          # 13. SpringPhysics
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/SpringPhysics.kt
          package com.edge.bezelmorph.engine
          import com.edge.bezelmorph.core.MorphConfig
          import kotlin.math.abs

          class SpringPhysics(private val config: MorphConfig) {
              var value=0f; private set
              var velocity=0f; private set
              var target=0f; private set
              var settled=true; private set
              private var epsilon=0.2f
              fun configure(cfg:MorphConfig){ epsilon=cfg.settleEpsilon.coerceAtLeast(0.05f) }
              fun press(impulse:Float){ target=config.depthDp*densityScale; velocity=impulse; settled=false }
              fun release(){ target=0f; settled=false }
              fun reset(){ value=0f; velocity=0f; target=0f; settled=true }
              fun step(dt:Float){
                  if(settled) return
                  val steps=if(config.substepping && config.omegaN>55f)2 else 1
                  val h=(dt/steps).coerceIn(0.001f,0.02f)
                  repeat(steps){
                      val d=value-target
                      val a=-(config.omegaN*config.omegaN*d)-(2f*config.zeta*config.omegaN*velocity)
                      velocity+=a*h; value+=velocity*h
                  }
                  if(abs(value-target)<epsilon && abs(velocity)<epsilon){ value=target; velocity=0f; settled=true }
              }
              companion object { var densityScale=2.5f }
          }
          EOF

          # 14. ShapeProvider
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/ShapeProvider.kt
          package com.edge.bezelmorph.engine
          import android.graphics.Path
          import com.edge.bezelmorph.core.ShapeProfile
          import kotlin.math.*

          object ShapeProvider {
              fun build(p:Path, width:Int, cy:Float, y0:Float, w:Float, depth:Float,
                        left:Boolean, profile:ShapeProfile){
                  val total=y0+w; val top=cy-total; val bot=cy+total
                  val steps=48; val stepSize=(2f*total)/steps
                  val xEdge=if(left)0f else width.toFloat()
                  p.rewind(); p.moveTo(xEdge,top)
                  for(i in 0..steps){
                      val y=top+i*stepSize; val d=abs(y-cy)
                      val x=when{
                          d<=y0->depth
                          d<total->depth*weight((d-y0)/w,profile)
                          else->0f
                      }
                      p.lineTo(if(left)x else xEdge-x, y)
                  }
                  p.lineTo(xEdge,bot); p.close()
              }
              private fun weight(u:Float,profile:ShapeProfile):Float{
                  val t=u.coerceIn(0f,1f)
                  return when(profile){
                      ShapeProfile.QUINTIC_SMOOTHERSTEP->1f-(10f*t*t*t)+(15f*t*t*t*t)-(6f*t*t*t*t*t)
                      ShapeProfile.GAUSSIAN->exp(-6f*t*t).toFloat()
                      ShapeProfile.SINE->sin((1f-t)*(PI/2).toFloat()).toFloat()
                      ShapeProfile.TRIANGLE->1f-t
                      ShapeProfile.TRAPEZOID->if(t<0.7f)1f else (1f-t)/0.3f
                  }
              }
          }
          EOF

