          @Composable
          fun Dashboard(config: MorphConfig, onConfigChange: (MorphConfig) -> Unit) {
              Column(modifier = Modifier.fillMaxSize().background(ComposeColor(0xFF0F172A))) {
                  Box(modifier = Modifier.fillMaxWidth().weight(1f)) {
                      BezelPreview(config)
                  }
                  Column(modifier = Modifier.fillMaxWidth().weight(1f).verticalScroll(rememberScrollState()).padding(16.dp)) {
                      Text("Physical Edge Calibrator", color = ComposeColor.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Text("Every parameter is live. Drag to see changes instantly.",
                          color = ComposeColor(0xFF94A3B8), fontSize = 12.sp, modifier = Modifier.padding(top = 8.dp, bottom = 20.dp))
                      ConfigSchema.ALL.groupBy { it.category }.forEach { (category, fields) ->
                          Text(category, color = ComposeColor(0xFF38BDF8), fontSize = 14.sp, fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(top = 24.dp, bottom = 8.dp))
                          fields.forEach { field ->
                              ControlField(field, config, onConfigChange)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ControlField(field: ConfigField, config: MorphConfig, onChange: (MorphConfig) -> Unit) {
              when (field.type) {
                  FieldType.FLOAT, FieldType.INT -> {
                      Column(modifier = Modifier.padding(vertical = 8.dp)) {
                          Text(field.label, color = ComposeColor(0xFFCBD5E1), fontSize = 12.sp)
                          Text(field.currentValue(config), color = ComposeColor(0xFF38BDF8), fontSize = 12.sp)
                          Slider(
                              value = field.get(config),
                              onValueChange = { v ->
                                  val newConfig = config.copy().also { field.set(it, v) }
                                  onChange(newConfig)
                              },
                              valueRange = field.min..field.max
                          )
                      }
                  }
                  FieldType.BOOLEAN -> {
                      Row(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(field.label, color = ComposeColor(0xFFCBD5E1), fontSize = 14.sp)
                          Switch(
                              checked = field.get(config) > 0.5f,
                              onCheckedChange = { checked ->
                                  val newConfig = config.copy().also { field.set(it, if (checked) 1f else 0f) }
                                  onChange(newConfig)
                              }
                          )
                      }
                  }
                  FieldType.ENUM -> {
                      var expanded by remember { mutableStateOf(false) }
                      Column(modifier = Modifier.padding(vertical = 8.dp)) {
                          Text(field.label, color = ComposeColor(0xFFCBD5E1), fontSize = 12.sp)
                          Box {
                              Button(onClick = { expanded = true }) {
                                  Text(field.enumValues.getOrElse(field.get(config).toInt()) { "?" })
                              }
                              DropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {
                                  field.enumValues.forEachIndexed { index, value ->
                                      DropdownMenuItem(
                                          text = { Text(value) },
                                          onClick = {
                                              val newConfig = config.copy().also { field.set(it, index.toFloat()) }
                                              onChange(newConfig)
                                              expanded = false
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  }
                  FieldType.COLOR -> {
                      Button(onClick = { /* color picker dialog */ }) {
                          Text("${field.label}: ${field.currentValue(config)}")
                      }
                  }
              }
          }

          @Composable
          fun BezelPreview(config: MorphConfig) {
              AndroidView(factory = { context ->
                  BezelOverlayView(context).apply {
                      updateConfig(config)
                      centerY = height * config.centerYRatio
                      setStaticPreview(1f)
                  }
              }, update = { view ->
                  view.updateConfig(config)
                  view.centerY = view.height * config.centerYRatio
                  view.setStaticPreview(1f)
              })
          }
