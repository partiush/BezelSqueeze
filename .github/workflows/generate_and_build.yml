name: Build 200x Ultra Zoom AI Camera APK (Pro Moon Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-35 build-tools;35.0.0'

    - name: Install Tools & Setup NDK/CMake
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq unzip wget curl

        ./gradlew --stop || true

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]] || true

        MAX_ATTEMPTS=3
        for i in $(seq 1 $MAX_ATTEMPTS); do
          rm -rf "$ANDROID_HOME/ndk/27.2.12479018" "$ANDROID_HOME/cmake/3.22.1"
          if $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null 2>&1; then
            break
          fi
          [ "$i" -eq "$MAX_ATTEMPTS" ] && exit 1
          sleep 5
        done

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmake/3.22.1/bin:$PATH" >> $GITHUB_ENV

    - name: Download OpenCV SDK, NCNN & Offline AI Models
      run: |
        set -euo pipefail
        download_file() {
          local dest=$1; shift; local urls=("$@")
          for url in "${urls[@]}"; do
            echo "Fetching $url ..."
            if wget -q --timeout=180 --tries=2 -O "$dest" "$url" && [ -s "$dest" ]; then
              return 0
            fi
          done
          return 1
        }

        # 1. OpenCV SDK
        download_file "/tmp/opencv.zip" \
          "https://github.com/opencv/opencv/releases/download/4.11.0/opencv-4.11.0-android-sdk.zip" \
          "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip"
        unzip -q /tmp/opencv.zip -d /tmp/

        # 2. NCNN Vulkan/ARM64 Engine
        download_file "/tmp/ncnn.zip" \
          "https://github.com/Tencent/ncnn/releases/download/20241226/ncnn-20241226-android-vulkan.zip" \
          "https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-android-vulkan.zip"
        unzip -q /tmp/ncnn.zip -d /tmp/

        # 3. Offline AI Super-Resolution Models (~65MB to restore full AI capability)
        mkdir -p app/src/main/assets/models
        download_file "app/src/main/assets/models/realesrgan-x4plus.param" \
          "https://raw.githubusercontent.com/nihui/realsr-ncnn-vulkan/master/models/models-DF2K_JPEG/realesrgan-x4plus.param" \
          "https://raw.githubusercontent.com/genie-design/ESRGAN-ncnn-models/main/realesrgan-x4plus/realesrgan-x4plus.param"
        download_file "app/src/main/assets/models/realesrgan-x4plus.bin" \
          "https://raw.githubusercontent.com/nihui/realsr-ncnn-vulkan/master/models/models-DF2K_JPEG/realesrgan-x4plus.bin" \
          "https://raw.githubusercontent.com/genie-design/ESRGAN-ncnn-models/main/realesrgan-x4plus/realesrgan-x4plus.bin"

    - name: Generate Complete Crash-Free 200x Pro Project
      run: |
        set -euo pipefail
        mkdir -p app/src/main/java/com/example/zoomcamera app/src/main/cpp app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/jniLibs/arm64-v8a

        cp -r /tmp/OpenCV-android-sdk app/src/main/cpp/opencv
        NCNN_EXTRACTED=$(find /tmp -maxdepth 1 -type d -name "ncnn-*-android-vulkan" | head -n 1)
        cp -r "$NCNN_EXTRACTED" app/src/main/cpp/ncnn

        # CRITICAL FIX 1: Copy libopencv_java4.so directly into jniLibs so the APK packages it and never crashes with UnsatisfiedLinkError
        cp app/src/main/cpp/opencv/sdk/native/libs/arm64-v8a/libopencv_java4.so app/src/main/jniLibs/arm64-v8a/

        # CRITICAL FIX 2: Patch ncnn.cmake to prevent stripping RTTI/Exceptions needed by OpenCV
        find app/src/main/cpp/ncnn -name "ncnn.cmake" -exec sed -i 's/INTERFACE_COMPILE_OPTIONS "-fno-rtti;-fno-exceptions"//g' {} \;

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "ZoomCamera200x"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.zoomcamera'
            compileSdk 35
            ndkVersion '27.2.12479018'
            defaultConfig {
                applicationId "com.example.zoomcamera"
                minSdk 26
                targetSdk 35
                versionCode 4
                versionName "4.0-ProMoon200x"
                ndk { abiFilters 'arm64-v8a' }
                externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++17 -frtti -fexceptions -O3"
                        arguments "-DANDROID_CPP_FEATURES=rtti exceptions", "-DANDROID_STL=c++_shared"
                    }
                }
            }
            sourceSets {
                main {
                    jniLibs.srcDirs = ['src/main/jniLibs']
                }
            }
            buildTypes {
                release { minifyEnabled false }
            }
            externalNativeBuild {
                cmake {
                    path "src/main/cpp/CMakeLists.txt"
                    version "3.22.1"
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
                freeCompilerArgs += ["-opt-in=androidx.camera.camera2.interop.ExperimentalCamera2Interop"]
            }
        }
        dependencies {
            def camerax_version = "1.4.0"
            implementation "androidx.camera:camera-core:${camerax_version}"
            implementation "androidx.camera:camera-camera2:${camerax_version}"
            implementation "androidx.camera:camera-lifecycle:${camerax_version}"
            implementation "androidx.camera:camera-view:${camerax_version}"
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
            implementation 'com.google.mlkit:text-recognition:16.0.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
