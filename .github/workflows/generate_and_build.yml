          # 17. Shader library (AGSL for API 33+)
          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/shader/ShaderLibrary.kt
          package com.edge.bezelmorph.shader

          import android.graphics.RuntimeShader
          import android.os.Build
          import com.edge.bezelmorph.core.ShaderPreset

          object ShaderLibrary {
              fun supportsShaders(): Boolean = Build.VERSION.SDK_INT >= 33

              fun create(preset: ShaderPreset): RuntimeShader? {
                  if (!supportsShaders()) return null
                  val src = when (preset) {
                      ShaderPreset.LIQUID_GLASS -> LIQUID_GLASS
                      ShaderPreset.CHROME -> CHROME
                      ShaderPreset.JELLY -> JELLY
                      ShaderPreset.WATER -> WATER
                      ShaderPreset.CAUSTICS -> CAUSTICS
                      ShaderPreset.NONE -> return null
                  }
                  return try { RuntimeShader(src) } catch (_: Exception) { null }
              }

              // AGSL: a simple Fresnel + refraction approximation.
              private const val LIQUID_GLASS = """
                  uniform shader content;
                  uniform float2 resolution;
                  half4 main(float2 fragCoord) {
                      float2 uv = fragCoord / resolution;
                      float2 p = uv * 2.0 - 1.0;
                      float r = length(p);
                      float caustic = smoothstep(0.8, 0.0, r) * 0.15;
                      half4 c = content.eval(fragCoord + float2(caustic * 20.0, 0.0));
                      float fresnel = pow(1.0 - abs(p.x), 3.0);
                      c.rgb += fresnel * 0.25;
                      return c;
                  }
              """

              private const val CHROME = """
                  uniform shader content;
                  uniform float2 resolution;
                  half4 main(float2 fragCoord) {
                      float2 uv = fragCoord / resolution;
                      float band = smoothstep(0.0, 1.0, uv.x) * 2.0 - 1.0;
                      half4 c = content.eval(fragCoord);
                      c.rgb *= (0.7 + 0.3 * abs(band));
                      return c;
                  }
              """

              private const val JELLY = """
                  uniform shader content;
                  uniform float2 resolution;
                  uniform float time;
                  half4 main(float2 fragCoord) {
                      float2 uv = fragCoord / resolution;
                      float wobble = sin(uv.y * 20.0 + time * 2.0) * 0.01;
                      return content.eval(fragCoord + float2(wobble * resolution.x, 0.0));
                  }
              """

              private const val WATER = """
                  uniform shader content;
                  uniform float2 resolution;
                  uniform float time;
                  half4 main(float2 fragCoord) {
                      float2 uv = fragCoord / resolution;
                      float2 off = float2(sin(uv.y*30.0+time), cos(uv.x*30.0+time))*2.0;
                      return content.eval(fragCoord + off);
                  }
              """

              private const val CAUSTICS = """
                  uniform shader content;
                  uniform float2 resolution;
                  half4 main(float2 fragCoord) {
                      float2 uv = fragCoord / resolution;
                      float d = length(uv - 0.5);
                      float ring = sin(d * 60.0) * 0.5 + 0.5;
                      half4 c = content.eval(fragCoord);
                      c.rgb += ring * 0.1;
                      return c;
                  }
              """
          }
          EOF

