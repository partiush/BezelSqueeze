      # ── GRADLE SETUP ──────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      # ── CONDITIONAL KEYSTORE (the fixed block) ─────────────────────────
      - name: Decode Release Keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Compile Production APK (Release + Debug)
        run: |
          gradle assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BezelMorph-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BezelMorph-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
