          package com.edge.bezelmorph.core
          import android.content.Context
          import android.os.Build
          import org.json.JSONObject

          object DeviceDatabase {
              private var list:List<DeviceProfile> = emptyList()
              data class DeviceProfile(val model:String,val edge:Edge,val upY:Float,val downY:Float)
              fun load(ctx:Context){
                  if(list.isNotEmpty()) return
                  try{
                      val text=ctx.assets.open("devices.json").bufferedReader().use{it.readText()}
                      val arr=JSONObject(text).getJSONArray("devices")
                      list=(0 until arr.length()).map{ i->
                          val o=arr.getJSONObject(i)
                          DeviceProfile(o.getString("model"),Edge.valueOf(o.optString("edge","RIGHT")),
                              o.optDouble("volUpY",0.228).toFloat(),o.optDouble("volDownY",0.315).toFloat())
                      }
                  }catch(_:Exception){}
              }
              fun autoDetect(ctx:Context):MorphConfig{
                  load(ctx)
                  val m=Build.MODEL ?: ""
                  val match=list.firstOrNull{ it.model.equals(m,true)||m.contains(it.model,true) }
                  return MorphConfig(edge=match?.edge?:Edge.RIGHT,centerYRatio=match?.upY?:0.228f)
              }
          }
