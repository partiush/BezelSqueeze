name: Generate Project & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Complete Project
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/edge/bezelmorph

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 14
                  versionName = "14.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          # 5. Manifest (Notch Bypass + Foreground Service + WakeLock)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:foregroundServiceType="specialUse"
                      android:stopWithTask="false"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>

                  <receiver
                      android:name=".BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 6. Service Configuration & Resources
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagIncludeNotImportantViews"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph Engine</string>
              <string name="service_description">Hardware physical button perimeter synchronizer.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          # 7. Persistent Boot Receiver
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BootCompletedReceiver.kt
          package com.edge.bezelmorph

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootCompletedReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val store = MorphConfigStore(context)
                  val _unused = store.isLeftEdge
              }
          }
          EOF

          # 8. Config Store with Fast In-Memory Key Routing
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MorphConfigStore.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.content.SharedPreferences
          import android.util.SparseArray
          import org.json.JSONArray
          import org.json.JSONObject

          data class KeyItem(
              var id: String,
              var name: String,
              var keyCode: Int,
              var ratio: Float,
              var isLeftEdge: Boolean
          )

          class MorphConfigStore(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("bezel_morph_pref", Context.MODE_PRIVATE)

              private var cachedKeyMap: SparseArray<KeyItem>? = null

              var flatTopHalfLengthY0: Float
                  get() = prefs.getFloat("y0_val", 50f)
                  set(v) = prefs.edit().putFloat("y0_val", v).apply()

              var blendTransitionW: Float
                  get() = prefs.getFloat("w_val", 85f)
                  set(v) = prefs.edit().putFloat("w_val", v).apply()

              var peakAmplitudeA: Float
                  get() = prefs.getFloat("peak_amp_A", 54f)
                  set(v) = prefs.edit().putFloat("peak_amp_A", v).apply()

              var speedOverall: Float
                  get() = prefs.getFloat("speed_omega", 36.0f)
                  set(v) = prefs.edit().putFloat("speed_omega", v).apply()

              var inwardImpulse: Float
                  get() = prefs.getFloat("speed_inward", 1400f)
                  set(v) = prefs.edit().putFloat("speed_inward", v).apply()

              var outwardDamping: Float
                  get() = prefs.getFloat("speed_outward_zeta", 0.76f)
                  set(v) = prefs.edit().putFloat("speed_outward_zeta", v).apply()

              var isLeftEdge: Boolean
                  get() = prefs.getBoolean("is_left_side", false)
                  set(v) = prefs.edit().putBoolean("is_left_side", v).apply()

              // Modern Optics Controls
              var bodyColor: Int
                  get() = prefs.getInt("body_color", 0xFF000000.toInt())
                  set(v) = prefs.edit().putInt("body_color", v).apply()

              var enableGlassRefraction: Boolean
                  get() = prefs.getBoolean("enable_glass_refraction", true)
                  set(v) = prefs.edit().putBoolean("enable_glass_refraction", v).apply()

              var refractionGlowColor: Int
                  get() = prefs.getInt("refraction_glow_color", 0x99FFFFFF.toInt())
                  set(v) = prefs.edit().putInt("refraction_glow_color", v).apply()

              @Synchronized
              fun getKeyForCodeFast(keyCode: Int): KeyItem? {
                  if (cachedKeyMap == null) {
                      loadKeys()
                  }
                  return cachedKeyMap?.get(keyCode)
              }

              @Synchronized
              fun loadKeys(): MutableList<KeyItem> {
                  val raw = prefs.getString("custom_keys_json", null)
                  val list = mutableListOf<KeyItem>()
                  if (raw.isNullOrEmpty()) {
                      list.add(KeyItem("vol_up", "Volume Up", 24, 0.22f, false))
                      list.add(KeyItem("vol_down", "Volume Down", 25, 0.32f, false))
                      list.add(KeyItem("power_btn", "Power Button", 26, 0.18f, true))
                      saveKeys(list)
                      return list
                  }
                  try {
                      val arr = JSONArray(raw)
                      val sparse = SparseArray<KeyItem>()
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          val item = KeyItem(
                              obj.getString("id"),
                              obj.getString("name"),
                              obj.getInt("keyCode"),
                              obj.getDouble("ratio").toFloat(),
                              obj.getBoolean("isLeftEdge")
                          )
                          list.add(item)
                          sparse.put(item.keyCode, item)
                      }
                      cachedKeyMap = sparse
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return list
              }

              @Synchronized
              fun saveKeys(keys: List<KeyItem>) {
                  val arr = JSONArray()
                  val sparse = SparseArray<KeyItem>()
                  for (k in keys) {
                      val obj = JSONObject().apply {
                          put("id", k.id)
                          put("name", k.name)
                          put("keyCode", k.keyCode)
                          put("ratio", k.ratio.toDouble())
                          put("isLeftEdge", k.isLeftEdge)
                      }
                      arr.put(obj)
                      sparse.put(k.keyCode, k)
                  }
                  cachedKeyMap = sparse
                  prefs.edit().putString("custom_keys_json", arr.toString()).apply()
              }
          }
          EOF

          # 9. Pure Native 0-Latency Optics & Harmonic Engine
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BezelSurfaceView.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.graphics.*
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.util.AttributeSet
          import android.view.Choreographer
          import android.view.View
          import kotlin.math.*

          class BezelSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs), Choreographer.FrameCallback {

              var isLeftEdge: Boolean = false
              var centerY: Float = 600f

              var y0: Float = 50f
              var w: Float = 85f
              var A: Float = 54f

              var omegaN: Float = 36.0f
              var inwardVelocity: Float = 1400f
              var zeta: Float = 0.76f

              var bodyColor: Int = 0xFF000000.toInt()
              var enableGlassRefraction: Boolean = true
              var refractionGlowColor: Int = 0x99FFFFFF.toInt()

              // Numerical physical state
              private var currentA: Float = 0f
              private var velocityA: Float = 0f
              private var targetA: Float = 0f
              private var isSimulating: Boolean = false
              private var lastFrameTimeNs: Long = 0L

              // Pressure factor accumulates on rapid bursts
              private var pressureMultiplier: Float = 1.0f

              private val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
              private val choreographer = Choreographer.getInstance()

              private val morphPath = Path()
              private val specularPath = Path()
              private val shadowPath = Path()

              // 100% Solid OLED Bezel
              private val corePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }

              // Dynamic Ambient Shading for dark & light wallpaper contrast
              private val ambientShadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0x66000000
                  style = Paint.Style.FILL
                  maskFilter = BlurMaskFilter(16f, BlurMaskFilter.Blur.NORMAL)
              }

              // Specular Glass Refraction Shimmer
              private val specularGlassPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3.6f
                  strokeCap = Paint.Cap.ROUND
              }

              fun onHardwareButtonDown() {
                  if (velocityA > 0f || currentA > 4f) {
                      pressureMultiplier = (pressureMultiplier + 0.18f).coerceAtMost(1.45f)
                      velocityA += inwardVelocity * pressureMultiplier
                  } else {
                      pressureMultiplier = 1.0f
                      velocityA = inwardVelocity
                  }

                  targetA = A * pressureMultiplier
                  triggerHaptic()
                  startSimulation()
              }

              fun onHardwareButtonUp() {
                  targetA = 0f
                  startSimulation()
              }

              fun setPreviewStatic(ratio: Float) {
                  stopSimulation()
                  currentA = A * ratio
                  invalidate()
              }

              private fun startSimulation() {
                  if (!isSimulating) {
                      isSimulating = true
                      lastFrameTimeNs = 0L
                      choreographer.postFrameCallback(this)
                  }
              }

              private fun stopSimulation() {
                  isSimulating = false
                  choreographer.removeFrameCallback(this)
              }

              override fun doFrame(frameTimeNs: Long) {
                  if (!isSimulating) return

                  val dt = if (lastFrameTimeNs > 0L) {
                      ((frameTimeNs - lastFrameTimeNs) / 1_000_000_000f).coerceIn(0.003f, 0.020f)
                  } else {
                      0.008f
                  }
                  lastFrameTimeNs = frameTimeNs

                  // 2nd-order harmonic spring oscillator
                  val displacement = currentA - targetA
                  val accel = -(omegaN * omegaN * displacement) - (2f * zeta * omegaN * velocityA)

                  velocityA += accel * dt
                  currentA += velocityA * dt

                  if (targetA == 0f && abs(velocityA) < 0.2f && abs(currentA) < 0.2f) {
                      currentA = 0f
                      velocityA = 0f
                      pressureMultiplier = 1.0f
                      isSimulating = false
                      invalidate()
                      return
                  }

                  invalidate()
                  choreographer.postFrameCallback(this)
              }

              private fun triggerHaptic() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          vibrator?.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(6)
                      }
                  } catch (ignored: Exception) {}
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (currentA <= 0.001f) return

                  val screenW = width.toFloat()
                  val totalHalfSpan = y0 + w
                  val yTop = centerY - totalHalfSpan
                  val yBottom = centerY + totalHalfSpan

                  morphPath.reset()
                  specularPath.reset()
                  shadowPath.reset()

                  val steps = 64
                  val stepSize = (2f * totalHalfSpan) / steps
                  val invW = 1.0f / w

                  corePaint.color = bodyColor

                  if (isLeftEdge) {
                      morphPath.moveTo(0f, yTop)
                      specularPath.moveTo(0f, yTop)
                      for (i in 0..steps) {
                          val curY = yTop + (i * stepSize)
                          val dist = abs(curY - centerY)
                          val x = when {
                              dist <= y0 -> currentA
                              dist < totalHalfSpan -> {
                                  val u = (dist - y0) * invW
                                  val u2 = u * u
                                  val u3 = u2 * u
                                  val poly = 1.0f - (u3 * (10.0f - (15.0f * u) + (6.0f * u2)))
                                  currentA * poly
                              }
                              else -> 0f
                          }
                          morphPath.lineTo(x, curY)
                          specularPath.lineTo(x, curY)
                      }
                      morphPath.lineTo(0f, yBottom)
                      morphPath.close()

                      // 1. Soft Ambient Depth
                      canvas.drawPath(morphPath, ambientShadowPaint)
                      // 2. Pure OLED Solid Body
                      canvas.drawPath(morphPath, corePaint)

                      // 3. Modern Specular Refraction Shimmer
                      if (enableGlassRefraction) {
                          val ratio = (currentA / A).coerceIn(0f, 1f)
                          specularGlassPaint.shader = LinearGradient(
                              0f, yTop, currentA, centerY,
                              intArrayOf(0x00FFFFFF, refractionGlowColor, 0x00FFFFFF),
                              floatArrayOf(0.0f, 0.5f, 1.0f),
                              Shader.TileMode.CLAMP
                          )
                          specularGlassPaint.alpha = (235 * ratio).toInt()
                          canvas.drawPath(specularPath, specularGlassPaint)
                      }
                  } else {
                      val xEdge = screenW
                      morphPath.moveTo(xEdge, yTop)
                      specularPath.moveTo(xEdge, yTop)
                      for (i in 0..steps) {
                          val curY = yTop + (i * stepSize)
                          val dist = abs(curY - centerY)
                          val x = when {
                              dist <= y0 -> currentA
                              dist < totalHalfSpan -> {
                                  val u = (dist - y0) * invW
                                  val u2 = u * u
                                  val u3 = u2 * u
                                  val poly = 1.0f - (u3 * (10.0f - (15.0f * u) + (6.0f * u2)))
                                  currentA * poly
                              }
                              else -> 0f
                          }
                          morphPath.lineTo(xEdge - x, curY)
                          specularPath.lineTo(xEdge - x, curY)
                      }
                      morphPath.lineTo(xEdge, yBottom)
                      morphPath.close()

                      canvas.drawPath(morphPath, ambientShadowPaint)
                      canvas.drawPath(morphPath, corePaint)

                      if (enableGlassRefraction) {
                          val ratio = (currentA / A).coerceIn(0f, 1f)
                          specularGlassPaint.shader = LinearGradient(
                              xEdge, yTop, xEdge - currentA, centerY,
                              intArrayOf(0x00FFFFFF, refractionGlowColor, 0x00FFFFFF),
                              floatArrayOf(0.0f, 0.5f, 1.0f),
                              Shader.TileMode.CLAMP
                          )
                          specularGlassPaint.alpha = (235 * ratio).toInt()
                          canvas.drawPath(specularPath, specularGlassPaint)
                      }
                  }
              }
          }
          EOF

          # 10. Direct Hardware Accessibility Hook
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/HardwareKeyMonitorService.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import androidx.core.app.NotificationCompat

          class HardwareKeyMonitorService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var overlay: BezelSurfaceView? = null
              private lateinit var store: MorphConfigStore
              private var activeKey: Int = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  store = MorphConfigStore(this)
                  store.loadKeys()
                  startPersistentForeground()
                  attachOverlay()
              }

              override fun onStartCommand(intent: android.content.Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }

              private fun startPersistentForeground() {
                  val channelId = "bezel_channel_core"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Morph Service",
                          NotificationManager.IMPORTANCE_MIN
                      ).apply {
                          setShowBadge(false)
                          enableVibration(false)
                      }
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Perimeter Engine Active")
                      .setContentText("Syncing with hardware switches")
                      .setSmallIcon(android.R.drawable.ic_menu_crop)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notification)
              }

              private fun attachOverlay() {
                  if (overlay != null) return
                  try {
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          flags,
                          PixelFormat.TRANSLUCENT
                      )

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          params.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      }

                      overlay = BezelSurfaceView(this).apply {
                          isLeftEdge = store.isLeftEdge
                          y0 = store.flatTopHalfLengthY0
                          w = store.blendTransitionW
                          A = store.peakAmplitudeA
                          omegaN = store.speedOverall
                          inwardVelocity = store.inwardImpulse
                          zeta = store.outwardDamping
                          bodyColor = store.bodyColor
                          enableGlassRefraction = store.enableGlassRefraction
                          refractionGlowColor = store.refractionGlowColor
                      }
                      wm?.addView(overlay, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode
                  val matched = store.getKeyForCodeFast(code)

                  if (matched != null) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          activeKey = code
                          overlay?.let { view ->
                              view.isLeftEdge = matched.isLeftEdge
                              view.y0 = store.flatTopHalfLengthY0
                              view.w = store.blendTransitionW
                              view.A = store.peakAmplitudeA
                              view.omegaN = store.speedOverall
                              view.inwardVelocity = store.inwardImpulse
                              view.zeta = store.outwardDamping
                              view.bodyColor = store.bodyColor
                              view.enableGlassRefraction = store.enableGlassRefraction
                              view.refractionGlowColor = store.refractionGlowColor
                              view.centerY = view.height * matched.ratio
                              view.onHardwareButtonDown()
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          if (activeKey == code) {
                              activeKey = 0
                              overlay?.onHardwareButtonUp()
                          }
                      }
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  try { overlay?.let { wm?.removeView(it) } } catch (ignored: Exception) {}
              }
          }
          EOF

          # 11. Full-Screen Interactive Live HUD Activity
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MainActivity.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.accessibility.AccessibilityManager
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import java.util.UUID

          class MainActivity : AppCompatActivity() {
              private lateinit var store: MorphConfigStore
              private lateinit var fullScreenPreview: BezelSurfaceView
              private var accessButton: Button? = null
              private lateinit var keysContainer: LinearLayout
              private var keyList = mutableListOf<KeyItem>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = MorphConfigStore(this)
                  keyList = store.loadKeys()

                  // Full screen container
                  val root = FrameLayout(this).apply {
                      setBackgroundColor(0xFF000000.toInt())
                  }

                  // Live Bezel Surface directly covers the entire screen behind the HUD
                  fullScreenPreview = BezelSurfaceView(this).apply {
                      isLeftEdge = store.isLeftEdge
                      y0 = store.flatTopHalfLengthY0
                      w = store.blendTransitionW
                      A = store.peakAmplitudeA
                      omegaN = store.speedOverall
                      inwardVelocity = store.inwardImpulse
                      zeta = store.outwardDamping
                      bodyColor = store.bodyColor
                      enableGlassRefraction = store.enableGlassRefraction
                      refractionGlowColor = store.refractionGlowColor
                  }
                  root.addView(fullScreenPreview, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)

                  // Translucent Floating Card HUD
                  val hudScroll = ScrollView(this).apply {
                      setBackgroundColor(0xD9101010.toInt())
                      setPadding(32, 28, 32, 32)
                  }
                  val hudContent = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val title = TextView(this).apply {
                      text = "Full-Screen Real-Time Tuning"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 19f
                      setPadding(0, 0, 0, 16)
                  }
                  hudContent.addView(title)

                  // Geometry Controls with instantaneous full-screen feedback
                  hudContent.addView(buildLiveSlider("Flat Key Plateau (y0)", store.flatTopHalfLengthY0.toInt(), 20, 140) {
                      store.flatTopHalfLengthY0 = it.toFloat()
                      syncAndPreview()
                  })

                  hudContent.addView(buildLiveSlider("Shoulder Blend Width (w)", store.blendTransitionW.toInt(), 30, 200) {
                      store.blendTransitionW = it.toFloat()
                      syncAndPreview()
                  })

                  hudContent.addView(buildLiveSlider("Peak Intrusion (A)", store.peakAmplitudeA.toInt(), 15, 120) {
                      store.peakAmplitudeA = it.toFloat()
                      syncAndPreview()
                  })

                  // Speed & Kinetics
                  val physicsHeader = TextView(this).apply {
                      text = "Speed & Spring Dynamics"
                      setTextColor(0xFF5389FF.toInt())
                      textSize = 15f
                      setPadding(0, 16, 0, 8)
                  }
                  hudContent.addView(physicsHeader)

                  hudContent.addView(buildLiveSlider("Frequency (Total Speed)", store.speedOverall.toInt(), 15, 60) {
                      store.speedOverall = it.toFloat()
                      fullScreenPreview.omegaN = store.speedOverall
                  })

                  hudContent.addView(buildLiveSlider("Inward Impulse Velocity", (store.inwardImpulse / 10).toInt(), 50, 250) {
                      store.inwardImpulse = (it * 10).toFloat()
                      fullScreenPreview.inwardVelocity = store.inwardImpulse
                  })

                  hudContent.addView(buildLiveSlider("Outward Recoil Damping", (store.outwardDamping * 100).toInt(), 50, 98) {
                      store.outwardDamping = it / 100f
                      fullScreenPreview.zeta = store.outwardDamping
                  })

                  // Modern Glass Optics
                  val opticsHeader = TextView(this).apply {
                      text = "Modern Glass Optics"
                      setTextColor(0xFF5389FF.toInt())
                      textSize = 15f
                      setPadding(0, 16, 0, 8)
                  }
                  hudContent.addView(opticsHeader)

                  val refractionToggle = Switch(this).apply {
                      text = "Ambient Glass Refraction (Modern Specular Lip)"
                      setTextColor(0xFFE0E0E0.toInt())
                      isChecked = store.enableGlassRefraction
                      setOnCheckedChangeListener { _, checked ->
                          store.enableGlassRefraction = checked
                          fullScreenPreview.enableGlassRefraction = checked
                          syncAndPreview()
                      }
                  }
                  hudContent.addView(refractionToggle)

                  val btnGlowColor = Button(this).apply {
                      text = "Customize Specular Glass Tint"
                      setBackgroundColor(0xFF222222.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          showColorPicker("Select Refraction Glint Tint") { chosen ->
                              store.refractionGlowColor = chosen
                              fullScreenPreview.refractionGlowColor = chosen
                              syncAndPreview()
                          }
                      }
                  }
                  hudContent.addView(btnGlowColor)

                  val btnBodyColor = Button(this).apply {
                      text = "Customize OLED Body Color"
                      setBackgroundColor(0xFF222222.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          showColorPicker("Select Inward OLED Body Color") { chosen ->
                              store.bodyColor = chosen
                              fullScreenPreview.bodyColor = chosen
                              syncAndPreview()
                          }
                      }
                  }
                  hudContent.addView(btnBodyColor)

                  // Hardware Key List
                  val keysHeader = TextView(this).apply {
                      text = "Hardware Button Positions"
                      setTextColor(0xFF5389FF.toInt())
                      textSize = 15f
                      setPadding(0, 16, 0, 8)
                  }
                  hudContent.addView(keysHeader)

                  keysContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  hudContent.addView(keysContainer)
                  renderKeyList()

                  val btnAddKey = Button(this).apply {
                      text = "+ Add New Physical Key"
                      setBackgroundColor(0xFF1B5E20.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { showAddKeyDialog() }
                  }
                  hudContent.addView(btnAddKey)

                  accessButton = Button(this).apply {
                      text = "Grant System Access"
                      setBackgroundColor(0xFF2E66FF.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  hudContent.addView(accessButton)

                  hudScroll.addView(hudContent)
                  val cardParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      (resources.displayMetrics.heightPixels * 0.58).toInt()
                  ).apply {
                      gravity = Gravity.BOTTOM
                      setMargins(20, 0, 20, 40)
                  }
                  root.addView(hudScroll, cardParams)

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  checkPermissionState()
                  syncAndPreview()
              }

              private fun checkPermissionState() {
                  if (isServiceRunning()) {
                      accessButton?.visibility = View.GONE
                  } else {
                      accessButton?.visibility = View.VISIBLE
                  }
              }

              private fun isServiceRunning(): Boolean {
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                  val services = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  for (s in services) {
                      if (s.id.contains(packageName)) return true
                  }
                  return false
              }

              private fun renderKeyList() {
                  keysContainer.removeAllViews()
                  for (key in keyList) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(16, 16, 16, 16)
                          setBackgroundColor(0xFF1B1B1B.toInt())
                          val lp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { setMargins(0, 8, 0, 8) }
                          layoutParams = lp
                      }

                      val topRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }

                      val nameTxt = TextView(this).apply {
                          text = "${key.name} (Key: ${key.keyCode})"
                          setTextColor(0xFFFFFFFF.toInt())
                          textSize = 14f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      topRow.addView(nameTxt)

                      val btnRename = Button(this).apply {
                          text = "Rename"
                          textSize = 11f
                          setOnClickListener { showRenameDialog(key) }
                      }
                      topRow.addView(btnRename)

                      val btnDelete = Button(this).apply {
                          text = "Delete"
                          textSize = 11f
                          setTextColor(0xFFFF5252.toInt())
                          setOnClickListener {
                              keyList.remove(key)
                              store.saveKeys(keyList)
                              renderKeyList()
                          }
                      }
                      topRow.addView(btnDelete)
                      row.addView(topRow)

                      val sideToggle = Switch(this).apply {
                          text = if (key.isLeftEdge) "Edge: Left" else "Edge: Right"
                          setTextColor(0xFFBBBBBB.toInt())
                          isChecked = key.isLeftEdge
                          setOnCheckedChangeListener { _, c ->
                              key.isLeftEdge = c
                              text = if (c) "Edge: Left" else "Edge: Right"
                              store.saveKeys(keyList)
                              fullScreenPreview.isLeftEdge = c
                              fullScreenPreview.centerY = fullScreenPreview.height * key.ratio
                              fullScreenPreview.setPreviewStatic(1.0f)
                          }
                      }
                      row.addView(sideToggle)

                      row.addView(buildLiveSlider("Position (${key.name})", (key.ratio * 1000).toInt(), 50, 950) { p ->
                          key.ratio = p / 1000f
                          store.saveKeys(keyList)
                          fullScreenPreview.isLeftEdge = key.isLeftEdge
                          fullScreenPreview.centerY = fullScreenPreview.height * key.ratio
                          fullScreenPreview.setPreviewStatic(1.0f)
                      })

                      keysContainer.addView(row)
                  }
              }

              private fun showAddKeyDialog() {
                  val inputName = EditText(this).apply { hint = "Key Name (e.g. Mute Switch)" }
                  val inputCode = EditText(this).apply {
                      hint = "Android KeyCode (e.g. 26=Power)"
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER
                  }
                  val dialogLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 20, 40, 20)
                      addView(inputName)
                      addView(inputCode)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Add Hardware Key")
                      .setView(dialogLayout)
                      .setPositiveButton("Add") { _, _ ->
                          val name = inputName.text.toString().ifEmpty { "Custom Button" }
                          val code = inputCode.text.toString().toIntOrNull() ?: 26
                          val newItem = KeyItem(UUID.randomUUID().toString(), name, code, 0.45f, false)
                          keyList.add(newItem)
                          store.saveKeys(keyList)
                          renderKeyList()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showRenameDialog(key: KeyItem) {
                  val input = EditText(this).apply { setText(key.name) }
                  AlertDialog.Builder(this)
                      .setTitle("Rename Button")
                      .setView(input)
                      .setPositiveButton("Save") { _, _ ->
                          key.name = input.text.toString()
                          store.saveKeys(keyList)
                          renderKeyList()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showColorPicker(dialogTitle: String, onPick: (Int) -> Unit) {
                  val options = arrayOf(
                      "Specular Diamond White",
                      "Pure OLED Jet Black",
                      "Deep Sapphire Blue",
                      "Reflective Silver Gray",
                      "Electric Amber",
                      "Neon Violet"
                  )
                  val colorValues = intArrayOf(
                      0xCCFFFFFF.toInt(),
                      0xFF000000.toInt(),
                      0xAA0091EA.toInt(),
                      0x88AAAAAA.toInt(),
                      0xCCFFAB00.toInt(),
                      0xCCAA00FF.toInt()
                  )
                  AlertDialog.Builder(this)
                      .setTitle(dialogTitle)
                      .setItems(options) { _, which ->
                          onPick(colorValues[which])
                      }
                      .show()
              }

              private fun buildLiveSlider(name: String, current: Int, min: Int, max: Int, onVal: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 6, 0, 6)
                  }
                  val txt = TextView(this).apply {
                      text = "$name: $current"
                      setTextColor(0xFFB0B0B0.toInt())
                      textSize = 13f
                  }
                  val bar = SeekBar(this).apply {
                      this.max = max - min
                      this.progress = current - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(b: SeekBar?, p: Int, fromUser: Boolean) {
                              val real = p + min
                              txt.text = "$name: $real"
                              onVal(real)
                          }
                          override fun onStartTrackingTouch(b: SeekBar?) {
                              fullScreenPreview.setPreviewStatic(1.0f)
                          }
                          override fun onStopTrackingTouch(b: SeekBar?) {
                              fullScreenPreview.setPreviewStatic(0f)
                          }
                      })
                  }
                  box.addView(txt)
                  box.addView(bar)
                  return box
              }

              private fun syncAndPreview() {
                  fullScreenPreview.isLeftEdge = store.isLeftEdge
                  fullScreenPreview.y0 = store.flatTopHalfLengthY0
                  fullScreenPreview.w = store.blendTransitionW
                  fullScreenPreview.A = store.peakAmplitudeA
                  fullScreenPreview.omegaN = store.speedOverall
                  fullScreenPreview.inwardVelocity = store.inwardImpulse
                  fullScreenPreview.zeta = store.outwardDamping
                  fullScreenPreview.bodyColor = store.bodyColor
                  fullScreenPreview.enableGlassRefraction = store.enableGlassRefraction
                  fullScreenPreview.refractionGlowColor = store.refractionGlowColor
                  fullScreenPreview.post {
                      val first = keyList.firstOrNull()
                      val ratio = first?.ratio ?: 0.22f
                      fullScreenPreview.centerY = fullScreenPreview.height * ratio
                      fullScreenPreview.setPreviewStatic(1.0f)
                  }
              }
          }
          EOF

      - name: Build With Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compile Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BezelMorph-Engine-APK
          path: app/build/outputs/apk/debug/app-debug.apk
