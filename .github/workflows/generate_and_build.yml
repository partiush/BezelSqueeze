          }
          EOF

          # ─── KOTLIN SOURCE (core) ─────────────────────────────────────────────
          # 11. MorphConfig (full schema)
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/core/MorphConfig.kt
          package com.edge.bezelmorph.core
          import android.graphics.Color
          import org.json.JSONObject

          data class MorphConfig(
              var edge: Edge = Edge.RIGHT,
              var centerYRatio: Float = 0.228f,
              var y0Dp: Float = 28f,
              var wDp: Float = 38f,
              var depthDp: Float = 16f,
              var shapeProfile: ShapeProfile = ShapeProfile.QUINTIC_SMOOTHERSTEP,
              var omegaN: Float = 68f,
              var zeta: Float = 0.88f,
              var inwardVelocity: Float = 2400f,
              var pressDurationMs: Int = 0,
              var overshootPct: Float = 0f,
              var fillMode: FillMode = FillMode.SOLID,
              var fillColor: Int = Color.BLACK,
              var fillColor2: Int = Color.BLACK,
              var glassEnabled: Boolean = false,
              var innerShadow: Boolean = true,
              var rimLight: Boolean = true,
              var outerGlow: Boolean = false,
              var shaderPreset: ShaderPreset = ShaderPreset.NONE,
              var hapticEnabled: Boolean = true,
              var hapticIntensity: Float = 1f,
              var pressEffect: Int = 0,
              var releaseEffect: Int = 1,
              var customWaveformTimings: LongArray = longArrayOf(),
              var customWaveformAmps: IntArray = intArrayOf(),
              var clickSoundEnabled: Boolean = false,
              var suppressVolumeUi: Boolean = false,
              var rateLimitPerMinute: Int = 60,
              var onlyWhenScreenOn: Boolean = true,
              var onlyWhenUnlocked: Boolean = false,
              var reduceMotion: Boolean = false,
              var adaptiveFps: Boolean = true,
              var dimScreenBehind: Boolean = false,
              var rippleEnabled: Boolean = false,
              var shimmerEnabled: Boolean = false,
              var substepping: Boolean = true,
              var maxFps: Int = 120,
              var debugOverlay: Boolean = false,
              // New: per-app profiles
              var perAppProfiles: MutableMap<String, String> = mutableMapOf(),
              // New: gesture trigger
              var gestureEdgeSwipeEnabled: Boolean = false,
              var gestureSensitivity: Float = 0.5f,
              // New: foreground service
              var showStatusNotification: Boolean = true,
              // New: floating bubble
              var bubbleEnabled: Boolean = false,
              var bubbleX: Int = 100,
              var bubbleY: Int = 500
          )

          enum class Edge { LEFT, RIGHT, TOP, BOTTOM }
          enum class ShapeProfile { QUINTIC_SMOOTHERSTEP, GAUSSIAN, SINE, TRIANGLE, TRAPEZOID }
          enum class FillMode { SOLID, LINEAR_GRADIENT, RADIAL_GRADIENT, GLASS, METAL, MATTE }
          enum class ShaderPreset { NONE, LIQUID_GLASS, CHROME, JELLY, WATER, CAUSTICS }

          fun MorphConfig.toJson(): JSONObject = JSONObject().apply {
              put("edge", edge.name); put("centerYRatio", centerYRatio)
              put("y0Dp", y0Dp); put("wDp", wDp); put("depthDp", depthDp)
              put("shapeProfile", shapeProfile.name); put("omegaN", omegaN)
              put("zeta", zeta); put("inwardVelocity", inwardVelocity)
              put("pressDurationMs", pressDurationMs); put("overshootPct", overshootPct)
              put("fillMode", fillMode.name); put("fillColor", fillColor)
              put("fillColor2", fillColor2); put("glassEnabled", glassEnabled)
              put("innerShadow", innerShadow); put("rimLight", rimLight)
              put("outerGlow", outerGlow); put("shaderPreset", shaderPreset.name)
              put("hapticEnabled", hapticEnabled); put("hapticIntensity", hapticIntensity)
              put("pressEffect", pressEffect); put("releaseEffect", releaseEffect)
              put("suppressVolumeUi", suppressVolumeUi); put("rateLimitPerMinute", rateLimitPerMinute)
              put("onlyWhenScreenOn", onlyWhenScreenOn); put("onlyWhenUnlocked", onlyWhenUnlocked)
              put("reduceMotion", reduceMotion); put("adaptiveFps", adaptiveFps)
              put("dimScreenBehind", dimScreenBehind); put("rippleEnabled", rippleEnabled)
              put("shimmerEnabled", shimmerEnabled); put("substepping", substepping)
              put("maxFps", maxFps); put("debugOverlay", debugOverlay)
              put("gestureEdgeSwipeEnabled", gestureEdgeSwipeEnabled)
              put("gestureSensitivity", gestureSensitivity)
              put("showStatusNotification", showStatusNotification)
              put("bubbleEnabled", bubbleEnabled); put("bubbleX", bubbleX); put("bubbleY", bubbleY)
              val apps = JSONObject(); perAppProfiles.forEach { (k,v) -> apps.put(k,v) }
              put("perAppProfiles", apps)
          }

          fun fromJson(obj: JSONObject): MorphConfig = MorphConfig(
              edge = Edge.valueOf(obj.optString("edge","RIGHT")),
              centerYRatio = obj.optDouble("centerYRatio",0.228).toFloat(),
              y0Dp = obj.optDouble("y0Dp",28.0).toFloat(),
              wDp = obj.optDouble("wDp",38.0).toFloat(),
              depthDp = obj.optDouble("depthDp",16.0).toFloat(),
              shapeProfile = ShapeProfile.valueOf(obj.optString("shapeProfile","QUINTIC_SMOOTHERSTEP")),
              omegaN = obj.optDouble("omegaN",68.0).toFloat(),
              zeta = obj.optDouble("zeta",0.88).toFloat(),
              inwardVelocity = obj.optDouble("inwardVelocity",2400.0).toFloat(),
              pressDurationMs = obj.optInt("pressDurationMs",0),
              overshootPct = obj.optDouble("overshootPct",0.0).toFloat(),
              fillMode = FillMode.valueOf(obj.optString("fillMode","SOLID")),
              fillColor = obj.optInt("fillColor",Color.BLACK),
              fillColor2 = obj.optInt("fillColor2",Color.BLACK),
              glassEnabled = obj.optBoolean("glassEnabled",false),
              innerShadow = obj.optBoolean("innerShadow",true),
              rimLight = obj.optBoolean("rimLight",true),
              outerGlow = obj.optBoolean("outerGlow",false),
              shaderPreset = ShaderPreset.valueOf(obj.optString("shaderPreset","NONE")),
              hapticEnabled = obj.optBoolean("hapticEnabled",true),
              hapticIntensity = obj.optDouble("hapticIntensity",1.0).toFloat(),
              pressEffect = obj.optInt("pressEffect",0),
              releaseEffect = obj.optInt("releaseEffect",1),
              suppressVolumeUi = obj.optBoolean("suppressVolumeUi",false),
              rateLimitPerMinute = obj.optInt("rateLimitPerMinute",60),
              onlyWhenScreenOn = obj.optBoolean("onlyWhenScreenOn",true),
              onlyWhenUnlocked = obj.optBoolean("onlyWhenUnlocked",false),
              reduceMotion = obj.optBoolean("reduceMotion",false),
              adaptiveFps = obj.optBoolean("adaptiveFps",true),
              dimScreenBehind = obj.optBoolean("dimScreenBehind",false),
              rippleEnabled = obj.optBoolean("rippleEnabled",false),
              shimmerEnabled = obj.optBoolean("shimmerEnabled",false),
              substepping = obj.optBoolean("substepping",true),
              maxFps = obj.optInt("maxFps",120),
              debugOverlay = obj.optBoolean("debugOverlay",false),
              gestureEdgeSwipeEnabled = obj.optBoolean("gestureEdgeSwipeEnabled",false),
              gestureSensitivity = obj.optDouble("gestureSensitivity",0.5).toFloat(),
              showStatusNotification = obj.optBoolean("showStatusNotification",true),
              bubbleEnabled = obj.optBoolean("bubbleEnabled",false),
              bubbleX = obj.optInt("bubbleX",100), bubbleY = obj.optInt("bubbleY",500)
          )
          EOF

          # 12. ConfigStore
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/core/ConfigStore.kt
          package com.edge.bezelmorph.core
          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONObject

          class ConfigStore(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("bezel_morph_pref", Context.MODE_PRIVATE)
              fun load(): MorphConfig = prefs.getString("config_json",null)?.let {
                  try { fromJson(JSONObject(it)) } catch (_:Exception) { MorphConfig() }
              } ?: MorphConfig()
              fun save(c: MorphConfig) { prefs.edit().putString("config_json", c.toJson().toString()).apply() }
              fun saveProfile(name:String,c:MorphConfig) { prefs.edit().putString("profile_$name",c.toJson().toString()).apply() }
              fun loadProfile(name:String):MorphConfig? = prefs.getString("profile_$name",null)?.let {
                  try { fromJson(JSONObject(it)) } catch (_:Exception) { null }
              }
              fun listProfiles() = prefs.all.keys.filter { it.startsWith("profile_") }.map { it.removePrefix("profile_") }
              fun deleteProfile(name:String) { prefs.edit().remove("profile_$name").apply() }
              fun exportAll():String {
                  val root = JSONObject(); root.put("config", load().toJson())
                  val profiles = JSONObject(); listProfiles().forEach { n -> loadProfile(n)?.let { profiles.put(n,it.toJson()) } }
                  root.put("profiles",profiles); return root.toString(2)
              }
              fun importAll(json:String) {
                  val root = JSONObject(json)
                  root.optJSONObject("config")?.let { save(fromJson(it)) }
                  root.optJSONObject("profiles")?.let { p ->
                      p.keys().forEach { n -> (p.optJSONObject(n) as? JSONObject)?.let { saveProfile(n,fromJson(it)) } }
                  }
              }
          }
