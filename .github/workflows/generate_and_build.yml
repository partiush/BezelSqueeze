          ############################################################
          # 13. Physics Engine (semi-implicit Euler with substepping)
          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/SpringPhysics.kt
          package com.edge.bezelmorph.engine

          import com.edge.bezelmorph.core.MorphConfig
          import kotlin.math.abs

          /**
           * Semi-implicit Euler integrator with optional substepping.
           * Achieves stable behaviour even at omega=95 rad/s on 120 Hz panels.
           */
          class SpringPhysics(private val config: MorphConfig) {
              var value: Float = 0f
                  private set
              var velocity: Float = 0f
                  private set
              var target: Float = 0f
                  private set
              var settled: Boolean = true
                  private set

              private var peak: Float = 0f
              private var lastDirection: Int = 0
              private var bouncePhase: Int = 0
              private var epsilon: Float = 0.2f

              fun configure(cfg: MorphConfig) {
                  epsilon = cfg.settleEpsilon.coerceAtLeast(0.05f)
              }

              fun press(impulse: Float) {
                  target = config.depthDp * densityScale
                  velocity = impulse
                  settled = false
                  peak = 0f
                  bouncePhase = 0
              }

              fun release() {
                  target = 0f
                  settled = false
              }

              fun reset() {
                  value = 0f; velocity = 0f; target = 0f; settled = true
              }

              fun step(dtSec: Float) {
                  if (settled) return
                  val steps = if (config.substepping && config.omegaN > 55f) 2 else 1
                  val h = (dtSec / steps).coerceIn(0.001f, 0.020f)
                  repeat(steps) {
                      val displacement = value - target
                      val accel = -(config.omegaN * config.omegaN * displacement) -
                              (2f * config.zeta * config.omegaN * velocity)
                      velocity += accel * h
                      value += velocity * h

                      peak = maxOf(peak, abs(value))
                      val dir = if (velocity > 0) 1 else -1
                      if (dir != lastDirection && lastDirection != 0) bouncePhase++
                      lastDirection = dir
                  }

                  if (abs(value - target) < epsilon && abs(velocity) < epsilon) {
                      value = target; velocity = 0f; settled = true
                  }
              }

              companion object {
                  var densityScale: Float = 2.5f
              }
          }
          EOF

          ############################################################
