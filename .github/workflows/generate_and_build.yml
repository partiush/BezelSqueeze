          package com.edge.bezelmorph.engine

          import android.content.Context
          import android.os.Build
          import android.os.VibrationAttributes
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import com.edge.bezelmorph.core.MorphConfig

          class HapticEngine(context: Context) {
              private val vibrator: Vibrator? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  (context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as? VibratorManager)?.defaultVibrator
              } else {
                  @Suppress("DEPRECATION")
                  context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
              }

              fun press(config: MorphConfig) = play(config.pressEffect, config)
              fun release(config: MorphConfig) = play(config.releaseEffect, config)

              private fun play(index: Int, config: MorphConfig) {
                  if (!config.hapticEnabled) return
                  try {
                      val effect = when (index) {
                          0 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK)
                          1 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          2 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_HEAVY_CLICK)
                          3 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_DOUBLE_CLICK)
                          else -> VibrationEffect.createOneShot(8, VibrationEffect.DEFAULT_AMPLITUDE)
                      }
                      val attrs = VibrationAttributes.Builder()
                          .setUsage(
                              when (config.hapticUsage) {
                                  1 -> VibrationAttributes.USAGE_NOTIFICATION
                                  else -> VibrationAttributes.USAGE_HARDWARE_FEEDBACK
                              }
                          ).build()
                      if (Build.VERSION.SDK_INT >= 33) {
                          vibrator?.vibrate(effect, attrs)
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(effect)
                      }
                  } catch (_: Exception) {}
              }
          }
