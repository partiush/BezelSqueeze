          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/ShapeProvider.kt
          package com.edge.bezelmorph.engine

          import android.graphics.Path
          import com.edge.bezelmorph.core.ShapeProfile
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.sin
          import kotlin.math.PI

          /**
           * Builds the bulge silhouette for any profile. All values in pixels.
           * Add a new enum + branch here and the whole app supports it.
           */
          object ShapeProvider {
              fun build(
                  path: Path,
                  width: Int,
                  centerY: Float,
                  y0: Float,
                  w: Float,
                  depth: Float,
                  isLeft: Boolean,
                  profile: ShapeProfile,
                  custom: FloatArray
              ) {
                  val total = y0 + w
                  val yTop = centerY - total
                  val yBottom = centerY + total
                  val steps = 48
                  val stepSize = (2f * total) / steps
                  val xEdge = if (isLeft) 0f else width.toFloat()

                  path.rewind()
                  path.moveTo(xEdge, yTop)
                  for (i in 0..steps) {
                      val curY = yTop + i * stepSize
                      val dist = abs(curY - centerY)
                      val x = when {
                          dist <= y0 -> depth
                          dist < total -> depth * weight((dist - y0) / w, profile, custom)
                          else -> 0f
                      }
                      val px = if (isLeft) x else xEdge - x
                      path.lineTo(px, curY)
                  }
                  path.lineTo(xEdge, yBottom)
                  path.close()
              }

              private fun weight(u: Float, profile: ShapeProfile, custom: FloatArray): Float {
                  val t = u.coerceIn(0f, 1f)
                  return when (profile) {
                      ShapeProfile.QUINTIC_SMOOTHERSTEP -> 1f - (10f * t * t * t) + (15f * t * t * t * t) - (6f * t * t * t * t * t)
                      ShapeProfile.GAUSSIAN -> exp(-6f * t * t).toFloat()
                      ShapeProfile.SINE -> (sin((1f - t) * (PI / 2).toFloat())).toFloat()
                      ShapeProfile.TRIANGLE -> 1f - t
                      ShapeProfile.TRAPEZOID -> if (t < 0.7f) 1f else (1f - t) / 0.3f
                      ShapeProfile.CUSTOM -> {
                          if (custom.isEmpty()) 1f - t
                          else {
                              val idx = (t * (custom.size - 1)).toInt().coerceIn(0, custom.size - 1)
                              custom[idx]
                          }
                      }
                  }
              }
          }
          EOF

