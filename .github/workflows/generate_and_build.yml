name: Build Flashlight Intensity App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p FlashlightIntensity/app/src/main/java/com/example/flashlight
          mkdir -p FlashlightIntensity/app/src/main/res/values
          mkdir -p FlashlightIntensity/.github/workflows

          cat > FlashlightIntensity/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FlashlightIntensity"
          include(":app")
          EOF

          cat > FlashlightIntensity/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FlashlightIntensity/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > FlashlightIntensity/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.flashlight'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.flashlight'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                              'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > FlashlightIntensity/app/proguard-rules.pro <<'EOF'
          EOF

          cat > FlashlightIntensity/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > FlashlightIntensity/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FlashlightIntensity"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF9800</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#121212</item>
              </style>
          </resources>
          EOF

          cat > FlashlightIntensity/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="false" />

              <application
                  android:theme="@style/Theme.FlashlightIntensity"
                  android:label="Flashlight Intensity"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > FlashlightIntensity/app/src/main/java/com/example/flashlight/MainActivity.kt <<'EOF'
          package com.example.flashlight

          import android.graphics.Color
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.math.max
          import kotlin.math.roundToInt

          class MainActivity : AppCompatActivity() {

              private lateinit var cameraManager: CameraManager
              private var cameraId: String? = null
              private var maxStrength = 1
              private var isOn = false

              private lateinit var statusText: TextView
              private lateinit var strengthText: TextView
              private lateinit var seekBar: SeekBar
              private lateinit var toggleButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  cameraManager =
                      getSystemService(CAMERA_SERVICE) as CameraManager

                  createInterface()
                  detectFlashlight()
              }

              private fun createInterface() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                      setBackgroundColor(Color.rgb(18, 18, 18))
                  }

                  val title = TextView(this).apply {
                      text = "Flashlight Intensity"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  statusText = TextView(this).apply {
                      text = "Detecting flashlight..."
                      textSize = 16f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                  }

                  strengthText = TextView(this).apply {
                      text = "Strength: 0%"
                      textSize = 22f
                      setTextColor(Color.rgb(255, 152, 0))
                      gravity = Gravity.CENTER
                  }

                  seekBar = SeekBar(this).apply {
                      max = 100
                      progress = 0
                      setOnSeekBarChangeListener(object :
                          SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(
                              bar: SeekBar?,
                              progress: Int,
                              fromUser: Boolean
                          ) {
                              if (fromUser) {
                                  setStrengthPercent(progress)
                              }
                          }

                          override fun onStartTrackingTouch(bar: SeekBar?) {}
                          override fun onStopTrackingTouch(bar: SeekBar?) {}
                      })
                  }

                  toggleButton = Button(this).apply {
                      text = "TURN ON"
                      setOnClickListener {
                          if (isOn) turnOff() else turnOn()
                      }
                  }

                  val note = TextView(this).apply {
                      text = "Some phones support only ON/OFF. Android 13+ torch hardware may support multiple levels."
                      textSize = 13f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                  }

                  root.addView(title, matchWrap())
                  root.addView(statusText, marginParams(0, 24, 0, 12))
                  root.addView(strengthText, marginParams(0, 12, 0, 12))
                  root.addView(seekBar, matchWrap())
                  root.addView(toggleButton, marginParams(0, 24, 0, 12))
                  root.addView(note, matchWrap())

                  setContentView(root)
              }

              private fun detectFlashlight() {
                  try {
                      for (id in cameraManager.cameraIdList) {
                          val characteristics =
                              cameraManager.getCameraCharacteristics(id)

                          val hasFlash =
                              characteristics.get(
                                  CameraCharacteristics.FLASH_INFO_AVAILABLE
                              ) == true

                          if (hasFlash) {
                              cameraId = id

                              maxStrength =
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                      characteristics.get(
                                          CameraCharacteristics
                                              .FLASH_INFO_STRENGTH_MAXIMUM_LEVEL
                                      ) ?: 1
                                  } else {
                                      1
                                  }

                              maxStrength = max(1, maxStrength)

                              statusText.text =
                                  if (maxStrength > 1) {
                                      "Multilevel control available: 1-$maxStrength"
                                  } else {
                                      "This phone supports ON/OFF only"
                                  }

                              return
                          }
                      }

                      statusText.text = "No flashlight detected"
                      seekBar.isEnabled = false
                      toggleButton.isEnabled = false
                  } catch (error: Exception) {
                      statusText.text = "Flashlight unavailable"
                      seekBar.isEnabled = false
                      toggleButton.isEnabled = false
                  }
              }

              private fun setStrengthPercent(percent: Int) {
                  if (cameraId == null) return

                  val safePercent = percent.coerceIn(1, 100)
                  val strength =
                      if (maxStrength > 1) {
                          ((safePercent / 100.0) * maxStrength)
                              .roundToInt()
                              .coerceIn(1, maxStrength)
                      } else {
                          1
                      }

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                          maxStrength > 1
                      ) {
                          cameraManager.turnOnTorchWithStrengthLevel(
                              cameraId,
                              strength
                          )
                      } else {
                          cameraManager.setTorchMode(cameraId, true)
                      }

                      isOn = true
                      toggleButton.text = "TURN OFF"
                      strengthText.text =
                          "Strength: $safePercent%  ($strength/$maxStrength)"
                  } catch (error: Exception) {
                      statusText.text = "Could not change flashlight"
                  }
              }

              private fun turnOn() {
                  if (seekBar.progress == 0) {
                      seekBar.progress = 50
                  }
                  setStrengthPercent(seekBar.progress)
              }

              private fun turnOff() {
                  try {
                      cameraId?.let {
                          cameraManager.setTorchMode(it, false)
                      }

                      isOn = false
                      toggleButton.text = "TURN ON"
                      strengthText.text = "Strength: 0%"
                  } catch (error: Exception) {
                      statusText.text = "Could not turn off flashlight"
                  }
              }

              private fun matchWrap(): ViewGroup.LayoutParams {
                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
              }

              private fun marginParams(
                  left: Int,
                  top: Int,
                  right: Int,
                  bottom: Int
              ): ViewGroup.LayoutParams {
                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply {
                      setMargins(left, top, right, bottom)
                  }
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        working-directory: FlashlightIntensity
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: FlashlightIntensity
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-intensity-debug-apk
          path: FlashlightIntensity/app/build/outputs/apk/debug/app-debug.apk
