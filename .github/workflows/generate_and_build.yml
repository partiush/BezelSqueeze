        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <android/bitmap.h>
        #include <android/log.h>
        #include <opencv2/opencv.hpp>
        #include <deque>
        #include <mutex>
        #include <vector>

        #define LOG_TAG "ZoomCameraEngine"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        static std::mutex gBurstMutex;
        static std::deque<cv::Mat> gBurstQueue;
        static const size_t MAX_BURST_FRAMES = 8;

        static std::mutex gLockMutex;
        static cv::Mat gLockTemplate;
        static cv::Point2f gLockPos(0.5f, 0.5f);
        static bool gIsLocked = false;

        static cv::Mat bitmapToMat(JNIEnv* env, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return cv::Mat();
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return cv::Mat();
            cv::Mat rgba(info.height, info.width, CV_8UC4, pixels);
            cv::Mat bgr;
            cv::cvtColor(rgba, bgr, cv::COLOR_RGBA2BGR);
            AndroidBitmap_unlockPixels(env, bitmap);
            return bgr;
        }

        static void matToBitmap(JNIEnv* env, const cv::Mat& bgr, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return;
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return;
            cv::Mat resized;
            if (bgr.cols != (int)info.width || bgr.rows != (int)info.height) {
                cv::resize(bgr, resized, cv::Size(info.width, info.height), 0, 0, cv::INTER_LANCZOS4);
            } else {
                resized = bgr;
            }
            cv::Mat dstRgba(info.height, info.width, CV_8UC4, pixels);
            cv::cvtColor(resized, dstRgba, cv::COLOR_BGR2RGBA);
            AndroidBitmap_unlockPixels(env, bitmap);
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeSetLockAnchor(JNIEnv* env, jobject, jobject bmp, jfloat normX, jfloat normY) {
            cv::Mat bgr = bitmapToMat(env, bmp);
            if (bgr.empty()) return;

            cv::Mat gray;
            cv::cvtColor(bgr, gray, cv::COLOR_BGR2GRAY);

            int patch = std::max(32, std::min(gray.cols, gray.rows) / 12);
            int cx = (int)(normX * gray.cols);
            int cy = (int)(normY * gray.rows);
            int x0 = std::clamp(cx - patch / 2, 0, gray.cols - patch);
            int y0 = std::clamp(cy - patch / 2, 0, gray.rows - patch);

            std::lock_guard<std::mutex> lock(gLockMutex);
            gLockTemplate = gray(cv::Rect(x0, y0, patch, patch)).clone();
            gLockPos = cv::Point2f(normX, normY);
            gIsLocked = true;
        }

        extern "C" JNIEXPORT jfloatArray JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeTrackLock(JNIEnv* env, jobject, jobject bmp) {
            std::lock_guard<std::mutex> lock(gLockMutex);
            if (!gIsLocked || gLockTemplate.empty()) return nullptr;

            cv::Mat bgr = bitmapToMat(env, bmp);
            if (bgr.empty()) return nullptr;
            cv::Mat gray;
            cv::cvtColor(bgr, gray, cv::COLOR_BGR2GRAY);

            int searchRad = gLockTemplate.cols * 2;
            int cx = (int)(gLockPos.x * gray.cols);
            int cy = (int)(gLockPos.y * gray.rows);

            int x0 = std::clamp(cx - searchRad, 0, gray.cols - gLockTemplate.cols - 1);
            int y0 = std::clamp(cy - searchRad, 0, gray.rows - gLockTemplate.rows - 1);
            int w = std::min(searchRad * 2, gray.cols - x0);
            int h = std::min(searchRad * 2, gray.rows - y0);

            if (w <= gLockTemplate.cols || h <= gLockTemplate.rows) return nullptr;

            cv::Mat window = gray(cv::Rect(x0, y0, w, h));
            cv::Mat matchRes;
            cv::matchTemplate(window, gLockTemplate, matchRes, cv::TM_CCOEFF_NORMED);

            double minVal, maxVal;
            cv::Point minLoc, maxLoc;
            cv::minMaxLoc(matchRes, &minVal, &maxVal, &minLoc, &maxLoc);

            if (maxVal > 0.40) {
                float targetX = (float)(x0 + maxLoc.x + gLockTemplate.cols / 2) / (float)gray.cols;
                float targetY = (float)(y0 + maxLoc.y + gLockTemplate.rows / 2) / (float)gray.rows;
                gLockPos.x = gLockPos.x * 0.4f + targetX * 0.6f;
                gLockPos.y = gLockPos.y * 0.4f + targetY * 0.6f;
            }

            jfloatArray out = env->NewFloatArray(2);
            float pos[2] = { gLockPos.x, gLockPos.y };
            env->SetFloatArrayRegion(out, 0, 2, pos);
            return out;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeClearLock(JNIEnv*, jobject) {
            std::lock_guard<std::mutex> lock(gLockMutex);
            gIsLocked = false;
            gLockTemplate.release();
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativePushBurstFrame(JNIEnv* env, jobject, jobject bmp) {
            cv::Mat bgr = bitmapToMat(env, bmp);
            if (bgr.empty()) return;

            std::lock_guard<std::mutex> lock(gBurstMutex);
            if (gBurstQueue.size() >= MAX_BURST_FRAMES) {
                gBurstQueue.pop_front();
            }
            gBurstQueue.push_back(bgr);
        }

        extern "C" JNIEXPORT jint JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeRemasterBurst(
            JNIEnv* env, jobject, jobject anchorBmp, jint cropX, jint cropY, jint cropW, jint cropH, jobject outBmp
        ) {
            cv::Mat fullAnchor = bitmapToMat(env, anchorBmp);
            if (fullAnchor.empty()) return 0;

            cv::Rect roiRect(cropX, cropY, cropW, cropH);
            roiRect &= cv::Rect(0, 0, fullAnchor.cols, fullAnchor.rows);
            cv::Mat anchorRoi = fullAnchor(roiRect).clone();

            std::vector<cv::Mat> burstList;
            {
                std::lock_guard<std::mutex> lock(gBurstMutex);
                for (const auto& b : gBurstQueue) {
                    cv::Rect sub(cropX, cropY, cropW, cropH);
                    sub &= cv::Rect(0, 0, b.cols, b.rows);
                    if (sub.width == cropW && sub.height == cropH) {
                        burstList.push_back(b(sub).clone());
                    }
                }
                gBurstQueue.clear();
            }

            AndroidBitmapInfo outInfo;
            AndroidBitmap_getInfo(env, outBmp, &outInfo);
            int targetW = outInfo.width;
            int targetH = outInfo.height;

            cv::Mat targetAnchor;
            cv::resize(anchorRoi, targetAnchor, cv::Size(targetW, targetH), 0, 0, cv::INTER_LANCZOS4);

            cv::Mat anchorGray;
            cv::cvtColor(targetAnchor, anchorGray, cv::COLOR_BGR2GRAY);

            // True Sub-Pixel Multi-Frame Accumulation (Drizzle)
            cv::Mat accumFloat;
            targetAnchor.convertTo(accumFloat, CV_32FC3, 2.0);
            cv::Mat weightSum = cv::Mat::ones(targetH, targetW, CV_32FC1) * 2.0f;
            int fused = 1;

            for (const auto& frame : burstList) {
                cv::Mat frameHi;
                cv::resize(frame, frameHi, cv::Size(targetW, targetH), 0, 0, cv::INTER_CUBIC);
                cv::Mat frameGray;
                cv::cvtColor(frameHi, frameGray, cv::COLOR_BGR2GRAY);

                cv::Mat a32, f32;
                anchorGray.convertTo(a32, CV_32F);
                frameGray.convertTo(f32, CV_32F);

                double response = 0.0;
                cv::Point2d shift = cv::phaseCorrelate(f32, a32, cv::noArray(), &response);

                if (std::abs(shift.x) < targetW * 0.15 && std::abs(shift.y) < targetH * 0.15 && response > 0.10) {
                    cv::Mat warp = (cv::Mat_<double>(2, 3) << 1.0, 0.0, shift.x, 0.0, 1.0, shift.y);
                    cv::Mat aligned;
                    cv::warpAffine(frameHi, aligned, warp, cv::Size(targetW, targetH), cv::INTER_LANCZOS4, cv::BORDER_REPLICATE);

                    cv::Mat diff;
                    cv::absdiff(targetAnchor, aligned, diff);
                    cv::Mat diffGray;
                    cv::cvtColor(diff, diffGray, cv::COLOR_BGR2GRAY);

                    cv::Mat mask;
                    cv::threshold(diffGray, mask, 30.0, 1.0, cv::THRESH_BINARY_INV);
                    mask.convertTo(mask, CV_32FC1);

                    cv::Mat alignedF;
                    aligned.convertTo(alignedF, CV_32FC3);

                    std::vector<cv::Mat> ch(3), accCh(3);
                    cv::split(alignedF, ch);
                    cv::split(accumFloat, accCh);
                    for (int c = 0; c < 3; ++c) {
                        accCh[c] += ch[c].mul(mask);
                    }
                    cv::merge(accCh, accumFloat);
                    weightSum += mask;
                    fused++;
                }
            }

            std::vector<cv::Mat> accPlanes(3);
            cv::split(accumFloat, accPlanes);
            for (int c = 0; c < 3; ++c) {
                cv::divide(accPlanes[c], weightSum, accPlanes[c]);
            }
            cv::Mat finalF, merged8U;
            cv::merge(accPlanes, finalF);
            finalF.convertTo(merged8U, CV_8UC3);

            // Optical Deconvolution & Natural Edge Preservation (No Watercolor Blur)
            cv::Mat lab;
            cv::cvtColor(merged8U, lab, cv::COLOR_BGR2Lab);
            std::vector<cv::Mat> labCh;
            cv::split(lab, labCh);

            cv::Ptr<cv::CLAHE> clahe = cv::createCLAHE(2.0, cv::Size(8, 8));
            clahe->apply(labCh[0], labCh[0]);

            // High-frequency structural sharpening
            cv::Mat blurL, sharpL;
            cv::GaussianBlur(labCh[0], blurL, cv::Size(0, 0), 1.2);
            cv::addWeighted(labCh[0], 1.7, blurL, -0.7, 0, labCh[0]);

            cv::merge(labCh, lab);
            cv::Mat resultBGR;
            cv::cvtColor(lab, resultBGR, cv::COLOR_Lab2BGR);

            matToBitmap(env, resultBGR, outBmp);
            return fused;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeCleanTextEdges(
            JNIEnv* env, jobject, jobject bmp, jintArray boxes
        ) {
            cv::Mat img = bitmapToMat(env, bmp);
            if (img.empty()) return;

            jsize len = env->GetArrayLength(boxes);
            jint* ptr = env->GetIntArrayElements(boxes, nullptr);

            for (int i = 0; i + 3 < len; i += 4) {
                int x = std::max(0, ptr[i] - 6);
                int y = std::max(0, ptr[i + 1] - 6);
                int w = std::min(img.cols - x, ptr[i + 2] + 12);
                int h = std::min(img.rows - y, ptr[i + 3] + 12);
                if (w <= 8 || h <= 8) continue;

                cv::Rect roiRect(x, y, w, h);
                cv::Mat roi = img(roiRect);

                // Morphological text stroke contrast restoration
                cv::Mat gray;
                cv::cvtColor(roi, gray, cv::COLOR_BGR2GRAY);

                cv::Mat morph;
                cv::Mat kernel = cv::getStructuringElement(cv::MORPH_RECT, cv::Size(2, 2));
                cv::morphologyEx(gray, morph, cv::MORPH_GRADIENT, kernel);

                cv::Mat mask;
                cv::threshold(morph, mask, 40, 255, cv::THRESH_BINARY);

                cv::Mat lab;
                cv::cvtColor(roi, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> planes;
                cv::split(lab, planes);

                // Boost edge sharpness strictly on letter boundaries
                cv::Mat sharp;
                cv::addWeighted(planes[0], 1.8, gray, -0.8, 0, sharp);
                sharp.copyTo(planes[0], mask);

                cv::merge(planes, lab);
                cv::cvtColor(lab, roi, cv::COLOR_Lab2BGR);
            }

            env->ReleaseIntArrayElements(boxes, ptr, JNI_ABORT);
            matToBitmap(env, img, bmp);
        }
        EOF

