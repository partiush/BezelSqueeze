        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/pip_box_border.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <stroke android:width="2dp" android:color="#FFD600" />
            <solid android:color="#20FFD600" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/CameraOverlayView.kt
        package com.example.zoomcamera

        import android.content.Context
        import android.graphics.*
        import android.util.AttributeSet
        import android.view.View

        class CameraOverlayView @JvmOverloads constructor(
            context: Context, attrs: AttributeSet? = null
        ) : View(context, attrs) {

            var isLocked = false
            var targetScreenX = 0.5f
            var targetScreenY = 0.5f
            var isZoomHigh = false

            private val boxPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 4f
                color = Color.parseColor("#FFD600")
            }

            private val crosshairPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 2f
                color = Color.parseColor("#80FFFFFF")
            }

            fun updateOverlay(locked: Boolean, scrX: Float, scrY: Float, highZoom: Boolean) {
                isLocked = locked
                targetScreenX = scrX
                targetScreenY = scrY
                isZoomHigh = highZoom
                postInvalidateOnAnimation()
            }

            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val cx = targetScreenX * width
                val cy = targetScreenY * height

                if (isLocked) {
                    boxPaint.color = Color.parseColor("#00E676")
                    val sz = 80f
                    canvas.drawRect(cx - sz, cy - sz, cx + sz, cy + sz, boxPaint)
                    canvas.drawLine(cx - sz - 20f, cy, cx - sz + 15f, cy, boxPaint)
                    canvas.drawLine(cx + sz - 15f, cy, cx + sz + 20f, cy, boxPaint)
                    canvas.drawLine(cx, cy - sz - 20f, cx, cy - sz + 15f, boxPaint)
                    canvas.drawLine(cx, cy + sz - 15f, cx, cy + sz + 20f, boxPaint)
                } else if (isZoomHigh) {
                    canvas.drawCircle(width / 2f, height / 2f, 28f, crosshairPaint)
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/MainActivity.kt
        package com.example.zoomcamera

        import android.Manifest
        import android.content.ContentValues
        import android.content.Context
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.Matrix
        import android.graphics.Rect
        import android.graphics.RectF
        import android.hardware.Sensor
        import android.hardware.SensorEvent
        import android.hardware.SensorEventListener
        import android.hardware.SensorManager
        import android.hardware.camera2.CaptureRequest
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.util.Size
        import android.view.GestureDetector
        import android.view.MotionEvent
        import android.view.ScaleGestureDetector
        import android.view.View
        import android.view.ViewGroup
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.camera2.interop.Camera2Interop
        import androidx.camera.core.*
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.camera.view.PreviewView
        import androidx.cardview.widget.CardView
        import androidx.constraintlayout.widget.ConstraintLayout
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import androidx.lifecycle.lifecycleScope
        import com.google.mlkit.vision.common.InputImage
        import com.google.mlkit.vision.text.TextRecognition
        import com.google.mlkit.vision.text.latin.TextRecognizerOptions
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.tasks.await
        import kotlinx.coroutines.withContext
        import java.io.OutputStream
        import java.util.concurrent.Executors
        import kotlin.math.min

        enum class AspectRatioMode(val label: String, val ratioW: Int, val ratioH: Int) {
            RATIO_4_3("4:3", 3, 4),
            RATIO_16_9("16:9", 9, 16),
            RATIO_1_1("1:1", 1, 1),
            RATIO_FULL("FULL", 0, 0)
        }

        class MainActivity : AppCompatActivity(), SensorEventListener {

            private lateinit var previewView: PreviewView
            private lateinit var overlayView: CameraOverlayView
            private lateinit var cameraFrameContainer: FrameLayout
            private lateinit var pipContainer: CardView
            private lateinit var ivPipMap: ImageView
            private lateinit var vPipIndicator: View
            private lateinit var btnCancelLock: Button
            private lateinit var btnAspectRatio: Button
            private lateinit var tvZoomDisplay: TextView
            private lateinit var tvOcrBanner: TextView
            private lateinit var seekZoom: SeekBar
            private lateinit var ivGalleryThumb: ImageView

            private var camera: Camera? = null
            private var lensFacing = CameraSelector.LENS_FACING_BACK
            private var flashMode = ImageCapture.FLASH_MODE_OFF
            private var currentRatio = AspectRatioMode.RATIO_4_3

            private var totalZoom = 1.0f
            private var maxHardwareZoom = 8.0f
            private var softwareScale = 1.0f

            // Target lock and Gyro tracking coordinates
            @Volatile private var isTargetLocked = false
            @Volatile private var lockNormX = 0.5f
            @Volatile private var lockNormY = 0.5f
            private var gyroOffsetNormX = 0f
            private var gyroOffsetNormY = 0f
            private var lastGyroTime = 0L

            private lateinit var sensorManager: SensorManager
            private var gyroSensor: Sensor? = null

            private val backgroundExecutor = Executors.newFixedThreadPool(2)
            private val textRecognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }

            // High-res burst buffer decoupled from UI
            @Volatile private var latestFrameBitmap: Bitmap? = null
            private var pipThrottleCounter = 0

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                previewView = findViewById(R.id.previewView)
                overlayView = findViewById(R.id.overlayView)
                cameraFrameContainer = findViewById(R.id.cameraFrameContainer)
                pipContainer = findViewById(R.id.pipContainer)
                ivPipMap = findViewById(R.id.ivPipMap)
                vPipIndicator = findViewById(R.id.vPipIndicator)
                btnCancelLock = findViewById(R.id.btnCancelLock)
                btnAspectRatio = findViewById(R.id.btnAspectRatio)
                tvZoomDisplay = findViewById(R.id.tvZoomDisplay)
                tvOcrBanner = findViewById(R.id.tvOcrBanner)
                seekZoom = findViewById(R.id.seekZoom)
                ivGalleryThumb = findViewById(R.id.ivGalleryThumb)

                // Enforce TextureView GPU mode for zero-latency RenderThread transforms
                previewView.implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                previewView.scaleType = PreviewView.ScaleType.FILL_CENTER

                sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE)

                setupInteractions()
                applyAspectRatioDimensions()

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                } else {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                }
            }

            override fun onResume() {
                super.onResume()
                gyroSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST) }
            }

            override fun onPause() {
                super.onPause()
                sensorManager.unregisterListener(this)
            }

            private fun setupInteractions() {
                // Aspect Ratio cycling
                btnAspectRatio.setOnClickListener {
                    currentRatio = when (currentRatio) {
                        AspectRatioMode.RATIO_4_3 -> AspectRatioMode.RATIO_16_9
                        AspectRatioMode.RATIO_16_9 -> AspectRatioMode.RATIO_1_1
                        AspectRatioMode.RATIO_1_1 -> AspectRatioMode.RATIO_FULL
                        AspectRatioMode.RATIO_FULL -> AspectRatioMode.RATIO_4_3
                    }
                    btnAspectRatio.text = currentRatio.label
                    applyAspectRatioDimensions()
                }

                // Unlock target button
                btnCancelLock.setOnClickListener { clearTargetLock() }

                // Zoom presets
                val presetMap = mapOf(
                    R.id.btnZ1 to 1.0f,
                    R.id.btnZ5 to 5.0f,
                    R.id.btnZ15 to 15.0f,
                    R.id.btnZ50 to 50.0f,
                    R.id.btnZ100 to 100.0f,
                    R.id.btnZ200 to 200.0f
                )
                presetMap.forEach { (id, zoom) ->
                    findViewById<Button>(id).setOnClickListener { setTargetZoom(zoom, updateSlider = true) }
                }

                seekZoom.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                        if (fromUser) {
                            setTargetZoom(1.0f + (progress / 10.0f), updateSlider = false)
                        }
                    }
                    override fun onStartTrackingTouch(sb: SeekBar?) {}
                    override fun onStopTrackingTouch(sb: SeekBar?) {}
                })

                findViewById<Button>(R.id.btnFlash).setOnClickListener { view ->
                    val b = view as Button
                    flashMode = if (flashMode == ImageCapture.FLASH_MODE_OFF) {
                        camera?.cameraControl?.enableTorch(true)
                        b.text = "⚡ ON"
                        ImageCapture.FLASH_MODE_ON
                    } else {
                        camera?.cameraControl?.enableTorch(false)
                        b.text = "⚡ OFF"
                        ImageCapture.FLASH_MODE_OFF
                    }
                }

                findViewById<Button>(R.id.btnFlipCamera).setOnClickListener {
                    lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                        CameraSelector.LENS_FACING_FRONT
                    } else {
                        CameraSelector.LENS_FACING_BACK
                    }
                    startCamera()
                }

                findViewById<Button>(R.id.btnShutter).setOnClickListener {
                    captureMultiFrameRemaster()
                }

                setupTouchGestures()
            }

            private fun setupTouchGestures() {
                val scaleGesture = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    override fun onScale(detector: ScaleGestureDetector): Boolean {
                        val newZoom = (totalZoom * detector.scaleFactor).coerceIn(1.0f, 200.0f)
                        setTargetZoom(newZoom, updateSlider = true)
                        return true
                    }
                })

                val tapGesture = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        if (isTargetLocked) {
                            // Any tap while locked clears the lock instantly
                            clearTargetLock()
                            return true
                        }
                        val factory = previewView.meteringPointFactory
                        val point = factory.createPoint(e.x, e.y)
                        camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(point).build())
                        return true
                    }

                    override fun onLongPress(e: MotionEvent) {
                        // Lock target at tapped coordinate
                        val normX = (e.x / previewView.width.toFloat()).coerceIn(0.1f, 0.9f)
                        val normY = (e.y / previewView.height.toFloat()).coerceIn(0.1f, 0.9f)

                        lockNormX = normX
                        lockNormY = normY
                        gyroOffsetNormX = 0f
                        gyroOffsetNormY = 0f
                        isTargetLocked = true

                        latestFrameBitmap?.let { bmp ->
                            nativeSetLockAnchor(bmp, normX, normY)
                        }

                        btnCancelLock.visibility = View.VISIBLE
                        applyGpuViewportTransform()
                        Toast.makeText(this@MainActivity, "Target Locked! Tracking active.", Toast.LENGTH_SHORT).show()
                    }
                })

                overlayView.setOnTouchListener { _, event ->
                    scaleGesture.onTouchEvent(event)
                    tapGesture.onTouchEvent(event)
                    true
                }
            }

            private fun clearTargetLock() {
                isTargetLocked = false
                lockNormX = 0.5f
                lockNormY = 0.5f
                gyroOffsetNormX = 0f
                gyroOffsetNormY = 0f
                nativeClearLock()
                btnCancelLock.visibility = View.GONE
                applyGpuViewportTransform()
                overlayView.updateOverlay(false, 0.5f, 0.5f, totalZoom >= 15f)
            }

            private fun applyAspectRatioDimensions() {
                val root = findViewById<ConstraintLayout>(R.id.rootContainer)
                root.post {
                    val rootW = root.width
                    val rootH = root.height
                    val params = cameraFrameContainer.layoutParams as ConstraintLayout.LayoutParams

                    if (currentRatio == AspectRatioMode.RATIO_FULL) {
                        params.width = ViewGroup.LayoutParams.MATCH_PARENT
                        params.height = ViewGroup.LayoutParams.MATCH_PARENT
                        params.dimensionRatio = null
                    } else {
                        val targetW = rootW
                        val targetH = (rootW * currentRatio.ratioH) / currentRatio.ratioW
                        if (targetH <= rootH) {
                            params.width = targetW
                            params.height = targetH
                        } else {
                            params.height = rootH
                            params.width = (rootH * currentRatio.ratioW) / currentRatio.ratioH
                        }
                    }
                    cameraFrameContainer.layoutParams = params
                }
            }

            private fun setTargetZoom(zoom: Float, updateSlider: Boolean) {
                totalZoom = zoom.coerceIn(1.0f, 200.0f)
                val hwZoom = min(totalZoom, maxHardwareZoom)
                camera?.cameraControl?.setZoomRatio(hwZoom)
                softwareScale = (totalZoom / hwZoom).coerceAtLeast(1.0f)

                tvZoomDisplay.text = String.format("%.1fx", totalZoom)
                if (updateSlider) {
                    seekZoom.progress = ((totalZoom - 1.0f) * 10f).toInt()
                }

                pipContainer.visibility = if (totalZoom >= 15.0f) View.VISIBLE else View.GONE
                applyGpuViewportTransform()
            }

            // Direct hardware-accelerated viewport zoom: 0ms lag, solid 60 FPS
            private fun applyGpuViewportTransform() {
                val activeNormX = (lockNormX + gyroOffsetNormX).coerceIn(0.08f, 0.92f)
                val activeNormY = (lockNormY + gyroOffsetNormY).coerceIn(0.08f, 0.92f)

                previewView.pivotX = activeNormX * previewView.width
                previewView.pivotY = activeNormY * previewView.height
                previewView.scaleX = softwareScale
                previewView.scaleY = softwareScale

                overlayView.updateOverlay(isTargetLocked, activeNormX, activeNormY, totalZoom >= 15f)
                updatePipIndicator(activeNormX, activeNormY)
            }

            private fun updatePipIndicator(normX: Float, normY: Float) {
                if (pipContainer.visibility != View.VISIBLE) return
                val pipW = pipContainer.width.toFloat().coerceAtLeast(1f)
                val pipH = pipContainer.height.toFloat().coerceAtLeast(1f)

                val boxFraction = (1.0f / softwareScale).coerceIn(0.1f, 0.9f)
                val boxPxW = pipW * boxFraction
                val boxPxH = pipH * boxFraction

                vPipIndicator.layoutParams.width = boxPxW.toInt().coerceAtLeast(20)
                vPipIndicator.layoutParams.height = boxPxH.toInt().coerceAtLeast(20)
                vPipIndicator.translationX = (normX * pipW) - (boxPxW / 2f)
                vPipIndicator.translationY = (normY * pipH) - (boxPxH / 2f)
            }

            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    val provider = cameraProviderFuture.get()
                    provider.unbindAll()

                    val targetRatio = when (currentRatio) {
                        AspectRatioMode.RATIO_16_9 -> AspectRatio.RATIO_16_9
                        else -> AspectRatio.RATIO_4_3
                    }

                    val previewBuilder = Preview.Builder().setTargetAspectRatio(targetRatio)
                    Camera2Interop.Extender(previewBuilder)
                        .setCaptureRequestOption(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE, CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON)
                        .setCaptureRequestOption(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON)

                    val preview = previewBuilder.build().also {
                        it.setSurfaceProvider(previewView.surfaceProvider)
                    }

                    // Background analysis: completely isolated from UI rendering thread
                    val analysisBuilder = ImageAnalysis.Builder()
                        .setTargetResolution(Size(1280, 720))
                        .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                        .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)

                    val imageAnalysis = analysisBuilder.build()
                    imageAnalysis.setAnalyzer(backgroundExecutor) { proxy ->
                        processBackgroundBuffer(proxy)
                    }

                    val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()
                    camera = provider.bindToLifecycle(this, selector, preview, imageAnalysis)

                    maxHardwareZoom = (camera?.cameraInfo?.zoomState?.value?.maxZoomRatio ?: 8.0f).coerceAtLeast(1.0f)
                    setTargetZoom(totalZoom, updateSlider = true)
                }, ContextCompat.getMainExecutor(this))
            }

            private fun processBackgroundBuffer(proxy: ImageProxy) {
                try {
                    val bmp = proxy.toBitmap()
                    val rot = proxy.imageInfo.rotationDegrees
                    val corrected = if (rot != 0) {
                        val m = Matrix().apply { postRotate(rot.toFloat()) }
                        Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                    } else {
                        bmp
                    }

                    latestFrameBitmap = corrected

                    // Track locked target in background without touching UI
                    if (isTargetLocked) {
                        val updatedCoords = nativeTrackLock(corrected)
                        if (updatedCoords != null && updatedCoords.size == 2) {
                            lockNormX = updatedCoords[0]
                            lockNormY = updatedCoords[1]
                            runOnUiThread { applyGpuViewportTransform() }
                        }
                    }

                    // Push frame into C++ Multi-Frame Super Resolution circular buffer
                    nativePushBurstFrame(corrected)

                    // Throttle PiP update to 8 FPS to eliminate any frame drops
                    if (++pipThrottleCounter % 4 == 0 && totalZoom >= 15.0f) {
                        val pipThumb = Bitmap.createScaledBitmap(corrected, 180, 240, false)
                        runOnUiThread { ivPipMap.setImageBitmap(pipThumb) }
                    }
                } catch (_: Exception) {
                } finally {
                    proxy.close()
                }
            }

            override fun onSensorChanged(event: SensorEvent?) {
                if (event?.sensor?.type != Sensor.TYPE_GYROSCOPE) return
                if (lastGyroTime != 0L && totalZoom >= 5.0f && !isTargetLocked) {
                    val dt = (event.timestamp - lastGyroTime) * 1e-9f
                    val damp = 0.035f / softwareScale
                    gyroOffsetNormX = (gyroOffsetNormX - event.values[1] * dt * damp).coerceIn(-0.12f, 0.12f)
                    gyroOffsetNormY = (gyroOffsetNormY + event.values[0] * dt * damp).coerceIn(-0.12f, 0.12f)
                    gyroOffsetNormX *= 0.95f
                    gyroOffsetNormY *= 0.95f
                    runOnUiThread { applyGpuViewportTransform() }
                }
                lastGyroTime = event.timestamp
            }

            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

            private fun captureMultiFrameRemaster() {
                val anchor = latestFrameBitmap ?: run {
                    Toast.makeText(this, "Camera stabilizing...", Toast.LENGTH_SHORT).show()
                    return
                }

                Toast.makeText(this, "Capturing Multi-Frame 200x Drizzle...", Toast.LENGTH_SHORT).show()

                // Calculate the exact bounding crop matching the user's aspect ratio and zoom
                val activeNormX = (lockNormX + gyroOffsetNormX).coerceIn(0.08f, 0.92f)
                val activeNormY = (lockNormY + gyroOffsetNormY).coerceIn(0.08f, 0.92f)

                val cropW = (anchor.width / softwareScale).toInt().coerceAtLeast(32)
                val cropH = when (currentRatio) {
                    AspectRatioMode.RATIO_1_1 -> cropW
                    AspectRatioMode.RATIO_16_9 -> (cropW * 16) / 9
                    AspectRatioMode.RATIO_4_3 -> (cropW * 4) / 3
                    AspectRatioMode.RATIO_FULL -> (cropW * previewView.height) / previewView.width
                }.coerceIn(32, anchor.height)

                val left = ((activeNormX * anchor.width) - cropW / 2).toInt().coerceIn(0, anchor.width - cropW)
                val top = ((activeNormY * anchor.height) - cropH / 2).toInt().coerceIn(0, anchor.height - cropH)
                val exactCropRect = Rect(left, top, left + cropW, top + cropH)

                val outW = 1080
                val outH = (1080 * exactCropRect.height()) / exactCropRect.width()
                val outBitmap = Bitmap.createBitmap(outW, outH, Bitmap.Config.ARGB_8888)

                lifecycleScope.launch(Dispatchers.Default) {
                    // Sub-Pixel Multi-Frame Fusion (Optical Drizzle without fake AI hallucination)
                    val mergedFrames = nativeRemasterBurst(
                        anchor,
                        exactCropRect.left,
                        exactCropRect.top,
                        exactCropRect.width(),
                        exactCropRect.height(),
                        outBitmap
                    )

                    // ML Kit On-Device Text Clarification
                    var recognizedText = ""
                    try {
                        val visionImg = InputImage.fromBitmap(outBitmap, 0)
                        val textResult = textRecognizer.process(visionImg).await()
                        if (textResult.text.isNotBlank()) {
                            recognizedText = textResult.text.trim()
                            val boxes = textResult.textBlocks.mapNotNull { it.boundingBox }
                            val flat = IntArray(boxes.size * 4)
                            boxes.forEachIndexed { i, r ->
                                flat[i * 4] = r.left
                                flat[i * 4 + 1] = r.top
                                flat[i * 4 + 2] = r.width()
                                flat[i * 4 + 3] = r.height()
                            }
                            if (flat.isNotEmpty()) {
                                nativeCleanTextEdges(outBitmap, flat)
                            }
                        }
                    } catch (_: Exception) {}

                    saveToGallery(outBitmap)

                    withContext(Dispatchers.Main) {
                        ivGalleryThumb.setImageBitmap(outBitmap)
                        if (recognizedText.isNotEmpty()) {
                            tvOcrBanner.text = "READABLE TEXT DETECTED:\n$recognizedText"
                            tvOcrBanner.visibility = View.VISIBLE
                        }
                        Toast.makeText(this@MainActivity, "Saved Remastered Photo ($mergedFrames frames fused)!", Toast.LENGTH_SHORT).show()
                    }
                }
            }

            private fun saveToGallery(bitmap: Bitmap) {
                val filename = "Zoom200x_${System.currentTimeMillis()}.jpg"
                val values = ContentValues().apply {
                    put(MediaStore.Images.Media.DISPLAY_NAME, filename)
                    put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/200xUltraCamera")
                    }
                }
                val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values) ?: return
                contentResolver.openOutputStream(uri)?.use { out: OutputStream ->
                    bitmap.compress(Bitmap.CompressFormat.JPEG, 98, out)
                }
            }

            external fun nativeSetLockAnchor(bmp: Bitmap, normX: Float, normY: Float)
            external fun nativeTrackLock(bmp: Bitmap): FloatArray?
            external fun nativeClearLock()
            external fun nativePushBurstFrame(bmp: Bitmap)
            external fun nativeRemasterBurst(anchor: Bitmap, cropX: Int, cropY: Int, cropW: Int, cropH: Int, outBmp: Bitmap): Int
            external fun nativeCleanTextEdges(bmp: Bitmap, boxes: IntArray)

            companion object {
                init {
                    System.loadLibrary("zoomcamera")
                }
            }
        }
