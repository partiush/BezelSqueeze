name: Generate Project & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Complete Android Project
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/edge/bezelmorph

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.0.0")
          }
          EOF

          # 5. Manifest (Boot + Foreground Persistent Service + Haptics)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:foregroundServiceType="specialUse"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>

                  <receiver
                      android:name=".BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 6. Service Configuration & Resources
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagIncludeNotImportantViews"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph Engine</string>
              <string name="service_description">Hardware physical button perimeter synchronizer.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          # 7. Boot Receiver
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BootCompletedReceiver.kt
          package com.edge.bezelmorph

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootCompletedReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  // Keep settings hot in flash memory
                  val store = MorphConfigStore(context)
                  val _unused = store.isLeftEdge
              }
          }
          EOF

          # 8. Config Store
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MorphConfigStore.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.content.SharedPreferences

          class MorphConfigStore(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("bezel_morph_pref", Context.MODE_PRIVATE)

              var volumeUpRatio: Float
                  get() = prefs.getFloat("v_up_ratio", 0.235f)
                  set(v) = prefs.edit().putFloat("v_up_ratio", v).apply()

              var volumeDownRatio: Float
                  get() = prefs.getFloat("v_down_ratio", 0.335f)
                  set(v) = prefs.edit().putFloat("v_down_ratio", v).apply()

              var lengthPx: Float
                  get() = prefs.getFloat("bulge_len", 175f)
                  set(v) = prefs.edit().putFloat("bulge_len", v).apply()

              var depthPx: Float
                  get() = prefs.getFloat("bulge_dep", 26f)
                  set(v) = prefs.edit().putFloat("bulge_dep", v).apply()

              var isLeftEdge: Boolean
                  get() = prefs.getBoolean("is_left_side", true)
                  set(v) = prefs.edit().putBoolean("is_left_side", v).apply()
          }
          EOF

          # 9. Ultra-Accurate Squircle Pill Bezel Engine with Ambient Glass Specular Lip
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BezelSurfaceView.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.graphics.*
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.util.AttributeSet
          import android.view.View
          import androidx.dynamicanimation.animation.FloatPropertyCompat
          import androidx.dynamicanimation.animation.SpringAnimation
          import androidx.dynamicanimation.animation.SpringForce

          class BezelSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              var isLeftEdge: Boolean = true
              var centerY: Float = 400f
              var bulgeLength: Float = 175f
              var maxDepth: Float = 26f

              private var displacement: Float = 0f
              private val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator

              private val bodyPath = Path()
              private val rimPath = Path()

              // Deep Pitch Black Core (Matches OLED border & physical frame)
              private val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  style = Paint.Style.FILL
              }

              // Drop shadow into content layer
              private val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0x55000000
                  style = Paint.Style.FILL
                  maskFilter = BlurMaskFilter(14f, BlurMaskFilter.Blur.NORMAL)
              }

              // Specular Glass Edge Arc (Glint along curvature)
              private val specularRimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3.2f
                  strokeCap = Paint.Cap.ROUND
              }

              private val animProp = object : FloatPropertyCompat<BezelSurfaceView>("displacement") {
                  override fun getValue(v: BezelSurfaceView): Float = v.displacement
                  override fun setValue(v: BezelSurfaceView, value: Float) {
                      v.displacement = value
                      v.invalidate()
                  }
              }

              // Spring tuned to 1400f stiffness with 0.62f damping
              private val spring = SpringAnimation(this, animProp).apply {
                  spring = SpringForce().apply {
                      dampingRatio = 0.62f
                      stiffness = 1400f
                  }
              }

              fun onHardwareButtonDown() {
                  spring.cancel()
                  triggerHapticTick()
                  // Push inward instantly with high impulse velocity
                  displacement = 1.0f
                  invalidate()
              }

              fun onHardwareButtonUp() {
                  spring.cancel()
                  spring.setStartValue(displacement)
                  spring.animateToFinalPosition(0f)
              }

              fun setPreviewStatic(value: Float) {
                  spring.cancel()
                  displacement = value
                  invalidate()
              }

              private fun triggerHapticTick() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          vibrator?.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(10)
                      }
                  } catch (ignored: Exception) {}
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (displacement <= 0.0001f) return

                  val w = width.toFloat()
                  val currentDepth = maxDepth * displacement

                  // Squircle geometry: A flat-crested pill center with G2 continuous tangent lead-ins
                  val halfLen = bulgeLength / 2f
                  val crestHalf = halfLen * 0.38f // Flat crest matching button pill length
                  val leadIn = halfLen - crestHalf

                  val y0 = centerY - halfLen
                  val y1 = centerY - crestHalf
                  val y2 = centerY + crestHalf
                  val y3 = centerY + halfLen

                  bodyPath.reset()
                  rimPath.reset()

                  if (isLeftEdge) {
                      // Lead-in cubic blend -> flat crest -> lead-out cubic blend
                      bodyPath.moveTo(0f, y0)
                      bodyPath.cubicTo(
                          currentDepth * 0.15f, y0 + (leadIn * 0.60f),
                          currentDepth, y1 - (leadIn * 0.25f),
                          currentDepth, y1
                      )
                      bodyPath.lineTo(currentDepth, y2)
                      bodyPath.cubicTo(
                          currentDepth, y2 + (leadIn * 0.25f),
                          currentDepth * 0.15f, y3 - (leadIn * 0.60f),
                          0f, y3
                      )
                      bodyPath.lineTo(0f, y0)

                      // Draw ambient shadow under curve
                      canvas.drawPath(bodyPath, shadowPaint)
                      // Draw solid OLED black core
                      canvas.drawPath(bodyPath, bodyPaint)

                      // Specular refraction edge line
                      specularRimPaint.shader = LinearGradient(
                          0f, y0, currentDepth, centerY,
                          intArrayOf(0x00FFFFFF, 0x66FFFFFF, 0x00FFFFFF),
                          floatArrayOf(0.0f, 0.5f, 1.0f),
                          Shader.TileMode.CLAMP
                      )
                      specularRimPaint.alpha = (210 * displacement).toInt()

                      rimPath.moveTo(0f, y0)
                      rimPath.cubicTo(
                          currentDepth * 0.15f, y0 + (leadIn * 0.60f),
                          currentDepth, y1 - (leadIn * 0.25f),
                          currentDepth, y1
                      )
                      rimPath.lineTo(currentDepth, y2)
                      rimPath.cubicTo(
                          currentDepth, y2 + (leadIn * 0.25f),
                          currentDepth * 0.15f, y3 - (leadIn * 0.60f),
                          0f, y3
                      )
                      canvas.drawPath(rimPath, specularRimPaint)
                  } else {
                      val xRight = w
                      bodyPath.moveTo(xRight, y0)
                      bodyPath.cubicTo(
                          xRight - (currentDepth * 0.15f), y0 + (leadIn * 0.60f),
                          xRight - currentDepth, y1 - (leadIn * 0.25f),
                          xRight - currentDepth, y1
                      )
                      bodyPath.lineTo(xRight - currentDepth, y2)
                      bodyPath.cubicTo(
                          xRight - currentDepth, y2 + (leadIn * 0.25f),
                          xRight - (currentDepth * 0.15f), y3 - (leadIn * 0.60f),
                          xRight, y3
                      )
                      bodyPath.lineTo(xRight, y0)

                      canvas.drawPath(bodyPath, shadowPaint)
                      canvas.drawPath(bodyPath, bodyPaint)

                      specularRimPaint.shader = LinearGradient(
                          xRight, y0, xRight - currentDepth, centerY,
                          intArrayOf(0x00FFFFFF, 0x66FFFFFF, 0x00FFFFFF),
                          floatArrayOf(0.0f, 0.5f, 1.0f),
                          Shader.TileMode.CLAMP
                      )
                      specularRimPaint.alpha = (210 * displacement).toInt()

                      rimPath.moveTo(xRight, y0)
                      rimPath.cubicTo(
                          xRight - (currentDepth * 0.15f), y0 + (leadIn * 0.60f),
                          xRight - currentDepth, y1 - (leadIn * 0.25f),
                          xRight - currentDepth, y1
                      )
                      rimPath.lineTo(xRight - currentDepth, y2)
                      rimPath.cubicTo(
                          xRight - currentDepth, y2 + (leadIn * 0.25f),
                          xRight - (currentDepth * 0.15f), y3 - (leadIn * 0.60f),
                          xRight, y3
                      )
                      canvas.drawPath(rimPath, specularRimPaint)
                  }
              }
          }
          EOF

          # 10. Hardware Service with Low Latency Key Dispatcher
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/HardwareKeyMonitorService.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import androidx.core.app.NotificationCompat

          class HardwareKeyMonitorService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var overlay: BezelSurfaceView? = null
              private lateinit var store: MorphConfigStore
              private var activeKey: Int = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  store = MorphConfigStore(this)
                  startPersistentForeground()
                  attachOverlay()
              }

              private fun startPersistentForeground() {
                  val channelId = "bezel_channel_core"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Morph Service",
                          NotificationManager.IMPORTANCE_MIN
                      ).apply {
                          setShowBadge(false)
                          enableVibration(false)
                      }
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Perimeter Engine Active")
                      .setContentText("Listening to hardware switches")
                      .setSmallIcon(android.R.drawable.ic_menu_crop)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notification)
              }

              private fun attachOverlay() {
                  if (overlay != null) return
                  try {
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          flags,
                          PixelFormat.TRANSLUCENT
                      )

                      overlay = BezelSurfaceView(this).apply {
                          isLeftEdge = store.isLeftEdge
                          bulgeLength = store.lengthPx
                          maxDepth = store.depthPx
                      }
                      wm?.addView(overlay, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode
                  if (code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      val ratio = if (code == KeyEvent.KEYCODE_VOLUME_UP) store.volumeUpRatio else store.volumeDownRatio

                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (event.repeatCount == 0) {
                              activeKey = code
                              overlay?.let { view ->
                                  view.isLeftEdge = store.isLeftEdge
                                  view.bulgeLength = store.lengthPx
                                  view.maxDepth = store.depthPx
                                  view.centerY = view.height * ratio
                                  view.onHardwareButtonDown()
                              }
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          if (activeKey == code) {
                              activeKey = 0
                              overlay?.onHardwareButtonUp()
                          }
                      }
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  try { overlay?.let { wm?.removeView(it) } } catch (ignored: Exception) {}
              }
          }
          EOF

          # 11. Customizer Activity with Live Bezel Interaction & Auto-Vanishing Setup UI
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MainActivity.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.accessibility.AccessibilityManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var store: MorphConfigStore
              private lateinit var preview: BezelSurfaceView
              private var accessButton: Button? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = MorphConfigStore(this)

                  val container = FrameLayout(this).apply { setBackgroundColor(0xFF000000.toInt()) }
                  preview = BezelSurfaceView(this).apply {
                      isLeftEdge = store.isLeftEdge
                      bulgeLength = store.lengthPx
                      maxDepth = store.depthPx
                  }
                  container.addView(preview, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(0xDD121212.toInt())
                      setPadding(36, 24, 36, 32)
                  }
                  val content = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val title = TextView(this).apply {
                      text = "Bezel Physical Alignment"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 18f
                      setPadding(0, 0, 0, 16)
                  }
                  content.addView(title)

                  val edgeSwitch = Switch(this).apply {
                      text = if (store.isLeftEdge) "Side: Left Edge" else "Side: Right Edge"
                      setTextColor(0xFFCCCCCC.toInt())
                      isChecked = store.isLeftEdge
                      setOnCheckedChangeListener { _, checked ->
                          store.isLeftEdge = checked
                          text = if (checked) "Side: Left Edge" else "Side: Right Edge"
                          updatePreview()
                      }
                  }
                  content.addView(edgeSwitch)

                  content.addView(buildSlider("Button 1 Position", (store.volumeUpRatio * 1000).toInt(), 50, 950) {
                      store.volumeUpRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreviewStatic(1.0f)
                  })

                  content.addView(buildSlider("Button 2 Position", (store.volumeDownRatio * 1000).toInt(), 50, 950) {
                      store.volumeDownRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeDownRatio
                      preview.setPreviewStatic(1.0f)
                  })

                  content.addView(buildSlider("Button Height (Length)", store.lengthPx.toInt(), 80, 380) {
                      store.lengthPx = it.toFloat()
                      updatePreview()
                  })

                  content.addView(buildSlider("Morph Depth (Intrusion)", store.depthPx.toInt(), 8, 65) {
                      store.depthPx = it.toFloat()
                      updatePreview()
                  })

                  accessButton = Button(this).apply {
                      text = "Grant System Access"
                      setBackgroundColor(0xFF2E66FF.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  content.addView(accessButton)

                  scroll.addView(content)
                  val cardParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM
                      setMargins(24, 0, 24, 48)
                  }
                  container.addView(scroll, cardParams)

                  setContentView(container)
              }

              override fun onResume() {
                  super.onResume()
                  checkPermissionState()
                  updatePreview()
              }

              private fun checkPermissionState() {
                  if (isServiceRunning()) {
                      accessButton?.visibility = View.GONE
                  } else {
                      accessButton?.visibility = View.VISIBLE
                  }
              }

              private fun isServiceRunning(): Boolean {
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                  val services = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  for (s in services) {
                      if (s.id.contains(packageName)) return true
                  }
                  return false
              }

              private fun buildSlider(name: String, current: Int, min: Int, max: Int, onVal: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 10, 0, 10)
                  }
                  val txt = TextView(this).apply {
                      text = "$name: $current"
                      setTextColor(0xFFB0B0B0.toInt())
                      textSize = 13f
                  }
                  val bar = SeekBar(this).apply {
                      this.max = max - min
                      this.progress = current - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(b: SeekBar?, p: Int, fromUser: Boolean) {
                              val real = p + min
                              txt.text = "$name: $real"
                              onVal(real)
                          }
                          override fun onStartTrackingTouch(b: SeekBar?) {}
                          override fun onStopTrackingTouch(b: SeekBar?) { preview.setPreviewStatic(0f) }
                      })
                  }
                  box.addView(txt)
                  box.addView(bar)
                  return box
              }

              private fun updatePreview() {
                  preview.isLeftEdge = store.isLeftEdge
                  preview.bulgeLength = store.lengthPx
                  preview.maxDepth = store.depthPx
                  preview.post {
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreviewStatic(1.0f)
                  }
              }
          }
          EOF

      - name: Build With Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compile Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BezelMorph-Engine-APK
          path: app/build/outputs/apk/debug/app-debug.apk
