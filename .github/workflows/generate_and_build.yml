          package com.edge.bezelmorph.engine
          import android.content.Context
          import android.media.AudioManager
          import android.os.*
          import com.edge.bezelmorph.core.MorphConfig

          class HapticEngine(ctx: Context) {
              private val vib: Vibrator? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S)
                  (ctx.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as? VibratorManager)?.defaultVibrator
              else @Suppress("DEPRECATION") ctx.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
              private val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as? AudioManager

              fun press(c: MorphConfig) {
                  if (!c.hapticEnabled) return
                  if (c.customWaveformTimings.isNotEmpty() && c.customWaveformAmps.isNotEmpty()) {
                      vib?.vibrate(VibrationEffect.createWaveform(c.customWaveformTimings, c.customWaveformAmps, -1))
                  } else play(c.pressEffect, c)
                  if (c.clickSoundEnabled) audio?.playSoundEffect(AudioManager.FX_KEY_CLICK, c.clickVolume / 100f)
              }
              fun release(c: MorphConfig) {
                  if (!c.hapticEnabled) return
                  play(c.releaseEffect, c)
              }
              private fun play(i: Int, c: MorphConfig) {
                  try {
                      val e = when (i) {
                          0 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK)
                          1 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          2 -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_HEAVY_CLICK)
                          else -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_DOUBLE_CLICK)
                      }
                      vib?.vibrate(e)
                  } catch (_: Exception) {}
              }
          }
          EOF

          # 20. ShaderLibrary
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/shader/ShaderLibrary.kt
          package com.edge.bezelmorph.shader
          import android.graphics.RuntimeShader
          import android.os.Build
          import com.edge.bezelmorph.core.ShaderPreset

          object ShaderLibrary {
              fun supports() = Build.VERSION.SDK_INT >= 33
              fun create(p: ShaderPreset): RuntimeShader? {
                  if (!supports() || p == ShaderPreset.NONE) return null
                  val src = when (p) {
                      ShaderPreset.LIQUID_GLASS -> LIQUID
                      ShaderPreset.CHROME -> CHROME
                      ShaderPreset.JELLY -> JELLY
                      ShaderPreset.WATER -> WATER
                      ShaderPreset.CAUSTICS -> CAUSTICS
                      ShaderPreset.NONE -> return null
                  }
                  return try { RuntimeShader(src) } catch (_: Exception) { null }
              }
              private const val LIQUID = """
              uniform shader content; uniform float2 resolution;
              half4 main(float2 f){ float2 uv=f/resolution; float r=length(uv*2.0-1.0);
              float c=smoothstep(0.8,0.0,r)*0.15; half4 p=content.eval(f+float2(c*20.0,0.0));
              p.rgb+=pow(1.0-abs(uv.x*2.0-1.0),3.0)*0.25; return p; }
              """
              private const val CHROME = """
              uniform shader content; uniform float2 resolution;
              half4 main(float2 f){ float2 uv=f/resolution; float b=smoothstep(0.0,1.0,uv.x)*2.0-1.0;
              half4 p=content.eval(f); p.rgb*=(0.7+0.3*abs(b)); return p; }
              """
              private const val JELLY = """
              uniform shader content; uniform float2 resolution; uniform float time;
              half4 main(float2 f){ float2 uv=f/resolution; float w=sin(uv.y*20.0+time*2.0)*0.01;
              return content.eval(f+float2(w*resolution.x,0.0)); }
              """
              private const val WATER = """
              uniform shader content; uniform float2 resolution; uniform float time;
              half4 main(float2 f){ float2 uv=f/resolution;
              float2 o=float2(sin(uv.y*30.0+time),cos(uv.x*30.0+time))*2.0;
              return content.eval(f+o); }
              """
              private const val CAUSTICS = """
              uniform shader content; uniform float2 resolution;
              half4 main(float2 f){ float2 uv=f/resolution; float d=length(uv-0.5);
              float r=sin(d*60.0)*0.5+0.5; half4 p=content.eval(f); p.rgb+=r*0.1; return p; }
              """
          }
