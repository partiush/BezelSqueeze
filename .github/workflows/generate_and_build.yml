          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/integration/AutomationReceiver.kt
          package com.edge.bezelmorph.integration
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.edge.bezelmorph.core.ConfigStore

          class AutomationReceiver:BroadcastReceiver(){
              override fun onReceive(ctx:Context,intent:Intent){
                  val store=ConfigStore(ctx)
                  when(intent.action){
                      "com.edge.bezelmorph.TRIGGER"->{
                          // Forward to the accessibility service via a broadcast
                          val i=Intent("com.edge.bezelmorph.INTERNAL_TRIGGER")
                          ctx.sendBroadcast(i)
                      }
                      "com.edge.bezelmorph.SET_PROFILE"->{
                          intent.getStringExtra("profile")?.let{ name->
                              store.loadProfile(name)?.let{ store.save(it) }
                          }
                      }
                  }
              }
          }
          EOF

