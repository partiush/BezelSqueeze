name: Build BezelMorph (Production + Debug)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Scaffold BezelMorph — Complete Source
        run: |
          set -e
          mkdir -p gradle/wrapper app/src/main/res/{values,values-night,drawable,mipmap-anydpi-v26,xml,layout} app/src/main/assets
          mkdir -p app/src/main/java/com/edge/bezelmorph/{core,engine,ui,integration,shader,di,data}

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8
          android.enableR8.fullMode=true
          android.enableJetifier=false
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts (Kotlin plugin removed — built into AGP 9)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "9.0.1" apply false
              id("com.google.dagger.hilt.android") version "2.57.1" apply false
              id("com.google.devtools.ksp") version "2.2.10-2.0.2" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("com.google.dagger.hilt.android")
              id("com.google.devtools.ksp")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 300
                  versionName = "300.0.0"
                  resourceConfigurations += listOf("en","fr","de","hi","ja","zh","es","pt","ru","ko")
              }

              signingConfigs {
                  create("release") {
                      if (System.getenv("KEYSTORE_BASE64") != null) {
                          storeFile = file("release.keystore")
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  debug { isMinifyEnabled = false; applicationIdSuffix = ".debug" }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }
              kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_21) } }
              buildFeatures { compose = true; buildConfig = true }
              packaging { resources.excludes += setOf("META-INF/AL2.0","META-INF/LGPL2.1") }
          }

          dependencies {
              // Compose BOM 2026.09.00 (Latest Stable)
              implementation(platform("androidx.compose:compose-bom:2026.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.activity:activity-compose:1.12.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              
              // Core Android
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.1.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              
              // Hilt + KSP
              implementation("com.google.dagger:hilt-android:2.57.1")
              ksp("com.google.dagger:hilt-compiler:2.57.1")
              implementation("androidx.hilt:hilt-navigation-compose:1.4.0")
              
              // Room
              implementation("androidx.room:room-runtime:2.8.5")
              implementation("androidx.room:room-ktx:2.8.5")
              ksp("androidx.room:room-compiler:2.8.5")
              
              // DataStore + Gson
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              implementation("com.google.code.gson:gson:2.13.1")
              
              // Testing
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepclassmembers class com.edge.bezelmorph.core.MorphConfig { *; }
          -keep class com.edge.bezelmorph.shader.ShaderLibrary { *; }
          -keep class * extends androidx.room.RoomDatabase { *; }
          -keep @androidx.room.Entity class *
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:name=".BezelMorphApp"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">

                  <activity
                      android:name=".ui.MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".engine.HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="@string/service_label">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>

                  <service
                      android:name=".engine.FloatingBubbleService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating control bubble for bezel morphology engine" />
                  </service>

                  <service
                      android:name=".integration.QuickSettingsTile"
                      android:exported="true"
                      android:icon="@drawable/ic_qs_tile"
                      android:label="@string/qs_tile_label"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".integration.BezelWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/bezel_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".integration.AutomationReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.edge.bezelmorph.TRIGGER" />
                          <action android:name="com.edge.bezelmorph.SET_PROFILE" />
                          <action android:name="com.edge.bezelmorph.INTERNAL_TRIGGER" />
                      </intent-filter>
                  </receiver>

                  <receiver android:name=".integration.BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="android.app.shortcuts"
                      android:resource="@xml/shortcuts" />
              </application>
          </manifest>
          EOF

          # 6. Accessibility service config
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
