          package com.edge.bezelmorph.ui

          import android.content.Context
          import com.edge.bezelmorph.core.MorphConfig
          import com.edge.bezelmorph.core.*

          enum class FieldType { FLOAT, INT, BOOLEAN, ENUM, COLOR }

          data class ConfigField(
              val key: String,
              val label: String,
              val type: FieldType,
              val category: String,
              val min: Float = 0f,
              val max: Float = 1f,
              val scale: Float = 1f,
              val enumValues: Array<String> = emptyArray(),
              val get: (MorphConfig) -> Float,
              val set: (MorphConfig, Float) -> Unit
          ) {
              fun currentValue(ctx: Context, c: MorphConfig): String = when (type) {
                  FieldType.BOOLEAN -> if (get(c) > 0.5f) "ON" else "OFF"
                  FieldType.ENUM -> enumValues.getOrElse(get(c).toInt()) { "?" }
                  FieldType.COLOR -> String.format("#%06X", get(c).toInt() and 0xFFFFFF)
                  else -> if (scale > 1f) String.format("%.1f", get(c)) else get(c).toInt().toString()
              }
          }

          object ConfigSchema {
              val ALL: List<ConfigField> = listOf(
                  // Geometry
                  ConfigField("edge", "Edge", FieldType.ENUM, "Geometry",
                      enumValues = arrayOf("LEFT", "RIGHT", "TOP", "BOTTOM"),
                      get = { it.edge.ordinal.toFloat() }, set = { c, v -> c.edge = Edge.entries[v.toInt()] }),
                  ConfigField("centerY", "Button center Y (%)", FieldType.FLOAT, "Geometry",
                      min = 0.05f, max = 0.95f, scale = 1000f,
                      get = { it.centerYRatio }, set = { c, v -> c.centerYRatio = v }),
                  ConfigField("y0", "Plateau half-length (dp)", FieldType.FLOAT, "Geometry",
                      min = 12f, max = 80f, scale = 1f,
                      get = { it.y0Dp }, set = { c, v -> c.y0Dp = v }),
                  ConfigField("w", "Shoulder width (dp)", FieldType.FLOAT, "Geometry",
                      min = 15f, max = 100f, scale = 1f,
                      get = { it.wDp }, set = { c, v -> c.wDp = v }),
                  ConfigField("depth", "Peak depth (dp)", FieldType.FLOAT, "Geometry",
                      min = 6f, max = 45f, scale = 1f,
                      get = { it.depthDp }, set = { c, v -> c.depthDp = v }),

                  // Shape
                  ConfigField("shape", "Shape profile", FieldType.ENUM, "Shape",
                      enumValues = ShapeProfile.entries.map { it.name }.toTypedArray(),
                      get = { it.shapeProfile.ordinal.toFloat() },
                      set = { c, v -> c.shapeProfile = ShapeProfile.entries[v.toInt()] }),

                  // Physics
                  ConfigField("omega", "Resonance (rad/s)", FieldType.FLOAT, "Physics",
                      min = 30f, max = 95f, scale = 1f,
                      get = { it.omegaN }, set = { c, v -> c.omegaN = v }),
                  ConfigField("zeta", "Damping ratio", FieldType.FLOAT, "Physics",
                      min = 0.5f, max = 0.99f, scale = 100f,
                      get = { it.zeta }, set = { c, v -> c.zeta = v }),
                  ConfigField("impulse", "Press impulse (px/s)", FieldType.FLOAT, "Physics",
                      min = 500f, max = 4000f, scale = 1f,
                      get = { it.inwardVelocity }, set = { c, v -> c.inwardVelocity = v }),
                  ConfigField("substep", "Substepping", FieldType.BOOLEAN, "Physics",
                      get = { if (it.substepping) 1f else 0f },
                      set = { c, v -> c.substepping = v > 0.5f }),

                  // Fill
                  ConfigField("fill", "Fill mode", FieldType.ENUM, "Fill",
                      enumValues = FillMode.entries.map { it.name }.toTypedArray(),
                      get = { it.fillMode.ordinal.toFloat() },
                      set = { c, v -> c.fillMode = FillMode.entries[v.toInt()] }),
                  ConfigField("fillColor", "Primary color", FieldType.COLOR, "Fill",
                      get = { it.fillColor.toFloat() }, set = { c, v -> c.fillColor = v.toInt() }),
                  ConfigField("fillColor2", "Secondary color", FieldType.COLOR, "Fill",
                      get = { it.fillColor2.toFloat() }, set = { c, v -> c.fillColor2 = v.toInt() }),
                  ConfigField("glass", "Glass highlight", FieldType.BOOLEAN, "Fill",
                      get = { if (it.glassEnabled) 1f else 0f },
                      set = { c, v -> c.glassEnabled = v > 0.5f }),
                  ConfigField("innerShadow", "Inner shadow", FieldType.BOOLEAN, "Fill",
                      get = { if (it.innerShadow) 1f else 0f },
                      set = { c, v -> c.innerShadow = v > 0.5f }),
                  ConfigField("rim", "Rim light", FieldType.BOOLEAN, "Fill",
                      get = { if (it.rimLight) 1f else 0f },
                      set = { c, v -> c.rimLight = v > 0.5f }),

                  // Haptics
                  ConfigField("haptic", "Haptics", FieldType.BOOLEAN, "Haptics",
                      get = { if (it.hapticEnabled) 1f else 0f },
                      set = { c, v -> c.hapticEnabled = v > 0.5f }),
                  ConfigField("hapticIntensity", "Intensity", FieldType.FLOAT, "Haptics",
                      min = 0f, max = 1f, scale = 100f,
                      get = { it.hapticIntensity }, set = { c, v -> c.hapticIntensity = v }),
                  ConfigField("pressEffect", "Press effect", FieldType.ENUM, "Haptics",
                      enumValues = arrayOf("TICK", "CLICK", "HEAVY", "DOUBLE"),
                      get = { it.pressEffect.toFloat() }, set = { c, v -> c.pressEffect = v.toInt() }),
                  ConfigField("releaseEffect", "Release effect", FieldType.ENUM, "Haptics",
                      enumValues = arrayOf("TICK", "CLICK", "HEAVY", "DOUBLE"),
                      get = { it.releaseEffect.toFloat() }, set = { c, v -> c.releaseEffect = v.toInt() }),

                  // Behavior
                  ConfigField("suppress", "Suppress system volume UI", FieldType.BOOLEAN, "Behavior",
                      get = { if (it.suppressVolumeUi) 1f else 0f },
                      set = { c, v -> c.suppressVolumeUi = v > 0.5f }),
                  ConfigField("rate", "Rate limit / min", FieldType.INT, "Behavior",
                      min = 1f, max = 120f, scale = 1f,
                      get = { it.rateLimitPerMinute.toFloat() },
                      set = { c, v -> c.rateLimitPerMinute = v.toInt() }),
                  ConfigField("adaptive", "Adaptive FPS", FieldType.BOOLEAN, "Behavior",
                      get = { if (it.adaptiveFps) 1f else 0f },
                      set = { c, v -> c.adaptiveFps = v > 0.5f }),
                  ConfigField("reduceMotion", "Reduce motion", FieldType.BOOLEAN, "Behavior",
                      get = { if (it.reduceMotion) 1f else 0f },
                      set = { c, v -> c.reduceMotion = v > 0.5f })
              )
          }
          EOF

          ############################################################
          # 24. Quick Settings Tile + Widget + Boot Receiver
          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/integration/QuickSettingsTile.kt
          package com.edge.bezelmorph.integration

          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.content.Intent
          import android.provider.Settings
          import com.edge.bezelmorph.core.ConfigStore

          class QuickSettingsTile : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  val store = ConfigStore(this)
                  val c = store.load()
                  qsTile?.apply {
                      state = if (c.hapticEnabled) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                      label = "Bezel Morph"
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()
                  val store = ConfigStore(this)
                  val c = store.load()
                  c.hapticEnabled = !c.hapticEnabled
                  store.save(c)
                  qsTile?.apply {
                      state = if (c.hapticEnabled) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                      updateTile()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/integration/BezelWidgetProvider.kt
          package com.edge.bezelmorph.integration

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews
          import com.edge.bezelmorph.R
          import com.edge.bezelmorph.core.ConfigStore

          class BezelWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, mgr: AppWidgetManager, ids: IntArray) {
                  val store = ConfigStore(context)
                  val c = store.load()
                  ids.forEach { id ->
                      val views = RemoteViews(context.packageName, R.layout.widget_bezel)
                      views.setTextViewText(R.id.widget_status,
                          if (c.hapticEnabled) "Bezel Morph: ON" else "Bezel Morph: OFF")
                      mgr.updateAppWidget(id, views)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/integration/BootReceiver.kt
          package com.edge.bezelmorph.integration

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.edge.bezelmorph.core.ConfigStore

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      // The accessibility service is auto-started by the OS when enabled.
                      // This receiver simply ensures config is preserved; no-op otherwise.
                      ConfigStore(context).load()
                  }
              }
          }
          EOF

