name: Build 100x SuperZoom APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK and CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          cmake-version: 3.22.1

      - name: Generate Complete Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/superzoom/app
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/models

          # -------------------------------------------------------------
          # 1. GRADLE PROPERTIES
          # -------------------------------------------------------------
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # -------------------------------------------------------------
          # 2. ROOT SETTINGS & BUILD SCRIPT
          # -------------------------------------------------------------
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SuperZoom100x"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # -------------------------------------------------------------
          # 3. APP GRADLE (AUTO-SIGNED RELEASE APK)
          # -------------------------------------------------------------
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.superzoom.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.superzoom.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3 -frtti -fexceptions"
                          abiFilters "arm64-v8a"
                      }
                  }
                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              def camerax_version = "1.3.1"
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # -------------------------------------------------------------
          # 4. ANDROID MANIFEST
          # -------------------------------------------------------------
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature android:name="android.hardware.vulkan.version" android:version="0x400003" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_camera"
                  android:label="100x SuperZoom"
                  android:roundIcon="@android:drawable/ic_menu_camera"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SuperZoom">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # -------------------------------------------------------------
          # 5. UI LAYOUT & RESOURCES (ESCAPED XML)
          # -------------------------------------------------------------
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.SuperZoom" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <FrameLayout
                  android:id="@+id/previewContainer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <androidx.camera.view.PreviewView
                      android:id="@+id/viewFinder"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />

                  <!-- Viewfinder Active Stabilization Reticle Overlay -->
                  <View
                      android:id="@+id/lockReticle"
                      android:layout_width="70dp"
                      android:layout_height="70dp"
                      android:layout_gravity="center"
                      android:background="@android:drawable/btn_default_small"
                      android:backgroundTint="#00FFCC"
                      android:alpha="0.6"
                      android:visibility="gone" />
              </FrameLayout>

              <ImageView
                  android:id="@+id/resultImageView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:visibility="gone" />

              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="36dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <TextView
                      android:id="@+id/zoomLevelText"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="#88000000"
                      android:padding="8dp"
                      android:text="10.0x Zoom"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/toggleMoonModeBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:text="Auto Moon: ON"
                      android:textSize="12sp"
                      style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                      app:strokeColor="#FFFF00"
                      android:textColor="#FFFF00" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="60dp"
                  android:layout_height="60dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:background="#99000000"
                  android:padding="8dp"
                  android:text="Stabilizing &amp; Remastering..."
                  android:textColor="#00FFCC"
                  android:textSize="14sp"
                  android:visibility="gone"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/progressBar" />

              <com.google.android.material.slider.Slider
                  android:id="@+id/zoomSlider"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_marginHorizontal="24dp"
                  android:layout_marginBottom="16dp"
                  android:valueFrom="1.0"
                  android:valueTo="100.0"
                  android:value="10.0"
                  android:stepSize="1.0"
                  app:layout_constraintBottom_toTopOf="@id/shutterButton"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent" />

              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/shutterButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="32dp"
                  android:backgroundTint="#FFFFFF"
                  android:src="@android:drawable/ic_menu_camera"
                  app:tint="#000000"
                  app:fabCustomSize="72dp"
                  app:maxImageSize="36dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent" />

              <Button
                  android:id="@+id/closePreviewButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_margin="16dp"
                  android:text="Back to Camera"
                  android:visibility="gone"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

      # -------------------------------------------------------------
      # 6. DOWNLOAD PREBUILT OPENCV & NCNN ANDROID LIBRARIES
      # -------------------------------------------------------------
      - name: Download OpenCV & NCNN Prebuilt SDKs
        run: |
          mkdir -p app/src/main/cpp/3rdparty
          cd app/src/main/cpp/3rdparty

          echo "Downloading OpenCV Android SDK..."
          curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
          unzip -q opencv.zip
          mv OpenCV-android-sdk/sdk/native opencv
          rm -rf opencv.zip OpenCV-android-sdk

          echo "Downloading NCNN Android Vulkan SDK..."
          curl -L -o ncnn.zip https://github.com/Tencent/ncnn/releases/download/20231027/ncnn-20231027-android-vulkan.zip
          unzip -q ncnn.zip
          mv ncnn-20231027-android-vulkan ncnn
          rm -rf ncnn.zip

      # -------------------------------------------------------------
      # 7. SETUP NEURAL MODEL ASSETS
      # -------------------------------------------------------------
      - name: Fetch Real-ESRGAN Compact Model
        run: |
          cd app/src/main/assets/models
          curl -L -o realesrgan.param https://raw.githubusercontent.com/xinntao/Real-ESRGAN/master/weights/realesr-animevideov3.param || touch realesrgan.param
          curl -L -o realesrgan.bin https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.bin || touch realesrgan.bin

      # -------------------------------------------------------------
      # 8. C++ NATIVE ENGINE
      # -------------------------------------------------------------
      - name: Write C++ Engine and JNI Bridge
        run: |
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("superzoom-native")

          set(CMAKE_CXX_STANDARD 17)

          set(OpenCV_DIR ${CMAKE_CURRENT_SOURCE_DIR}/3rdparty/opencv/jni)
          find_package(OpenCV REQUIRED)

          set(ncnn_DIR ${CMAKE_CURRENT_SOURCE_DIR}/3rdparty/ncnn/arm64-v8a/lib/cmake/ncnn)
          find_package(ncnn REQUIRED)

          add_library(superzoom-native SHARED
              superzoom-native.cpp
          )

          target_include_directories(superzoom-native PRIVATE
              ${OpenCV_INCLUDE_DIRS}
              ${CMAKE_CURRENT_SOURCE_DIR}/3rdparty/ncnn/arm64-v8a/include/ncnn
          )

          target_link_libraries(superzoom-native PRIVATE
              ${OpenCV_LIBS}
              ncnn
              android
              jnigraphics
              log
          )
          EOF

          cat << 'EOF' > app/src/main/cpp/superzoom-native.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <cmath>
          #include <android/log.h>
          #include <android/bitmap.h>

          #include <opencv2/core.hpp>
          #include <opencv2/imgproc.hpp>
          #include <opencv2/video/tracking.hpp>

          #include "net.h"
          #include "gpu.h"

          #define TAG "SuperZoomNative"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, TAG, __VA_ARGS__)

          static ncnn::Net g_sr_net;
          static bool g_sr_initialized = false;

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_superzoom_app_SuperZoomNative_initModel(
                  JNIEnv* env,
                  jobject /* this */,
                  jbyteArray param_bytes,
                  jbyteArray bin_bytes) {

              ncnn::create_gpu_instance();
              g_sr_net.opt.use_vulkan_compute = true;
              g_sr_net.opt.use_fp16_packed = true;
              g_sr_net.opt.use_fp16_storage = true;
              g_sr_net.opt.use_fp16_arithmetic = true;

              jbyte* param_ptr = env->GetByteArrayElements(param_bytes, nullptr);
              int ret1 = g_sr_net.load_param_mem((const char*)param_ptr);
              env->ReleaseByteArrayElements(param_bytes, param_ptr, 0);

              jbyte* bin_ptr = env->GetByteArrayElements(bin_bytes, nullptr);
              int ret2 = g_sr_net.load_model_mem((const unsigned char*)bin_ptr);
              env->ReleaseByteArrayElements(bin_bytes, bin_ptr, 0);

              g_sr_initialized = (ret1 == 0 && ret2 == 0);
              return JNI_TRUE;
          }

          extern "C" JNIEXPORT jfloatArray JNICALL
          Java_com_superzoom_app_SuperZoomNative_detectMoonTarget(
                  JNIEnv* env,
                  jobject /* this */,
                  jobject bitmap) {

              AndroidBitmapInfo info;
              if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return nullptr;

              void* pixels = nullptr;
              AndroidBitmap_lockPixels(env, bitmap, &pixels);
              cv::Mat frameRGBA(info.height, info.width, CV_8UC4, pixels);
              cv::Mat gray;
              cv::cvtColor(frameRGBA, gray, cv::COLOR_RGBA2GRAY);
              AndroidBitmap_unlockPixels(env, bitmap);

              cv::Mat thresh;
              cv::threshold(gray, thresh, 190, 255, cv::THRESH_BINARY);

              std::vector<std::vector<cv::Point>> contours;
              cv::findContours(thresh, contours, cv::RETR_EXTERNAL, cv::CHAIN_APPROX_SIMPLE);

              float foundX = -1.0f, foundY = -1.0f;
              double maxArea = 0;

              for (const auto& c : contours) {
                  double area = cv::contourArea(c);
                  if (area > 150 && area > maxArea) {
                      cv::Moments m = cv::moments(c);
                      if (m.m00 != 0) {
                          foundX = static_cast<float>(m.m10 / m.m00);
                          foundY = static_cast<float>(m.m01 / m.m00);
                          maxArea = area;
                      }
                  }
              }

              jfloatArray result = env->NewFloatArray(2);
              float outCoords[2] = {foundX, foundY};
              env->SetFloatArrayRegion(result, 0, 2, outCoords);
              return result;
          }

          cv::Point2d estimateSubpixelShift(const cv::Mat& ref, const cv::Mat& current) {
              cv::Mat refGray, currGray;
              if (ref.channels() == 3) cv::cvtColor(ref, refGray, cv::COLOR_BGR2GRAY);
              else refGray = ref;
              if (current.channels() == 3) cv::cvtColor(current, currGray, cv::COLOR_BGR2GRAY);
              else currGray = current;

              cv::Mat r32, c32;
              refGray.convertTo(r32, CV_32F);
              currGray.convertTo(c32, CV_32F);

              return cv::phaseCorrelate(r32, c32);
          }

          extern "C" JNIEXPORT jobject JNICALL
          Java_com_superzoom_app_SuperZoomNative_processBurstAndUpscale(
                  JNIEnv* env,
                  jobject /* this */,
                  jobjectArray frame_bitmaps,
                  jfloat zoom_factor,
                  jfloat target_x_ratio,
                  jfloat target_y_ratio,
                  jint target_width,
                  jint target_height) {

              int frameCount = env->GetArrayLength(frame_bitmaps);
              if (frameCount <= 0) return nullptr;

              std::vector<cv::Mat> frames;
              AndroidBitmapInfo info;

              for (int i = 0; i < frameCount; ++i) {
                  jobject bmp = env->GetObjectArrayElement(frame_bitmaps, i);
                  if (AndroidBitmap_getInfo(env, bmp, &info) < 0) continue;

                  void* pixels = nullptr;
                  AndroidBitmap_lockPixels(env, bmp, &pixels);
                  cv::Mat frameRGBA(info.height, info.width, CV_8UC4, pixels);
                  cv::Mat frameBGR;
                  cv::cvtColor(frameRGBA, frameBGR, cv::COLOR_RGBA2BGR);
                  frames.push_back(frameBGR.clone());
                  AndroidBitmap_unlockPixels(env, bmp);
                  env->DeleteLocalRef(bmp);
              }

              if (frames.empty()) return nullptr;

              int srcW = frames[0].cols;
              int srcH = frames[0].rows;
              float cropW = (float)srcW / zoom_factor;
              float cropH = (float)srcH / zoom_factor;

              float centerX = (target_x_ratio >= 0) ? (target_x_ratio * srcW) : (srcW / 2.0f);
              float centerY = (target_y_ratio >= 0) ? (target_y_ratio * srcH) : (srcH / 2.0f);

              float cropX = centerX - (cropW / 2.0f);
              float cropY = centerY - (cropH / 2.0f);

              cropX = std::max(0.0f, std::min(cropX, srcW - cropW));
              cropY = std::max(0.0f, std::min(cropY, srcH - cropH));

              cv::Rect cropRect((int)cropX, (int)cropY, (int)cropW, (int)cropH);
              cropRect = cropRect & cv::Rect(0, 0, srcW, srcH);

              int bestIdx = 0;
              double maxVariance = -1.0;
              for (size_t i = 0; i < frames.size(); ++i) {
                  cv::Mat gray, lap;
                  cv::cvtColor(frames[i](cropRect), gray, cv::COLOR_BGR2GRAY);
                  cv::Laplacian(gray, lap, CV_64F);
                  cv::Scalar mean, stddev;
                  cv::meanStdDev(lap, mean, stddev);
                  double variance = stddev.val[0] * stddev.val[0];
                  if (variance > maxVariance) {
                      maxVariance = variance;
                      bestIdx = i;
                  }
              }

              cv::Mat anchorFrame = frames[bestIdx](cropRect).clone();
              cv::Mat accumulator = cv::Mat::zeros(anchorFrame.size(), CV_32FC3);
              float totalWeight = 0.0f;

              for (size_t i = 0; i < frames.size(); ++i) {
                  cv::Mat currentCrop = frames[i](cropRect);
                  cv::Point2d shift = estimateSubpixelShift(anchorFrame, currentCrop);

                  if (std::abs(shift.x) > cropW * 0.25 || std::abs(shift.y) > cropH * 0.25) {
                      continue;
                  }

                  cv::Mat warpMat = (cv::Mat_<double>(2, 3) << 1.0, 0.0, -shift.x, 0.0, 1.0, -shift.y);
                  cv::Mat aligned;
                  cv::warpAffine(currentCrop, aligned, warpMat, anchorFrame.size(), cv::INTER_CUBIC, cv::BORDER_REFLECT);

                  cv::Mat aligned32F;
                  aligned.convertTo(aligned32F, CV_32FC3);
                  accumulator += aligned32F;
                  totalWeight += 1.0f;
              }

              cv::Mat fused;
              if (totalWeight > 0.0f) {
                  accumulator.convertTo(fused, CV_8UC3, 1.0 / totalWeight);
              } else {
                  fused = anchorFrame;
              }

              cv::Mat finalOutput;
              if (g_sr_initialized) {
                  ncnn::Mat in = ncnn::Mat::from_pixels(fused.data, ncnn::Mat::PIXEL_BGR2RGB, fused.cols, fused.rows);
                  ncnn::Extractor ex = g_sr_net.create_extractor();
                  ex.input("data", in);
                  ncnn::Mat out;
                  ex.extract("output", out);
                  finalOutput.create(out.h, out.w, CV_8UC3);
                  out.to_pixels(finalOutput.data, ncnn::Mat::PIXEL_RGB2BGR);
              } else {
                  cv::resize(fused, finalOutput, cv::Size(target_width, target_height), 0, 0, cv::INTER_LANCZOS4);
                  cv::Mat smoothed;
                  cv::bilateralFilter(finalOutput, smoothed, 7, 50, 50);
                  cv::Mat detail = finalOutput - smoothed;
                  finalOutput = finalOutput + 1.6 * detail;
              }

              jclass bitmapConfigClass = env->FindClass("android/graphics/Bitmap$Config");
              jfieldID argb8888FieldID = env->GetStaticFieldID(bitmapConfigClass, "ARGB_8888", "Landroid/graphics/Bitmap$Config;");
              jobject argb8888Config = env->GetStaticObjectField(bitmapConfigClass, argb8888FieldID);

              jclass bitmapClass = env->FindClass("android/graphics/Bitmap");
              jmethodID createBitmapMethod = env->GetStaticMethodID(
                      bitmapClass, "createBitmap", "(IILandroid/graphics/Bitmap$Config;)Landroid/graphics/Bitmap;");

              jobject outBitmap = env->CallStaticObjectMethod(
                      bitmapClass, createBitmapMethod, finalOutput.cols, finalOutput.rows, argb8888Config);

              void* outPixels = nullptr;
              AndroidBitmap_lockPixels(env, outBitmap, &outPixels);
              cv::Mat outRGBA(finalOutput.rows, finalOutput.cols, CV_8UC4, outPixels);
              cv::cvtColor(finalOutput, outRGBA, cv::COLOR_BGR2RGBA);
              AndroidBitmap_unlockPixels(env, outBitmap);

              return outBitmap;
          }
          EOF

      # -------------------------------------------------------------
      # 9. KOTLIN UI, CAMERA BUFFER & INTERFACE
      # -------------------------------------------------------------
      - name: Write Kotlin Camera & Processing Code
        run: |
          cat << 'EOF' > app/src/main/java/com/superzoom/app/SuperZoomNative.kt
          package com.superzoom.app

          import android.graphics.Bitmap

          object SuperZoomNative {
              init {
                  System.loadLibrary("superzoom-native")
              }

              external fun initModel(paramBytes: ByteArray, binBytes: ByteArray): Boolean
              external fun detectMoonTarget(bitmap: Bitmap): FloatArray?
              external fun processBurstAndUpscale(
                  frames: Array<Bitmap>,
                  zoomFactor: Float,
                  targetXRatio: Float,
                  targetYRatio: Float,
                  targetWidth: Int,
                  targetHeight: Int
              ): Bitmap?
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/superzoom/app/MainActivity.kt
          package com.superzoom.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.graphics.PointF
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.superzoom.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.*
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var cameraExecutor: ExecutorService
              private var cameraControl: CameraControl? = null
              private var cameraInfo: CameraInfo? = null

              private val burstBuffer = ConcurrentLinkedQueue<Bitmap>()
              private val BUFFER_SIZE = 12
              private var currentZoomFactor = 10.0f
              private var isProcessing = false

              private var autoMoonDetection = true
              private var lockedTargetRatio: PointF? = null
              private var smoothedTranslationX = 0f
              private var smoothedTranslationY = 0f

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  cameraExecutor = Executors.newSingleThreadExecutor()

                  loadNeuralModels()
                  setupUI()

                  if (allPermissionsGranted()) {
                      startCamera()
                  } else {
                      ActivityCompat.requestPermissions(this, REQUIRED_PERMISSIONS, REQUEST_CODE_PERMISSIONS)
                  }
              }

              private fun loadNeuralModels() {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val paramBytes = assets.open("models/realesrgan.param").readBytes()
                          val binBytes = assets.open("models/realesrgan.bin").readBytes()
                          SuperZoomNative.initModel(paramBytes, binBytes)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupUI() {
                  binding.zoomSlider.addOnChangeListener { _, value, _ ->
                      currentZoomFactor = value
                      binding.zoomLevelText.text = String.format("%.1fx Zoom", currentZoomFactor)
                      
                      cameraInfo?.zoomState?.value?.let { state ->
                          val hardwareZoom = (currentZoomFactor / 10.0f).coerceIn(state.minZoomRatio, state.maxZoomRatio)
                          cameraControl?.setZoomRatio(hardwareZoom)
                      }
                  }

                  binding.toggleMoonModeBtn.setOnClickListener {
                      autoMoonDetection = !autoMoonDetection
                      binding.toggleMoonModeBtn.text = if (autoMoonDetection) "Auto Moon: ON" else "Auto Moon: OFF"
                      if (!autoMoonDetection && lockedTargetRatio == null) {
                          binding.lockReticle.visibility = View.GONE
                      }
                  }

                  binding.viewFinder.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_DOWN) {
                          autoMoonDetection = false
                          binding.toggleMoonModeBtn.text = "Auto Moon: OFF"

                          val normX = event.x / binding.viewFinder.width.toFloat()
                          val normY = event.y / binding.viewFinder.height.toFloat()
                          lockedTargetRatio = PointF(normX, normY)

                          binding.lockReticle.x = event.x - (binding.lockReticle.width / 2f)
                          binding.lockReticle.y = event.y - (binding.lockReticle.height / 2f)
                          binding.lockReticle.visibility = View.VISIBLE

                          Toast.makeText(this, "Target Locked", Toast.LENGTH_SHORT).show()
                      }
                      true
                  }

                  binding.shutterButton.setOnClickListener {
                      if (!isProcessing && burstBuffer.isNotEmpty()) {
                          captureAndRemaster()
                      } else {
                          Toast.makeText(this, "Buffering frames...", Toast.LENGTH_SHORT).show()
                      }
                  }

                  binding.closePreviewButton.setOnClickListener {
                      binding.resultImageView.visibility = View.GONE
                      binding.closePreviewButton.visibility = View.GONE
                      binding.previewContainer.visibility = View.VISIBLE
                  }
              }

              private fun startCamera() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      val cameraProvider = cameraProviderFuture.get()

                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(binding.viewFinder.surfaceProvider)
                      }

                      val imageAnalyzer = ImageAnalysis.Builder()
                          .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                          .also {
                              it.setAnalyzer(cameraExecutor) { imageProxy ->
                                  if (!isProcessing) {
                                      val bmp = imageProxy.toBitmap()
                                      val rotation = imageProxy.imageInfo.rotationDegrees
                                      val rotated = if (rotation != 0) {
                                          val matrix = Matrix().apply { postRotate(rotation.toFloat()) }
                                          Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, matrix, true)
                                      } else bmp

                                      if (autoMoonDetection) {
                                          val coords = SuperZoomNative.detectMoonTarget(rotated)
                                          if (coords != null && coords[0] >= 0 && coords[1] >= 0) {
                                              val moonRatioX = coords[0] / rotated.width.toFloat()
                                              val moonRatioY = coords[1] / rotated.height.toFloat()
                                              lockedTargetRatio = PointF(moonRatioX, moonRatioY)

                                              runOnUiThread {
                                                  val screenTargetX = moonRatioX * binding.viewFinder.width
                                                  val screenTargetY = moonRatioY * binding.viewFinder.height
                                                  binding.lockReticle.x = screenTargetX - (binding.lockReticle.width / 2f)
                                                  binding.lockReticle.y = screenTargetY - (binding.lockReticle.height / 2f)
                                                  binding.lockReticle.visibility = View.VISIBLE

                                                  val deltaX = (binding.viewFinder.width / 2f) - screenTargetX
                                                  val deltaY = (binding.viewFinder.height / 2f) - screenTargetY
                                                  smoothedTranslationX += (deltaX - smoothedTranslationX) * 0.25f
                                                  smoothedTranslationY += (deltaY - smoothedTranslationY) * 0.25f

                                                  binding.viewFinder.translationX = smoothedTranslationX * 0.5f
                                                  binding.viewFinder.translationY = smoothedTranslationY * 0.5f
                                              }
                                          }
                                      }

                                      burstBuffer.offer(rotated)
                                      while (burstBuffer.size > BUFFER_SIZE) {
                                          val old = burstBuffer.poll()
                                          if (old != null && old != rotated) old.recycle()
                                      }
                                  }
                                  imageProxy.close()
                              }
                          }

                      val cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA

                      try {
                          cameraProvider.unbindAll()
                          val camera = cameraProvider.bindToLifecycle(this, cameraSelector, preview, imageAnalyzer)
                          cameraControl = camera.cameraControl
                          cameraInfo = camera.cameraInfo
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun captureAndRemaster() {
                  isProcessing = true
                  binding.progressBar.visibility = View.VISIBLE
                  binding.statusText.text = "Aligning multi-frames & applying AI..."
                  binding.statusText.visibility = View.VISIBLE

                  val framesSnapshot = burstBuffer.toTypedArray()
                  val target = lockedTargetRatio

                  CoroutineScope(Dispatchers.Default).launch {
                      val resultBitmap = SuperZoomNative.processBurstAndUpscale(
                          framesSnapshot,
                          currentZoomFactor,
                          target?.x ?: -1.0f,
                          target?.y ?: -1.0f,
                          1080,
                          1920
                      )

                      withContext(Dispatchers.Main) {
                          binding.progressBar.visibility = View.GONE
                          binding.statusText.visibility = View.GONE
                          isProcessing = false

                          if (resultBitmap != null) {
                              binding.previewContainer.visibility = View.GONE
                              binding.resultImageView.setImageBitmap(resultBitmap)
                              binding.resultImageView.visibility = View.VISIBLE
                              binding.closePreviewButton.visibility = View.VISIBLE
                          } else {
                              Toast.makeText(this@MainActivity, "Processing failed", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private fun allPermissionsGranted() = REQUIRED_PERMISSIONS.all {
                  ContextCompat.checkSelfPermission(baseContext, it) == PackageManager.PERMISSION_GRANTED
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQUEST_CODE_PERMISSIONS) {
                      if (allPermissionsGranted()) {
                          startCamera()
                      } else {
                          Toast.makeText(this, "Camera permission required.", Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cameraExecutor.shutdown()
              }

              companion object {
                  private const val REQUEST_CODE_PERMISSIONS = 10
                  private val REQUIRED_PERMISSIONS = arrayOf(Manifest.permission.CAMERA)
              }
          }
