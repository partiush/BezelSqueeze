name: Generate Production APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Scaffold Production Project Files
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/edge/bezelmorph

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 12
                  versionName = "12.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }

              kotlin {
                  compilerOptions {
                      jvmTarget.set(JvmTarget.JVM_21)
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          # 5. Production Vector Drawables
          cat << 'EOF' > app/src/main/res/drawable/ic_check_circle.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_chevron_right.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M10,6L8.59,7.41 13.17,12l-4.58,4.59L10,18l6,-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_accessibility.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#3B82F6"
                  android:pathData="M12,2c1.1,0 2,0.9 2,2s-0.9,2 -2,2 -2,-0.9 -2,-2 0.9,-2 2,-2zm9,7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_overlay.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#3B82F6"
                  android:pathData="M19,3H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm-7,14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/>
          </vector>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 7. Accessibility Service XML Configuration
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph</string>
              <string name="service_description">Hardware edge displacement engine.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#0F172A</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:navigationBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          # 8. Configuration Store
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MorphConfigStore.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.content.SharedPreferences

          class MorphConfigStore(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("bezel_morph_pref", Context.MODE_PRIVATE)

              var volumeUpRatio: Float
                  get() = prefs.getFloat("v_up_ratio", 0.228f)
                  set(v) = prefs.edit().putFloat("v_up_ratio", v).apply()

              var volumeDownRatio: Float
                  get() = prefs.getFloat("v_down_ratio", 0.315f)
                  set(v) = prefs.edit().putFloat("v_down_ratio", v).apply()

              var flatTopHalfLengthY0: Float
                  get() = prefs.getFloat("y0_val", 28f)
                  set(v) = prefs.edit().putFloat("y0_val", v).apply()

              var blendTransitionW: Float
                  get() = prefs.getFloat("w_val", 38f)
                  set(v) = prefs.edit().putFloat("w_val", v).apply()

              var peakAmplitudeA: Float
                  get() = prefs.getFloat("peak_amp_A", 16f)
                  set(v) = prefs.edit().putFloat("peak_amp_A", v).apply()

              var speedOverall: Float
                  get() = prefs.getFloat("speed_omega", 68.0f)
                  set(v) = prefs.edit().putFloat("speed_omega", v).apply()

              var inwardImpulse: Float
                  get() = prefs.getFloat("speed_inward", 2400f)
                  set(v) = prefs.edit().putFloat("speed_inward", v).apply()

              var outwardDamping: Float
                  get() = prefs.getFloat("speed_outward_zeta", 0.88f)
                  set(v) = prefs.edit().putFloat("speed_outward_zeta", v).apply()

              var isLeftEdge: Boolean
                  get() = prefs.getBoolean("is_left_side", false)
                  set(v) = prefs.edit().putBoolean("is_left_side", v).apply()
          }
          EOF

          # 9. Ultra Low-Latency Hardware Accelerated Surface View
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BezelSurfaceView.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.graphics.*
          import android.os.Build
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.util.AttributeSet
          import android.view.Choreographer
          import android.view.View
          import kotlin.math.*

          class BezelSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs), Choreographer.FrameCallback {

              var isLeftEdge: Boolean = false
              var centerY: Float = 0f

              var y0: Float = 28f
              var w: Float = 38f
              var A: Float = 16f

              var omegaN: Float = 68.0f
              var inwardVelocity: Float = 2400f
              var zeta: Float = 0.88f

              private var currentA: Float = 0f
              private var velocityA: Float = 0f
              private var targetA: Float = 0f
              private var isSimulating: Boolean = false
              private var lastFrameTimeNs: Long = 0L

              private var downTimestampMs: Long = 0L
              private var isReleasePending: Boolean = false
              private val minHoldDurationMs: Long = 48L

              private val vibrator: Vibrator? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  val vibratorManager = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as? VibratorManager
                  vibratorManager?.defaultVibrator
              } else {
                  @Suppress("DEPRECATION")
                  context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
              }

              private val choreographer = Choreographer.getInstance()
              private val morphPath = Path()
              private val bezelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  style = Paint.Style.FILL
              }

              init {
                  setLayerType(LAYER_TYPE_HARDWARE, null)
              }

              fun onHardwareButtonDown() {
                  downTimestampMs = SystemClock.uptimeMillis()
                  isReleasePending = false
                  targetA = A
                  if (currentA < 1.0f) {
                      currentA = A * 0.50f
                  }
                  velocityA = inwardVelocity
                  triggerHaptic()
                  startSimulation()
                  invalidate()
              }

              fun onHardwareButtonUp() {
                  val elapsed = SystemClock.uptimeMillis() - downTimestampMs
                  if (elapsed < minHoldDurationMs) {
                      isReleasePending = true
                  } else {
                      targetA = 0f
                      startSimulation()
                  }
              }

              fun setPreviewStatic(ratio: Float) {
                  stopSimulation()
                  currentA = A * ratio
                  invalidate()
              }

              private fun startSimulation() {
                  if (!isSimulating) {
                      isSimulating = true
                      lastFrameTimeNs = 0L
                      choreographer.postFrameCallback(this)
                  }
              }

              private fun stopSimulation() {
                  isSimulating = false
                  choreographer.removeFrameCallback(this)
              }

              override fun doFrame(frameTimeNs: Long) {
                  if (!isSimulating) return

                  val now = SystemClock.uptimeMillis()
                  if (isReleasePending && (now - downTimestampMs >= minHoldDurationMs)) {
                      isReleasePending = false
                      targetA = 0f
                  }

                  val dt = if (lastFrameTimeNs > 0L) {
                      ((frameTimeNs - lastFrameTimeNs) / 1_000_000_000f).coerceIn(0.002f, 0.020f)
                  } else {
                      0.008f
                  }
                  lastFrameTimeNs = frameTimeNs

                  val displacement = currentA - targetA
                  val accel = -(omegaN * omegaN * displacement) - (2f * zeta * omegaN * velocityA)

                  velocityA += accel * dt
                  currentA += velocityA * dt

                  if (targetA == 0f && !isReleasePending && abs(velocityA) < 0.2f && abs(currentA) < 0.2f) {
                      currentA = 0f
                      velocityA = 0f
                      isSimulating = false
                      invalidate()
                      return
                  }

                  invalidate()
                  choreographer.postFrameCallback(this)
              }

              private fun triggerHaptic() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          vibrator?.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(4)
                      }
                  } catch (ignored: Exception) {}
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (currentA <= 0.01f) return

                  val totalHalfSpan = y0 + w
                  val yTop = centerY - totalHalfSpan
                  val yBottom = centerY + totalHalfSpan

                  morphPath.rewind()
                  val steps = 36
                  val stepSize = (2f * totalHalfSpan) / steps

                  if (isLeftEdge) {
                      morphPath.moveTo(0f, yTop)
                      for (i in 0..steps) {
                          val curY = yTop + (i * stepSize)
                          val dist = abs(curY - centerY)
                          val x = when {
                              dist <= y0 -> currentA
                              dist < totalHalfSpan -> {
                                  val u = (dist - y0) / w
                                  currentA * (1.0f - (10.0f * u.pow(3)) + (15.0f * u.pow(4)) - (6.0f * u.pow(5)))
                              }
                              else -> 0f
                          }
                          morphPath.lineTo(x, curY)
                      }
                      morphPath.lineTo(0f, yBottom)
                      morphPath.close()
                  } else {
                      val xEdge = width.toFloat()
                      morphPath.moveTo(xEdge, yTop)
                      for (i in 0..steps) {
                          val curY = yTop + (i * stepSize)
                          val dist = abs(curY - centerY)
                          val x = when {
                              dist <= y0 -> currentA
                              dist < totalHalfSpan -> {
                                  val u = (dist - y0) / w
                                  currentA * (1.0f - (10.0f * u.pow(3)) + (15.0f * u.pow(4)) - (6.0f * u.pow(5)))
                              }
                              else -> 0f
                          }
                          morphPath.lineTo(xEdge - x, curY)
                      }
                      morphPath.lineTo(xEdge, yBottom)
                      morphPath.close()
                  }

                  canvas.drawPath(morphPath, bezelPaint)
              }
          }
          EOF

          # 10. Hardware Key Monitor Service
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/HardwareKeyMonitorService.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.*
          import android.view.accessibility.AccessibilityEvent

          class HardwareKeyMonitorService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var overlay: BezelSurfaceView? = null
              private lateinit var store: MorphConfigStore
              private var activeKey: Int = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  store = MorphConfigStore(this)
                  attachOverlay()
              }

              private fun attachOverlay() {
                  if (overlay != null) return
                  try {
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          flags,
                          PixelFormat.TRANSLUCENT
                      )

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          params.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      }

                      overlay = BezelSurfaceView(this).apply {
                          isLeftEdge = store.isLeftEdge
                          y0 = store.flatTopHalfLengthY0
                          w = store.blendTransitionW
                          A = store.peakAmplitudeA
                          omegaN = store.speedOverall
                          inwardVelocity = store.inwardImpulse
                          zeta = store.outwardDamping
                      }
                      wm?.addView(overlay, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode
                  if (code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      val ratio = if (code == KeyEvent.KEYCODE_VOLUME_UP) store.volumeUpRatio else store.volumeDownRatio

                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (event.repeatCount == 0) {
                              activeKey = code
                              overlay?.let { view ->
                                  view.isLeftEdge = store.isLeftEdge
                                  view.y0 = store.flatTopHalfLengthY0
                                  view.w = store.blendTransitionW
                                  view.A = store.peakAmplitudeA
                                  view.omegaN = store.speedOverall
                                  view.inwardVelocity = store.inwardImpulse
                                  view.zeta = store.outwardDamping
                                  view.centerY = (if (view.height > 0) view.height else resources.displayMetrics.heightPixels) * ratio
                                  view.onHardwareButtonDown()
                              }
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          if (activeKey == code) {
                              activeKey = 0
                              overlay?.onHardwareButtonUp()
                          }
                      }
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  try { overlay?.let { wm?.removeView(it) } } catch (ignored: Exception) {}
              }
          }
          EOF

          # 11. Production MainActivity with Strict Permission Gate & Clean UI
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MainActivity.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.accessibility.AccessibilityManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var store: MorphConfigStore
              private lateinit var rootContainer: FrameLayout
              private lateinit var permissionGateLayout: LinearLayout
              private lateinit var dashboardLayout: FrameLayout

              private lateinit var accessibilityStatusIcon: ImageView
              private lateinit var overlayStatusIcon: ImageView
              private lateinit var preview: BezelSurfaceView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = MorphConfigStore(this)

                  rootContainer = FrameLayout(this).apply {
                      setBackgroundColor(0xFF0F172A.toInt())
                  }

                  buildPermissionGate()
                  buildDashboard()

                  setContentView(rootContainer)
              }

              override fun onResume() {
                  super.onResume()
                  refreshPermissionsAndFlow()
              }

              private fun hasAccessibilityPermission(): Boolean {
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                  val services = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  for (s in services) {
                      if (s.id.contains(packageName)) return true
                  }
                  return false
              }

              private fun hasOverlayPermission(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else {
                      true
                  }
              }

              private fun refreshPermissionsAndFlow() {
                  val accessOk = hasAccessibilityPermission()
                  val overlayOk = hasOverlayPermission()

                  accessibilityStatusIcon.setImageResource(
                      if (accessOk) R.drawable.ic_check_circle else R.drawable.ic_chevron_right
                  )
                  overlayStatusIcon.setImageResource(
                      if (overlayOk) R.drawable.ic_check_circle else R.drawable.ic_chevron_right
                  )

                  if (accessOk && overlayOk) {
                      permissionGateLayout.visibility = View.GONE
                      dashboardLayout.visibility = View.VISIBLE
                      updatePreview()
                  } else {
                      permissionGateLayout.visibility = View.VISIBLE
                      dashboardLayout.visibility = View.GONE
                  }
              }

              private fun buildPermissionGate() {
                  permissionGateLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 80, 48, 48)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "System Authorization"
                      setTextColor(Color.WHITE)
                      textSize = 24f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  permissionGateLayout.addView(title)

                  val subtitle = TextView(this).apply {
                      text = "Authorize display perimeter access to align physics with physical switches."
                      setTextColor(0xFF94A3B8.toInt())
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 16, 0, 48)
                  }
                  permissionGateLayout.addView(subtitle)

                  val cardAccessibility = createPermissionCard(
                      iconRes = R.drawable.ic_accessibility,
                      titleText = "Accessibility Interceptor",
                      descText = "Directly monitors hardware volume button transitions"
                  ) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  accessibilityStatusIcon = cardAccessibility.second
                  permissionGateLayout.addView(cardAccessibility.first)

                  val cardOverlay = createPermissionCard(
                      iconRes = R.drawable.ic_overlay,
                      titleText = "Display Perimeter Layer",
                      descText = "Projects visual deformation directly against display cutouts"
                  ) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      }
                  }
                  overlayStatusIcon = cardOverlay.second
                  permissionGateLayout.addView(cardOverlay.first)

                  rootContainer.addView(
                      permissionGateLayout,
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  )
              }

              private fun createPermissionCard(
                  iconRes: Int,
                  titleText: String,
                  descText: String,
                  onClick: () -> Unit
              ): Pair<LinearLayout, ImageView> {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(32, 28, 32, 28)
                      background = GradientDrawable().apply {
                          setColor(0xFF1E293B.toInt())
                          cornerRadius = 20f
                      }
                      isClickable = true
                      isFocusable = true
                      setOnClickListener { onClick() }
                  }
                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(0, 0, 0, 24) }
                  card.layoutParams = params

                  val icon = ImageView(this).apply {
                      setImageResource(iconRes)
                      layoutParams = LinearLayout.LayoutParams(64, 64)
                  }
                  card.addView(icon)

                  val textContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 0, 24, 0)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f)
                  }
                  val t = TextView(this).apply {
                      text = titleText
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val d = TextView(this).apply {
                      text = descText
                      setTextColor(0xFF94A3B8.toInt())
                      textSize = 12f
                      setPadding(0, 6, 0, 0)
                  }
                  textContainer.addView(t)
                  textContainer.addView(d)
                  card.addView(textContainer)

                  val status = ImageView(this).apply {
                      setImageResource(R.drawable.ic_chevron_right)
                      layoutParams = LinearLayout.LayoutParams(48, 48)
                  }
                  card.addView(status)

                  return Pair(card, status)
              }

              private fun buildDashboard() {
                  dashboardLayout = FrameLayout(this).apply {
                      visibility = View.GONE
                  }

                  preview = BezelSurfaceView(this).apply {
                      isLeftEdge = store.isLeftEdge
                      y0 = store.flatTopHalfLengthY0
                      w = store.blendTransitionW
                      A = store.peakAmplitudeA
                      omegaN = store.speedOverall
                      inwardVelocity = store.inwardImpulse
                      zeta = store.outwardDamping
                  }
                  dashboardLayout.addView(preview, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)

                  val scroll = ScrollView(this).apply {
                      background = GradientDrawable().apply {
                          setColor(0xFA0F172A.toInt())
                          cornerRadii = floatArrayOf(40f, 40f, 40f, 40f, 0f, 0f, 0f, 0f)
                      }
                      setPadding(36, 32, 36, 40)
                  }
                  val content = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val dashTitle = TextView(this).apply {
                      text = "Physical Edge Calibrator"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 8)
                  }
                  content.addView(dashTitle)

                  val dashSub = TextView(this).apply {
                      text = "Calibrated directly to physical switch dimensions and spring actuation dynamics."
                      setTextColor(0xFF94A3B8.toInt())
                      textSize = 12f
                      setPadding(0, 0, 0, 20)
                  }
                  content.addView(dashSub)

                  val edgeSwitch = Switch(this).apply {
                      text = if (store.isLeftEdge) "Perimeter: Left Chassis Edge" else "Perimeter: Right Chassis Edge"
                      setTextColor(Color.WHITE)
                      isChecked = store.isLeftEdge
                      setOnCheckedChangeListener { _, checked ->
                          store.isLeftEdge = checked
                          text = if (checked) "Perimeter: Left Chassis Edge" else "Perimeter: Right Chassis Edge"
                          updatePreview()
                      }
                  }
                  content.addView(edgeSwitch)

                  content.addView(buildSlider("Volume Up Center", (store.volumeUpRatio * 1000).toInt(), 50, 950) {
                      store.volumeUpRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreviewStatic(1.0f)
                  })

                  content.addView(buildSlider("Volume Down Center", (store.volumeDownRatio * 1000).toInt(), 50, 950) {
                      store.volumeDownRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeDownRatio
                      preview.setPreviewStatic(1.0f)
                  })

                  content.addView(buildSlider("Plateau Flatness (y0)", store.flatTopHalfLengthY0.toInt(), 12, 80) {
                      store.flatTopHalfLengthY0 = it.toFloat()
                      updatePreview()
                  })

                  content.addView(buildSlider("Shoulder Transition (w)", store.blendTransitionW.toInt(), 15, 100) {
                      store.blendTransitionW = it.toFloat()
                      updatePreview()
                  })

                  content.addView(buildSlider("Actuation Intrusion Depth (A)", store.peakAmplitudeA.toInt(), 6, 45) {
                      store.peakAmplitudeA = it.toFloat()
                      updatePreview()
                  })

                  val physicsHeader = TextView(this).apply {
                      text = "Kinematics & Response Dynamics"
                      setTextColor(0xFF38BDF8.toInt())
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 24, 0, 8)
                  }
                  content.addView(physicsHeader)

                  content.addView(buildSlider("Resonance Frequency", store.speedOverall.toInt(), 30, 95) {
                      store.speedOverall = it.toFloat()
                      preview.omegaN = store.speedOverall
                  })

                  content.addView(buildSlider("Initial Velocity Impulse", (store.inwardImpulse / 10).toInt(), 100, 350) {
                      store.inwardImpulse = (it * 10).toFloat()
                      preview.inwardVelocity = store.inwardImpulse
                  })

                  content.addView(buildSlider("Oscillator Damping Ratio", (store.outwardDamping * 100).toInt(), 50, 99) {
                      store.outwardDamping = it / 100f
                      preview.zeta = store.outwardDamping
                  })

                  scroll.addView(content)
                  val cardParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM
                      setMargins(0, 0, 0, 0)
                  }
                  dashboardLayout.addView(scroll, cardParams)

                  rootContainer.addView(dashboardLayout, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
              }

              private fun buildSlider(name: String, current: Int, min: Int, max: Int, onVal: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 10, 0, 10)
                  }
                  val txt = TextView(this).apply {
                      text = "$name: $current"
                      setTextColor(0xFFCBD5E1.toInt())
                      textSize = 12f
                  }
                  val bar = SeekBar(this).apply {
                      this.max = max - min
                      this.progress = current - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(b: SeekBar?, p: Int, fromUser: Boolean) {
                              val real = p + min
                              txt.text = "$name: $real"
                              onVal(real)
                          }
                          override fun onStartTrackingTouch(b: SeekBar?) {}
                          override fun onStopTrackingTouch(b: SeekBar?) { preview.setPreviewStatic(0f) }
                      })
                  }
                  box.addView(txt)
                  box.addView(bar)
                  return box
              }

              private fun updatePreview() {
                  preview.isLeftEdge = store.isLeftEdge
                  preview.y0 = store.flatTopHalfLengthY0
                  preview.w = store.blendTransitionW
                  preview.A = store.peakAmplitudeA
                  preview.omegaN = store.speedOverall
                  preview.inwardVelocity = store.inwardImpulse
                  preview.zeta = store.outwardDamping
                  preview.post {
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreviewStatic(1.0f)
                  }
              }
          }
          EOF

      - name: Build With Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile Production APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BezelMorph-Engine-APK
          path: app/build/outputs/apk/debug/app-debug.apk
