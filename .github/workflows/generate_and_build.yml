          package com.edge.bezelmorph.core

          import android.content.Context
          import android.os.Build
          import org.json.JSONObject

          data class DeviceProfile(
              val brand: String,
              val model: String,
              val width: Int,
              val height: Int,
              val dpi: Int,
              val volUpY: Float,
              val volDownY: Float,
              val edge: Edge
          )

          object DeviceDatabase {
              private var profiles: List<DeviceProfile> = emptyList()

              fun load(context: Context) {
                  if (profiles.isNotEmpty()) return
                  try {
                      val text = context.assets.open("devices.json").bufferedReader().use { it.readText() }
                      val root = JSONObject(text)
                      val arr = root.getJSONArray("devices")
                      profiles = (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          DeviceProfile(
                              brand = o.getString("brand"),
                              model = o.getString("model"),
                              width = o.getInt("width"),
                              height = o.getInt("height"),
                              dpi = o.getInt("dpi"),
                              volUpY = o.optDouble("volUpY", 0.228).toFloat(),
                              volDownY = o.optDouble("volDownY", 0.315).toFloat(),
                              edge = Edge.valueOf(o.optString("edge", "RIGHT").uppercase())
                          )
                      }
                  } catch (_: Exception) {}
              }

              /**
               * Match by Build.MODEL, falling back to Build.DEVICE and then a
               * DPI-derived generic profile. The generic profile uses the same
               * ratios as the curated entries, so it is always usable.
               */
              fun autoDetect(context: Context): MorphConfig {
                  load(context)
                  val model = Build.MODEL ?: ""
                  val device = Build.DEVICE ?: ""
                  val match = profiles.firstOrNull {
                      it.model.equals(model, ignoreCase = true) ||
                      it.model.equals(device, ignoreCase = true) ||
                      model.contains(it.model, ignoreCase = true)
                  }
                  val dm = context.resources.displayMetrics
                  return if (match != null) {
                      MorphConfig(
                          edge = match.edge,
                          centerYRatio = match.volUpY,
                          y0Dp = 28f,
                          wDp = 38f,
                          depthDp = 16f
                      )
                  } else {
                      MorphConfig(
                          edge = Edge.RIGHT,
                          centerYRatio = 0.228f,
                          y0Dp = 28f,
                          wDp = 38f,
                          depthDp = 16f
                      )
                  }
              }
          }
