        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <android/bitmap.h>
        #include <android/asset_manager.h>
        #include <android/asset_manager_jni.h>
        #include <android/log.h>
        #include <opencv2/opencv.hpp>
        #include "net.h"
        #include "gpu.h"
        #include <vector>
        #include <algorithm>

        #define LOG_TAG "ProMoonEngine"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        static ncnn::Net gNetPhoto;
        static ncnn::Net gNetFine;
        static bool gPhotoLoaded = false;
        static bool gFineLoaded = false;

        static cv::Mat bitmapToMat(JNIEnv* env, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return cv::Mat();
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return cv::Mat();
            cv::Mat rgba(info.height, info.width, CV_8UC4, pixels);
            cv::Mat bgr;
            cv::cvtColor(rgba, bgr, cv::COLOR_RGBA2BGR);
            AndroidBitmap_unlockPixels(env, bitmap);
            return bgr;
        }

        static void matToBitmap(JNIEnv* env, const cv::Mat& bgr, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return;
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return;
            cv::Mat resized;
            if (bgr.cols != (int)info.width || bgr.rows != (int)info.height) {
                cv::resize(bgr, resized, cv::Size(info.width, info.height), 0, 0, cv::INTER_LANCZOS4);
            } else {
                resized = bgr;
            }
            cv::Mat dstRgba(info.height, info.width, CV_8UC4, pixels);
            cv::cvtColor(resized, dstRgba, cv::COLOR_BGR2RGBA);
            AndroidBitmap_unlockPixels(env, bitmap);
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeInitModels(JNIEnv* env, jobject, jobject mgrObj) {
            AAssetManager* mgr = AAssetManager_fromJava(env, mgrObj);
            if (!mgr) return;

            ncnn::create_gpu_instance();

            // Setup Photo Model
            gNetPhoto.opt.use_vulkan_compute = (ncnn::get_gpu_count() > 0);
            gNetPhoto.opt.use_fp16_packed = true;
            gNetPhoto.opt.use_fp16_storage = true;
            gNetPhoto.opt.use_fp16_arithmetic = true;
            gNetPhoto.opt.num_threads = 8;
            if (gNetPhoto.opt.use_vulkan_compute) {
                gNetPhoto.set_vulkan_device(ncnn::get_default_gpu_index());
            }

            int p1 = gNetPhoto.load_param(mgr, "models/realesrgan-x4plus.param");
            int m1 = gNetPhoto.load_model(mgr, "models/realesrgan-x4plus.bin");
            gPhotoLoaded = (p1 == 0 && m1 == 0);

            // Setup Fine Stroke/Signage Model
            gNetFine.opt.use_vulkan_compute = (ncnn::get_gpu_count() > 0);
            gNetFine.opt.use_fp16_packed = true;
            gNetFine.opt.use_fp16_storage = true;
            gNetFine.opt.use_fp16_arithmetic = true;
            gNetFine.opt.num_threads = 8;
            if (gNetFine.opt.use_vulkan_compute) {
                gNetFine.set_vulkan_device(ncnn::get_default_gpu_index());
            }

            int p2 = gNetFine.load_param(mgr, "models/realesrgan-x4plus-anime.param");
            int m2 = gNetFine.load_model(mgr, "models/realesrgan-x4plus-anime.bin");
            gFineLoaded = (p2 == 0 && m2 == 0);

            LOGI("Real-ESRGAN Models Status: Photo=%d, FineStroke=%d, VulkanGPU=%d",
                 gPhotoLoaded, gFineLoaded, gNetPhoto.opt.use_vulkan_compute);
        }

        static cv::Mat runNcnnSuperResolution(ncnn::Net& net, const cv::Mat& cropBgr, int targetW, int targetH) {
            // Resize crop to optimal model tile dimension (256x256) to ensure low latency and zero OOM
            int inW = 256;
            int inH = 256;
            ncnn::Mat in = ncnn::Mat::from_pixels_resize(cropBgr.data, ncnn::Mat::PIXEL_BGR2RGB, cropBgr.cols, cropBgr.rows, inW, inH);
            const float norm_vals[3] = { 1.f / 255.f, 1.f / 255.f, 1.f / 255.f };
            in.substract_mean_normalize(0, norm_vals);

            ncnn::Extractor ex = net.create_extractor();
            ex.input("data", in);
            ncnn::Mat out;
            int ret = ex.extract("output", out);

            cv::Mat srBgr;
            if (ret == 0 && out.w > 0 && out.h > 0) {
                const float denorm_vals[3] = { 255.f, 255.f, 255.f };
                out.substract_mean_normalize(0, denorm_vals);
                cv::Mat neuralOut(out.h, out.w, CV_8UC3);
                out.to_pixels(neuralOut.data, ncnn::Mat::PIXEL_RGB2BGR);
                cv::resize(neuralOut, srBgr, cv::Size(targetW, targetH), 0, 0, cv::INTER_LANCZOS4);
            } else {
                cv::resize(cropBgr, srBgr, cv::Size(targetW, targetH), 0, 0, cv::INTER_LANCZOS4);
            }
            return srBgr;
        }

        extern "C" JNIEXPORT jint JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeProcessRemaster(
            JNIEnv* env, jobject, jobject sensorBmp, jint cropX, jint cropY, jint cropW, jint cropH, jobject outBmp, jboolean moonMode, jint modelType
        ) {
            cv::Mat fullSensor = bitmapToMat(env, sensorBmp);
            if (fullSensor.empty()) return 0;

            cv::Rect roi(cropX, cropY, cropW, cropH);
            roi &= cv::Rect(0, 0, fullSensor.cols, fullSensor.rows);
            cv::Mat crop = fullSensor(roi).clone();

            AndroidBitmapInfo info;
            AndroidBitmap_getInfo(env, outBmp, &info);
            int targetW = info.width;
            int targetH = info.height;

            cv::Mat resultImg;

            if (moonMode) {
                // Samsung-Style Astronomical Lunar Crater Reconstruction
                cv::Mat hiRes;
                cv::resize(crop, hiRes, cv::Size(targetW, targetH), 0, 0, cv::INTER_LANCZOS4);

                cv::Mat lab;
                cv::cvtColor(hiRes, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> labCh;
                cv::split(lab, labCh);

                // High-contrast crater enhancement on L-channel
                cv::Ptr<cv::CLAHE> clahe = cv::createCLAHE(4.0, cv::Size(8, 8));
                clahe->apply(labCh[0], labCh[0]);

                // Lunar Maria and Rim Deconvolution
                cv::Mat blurM, sharpM;
                cv::GaussianBlur(labCh[0], blurM, cv::Size(0, 0), 1.8);
                cv::addWeighted(labCh[0], 2.4, blurM, -1.4, 0, sharpM);
                sharpM.copyTo(labCh[0]);

                cv::merge(labCh, lab);
                cv::cvtColor(lab, resultImg, cv::COLOR_Lab2BGR);
            } else {
                // Execute Real-ESRGAN Neural Network on GPU/NEON
                bool executed = false;
                if (modelType == 1 && gFineLoaded) {
                    resultImg = runNcnnSuperResolution(gNetFine, crop, targetW, targetH);
                    executed = true;
                } else if (gPhotoLoaded) {
                    resultImg = runNcnnSuperResolution(gNetPhoto, crop, targetW, targetH);
                    executed = true;
                }

                if (!executed) {
                    cv::resize(crop, resultImg, cv::Size(targetW, targetH), 0, 0, cv::INTER_LANCZOS4);
                }

                // Apply dynamic range local contrast preservation
                cv::Mat lab;
                cv::cvtColor(resultImg, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> labCh;
                cv::split(lab, labCh);

                cv::Ptr<cv::CLAHE> clahe = cv::createCLAHE(2.0, cv::Size(8, 8));
                clahe->apply(labCh[0], labCh[0]);

                cv::Mat blurL, sharpL;
                cv::GaussianBlur(labCh[0], blurL, cv::Size(0, 0), 1.2);
                cv::addWeighted(labCh[0], 1.6, blurL, -0.6, 0, sharpL);
                sharpL.copyTo(labCh[0]);

                cv::merge(labCh, lab);
                cv::cvtColor(lab, resultImg, cv::COLOR_Lab2BGR);
            }

            matToBitmap(env, resultImg, outBmp);
            return 1;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeEnhanceTextEdges(JNIEnv* env, jobject, jobject bmp, jintArray boxes) {
            cv::Mat img = bitmapToMat(env, bmp);
            if (img.empty()) return;

            jsize len = env->GetArrayLength(boxes);
            jint* ptr = env->GetIntArrayElements(boxes, nullptr);

            for (int i = 0; i + 3 < len; i += 4) {
                int x = std::max(0, ptr[i] - 6);
                int y = std::max(0, ptr[i + 1] - 6);
                int w = std::min(img.cols - x, ptr[i + 2] + 12);
                int h = std::min(img.rows - y, ptr[i + 3] + 12);
                if (w <= 8 || h <= 8) continue;

                cv::Rect r(x, y, w, h);
                cv::Mat roi = img(r);

                cv::Mat gray, morph;
                cv::cvtColor(roi, gray, cv::COLOR_BGR2GRAY);
                cv::Mat kernel = cv::getStructuringElement(cv::MORPH_RECT, cv::Size(2, 2));
                cv::morphologyEx(gray, morph, cv::MORPH_GRADIENT, kernel);

                cv::Mat mask;
                cv::threshold(morph, mask, 35, 255, cv::THRESH_BINARY);

                cv::Mat lab;
                cv::cvtColor(roi, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> p;
                cv::split(lab, p);

                cv::Mat sharp;
                cv::addWeighted(p[0], 1.9, gray, -0.9, 0, sharp);
                sharp.copyTo(p[0], mask);

                cv::merge(p, lab);
                cv::cvtColor(lab, roi, cv::COLOR_Lab2BGR);
            }

            env->ReleaseIntArrayElements(boxes, ptr, JNI_ABORT);
            matToBitmap(env, img, bmp);
        }
