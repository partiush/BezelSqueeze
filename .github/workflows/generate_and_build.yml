          # 26. ConfigSchema for Compose
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/ui/ConfigSchema.kt
          package com.edge.bezelmorph.ui
          import androidx.compose.runtime.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.edge.bezelmorph.core.*

          enum class FieldType { FLOAT, INT, BOOLEAN, ENUM, COLOR }
          data class ConfigField(
              val label: String, val type: FieldType, val category: String,
              val min: Float = 0f, val max: Float = 1f, val scale: Float = 1f,
              val enumValues: List<String> = emptyList(),
              val get: (MorphConfig) -> Float, val set: (MorphConfig, Float) -> Unit
          ) {
              fun currentValue(c: MorphConfig): String = when (type) {
                  FieldType.BOOLEAN -> if (get(c) > 0.5f) "ON" else "OFF"
                  FieldType.ENUM -> enumValues.getOrElse(get(c).toInt()) { "?" }
                  FieldType.COLOR -> String.format("#%06X", get(c).toInt() and 0xFFFFFF)
                  else -> if (scale > 1f) String.format("%.1f", get(c)) else get(c).toInt().toString()
              }
          }

          object ConfigSchema {
              val ALL = listOf(
                  ConfigField("Edge", FieldType.ENUM, "Geometry", enumValues = Edge.entries.map { it.name },
                      get = { it.edge.ordinal.toFloat() }, set = { c, v -> c.edge = Edge.entries[v.toInt()] }),
                  ConfigField("Center Y (%)", FieldType.FLOAT, "Geometry", min = 0.05f, max = 0.95f, scale = 1000f,
                      get = { it.centerYRatio }, set = { c, v -> c.centerYRatio = v }),
                  ConfigField("Plateau (dp)", FieldType.FLOAT, "Geometry", min = 12f, max = 80f,
                      get = { it.y0Dp }, set = { c, v -> c.y0Dp = v }),
                  ConfigField("Shoulder (dp)", FieldType.FLOAT, "Geometry", min = 15f, max = 100f,
                      get = { it.wDp }, set = { c, v -> c.wDp = v }),
                  ConfigField("Depth (dp)", FieldType.FLOAT, "Geometry", min = 6f, max = 45f,
                      get = { it.depthDp }, set = { c, v -> c.depthDp = v }),
                  ConfigField("Shape", FieldType.ENUM, "Shape", enumValues = ShapeProfile.entries.map { it.name },
                      get = { it.shapeProfile.ordinal.toFloat() }, set = { c, v -> c.shapeProfile = ShapeProfile.entries[v.toInt()] }),
                  ConfigField("Resonance", FieldType.FLOAT, "Physics", min = 30f, max = 95f,
                      get = { it.omegaN }, set = { c, v -> c.omegaN = v }),
                  ConfigField("Damping", FieldType.FLOAT, "Physics", min = 0.5f, max = 0.99f, scale = 100f,
                      get = { it.zeta }, set = { c, v -> c.zeta = v }),
                  ConfigField("Impulse", FieldType.FLOAT, "Physics", min = 500f, max = 4000f,
                      get = { it.inwardVelocity }, set = { c, v -> c.inwardVelocity = v }),
                  ConfigField("Substepping", FieldType.BOOLEAN, "Physics",
                      get = { if (it.substepping) 1f else 0f }, set = { c, v -> c.substepping = v > 0.5f }),
                  ConfigField("Fill mode", FieldType.ENUM, "Fill", enumValues = FillMode.entries.map { it.name },
                      get = { it.fillMode.ordinal.toFloat() }, set = { c, v -> c.fillMode = FillMode.entries[v.toInt()] }),
                  ConfigField("Primary color", FieldType.COLOR, "Fill",
                      get = { it.fillColor.toFloat() }, set = { c, v -> c.fillColor = v.toInt() }),
                  ConfigField("Inner shadow", FieldType.BOOLEAN, "Fill",
                      get = { if (it.innerShadow) 1f else 0f }, set = { c, v -> c.innerShadow = v > 0.5f }),
                  ConfigField("Rim light", FieldType.BOOLEAN, "Fill",
                      get = { if (it.rimLight) 1f else 0f }, set = { c, v -> c.rimLight = v > 0.5f }),
                  ConfigField("Haptics", FieldType.BOOLEAN, "Haptics",
                      get = { if (it.hapticEnabled) 1f else 0f }, set = { c, v -> c.hapticEnabled = v > 0.5f }),
                  ConfigField("Press effect", FieldType.ENUM, "Haptics", enumValues = listOf("TICK", "CLICK", "HEAVY", "DOUBLE"),
                      get = { it.pressEffect.toFloat() }, set = { c, v -> c.pressEffect = v.toInt() }),
                  ConfigField("Click sound", FieldType.BOOLEAN, "Haptics",
                      get = { if (it.clickSoundEnabled) 1f else 0f }, set = { c, v -> c.clickSoundEnabled = v > 0.5f }),
                  ConfigField("Suppress volume UI", FieldType.BOOLEAN, "Behavior",
                      get = { if (it.suppressVolumeUi) 1f else 0f }, set = { c, v -> c.suppressVolumeUi = v > 0.5f }),
                  ConfigField("Rate limit/min", FieldType.INT, "Behavior", min = 1f, max = 120f,
                      get = { it.rateLimitPerMinute.toFloat() }, set = { c, v -> c.rateLimitPerMinute = v.toInt() }),
                  ConfigField("Adaptive FPS", FieldType.BOOLEAN, "Behavior",
                      get = { if (it.adaptiveFps) 1f else 0f }, set = { c, v -> c.adaptiveFps = v > 0.5f }),
                  ConfigField("Reduce motion", FieldType.BOOLEAN, "Behavior",
                      get = { if (it.reduceMotion) 1f else 0f }, set = { c, v -> c.reduceMotion = v > 0.5f }),
                  ConfigField("Gesture edge swipe", FieldType.BOOLEAN, "Advanced",
                      get = { if (it.gestureEdgeSwipeEnabled) 1f else 0f }, set = { c, v -> c.gestureEdgeSwipeEnabled = v > 0.5f }),
                  ConfigField("Show notification", FieldType.BOOLEAN, "Advanced",
                      get = { if (it.showStatusNotification) 1f else 0f }, set = { c, v -> c.showStatusNotification = v > 0.5f }),
                  ConfigField("Floating bubble", FieldType.BOOLEAN, "Advanced",
                      get = { if (it.bubbleEnabled) 1f else 0f }, set = { c, v -> c.bubbleEnabled = v > 0.5f }),
                  ConfigField("Script enabled", FieldType.BOOLEAN, "Advanced",
                      get = { if (it.scriptEnabled) 1f else 0f }, set = { c, v -> c.scriptEnabled = v > 0.5f }),
                  ConfigField("Click volume", FieldType.FLOAT, "Advanced", min = 0f, max = 1f, scale = 100f,
                      get = { it.clickVolume.toFloat() }, set = { c, v -> c.clickVolume = v.toInt() })
              )
