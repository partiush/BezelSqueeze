          # 21. Screen capture manager (optional refraction)
          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/ScreenCaptureManager.kt
          package com.edge.bezelmorph.engine

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.Looper

          /**
           * Optional. When enabled, the overlay can sample the screen behind it
           * so the bulge truly refracts the live content (Liquid Glass style).
           * Requires MediaProjection consent.
           */
          class ScreenCaptureManager(private val context: Context) {
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              var lastFrame: Bitmap? = null
                  private set

              fun requestIntent(): Intent? {
                  val mgr = context.getSystemService(Context.MEDIA_PROJECTION_SERVICE) as? MediaProjectionManager
                  return mgr?.createScreenCaptureIntent()
              }

              fun start(resultCode: Int, data: Intent) {
                  val mgr = context.getSystemService(Context.MEDIA_PROJECTION_SERVICE) as? MediaProjectionManager
                      ?: return
                  projection = mgr.getMediaProjection(resultCode, data)
                  val dm = context.resources.displayMetrics
                  imageReader = ImageReader.newInstance(
                      dm.widthPixels, dm.heightPixels,
                      android.graphics.PixelFormat.RGBA_8888, 2
                  )
                  virtualDisplay = projection?.createVirtualDisplay(
                      "BezelCapture", dm.widthPixels, dm.heightPixels, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, Handler(Looper.getMainLooper())
                  )
                  imageReader?.setOnImageAvailableListener({ reader ->
                      val image = reader.acquireLatestImage() ?: return@setOnImageAvailableListener
                      val plane = image.planes[0]
                      val bmp = Bitmap.createBitmap(image.width, image.height, Bitmap.Config.ARGB_8888)
                      bmp.copyPixelsFromBuffer(plane.buffer)
                      lastFrame = bmp
                      image.close()
                  }, Handler(Looper.getMainLooper()))
              }

              fun stop() {
                  virtualDisplay?.release(); virtualDisplay = null
                  imageReader?.close(); imageReader = null
                  projection?.stop(); projection = null
              }
          }
          EOF

