          package com.edge.bezelmorph.core

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONObject

          class ConfigStore(context: Context) {
              private val prefs: SharedPreferences =
                  context.getSharedPreferences("bezel_morph_pref", Context.MODE_PRIVATE)

              fun load(): MorphConfig {
                  val raw = prefs.getString("config_json", null) ?: return MorphConfig()
                  return try {
                      MorphConfig.fromJson(JSONObject(raw))
                  } catch (_: Exception) {
                      MorphConfig()
                  }
              }

              fun save(config: MorphConfig) {
                  prefs.edit().putString("config_json", config.toJson().toString()).apply()
              }

              fun saveProfile(name: String, config: MorphConfig) {
                  prefs.edit().putString("profile_$name", config.toJson().toString()).apply()
              }

              fun loadProfile(name: String): MorphConfig? {
                  val raw = prefs.getString("profile_$name", null) ?: return null
                  return try { MorphConfig.fromJson(JSONObject(raw)) } catch (_: Exception) { null }
              }

              fun listProfiles(): List<String> =
                  prefs.all.keys.filter { it.startsWith("profile_") }.map { it.removePrefix("profile_") }

              fun deleteProfile(name: String) {
                  prefs.edit().remove("profile_$name").apply()
              }

              fun exportAll(): String {
                  val root = JSONObject()
                  root.put("config", load().toJson())
                  val profiles = JSONObject()
                  listProfiles().forEach { name ->
                      loadProfile(name)?.let { profiles.put(name, it.toJson()) }
                  }
                  root.put("profiles", profiles)
                  return root.toString(2)
              }

              fun importAll(json: String) {
                  val root = JSONObject(json)
                  root.optJSONObject("config")?.let { save(MorphConfig.fromJson(it)) }
                  root.optJSONObject("profiles")?.let { profiles ->
                      profiles.keys().forEach { name ->
                          (profiles.optJSONObject(name) as? JSONObject)?.let {
                              saveProfile(name, MorphConfig.fromJson(it))
                          }
                      }
                  }
              }
          }
