                      form.addView(header(cat)); fields.forEach{form.addView(control(it))}
                  }
                  form.addView(header("Profiles & Data"))
                  val row=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL}
                  row.addView(button("Save"){saveProfileDialog()}); row.addView(button("Load"){loadProfileDialog()})
                  row.addView(button("Export"){exportDialog()}); row.addView(button("Import"){importDialog()})
                  form.addView(row)
                  scroll.addView(form)
                  dash.addView(scroll,FrameLayout.LayoutParams(-1,-2).apply{gravity=Gravity.BOTTOM})
                  root.addView(dash,FrameLayout.LayoutParams.MATCH_PARENT,FrameLayout.LayoutParams.MATCH_PARENT)
              }

              private fun control(f:ConfigField):View{
                  return when(f.type){
                      FieldType.FLOAT,FieldType.INT->{
                          val box=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(0,8,0,8)}
                          box.addView(text(f.label,12f,0xFFCBD5E1.toInt()))
                          val valTv=TextView(this).apply{text=f.currentValue(this@MainActivity,config);setTextColor(0xFF38BDF8.toInt());textSize=12f}
                          val bar=SeekBar(this).apply{
                              max=((f.max-f.min)*f.scale).toInt()
                              progress=((f.get(config)-f.min)*f.scale).toInt()
                              setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{
                                  override fun onProgressChanged(sb:SeekBar?,p:Int,u:Boolean){
                                      val real=f.min+p/f.scale; f.set(config,real)
                                      valTv.text=f.currentValue(this@MainActivity,config)
                                      store.save(config);refreshPreview()
                                  }
                                  override fun onStartTrackingTouch(sb:SeekBar?){}
                                  override fun onStopTrackingTouch(sb:SeekBar?){preview.setStaticPreview(1f)}
                              })
                          }
                          box.addView(valTv); box.addView(bar); box
                      }
                      FieldType.BOOLEAN->Switch(this).apply{
                          text=f.label;setTextColor(0xFFCBD5E1.toInt())
                          isChecked=f.get(config)>0.5f
                          setOnCheckedChangeListener{_,c->f.set(config,if(c)1f else 0f);store.save(config);refreshPreview()}
                      }
                      FieldType.ENUM->{
                          val r=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL}
                          r.addView(text(f.label,12f,0xFFCBD5E1.toInt()),LinearLayout.LayoutParams(0,-2,1f))
                          val sp=Spinner(this).apply{
                              adapter=ArrayAdapter(this@MainActivity,android.R.layout.simple_spinner_dropdown_item,f.enumValues)
                              setSelection(f.get(config).toInt())
                              onItemSelectedListener=object:AdapterView.OnItemSelectedListener{
                                  override fun onItemSelected(p:AdapterView<*>?,v:View?,pos:Int,id:Long){
                                      f.set(config,pos.toFloat());store.save(config);refreshPreview()
                                  }
                                  override fun onNothingSelected(p:AdapterView<*>?){}
                              }
                          }
                          r.addView(sp); r
                      }
                      FieldType.COLOR->Button(this).apply{
                          text=f.label
                          setOnClickListener{
                              val colors=intArrayOf(Color.BLACK,0xFF1E293B.toInt(),0xFF38BDF8.toInt(),Color.WHITE)
                              android.app.AlertDialog.Builder(this@MainActivity)
                                  .setTitle(f.label).setItems(arrayOf("Black","Slate","Sky","White")){_,w->
                                      f.set(config,colors[w].toFloat());store.save(config);refreshPreview()
                                  }.show()
                          }
                      }
                  }
              }

              private fun refreshPreview(){
                  preview.updateConfig(config)
                  preview.post{preview.centerY=preview.height*config.centerYRatio;preview.setStaticPreview(1f)}
              }
              private fun saveProfileDialog(){
                  val e=EditText(this)
                  android.app.AlertDialog.Builder(this).setTitle("Name").setView(e)
                      .setPositiveButton("Save"){_,_->store.saveProfile(e.text.toString().ifBlank{"default"},config)}.show()
              }
              private fun loadProfileDialog(){
                  val names=store.listProfiles().toTypedArray()
                  if(names.isEmpty()){Toast.makeText(this,"No profiles",Toast.LENGTH_SHORT).show();return}
                  android.app.AlertDialog.Builder(this).setTitle("Load").setItems(names){_,w->
                      store.loadProfile(names[w])?.let{config=it;store.save(config);refreshPreview()}
                  }.show()
              }
              private fun exportDialog(){
                  val i=Intent(Intent.ACTION_SEND).apply{type="application/json";putExtra(Intent.EXTRA_TEXT,store.exportAll())}
                  startActivity(Intent.createChooser(i,"Export"))
              }
              private fun importDialog(){
                  val e=EditText(this).apply{hint="Paste JSON";minLines=4}
                  android.app.AlertDialog.Builder(this).setTitle("Import").setView(e)
                      .setPositiveButton("Import"){_,_->try{store.importAll(e.text.toString());config=store.load();refreshPreview()}catch(ex:Exception){}}.show()
              }

              // helpers
              private fun text(s:String,sz:Float,col:Int,bold:Boolean=false,padTop:Int=0,padBottom:Int=0)=
                  TextView(this).apply{text=s;textSize=sz;setTextColor(col);if(bold)typeface=Typeface.DEFAULT_BOLD;setPadding(0,padTop,0,padBottom)}
              private fun header(s:String)=TextView(this).apply{text=s;textSize=14f;setTextColor(0xFF38BDF8.toInt());typeface=Typeface.DEFAULT_BOLD;setPadding(0,28,0,8)}
              private fun button(l:String,onClick:()->Unit)=Button(this).apply{text=l;setOnClickListener{onClick()}}
              private fun card(t:String,d:String,ic:Int,onClick:()->Unit):Pair<LinearLayout,ImageView>{
                  val c=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL;
                      setPadding(28,24,28,24);background=android.graphics.drawable.GradientDrawable().apply{setColor(0xFF1E293B.toInt());cornerRadius=20f};
                      isClickable=true;setOnClickListener{onClick()}}
                  c.layoutParams=LinearLayout.LayoutParams(-1,-2).apply{setMargins(0,0,0,20)}
                  val iv=ImageView(this).apply{setImageResource(ic);layoutParams=LinearLayout.LayoutParams(56,56)}
                  c.addView(iv)
                  val col=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(24,0,16,0);layoutParams=LinearLayout.LayoutParams(0,-2,1f)}
                  col.addView(text(t,15f,Color.WHITE,true));col.addView(text(d,12f,0xFF94A3B8.toInt(),padTop=4))
                  c.addView(col)
                  val st=ImageView(this).apply{setImageResource(R.drawable.ic_chevron_right);layoutParams=LinearLayout.LayoutParams(40,40)}
                  c.addView(st); return c to st
              }
          }
          EOF

          # 23. ConfigSchema (all tunables)
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/ui/ConfigSchema.kt
          package com.edge.bezelmorph.ui
          import android.content.Context
          import com.edge.bezelmorph.core.*

          enum class FieldType { FLOAT,INT,BOOLEAN,ENUM,COLOR }
          data class ConfigField(
              val label:String,val type:FieldType,val category:String,
              val min:Float=0f,val max:Float=1f,val scale:Float=1f,
              val enumValues:Array<String> = emptyArray(),
              val get:(MorphConfig)->Float,val set:(MorphConfig,Float)->Unit
          ){
              fun currentValue(ctx:Context,c:MorphConfig):String = when(type){
                  FieldType.BOOLEAN->if(get(c)>0.5f)"ON" else "OFF"
                  FieldType.ENUM->enumValues.getOrElse(get(c).toInt()){"?"}
                  FieldType.COLOR->String.format("#%06X",get(c).toInt() and 0xFFFFFF)
                  else->if(scale>1f)String.format("%.1f",get(c)) else get(c).toInt().toString()
              }
          }

          object ConfigSchema {
              val ALL = listOf(
                  ConfigField("Edge","",FieldType.ENUM,"Geometry",enumValues=Edge.entries.map{it.name}.toTypedArray(),
                      get={it.edge.ordinal.toFloat()},set={c,v->c.edge=Edge.entries[v.toInt()]}),
                  ConfigField("Center Y (%)","",FieldType.FLOAT,"Geometry",min=0.05f,max=0.95f,scale=1000f,
                      get={it.centerYRatio},set={c,v->c.centerYRatio=v}),
                  ConfigField("Plateau (dp)","",FieldType.FLOAT,"Geometry",min=12f,max=80f,
                      get={it.y0Dp},set={c,v->c.y0Dp=v}),
                  ConfigField("Shoulder (dp)","",FieldType.FLOAT,"Geometry",min=15f,max=100f,
                      get={it.wDp},set={c,v->c.wDp=v}),
                  ConfigField("Depth (dp)","",FieldType.FLOAT,"Geometry",min=6f,max=45f,
                      get={it.depthDp},set={c,v->c.depthDp=v}),
                  ConfigField("Shape","",FieldType.ENUM,"Shape",enumValues=ShapeProfile.entries.map{it.name}.toTypedArray(),
                      get={it.shapeProfile.ordinal.toFloat()},set={c,v->c.shapeProfile=ShapeProfile.entries[v.toInt()]}),
                  ConfigField("Resonance","",FieldType.FLOAT,"Physics",min=30f,max=95f,
                      get={it.omegaN},set={c,v->c.omegaN=v}),
                  ConfigField("Damping","",FieldType.FLOAT,"Physics",min=0.5f,max=0.99f,scale=100f,
                      get={it.zeta},set={c,v->c.zeta=v}),
                  ConfigField("Impulse","",FieldType.FLOAT,"Physics",min=500f,max=4000f,
                      get={it.inwardVelocity},set={c,v->c.inwardVelocity=v}),
                  ConfigField("Substepping","",FieldType.BOOLEAN,"Physics",
                      get={if(it.substepping)1f else 0f},set={c,v->c.substepping=v>0.5f}),
                  ConfigField("Fill mode","",FieldType.ENUM,"Fill",enumValues=FillMode.entries.map{it.name}.toTypedArray(),
                      get={it.fillMode.ordinal.toFloat()},set={c,v->c.fillMode=FillMode.entries[v.toInt()]}),
                  ConfigField("Primary color","",FieldType.COLOR,"Fill",
                      get={it.fillColor.toFloat()},set={c,v->c.fillColor=v.toInt()}),
                  ConfigField("Inner shadow","",FieldType.BOOLEAN,"Fill",
                      get={if(it.innerShadow)1f else 0f},set={c,v->c.innerShadow=v>0.5f}),
                  ConfigField("Rim light","",FieldType.BOOLEAN,"Fill",
                      get={if(it.rimLight)1f else 0f},set={c,v->c.rimLight=v>0.5f}),
                  ConfigField("Haptics","",FieldType.BOOLEAN,"Haptics",
                      get={if(it.hapticEnabled)1f else 0f},set={c,v->c.hapticEnabled=v>0.5f}),
                  ConfigField("Press effect","",FieldType.ENUM,"Haptics",enumValues=arrayOf("TICK","CLICK","HEAVY","DOUBLE"),
                      get={it.pressEffect.toFloat()},set={c,v->c.pressEffect=v.toInt()}),
                  ConfigField("Click sound","",FieldType.BOOLEAN,"Haptics",
                      get={if(it.clickSoundEnabled)1f else 0f},set={c,v->c.clickSoundEnabled=v>0.5f}),
                  ConfigField("Suppress volume UI","",FieldType.BOOLEAN,"Behavior",
                      get={if(it.suppressVolumeUi)1f else 0f},set={c,v->c.suppressVolumeUi=v>0.5f}),
                  ConfigField("Rate limit/min","",FieldType.INT,"Behavior",min=1f,max=120f,
                      get={it.rateLimitPerMinute.toFloat()},set={c,v->c.rateLimitPerMinute=v.toInt()}),
                  ConfigField("Adaptive FPS","",FieldType.BOOLEAN,"Behavior",
                      get={if(it.adaptiveFps)1f else 0f},set={c,v->c.adaptiveFps=v>0.5f}),
                  ConfigField("Reduce motion","",FieldType.BOOLEAN,"Behavior",
                      get={if(it.reduceMotion)1f else 0f},set={c,v->c.reduceMotion=v>0.5f}),
                  ConfigField("Gesture edge swipe","",FieldType.BOOLEAN,"Advanced",
                      get={if(it.gestureEdgeSwipeEnabled)1f else 0f},set={c,v->c.gestureEdgeSwipeEnabled=v>0.5f}),
                  ConfigField("Show notification","",FieldType.BOOLEAN,"Advanced",
                      get={if(it.showStatusNotification)1f else 0f},set={c,v->c.showStatusNotification=v>0.5f}),
                  ConfigField("Floating bubble","",FieldType.BOOLEAN,"Advanced",
                      get={if(it.bubbleEnabled)1f else 0f},set={c,v->c.bubbleEnabled=v>0.5f})
              )
          }
          EOF

          # 24. QuickSettingsTile
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/integration/QuickSettingsTile.kt
          package com.edge.bezelmorph.integration
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import com.edge.bezelmorph.core.ConfigStore

          class QuickSettingsTile:TileService(){
              override fun onStartListening(){
                  super.onStartListening(); val c=ConfigStore(this).load()
                  qsTile?.apply{state=if(c.hapticEnabled)Tile.STATE_ACTIVE else Tile.STATE_INACTIVE;updateTile()}
              }
              override fun onClick(){
                  super.onClick(); val s=ConfigStore(this); val c=s.load()
                  c.hapticEnabled=!c.hapticEnabled; s.save(c)
                  qsTile?.apply{state=if(c.hapticEnabled)Tile.STATE_ACTIVE else Tile.STATE_INACTIVE;updateTile()}
              }
          }
          EOF

          # 25. Widget + AutomationReceiver
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/integration/BezelWidgetProvider.kt
          package com.edge.bezelmorph.integration
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews
          import com.edge.bezelmorph.R
          import com.edge.bezelmorph.core.ConfigStore

          class BezelWidgetProvider:AppWidgetProvider(){
              override fun onUpdate(ctx:Context,mgr:AppWidgetManager,ids:IntArray){
                  val c=ConfigStore(ctx).load()
                  ids.forEach{ id->
                      val v=RemoteViews(ctx.packageName,R.layout.widget_bezel)
                      v.setTextViewText(R.id.widget_status,if(c.hapticEnabled)"Bezel Morph: ON" else "Bezel Morph: OFF")
                      mgr.updateAppWidget(id,v)
                  }
              }
          }
