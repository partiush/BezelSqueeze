name: Generate Project & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Project Files
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/edge/bezelmorph

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 11
                  versionName = "11.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          # 5. Manifest (Keepalive Foreground Service + Boot Persistence + Cutout Bypass)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:foregroundServiceType="specialUse"
                      android:stopWithTask="false"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>

                  <receiver
                      android:name=".BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 6. Service Configuration & Resources
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagIncludeNotImportantViews"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph Engine</string>
              <string name="service_description">Hardware physical button perimeter synchronizer.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          # 7. Persistent Boot Receiver
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BootCompletedReceiver.kt
          package com.edge.bezelmorph

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootCompletedReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  // Warms preferences and verifies accessibility service registration
                  val store = MorphConfigStore(context)
                  val _unused = store.isLeftEdge
              }
          }
          EOF

          # 8. Expanded Config Store with Kinematic Parameters
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MorphConfigStore.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.content.SharedPreferences

          class MorphConfigStore(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("bezel_morph_pref", Context.MODE_PRIVATE)

              var volumeUpRatio: Float
                  get() = prefs.getFloat("v_up_ratio", 0.22f)
                  set(v) = prefs.edit().putFloat("v_up_ratio", v).apply()

              var volumeDownRatio: Float
                  get() = prefs.getFloat("v_down_ratio", 0.32f)
                  set(v) = prefs.edit().putFloat("v_down_ratio", v).apply()

              var flatTopHalfLengthY0: Float
                  get() = prefs.getFloat("y0_val", 50f)
                  set(v) = prefs.edit().putFloat("y0_val", v).apply()

              var blendTransitionW: Float
                  get() = prefs.getFloat("w_val", 85f)
                  set(v) = prefs.edit().putFloat("w_val", v).apply()

              var peakAmplitudeA: Float
                  get() = prefs.getFloat("peak_amp_A", 52f)
                  set(v) = prefs.edit().putFloat("peak_amp_A", v).apply()

              // Speed & Physics Controls
              var speedOverall: Float
                  get() = prefs.getFloat("speed_omega", 28.0f) // Natural Frequency (15 to 45)
                  set(v) = prefs.edit().putFloat("speed_omega", v).apply()

              var inwardImpulse: Float
                  get() = prefs.getFloat("speed_inward", 950f) // Initial Push Velocity (400 to 2000)
                  set(v) = prefs.edit().putFloat("speed_inward", v).apply()

              var outwardDamping: Float
                  get() = prefs.getFloat("speed_outward_zeta", 0.76f) // Recoil Damping (0.60 to 0.98)
                  set(v) = prefs.edit().putFloat("speed_outward_zeta", v).apply()

              var isLeftEdge: Boolean
                  get() = prefs.getBoolean("is_left_side", false)
                  set(v) = prefs.edit().putBoolean("is_left_side", v).apply()
          }
          EOF

          # 9. Ultra-Responsive Surface Engine with Micro-Click Lock
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BezelSurfaceView.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.graphics.*
          import android.os.Build
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.util.AttributeSet
          import android.view.Choreographer
          import android.view.View
          import kotlin.math.*

          class BezelSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs), Choreographer.FrameCallback {

              var isLeftEdge: Boolean = false
              var centerY: Float = 600f

              var y0: Float = 50f
              var w: Float = 85f
              var A: Float = 52f

              // Physics Sliders
              var omegaN: Float = 28.0f
              var inwardVelocity: Float = 950f
              var zeta: Float = 0.76f

              // Oscillator State
              private var currentA: Float = 0f
              private var velocityA: Float = 0f
              private var targetA: Float = 0f
              private var isSimulating: Boolean = false
              private var lastFrameTimeNs: Long = 0L

              // Micro-click Protection: Holds full outward push for at least 85ms even on 1ms click
              private var downTimestampMs: Long = 0L
              private var isReleasePending: Boolean = false
              private val minHoldDurationMs: Long = 85L

              private val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
              private val choreographer = Choreographer.getInstance()

              private val morphPath = Path()
              private val bezelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  style = Paint.Style.FILL
              }

              fun onHardwareButtonDown() {
                  downTimestampMs = SystemClock.uptimeMillis()
                  isReleasePending = false
                  targetA = A
                  velocityA = inwardVelocity
                  triggerHaptic()
                  startSimulation()
              }

              fun onHardwareButtonUp() {
                  val elapsed = SystemClock.uptimeMillis() - downTimestampMs
                  if (elapsed < minHoldDurationMs) {
                      // Ultra-fast click detected: guarantee smooth expansion before triggering release
                      isReleasePending = true
                  } else {
                      targetA = 0f
                      startSimulation()
                  }
              }

              fun setPreviewStatic(ratio: Float) {
                  stopSimulation()
                  currentA = A * ratio
                  invalidate()
              }

              private fun startSimulation() {
                  if (!isSimulating) {
                      isSimulating = true
                      lastFrameTimeNs = 0L
                      choreographer.postFrameCallback(this)
                  }
              }

              private fun stopSimulation() {
                  isSimulating = false
                  choreographer.removeFrameCallback(this)
              }

              override fun doFrame(frameTimeNs: Long) {
                  if (!isSimulating) return

                  val now = SystemClock.uptimeMillis()
                  if (isReleasePending && (now - downTimestampMs >= minHoldDurationMs)) {
                      isReleasePending = false
                      targetA = 0f
                  }

                  val dt = if (lastFrameTimeNs > 0L) {
                      ((frameTimeNs - lastFrameTimeNs) / 1_000_000_000f).coerceIn(0.004f, 0.024f)
                  } else {
                      0.016f
                  }
                  lastFrameTimeNs = frameTimeNs

                  // Damped Harmonic Oscillator with dynamic frequency & damping
                  val displacement = currentA - targetA
                  val accel = -(omegaN * omegaN * displacement) - (2f * zeta * omegaN * velocityA)

                  velocityA += accel * dt
                  currentA += velocityA * dt

                  if (targetA == 0f && !isReleasePending && abs(velocityA) < 0.15f && abs(currentA) < 0.15f) {
                      currentA = 0f
                      velocityA = 0f
                      isSimulating = false
                      invalidate()
                      return
                  }

                  invalidate()
                  choreographer.postFrameCallback(this)
              }

              private fun triggerHaptic() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          vibrator?.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(8)
                      }
                  } catch (ignored: Exception) {}
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (currentA <= 0.001f) return

                  val screenW = width.toFloat()
                  val totalHalfSpan = y0 + w
                  val yTop = centerY - totalHalfSpan
                  val yBottom = centerY + totalHalfSpan

                  morphPath.reset()
                  val steps = 72
                  val stepSize = (2f * totalHalfSpan) / steps

                  if (isLeftEdge) {
                      morphPath.moveTo(0f, yTop)
                      for (i in 0..steps) {
                          val curY = yTop + (i * stepSize)
                          val dist = abs(curY - centerY)
                          val x = when {
                              dist <= y0 -> currentA
                              dist < totalHalfSpan -> {
                                  val u = (dist - y0) / w
                                  currentA * (1.0f - (10.0f * u.pow(3)) + (15.0f * u.pow(4)) - (6.0f * u.pow(5)))
                              }
                              else -> 0f
                          }
                          morphPath.lineTo(x, curY)
                      }
                      morphPath.lineTo(0f, yBottom)
                      morphPath.close()
                  } else {
                      val xEdge = screenW
                      morphPath.moveTo(xEdge, yTop)
                      for (i in 0..steps) {
                          val curY = yTop + (i * stepSize)
                          val dist = abs(curY - centerY)
                          val x = when {
                              dist <= y0 -> currentA
                              dist < totalHalfSpan -> {
                                  val u = (dist - y0) / w
                                  currentA * (1.0f - (10.0f * u.pow(3)) + (15.0f * u.pow(4)) - (6.0f * u.pow(5)))
                              }
                              else -> 0f
                          }
                          morphPath.lineTo(xEdge - x, curY)
                      }
                      morphPath.lineTo(xEdge, yBottom)
                      morphPath.close()
                  }

                  canvas.drawPath(morphPath, bezelPaint)
              }
          }
          EOF

          # 10. Foreground Kept-Alive Accessibility Service
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/HardwareKeyMonitorService.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import androidx.core.app.NotificationCompat

          class HardwareKeyMonitorService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var overlay: BezelSurfaceView? = null
              private lateinit var store: MorphConfigStore
              private var activeKey: Int = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  store = MorphConfigStore(this)
                  startPersistentForeground()
                  attachOverlay()
              }

              override fun onStartCommand(intent: android.content.Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }

              private fun startPersistentForeground() {
                  val channelId = "bezel_channel_core"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Morph Service",
                          NotificationManager.IMPORTANCE_MIN
                      ).apply {
                          setShowBadge(false)
                          enableVibration(false)
                      }
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Perimeter Engine Active")
                      .setContentText("Syncing with hardware switches")
                      .setSmallIcon(android.R.drawable.ic_menu_crop)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notification)
              }

              private fun attachOverlay() {
                  if (overlay != null) return
                  try {
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          flags,
                          PixelFormat.TRANSLUCENT
                      )

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          params.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      }

                      overlay = BezelSurfaceView(this).apply {
                          isLeftEdge = store.isLeftEdge
                          y0 = store.flatTopHalfLengthY0
                          w = store.blendTransitionW
                          A = store.peakAmplitudeA
                          omegaN = store.speedOverall
                          inwardVelocity = store.inwardImpulse
                          zeta = store.outwardDamping
                      }
                      wm?.addView(overlay, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode
                  if (code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      val ratio = if (code == KeyEvent.KEYCODE_VOLUME_UP) store.volumeUpRatio else store.volumeDownRatio

                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (event.repeatCount == 0) {
                              activeKey = code
                              overlay?.let { view ->
                                  view.isLeftEdge = store.isLeftEdge
                                  view.y0 = store.flatTopHalfLengthY0
                                  view.w = store.blendTransitionW
                                  view.A = store.peakAmplitudeA
                                  view.omegaN = store.speedOverall
                                  view.inwardVelocity = store.inwardImpulse
                                  view.zeta = store.outwardDamping
                                  view.centerY = view.height * ratio
                                  view.onHardwareButtonDown()
                              }
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          if (activeKey == code) {
                              activeKey = 0
                              overlay?.onHardwareButtonUp()
                          }
                      }
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  try { overlay?.let { wm?.removeView(it) } } catch (ignored: Exception) {}
              }
          }
          EOF

          # 11. MainActivity with Speed & Transition Controls
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MainActivity.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.accessibility.AccessibilityManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var store: MorphConfigStore
              private lateinit var preview: BezelSurfaceView
              private var accessButton: Button? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = MorphConfigStore(this)

                  val container = FrameLayout(this).apply { setBackgroundColor(0xFF000000.toInt()) }
                  preview = BezelSurfaceView(this).apply {
                      isLeftEdge = store.isLeftEdge
                      y0 = store.flatTopHalfLengthY0
                      w = store.blendTransitionW
                      A = store.peakAmplitudeA
                      omegaN = store.speedOverall
                      inwardVelocity = store.inwardImpulse
                      zeta = store.outwardDamping
                  }
                  container.addView(preview, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(0xEE111111.toInt())
                      setPadding(36, 24, 36, 32)
                  }
                  val content = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val title = TextView(this).apply {
                      text = "Physical Edge & Physics Tuning"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 18f
                      setPadding(0, 0, 0, 16)
                  }
                  content.addView(title)

                  val edgeSwitch = Switch(this).apply {
                      text = if (store.isLeftEdge) "Side: Left Edge" else "Side: Right Edge"
                      setTextColor(0xFFCCCCCC.toInt())
                      isChecked = store.isLeftEdge
                      setOnCheckedChangeListener { _, checked ->
                          store.isLeftEdge = checked
                          text = if (checked) "Side: Left Edge" else "Side: Right Edge"
                          updatePreview()
                      }
                  }
                  content.addView(edgeSwitch)

                  content.addView(buildSlider("Button 1 Center", (store.volumeUpRatio * 1000).toInt(), 50, 950) {
                      store.volumeUpRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreviewStatic(1.0f)
                  })

                  content.addView(buildSlider("Button 2 Center", (store.volumeDownRatio * 1000).toInt(), 50, 950) {
                      store.volumeDownRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeDownRatio
                      preview.setPreviewStatic(1.0f)
                  })

                  content.addView(buildSlider("Flat Key Plateau (y0)", store.flatTopHalfLengthY0.toInt(), 20, 140) {
                      store.flatTopHalfLengthY0 = it.toFloat()
                      updatePreview()
                  })

                  content.addView(buildSlider("Shoulder Blend Width (w)", store.blendTransitionW.toInt(), 30, 200) {
                      store.blendTransitionW = it.toFloat()
                      updatePreview()
                  })

                  content.addView(buildSlider("Peak Intrusion (A)", store.peakAmplitudeA.toInt(), 15, 120) {
                      store.peakAmplitudeA = it.toFloat()
                      updatePreview()
                  })

                  // Speed Sliders
                  val physicsHeader = TextView(this).apply {
                      text = "Dynamics & Velocity Tuning"
                      setTextColor(0xFF5389FF.toInt())
                      textSize = 15f
                      setPadding(0, 16, 0, 8)
                  }
                  content.addView(physicsHeader)

                  content.addView(buildSlider("Overall Speed (Natural Frequency)", store.speedOverall.toInt(), 15, 55) {
                      store.speedOverall = it.toFloat()
                      preview.omegaN = store.speedOverall
                  })

                  content.addView(buildSlider("Inward Push Speed", (store.inwardImpulse / 10).toInt(), 40, 220) {
                      store.inwardImpulse = (it * 10).toFloat()
                      preview.inwardVelocity = store.inwardImpulse
                  })

                  content.addView(buildSlider("Outward Recoil Damping", (store.outwardDamping * 100).toInt(), 50, 98) {
                      store.outwardDamping = it / 100f
                      preview.zeta = store.outwardDamping
                  })

                  accessButton = Button(this).apply {
                      text = "Grant System Access"
                      setBackgroundColor(0xFF2E66FF.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  content.addView(accessButton)

                  scroll.addView(content)
                  val cardParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM
                      setMargins(24, 0, 24, 48)
                  }
                  container.addView(scroll, cardParams)

                  setContentView(container)
              }

              override fun onResume() {
                  super.onResume()
                  checkPermissionState()
                  updatePreview()
              }

              private fun checkPermissionState() {
                  if (isServiceRunning()) {
                      accessButton?.visibility = View.GONE
                  } else {
                      accessButton?.visibility = View.VISIBLE
                  }
              }

              private fun isServiceRunning(): Boolean {
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                  val services = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  for (s in services) {
                      if (s.id.contains(packageName)) return true
                  }
                  return false
              }

              private fun buildSlider(name: String, current: Int, min: Int, max: Int, onVal: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 8, 0, 8)
                  }
                  val txt = TextView(this).apply {
                      text = "$name: $current"
                      setTextColor(0xFFB0B0B0.toInt())
                      textSize = 13f
                  }
                  val bar = SeekBar(this).apply {
                      this.max = max - min
                      this.progress = current - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(b: SeekBar?, p: Int, fromUser: Boolean) {
                              val real = p + min
                              txt.text = "$name: $real"
                              onVal(real)
                          }
                          override fun onStartTrackingTouch(b: SeekBar?) {}
                          override fun onStopTrackingTouch(b: SeekBar?) { preview.setPreviewStatic(0f) }
                      })
                  }
                  box.addView(txt)
                  box.addView(bar)
                  return box
              }

              private fun updatePreview() {
                  preview.isLeftEdge = store.isLeftEdge
                  preview.y0 = store.flatTopHalfLengthY0
                  preview.w = store.blendTransitionW
                  preview.A = store.peakAmplitudeA
                  preview.omegaN = store.speedOverall
                  preview.inwardVelocity = store.inwardImpulse
                  preview.zeta = store.outwardDamping
                  preview.post {
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreviewStatic(1.0f)
                  }
              }
          }
          EOF

      - name: Build With Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compile Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BezelMorph-Engine-APK
          path: app/build/outputs/apk/debug/app-debug.apk
