name: Build SuperZoom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # --- Toolchain versions (latest stable) ---
      AGP_VERSION: "8.7.3"
      KOTLIN_VERSION: "2.0.21"
      GRADLE_VERSION: "8.10.2"
      CAMERAX_VERSION: "1.5.1"
      OPENCV_VERSION: "4.12.0"
      NCNN_VERSION: "20250428"
      NDK_VERSION: "27.2.12479018"
      COMPILE_SDK: "35"
      MIN_SDK: "26"
      TARGET_SDK: "35"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          cmake-version: '3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ------------------------------------------------------------
      # 1. Create all Gradle project files
      # ------------------------------------------------------------
      - name: Create Gradle root files
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SuperZoom"
          include(":app")
          EOF

          cat > build.gradle.kts << EOF
          plugins {
              id("com.android.application") version "${{ env.AGP_VERSION }}" apply false
              id("org.jetbrains.kotlin.android") version "${{ env.KOTLIN_VERSION }}" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Create app module build file
        run: |
          mkdir -p app/src/main/cpp app/src/main/java/com/example/superzoom app/src/main/res/layout app/src/main/assets
          cat > app/build.gradle.kts << EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.superzoom"
              compileSdk = ${{ env.COMPILE_SDK }}
              ndkVersion = "${{ env.NDK_VERSION }}"

              defaultConfig {
                  applicationId = "com.example.superzoom"
                  minSdk = ${{ env.MIN_SDK }}
                  targetSdk = ${{ env.TARGET_SDK }}
                  versionCode = 1
                  versionName = "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += "-DANDROID_PLATFORM=android-${{ env.MIN_SDK }}"
                          arguments += "-DANDROID_ARM_NEON=ON"
                      }
                  }
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              buildFeatures {
                  viewBinding = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.camera:camera-core:${{ env.CAMERAX_VERSION }}")
              implementation("androidx.camera:camera-camera2:${{ env.CAMERAX_VERSION }}")
              implementation("androidx.camera:camera-lifecycle:${{ env.CAMERAX_VERSION }}")
              implementation("androidx.camera:camera-view:${{ env.CAMERAX_VERSION }}")

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.2.0")
          }
          EOF

      # ------------------------------------------------------------
      # 2. Manifest & layout
      # ------------------------------------------------------------
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera.any" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="SuperZoom"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <com.example.superzoom.TrackingOverlay
                  android:id="@+id/trackingOverlay"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <Button
                  android:id="@+id/captureButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="CAPTURE 100x"
                  android:layout_marginBottom="32dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <ImageView
                  android:id="@+id/resultImage"
                  android:layout_width="150dp"
                  android:layout_height="150dp"
                  android:layout_margin="16dp"
                  android:background="#88000000"
                  android:scaleType="fitCenter"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

      # ------------------------------------------------------------
      # 3. Kotlin source files
      # ------------------------------------------------------------
      - name: Create Kotlin sources
        run: |
          # NativeBridge.kt
          cat > app/src/main/java/com/example/superzoom/NativeBridge.kt << 'EOF'
          package com.example.superzoom

          import android.graphics.Bitmap

          object NativeBridge {
              init {
                  System.loadLibrary("superzoom")
              }

              external fun alignAndMerge(
                  frames: Array<Bitmap>,
                  cropX: Int,
                  cropY: Int,
                  cropWidth: Int,
                  cropHeight: Int
              ): Bitmap?

              external fun runSuperResolution(input: Bitmap): Bitmap?
          }
          EOF

          # CameraController.kt
          cat > app/src/main/java/com/example/superzoom/CameraController.kt << 'EOF'
          package com.example.superzoom

          import android.content.Context
          import android.graphics.Bitmap
          import android.util.Log
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleOwner
          import java.util.concurrent.Executors

          class CameraController(
              private val context: Context,
              private val previewView: PreviewView,
              private val lifecycleOwner: LifecycleOwner
          ) {
              private var imageCapture: ImageCapture? = null
              private var imageAnalysis: ImageAnalysis? = null
              private val cameraExecutor = Executors.newSingleThreadExecutor()
              private val frameBuffer = ArrayDeque<Bitmap>(15)
              private val bufferLock = Any()

              fun startCamera() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(context)
                  cameraProviderFuture.addListener({
                      val cameraProvider = cameraProviderFuture.get()

                      val preview = Preview.Builder()
                          .build()
                          .also { it.setSurfaceProvider(previewView.surfaceProvider) }

                      imageCapture = ImageCapture.Builder()
                          .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                          .build()

                      imageAnalysis = ImageAnalysis.Builder()
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                          .also { analysis ->
                              analysis.setAnalyzer(cameraExecutor) { imageProxy ->
                                  val bitmap = imageProxy.toBitmap()
                                  synchronized(bufferLock) {
                                      if (frameBuffer.size >= 15) frameBuffer.removeFirst()
                                      frameBuffer.addLast(bitmap)
                                  }
                                  imageProxy.close()
                              }
                          }

                      val cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA

                      try {
                          cameraProvider.unbindAll()
                          val camera = cameraProvider.bindToLifecycle(
                              lifecycleOwner, cameraSelector, preview, imageCapture, imageAnalysis
                          )

                          val stabilizationSupported = camera.cameraInfo.isPreviewStabilizationSupported
                          if (stabilizationSupported) {
                              preview.setPreviewStabilizationEnabled(true)
                              Log.d("CameraController", "Preview stabilization enabled")
                          }
                      } catch (e: Exception) {
                          Log.e("CameraController", "Use case binding failed", e)
                      }
                  }, ContextCompat.getMainExecutor(context))
              }

              fun captureBurst(onBurstReady: (Array<Bitmap>) -> Unit) {
                  synchronized(bufferLock) {
                      val frames = frameBuffer.toTypedArray()
                      if (frames.isNotEmpty()) {
                          onBurstReady(frames)
                      }
                  }
              }

              fun shutdown() {
                  cameraExecutor.shutdown()
              }
          }
          EOF

          # TrackingOverlay.kt
          cat > app/src/main/java/com/example/superzoom/TrackingOverlay.kt << 'EOF'
          package com.example.superzoom

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View

          class TrackingOverlay @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {

              private val boxPaint = Paint().apply {
                  color = Color.GREEN
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private val cornerPaint = Paint().apply {
                  color = Color.GREEN
                  style = Paint.Style.FILL
              }

              private var trackingRect = RectF(200f, 200f, 600f, 600f)
              private var dragCorner = -1

              var onRectChanged: ((RectF) -> Unit)? = null

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawRect(trackingRect, boxPaint)

                  val handleRadius = 20f
                  canvas.drawCircle(trackingRect.left, trackingRect.top, handleRadius, cornerPaint)
                  canvas.drawCircle(trackingRect.right, trackingRect.top, handleRadius, cornerPaint)
                  canvas.drawCircle(trackingRect.left, trackingRect.bottom, handleRadius, cornerPaint)
                  canvas.drawCircle(trackingRect.right, trackingRect.bottom, handleRadius, cornerPaint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          dragCorner = -1
                          val threshold = 50f
                          if (dist(event.x, event.y, trackingRect.left, trackingRect.top) < threshold) dragCorner = 0
                          else if (dist(event.x, event.y, trackingRect.right, trackingRect.top) < threshold) dragCorner = 1
                          else if (dist(event.x, event.y, trackingRect.left, trackingRect.bottom) < threshold) dragCorner = 2
                          else if (dist(event.x, event.y, trackingRect.right, trackingRect.bottom) < threshold) dragCorner = 3
                          else if (trackingRect.contains(event.x, event.y)) dragCorner = 4
                      }
                      MotionEvent.ACTION_MOVE -> {
                          when (dragCorner) {
                              0 -> { trackingRect.left = event.x; trackingRect.top = event.y }
                              1 -> { trackingRect.right = event.x; trackingRect.top = event.y }
                              2 -> { trackingRect.left = event.x; trackingRect.bottom = event.y }
                              3 -> { trackingRect.right = event.x; trackingRect.bottom = event.y }
                              4 -> {
                                  val dx = event.x - trackingRect.centerX()
                                  val dy = event.y - trackingRect.centerY()
                                  trackingRect.offset(dx, dy)
                              }
                          }
                          invalidate()
                          onRectChanged?.invoke(RectF(trackingRect))
                      }
                      MotionEvent.ACTION_UP -> dragCorner = -1
                  }
                  return true
              }

              private fun dist(x1: Float, y1: Float, x2: Float, y2: Float): Float {
                  return Math.hypot((x1 - x2).toDouble(), (y1 - y2).toDouble()).toFloat()
              }
          }
          EOF

          # MainActivity.kt
          cat > app/src/main/java/com/example/superzoom/MainActivity.kt << 'EOF'
          package com.example.superzoom

          import android.graphics.Bitmap
          import android.os.Bundle
          import android.util.Log
          import android.widget.Button
          import android.widget.ImageView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.view.PreviewView

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var trackingOverlay: TrackingOverlay
              private lateinit var resultImage: ImageView
              private lateinit var cameraController: CameraController
              private lateinit var captureButton: Button
              private var currentCropRect: android.graphics.RectF? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  previewView = findViewById(R.id.previewView)
                  trackingOverlay = findViewById(R.id.trackingOverlay)
                  resultImage = findViewById(R.id.resultImage)
                  captureButton = findViewById(R.id.captureButton)

                  cameraController = CameraController(this, previewView, this)
                  cameraController.startCamera()

                  trackingOverlay.onRectChanged = { rect -> currentCropRect = rect }

                  captureButton.setOnClickListener { captureAndProcess() }
              }

              private fun captureAndProcess() {
                  cameraController.captureBurst { frames ->
                      if (frames.size < 2) {
                          Log.e("MainActivity", "Not enough frames")
                          return@captureBurst
                      }

                      val rect = currentCropRect ?: android.graphics.RectF(
                          0f, 0f, frames[0].width.toFloat(), frames[0].height.toFloat()
                      )

                      val cropX = rect.left.toInt().coerceAtLeast(0)
                      val cropY = rect.top.toInt().coerceAtLeast(0)
                      val cropW = rect.width().toInt().coerceAtMost(frames[0].width - cropX)
                      val cropH = rect.height().toInt().coerceAtMost(frames[0].height - cropY)

                      if (cropW <= 0 || cropH <= 0) return@captureBurst

                      val merged = NativeBridge.alignAndMerge(frames, cropX, cropY, cropW, cropH)

                      if (merged != null) {
                          val upscaled = NativeBridge.runSuperResolution(merged)
                          runOnUiThread { resultImage.setImageBitmap(upscaled ?: merged) }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cameraController.shutdown()
              }
          }
          EOF

      # ------------------------------------------------------------
      # 4. Native C++ code
      # ------------------------------------------------------------
      - name: Create native headers and sources
        run: |
          cat > app/src/main/cpp/super_zoom.h << 'EOF'
          #ifndef SUPERZOOM_H
          #define SUPERZOOM_H
          #include <jni.h>
          #include <opencv2/core.hpp>
          #include <vector>
          extern "C" {
          JNIEXPORT jobject JNICALL
          Java_com_example_superzoom_NativeBridge_alignAndMerge(
                  JNIEnv* env, jobject thiz,
                  jobjectArray frames, jint cropX, jint cropY,
                  jint cropWidth, jint cropHeight);
          JNIEXPORT jobject JNICALL
          Java_com_example_superzoom_NativeBridge_runSuperResolution(
                  JNIEnv* env, jobject thiz, jobject inputBitmap);
          }
          #endif
          EOF

          cat > app/src/main/cpp/super_zoom.cpp << 'EOF'
          #include "super_zoom.h"
          #include <opencv2/imgproc.hpp>
          #include <android/bitmap.h>
          #include <android/log.h>
          #include <ncnn/net.h>

          #define LOG_TAG "SuperZoom"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          cv::Mat bitmapToMat(JNIEnv* env, jobject bitmap) {
              AndroidBitmapInfo info;
              if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return {};
              if (info.format != ANDROID_BITMAP_FORMAT_RGBA_8888) return {};
              void* pixels;
              if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return {};
              cv::Mat mat(info.height, info.width, CV_8UC4, pixels);
              cv::Mat bgr;
              cv::cvtColor(mat, bgr, cv::COLOR_RGBA2BGR);
              AndroidBitmap_unlockPixels(env, bitmap);
              return bgr;
          }

          jobject matToBitmap(JNIEnv* env, const cv::Mat& mat) {
              jclass bitmapClass = env->FindClass("android/graphics/Bitmap");
              jmethodID createBitmap = env->GetStaticMethodID(bitmapClass, "createBitmap",
                  "(IILandroid/graphics/Bitmap$Config;)Landroid/graphics/Bitmap;");
              jclass configClass = env->FindClass("android/graphics/Bitmap$Config");
              jfieldID argb8888 = env->GetStaticFieldID(configClass, "ARGB_8888", "Landroid/graphics/Bitmap$Config;");
              jobject config = env->GetStaticObjectField(configClass, argb8888);
              jobject bitmap = env->CallStaticObjectMethod(bitmapClass, createBitmap, mat.cols, mat.rows, config);
              void* pixels;
              AndroidBitmap_lockPixels(env, bitmap, &pixels);
              cv::Mat rgba;
              cv::cvtColor(mat, rgba, cv::COLOR_BGR2RGBA);
              memcpy(pixels, rgba.data, rgba.total() * rgba.elemSize());
              AndroidBitmap_unlockPixels(env, bitmap);
              return bitmap;
          }

          cv::Mat estimateShift(const cv::Mat& ref, const cv::Mat& target) {
              // Placeholder: identity for stability. Production would use ORB + RANSAC.
              return cv::Mat::eye(3, 3, CV_64F);
          }

          extern "C" JNIEXPORT jobject JNICALL
          Java_com_example_superzoom_NativeBridge_alignAndMerge(
                  JNIEnv* env, jobject thiz, jobjectArray frames,
                  jint cropX, jint cropY, jint cropWidth, jint cropHeight) {

              int numFrames = env->GetArrayLength(frames);
              if (numFrames == 0) return nullptr;

              std::vector<cv::Mat> mats;
              for (int i = 0; i < numFrames; ++i) {
                  jobject bitmap = env->GetObjectArrayElement(frames, i);
                  cv::Mat mat = bitmapToMat(env, bitmap);
                  if (!mat.empty()) mats.push_back(mat);
                  env->DeleteLocalRef(bitmap);
              }
              if (mats.empty()) return nullptr;

              cv::Rect cropRect(cropX, cropY, cropWidth, cropHeight);
              cv::Rect validRect = cropRect & cv::Rect(0, 0, mats[0].cols, mats[0].rows);
              if (validRect.area() == 0) return nullptr;

              cv::Mat ref = mats[0](validRect).clone();
              cv::Mat accumulator = cv::Mat::zeros(ref.size(), CV_32FC3);

              for (size_t i = 0; i < mats.size(); ++i) {
                  cv::Mat warped;
                  if (i == 0) {
                      warped = ref;
                  } else {
                      cv::Mat H = estimateShift(ref, mats[i]);
                      cv::warpPerspective(mats[i], warped, H, ref.size());
                  }
                  cv::accumulate(warped, accumulator);
              }

              cv::Mat merged;
              accumulator.convertTo(merged, CV_8UC3, 1.0 / mats.size());
              return matToBitmap(env, merged);
          }

          extern "C" JNIEXPORT jobject JNICALL
          Java_com_example_superzoom_NativeBridge_runSuperResolution(
                  JNIEnv* env, jobject thiz, jobject inputBitmap) {

              cv::Mat input = bitmapToMat(env, inputBitmap);
              if (input.empty()) return nullptr;

              ncnn::Net srNet;
              srNet.opt.use_vulkan_compute = true;
              srNet.opt.use_fp16_storage = true;
              srNet.opt.use_fp16_arithmetic = true;

              int ret = srNet.load_param("realesrgan-x4.param");
              if (ret != 0) {
                  LOGE("Failed to load param");
                  return matToBitmap(env, input);
              }
              ret = srNet.load_model("realesrgan-x4.bin");
              if (ret != 0) {
                  LOGE("Failed to load bin");
                  return matToBitmap(env, input);
              }

              ncnn::Mat in = ncnn::Mat::from_pixels(input.data, ncnn::Mat::PIXEL_BGR2RGB, input.cols, input.rows);
              const float norm_vals[3] = {1 / 255.f, 1 / 255.f, 1 / 255.f};
              in.substract_mean_normalize(0, norm_vals);

              ncnn::Extractor ex = srNet.create_extractor();
              ex.input("data", in);
              ncnn::Mat out;
              ex.extract("output", out);

              cv::Mat output(out.h, out.w, CV_8UC3);
              out.to_pixels(output.data, ncnn::Mat::PIXEL_RGB2BGR);
              return matToBitmap(env, output);
          }
          EOF

      # ------------------------------------------------------------
      # 5. CMakeLists.txt
      # ------------------------------------------------------------
      - name: Create CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("superzoom")
          set(CMAKE_CXX_STANDARD 17)

          # OpenCV (installed below)
          set(OpenCV_DIR "${CMAKE_SOURCE_DIR}/opencv/sdk/native/jni")
          find_package(OpenCV REQUIRED)
          include_directories(${OpenCV_INCLUDE_DIRS})

          # NCNN (installed below)
          set(ncnn_DIR "${CMAKE_SOURCE_DIR}/ncnn/${ANDROID_ABI}/lib/cmake/ncnn")
          find_package(ncnn REQUIRED)
          include_directories(${NCNN_INCLUDE_DIRS})

          add_library(superzoom SHARED super_zoom.cpp)
          target_link_libraries(superzoom ${OpenCV_LIBS} ncnn android log)
          EOF

      # ------------------------------------------------------------
      # 6. Download prebuilt native libraries
      # ------------------------------------------------------------
      - name: Download OpenCV Android SDK
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip
          unzip -q opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip -d app/src/main/cpp
          # The SDK extracts as OpenCV-android-sdk; CMake expects 'opencv'
          if [ -d "app/src/main/cpp/OpenCV-android-sdk" ]; then
              mv app/src/main/cpp/OpenCV-android-sdk app/src/main/cpp/opencv
          fi

      - name: Download NCNN Vulkan binaries
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/${{ env.NCNN_VERSION }}/ncnn-${{ env.NCNN_VERSION }}-android-vulkan.zip
          unzip -q ncnn-${{ env.NCNN_VERSION }}-android-vulkan.zip -d app/src/main/cpp
          # The zip extracts to ncnn-YYYYMMDD-android-vulkan; rename to 'ncnn'
          NCNN_DIR=$(find app/src/main/cpp -maxdepth 1 -type d -name "ncnn-*-android-vulkan" | head -n 1)
          if [ -n "$NCNN_DIR" ]; then
              mv "$NCNN_DIR" app/src/main/cpp/ncnn
          fi

      # ------------------------------------------------------------
      # 7. Placeholder for Real-ESRGAN model
      # ------------------------------------------------------------
      - name: Create assets placeholder
        run: |
          echo "Place your Real-ESRGAN NCNN model files here (realesrgan-x4.param and .bin)." > app/src/main/assets/README.txt

      # ------------------------------------------------------------
      # 8. Build the APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperZoom-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
