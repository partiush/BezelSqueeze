        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/StabilizedZoomView.kt
        package com.example.zoomcamera

        import android.content.Context
        import android.graphics.*
        import android.util.AttributeSet
        import android.view.View

        class StabilizedZoomView @JvmOverloads constructor(
            context: Context, attrs: AttributeSet? = null
        ) : View(context, attrs) {

            private var currentFrame: Bitmap? = null
            private val paint = Paint(Paint.FILTER_BITMAP_FLAG or Paint.ANTI_ALIAS_FLAG)
            private val lockPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 5f
                color = Color.parseColor("#FFD600")
            }
            private val crosshairPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 2f
                color = Color.parseColor("#88FFFFFF")
            }

            var softwareZoomFactor: Float = 1.0f
            var normCenterX: Float = 0.5f
            var normCenterY: Float = 0.5f
            var isTargetLocked: Boolean = false
            private val srcRect = Rect()
            private val dstRect = Rect()

            fun updateFrame(
                bitmap: Bitmap,
                swZoom: Float,
                centerX: Float,
                centerY: Float,
                locked: Boolean
            ) {
                currentFrame = bitmap
                softwareZoomFactor = swZoom.coerceAtLeast(1.0f)
                normCenterX = centerX.coerceIn(0.05f, 0.95f)
                normCenterY = centerY.coerceIn(0.05f, 0.95f)
                isTargetLocked = locked
                postInvalidateOnAnimation()
            }

            fun getCurrentCropRect(bmpWidth: Int, bmpHeight: Int): Rect {
                val cropW = (bmpWidth / softwareZoomFactor).toInt().coerceAtLeast(32)
                val cropH = (bmpHeight / softwareZoomFactor).toInt().coerceAtLeast(32)
                val cx = (normCenterX * bmpWidth).toInt()
                val cy = (normCenterY * bmpHeight).toInt()
                val left = (cx - cropW / 2).coerceIn(0, (bmpWidth - cropW).coerceAtLeast(0))
                val top = (cy - cropH / 2).coerceIn(0, (bmpHeight - cropH).coerceAtLeast(0))
                return Rect(left, top, left + cropW, top + cropH)
            }

            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val bmp = currentFrame ?: return
                if (bmp.isRecycled) return

                val crop = getCurrentCropRect(bmp.width, bmp.height)
                srcRect.set(crop)
                dstRect.set(0, 0, width, height)
                canvas.drawBitmap(bmp, srcRect, dstRect, paint)

                val cx = width / 2f
                val cy = height / 2f

                if (isTargetLocked) {
                    lockPaint.color = if (softwareZoomFactor > 15f) Color.parseColor("#00E676") else Color.parseColor("#FFD600")
                    val boxRadius = 90f
                    canvas.drawRect(cx - boxRadius, cy - boxRadius, cx + boxRadius, cy + boxRadius, lockPaint)
                    canvas.drawLine(cx - boxRadius - 25f, cy, cx - boxRadius + 15f, cy, lockPaint)
                    canvas.drawLine(cx + boxRadius - 15f, cy, cx + boxRadius + 25f, cy, lockPaint)
                    canvas.drawLine(cx, cy - boxRadius - 25f, cx, cy - boxRadius + 15f, lockPaint)
                    canvas.drawLine(cx, cy + boxRadius - 15f, cx, cy + boxRadius + 25f, lockPaint)
                } else if (softwareZoomFactor >= 15f) {
                    canvas.drawCircle(cx, cy, 24f, crosshairPaint)
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/SamsungPipGuideView.kt
        package com.example.zoomcamera

        import android.content.Context
        import android.graphics.*
        import android.util.AttributeSet
        import android.view.View

        class SamsungPipGuideView @JvmOverloads constructor(
            context: Context, attrs: AttributeSet? = null
        ) : View(context, attrs) {

            private var wideBitmap: Bitmap? = null
            private val bmpPaint = Paint(Paint.FILTER_BITMAP_FLAG)
            private val boxPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 4f
                color = Color.parseColor("#FFD600")
            }
            private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 3f
                color = Color.WHITE
            }
            private val dstRect = Rect()
            private val zoomBox = RectF()

            fun updateGuide(bitmap: Bitmap, swZoom: Float, normX: Float, normY: Float, locked: Boolean) {
                wideBitmap = bitmap
                boxPaint.color = if (locked) Color.parseColor("#00E676") else Color.parseColor("#FFD600")
                val boxFraction = (1.0f / swZoom.coerceAtLeast(1.0f)).coerceIn(0.06f, 0.95f)
                val halfW = boxFraction * 0.5f
                val halfH = boxFraction * 0.5f
                val left = (normX - halfW).coerceIn(0.02f, 0.98f - boxFraction)
                val top = (normY - halfH).coerceIn(0.02f, 0.98f - boxFraction)
                zoomBox.set(left, top, left + boxFraction, top + boxFraction)
                postInvalidateOnAnimation()
            }

            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val bmp = wideBitmap ?: return
                if (bmp.isRecycled) return
                dstRect.set(0, 0, width, height)
                canvas.drawBitmap(bmp, null, dstRect, bmpPaint)

                val rectPx = RectF(
                    zoomBox.left * width,
                    zoomBox.top * height,
                    zoomBox.right * width,
                    zoomBox.bottom * height
                )
                canvas.drawRect(rectPx, boxPaint)
                canvas.drawRect(1f, 1f, width - 1f, height - 1f, borderPaint)
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/MainActivity.kt
        package com.example.zoomcamera

