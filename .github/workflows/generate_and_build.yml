        enum class AspectRatioOption(val label: String, val ratioString: String?, val cameraRatio: Int) {
            RATIO_4_3("4:3", "H,3:4", AspectRatio.RATIO_4_3),
            RATIO_16_9("16:9", "H,9:16", AspectRatio.RATIO_16_9),
            RATIO_1_1("1:1", "H,1:1", AspectRatio.RATIO_4_3),
            RATIO_FULL("FULL", null, AspectRatio.RATIO_16_9)
        }

        class MainActivity : AppCompatActivity(), SensorEventListener {

            private lateinit var rootContainer: ConstraintLayout
            private lateinit var viewportContainer: FrameLayout
            private lateinit var previewView: PreviewView
            private lateinit var overlayView: CameraOverlayView
            private lateinit var pipContainer: FrameLayout
            private lateinit var ivPipBackground: ImageView
            private lateinit var vPipReticle: View
            private lateinit var btnDismissLock: Button
            private lateinit var btnAspectRatio: Button
            private lateinit var btnMoonMode: Button
            private lateinit var btnAiMode: Button
            private lateinit var tvStatusHud: TextView
            private lateinit var tvZoomValue: TextView
            private lateinit var tvOcrBanner: TextView
            private lateinit var seekZoom: SeekBar
            private lateinit var seekExposure: SeekBar
            private lateinit var ivGallery: ImageView

            private var camera: Camera? = null
            private var imageCapture: ImageCapture? = null
            private var lensFacing = CameraSelector.LENS_FACING_BACK
            private var flashMode = ImageCapture.FLASH_MODE_OFF
            private var currentRatio = AspectRatioOption.RATIO_4_3
            private var isMoonMode = false
            private var currentAiMode = 0 // 0 = ULTRA HD (Photo), 1 = CRISP TEXT (Signage/OCR)

            private var totalZoom = 1.0f
            private var maxHardwareZoom = 8.0f
            private var softwareZoom = 1.0f

            // Target Lock & Stabilization Coordinates
            @Volatile private var isTargetLocked = false
            @Volatile private var normLockX = 0.5f
            @Volatile private var normLockY = 0.5f
            private var gyroCompX = 0f
            private var gyroCompY = 0f
            private var lastGyroTime = 0L

            private lateinit var sensorManager: SensorManager
            private var gyroSensor: Sensor? = null

            private val cameraExecutor = Executors.newSingleThreadExecutor()
            private val analysisExecutor = Executors.newSingleThreadExecutor()
            private val textRecognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }

            @Volatile private var latestAnalysisBitmap: Bitmap? = null
            @Volatile private var isNativeReady = false
            private var pipFrameTick = 0

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                rootContainer = findViewById(R.id.rootContainer)
                viewportContainer = findViewById(R.id.viewportContainer)
                previewView = findViewById(R.id.previewView)
                overlayView = findViewById(R.id.overlayView)
                pipContainer = findViewById(R.id.pipContainer)
                ivPipBackground = findViewById(R.id.ivPipBackground)
                vPipReticle = findViewById(R.id.vPipReticle)
                btnDismissLock = findViewById(R.id.btnDismissLock)
                btnAspectRatio = findViewById(R.id.btnAspectRatio)
                btnMoonMode = findViewById(R.id.btnMoonMode)
                btnAiMode = findViewById(R.id.btnAiMode)
                tvStatusHud = findViewById(R.id.tvStatusHud)
                tvZoomValue = findViewById(R.id.tvZoomValue)
                tvOcrBanner = findViewById(R.id.tvOcrBanner)
                seekZoom = findViewById(R.id.seekZoom)
                seekExposure = findViewById(R.id.seekExposure)
                ivGallery = findViewById(R.id.ivGallery)

                // Use COMPATIBLE (TextureView) so GPU matrix scaling & AGSL shaders work smoothly at 60 FPS
                previewView.implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                previewView.scaleType = PreviewView.ScaleType.FIT_CENTER

                sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE)

                setupUIControls()
                setupTouchHandlers()

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                } else {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                }

                // Lazily load native libraries & extract AI models in background AFTER UI is already running
                initializeNativeAndAiAsync()
            }

            private fun initializeNativeAndAiAsync() {
                lifecycleScope.launch(Dispatchers.IO) {
                    try {
                        try { System.loadLibrary("opencv_java4") } catch (_: Throwable) {}
                        System.loadLibrary("zoomcamera")

                        val modelDir = File(filesDir, "models").apply { mkdirs() }
                        val filesToExtract = listOf(
                            "realesrgan-x4plus.param",
                            "realesrgan-x4plus.bin",
                            "realesrgan-x4plus-anime.param",
                            "realesrgan-x4plus-anime.bin"
                        )
                        for (name in filesToExtract) {
                            val outFile = File(modelDir, name)
                            if (!outFile.exists() || outFile.length() == 0L) {
                                assets.open("models/$name").use { input ->
                                    FileOutputStream(outFile).use { output ->
                                        input.copyTo(output)
                                    }
                                }
                            }
                        }

                        val ok = nativeInitEngine(modelDir.absolutePath)
                        isNativeReady = true
                        withContext(Dispatchers.Main) {
                            tvStatusHud.text = if (ok) {
                                "AI NEURAL ENGINE READY | 200x Multi-Frame + GPU CAS"
                            } else {
                                "OPTICAL DRIZZLE READY | 200x Multi-Frame Active"
                            }
                        }
                    } catch (t: Throwable) {
                        Log.e("ZoomCamera", "Native init fallback", t)
                        withContext(Dispatchers.Main) {
                            tvStatusHud.text = "200x GPU ENGINE READY (Safe Mode)"
                        }
                    }
                }
            }

            override fun onResume() {
                super.onResume()
                gyroSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
            }

            override fun onPause() {
                super.onPause()
                sensorManager.unregisterListener(this)
            }

            private fun setupUIControls() {
                btnAspectRatio.setOnClickListener {
                    currentRatio = when (currentRatio) {
                        AspectRatioOption.RATIO_4_3 -> AspectRatioOption.RATIO_16_9
                        AspectRatioOption.RATIO_16_9 -> AspectRatioOption.RATIO_1_1
                        AspectRatioOption.RATIO_1_1 -> AspectRatioOption.RATIO_FULL
                        AspectRatioOption.RATIO_FULL -> AspectRatioOption.RATIO_4_3
                    }
                    btnAspectRatio.text = currentRatio.label
                    applyAspectRatioLayout()
                }

                btnMoonMode.setOnClickListener {
                    isMoonMode = !isMoonMode
                    btnMoonMode.text = if (isMoonMode) "🌕 MOON: ON" else "🌕 MOON: OFF"
                    btnMoonMode.setTextColor(if (isMoonMode) Color.parseColor("#00E676") else Color.parseColor("#FFD600"))
                    applyMoonExposureAndShader()
                    updateViewportZoom()
                    Toast.makeText(
                        this,
                        if (isMoonMode) "Moon Astrophotography Mode: -4.0 EV & Lunar Wavelet Engine" else "Universal Camera Mode",
                        Toast.LENGTH_SHORT
                    ).show()
                }

                btnAiMode.setOnClickListener {
                    currentAiMode = (currentAiMode + 1) % 2
                    if (currentAiMode == 0) {
                        btnAiMode.text = "AI: ULTRA HD"
                        btnAiMode.setTextColor(Color.parseColor("#00E676"))
                    } else {
                        btnAiMode.text = "AI: CRISP TEXT"
                        btnAiMode.setTextColor(Color.parseColor("#00B0FF"))
                    }
                }

                btnDismissLock.setOnClickListener { clearTargetLock() }

                val presets = mapOf(
                    R.id.btnZ1 to 1.0f, R.id.btnZ5 to 5.0f, R.id.btnZ15 to 15.0f,
                    R.id.btnZ50 to 50.0f, R.id.btnZ100 to 100.0f, R.id.btnZ200 to 200.0f
                )
                presets.forEach { (id, z) ->
                    findViewById<Button>(id).setOnClickListener { setZoomLevel(z, updateSeek = true) }
                }

                seekZoom.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                        if (fromUser) setZoomLevel(1.0f + (progress / 10.0f), updateSeek = false)
                    }
                    override fun onStartTrackingTouch(sb: SeekBar?) {}
                    override fun onStopTrackingTouch(sb: SeekBar?) {}
                })

                seekExposure.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                        if (!fromUser) return
                        val state = camera?.cameraInfo?.exposureState ?: return
                        if (!state.isExposureCompensationSupported) return
                        val range = state.exposureCompensationRange
                        val idx = (range.lower + ((progress / 100f) * (range.upper - range.lower))).toInt()
                        camera?.cameraControl?.setExposureCompensationIndex(idx)
                    }
                    override fun onStartTrackingTouch(sb: SeekBar?) {}
                    override fun onStopTrackingTouch(sb: SeekBar?) {}
                })

                findViewById<Button>(R.id.btnFlash).setOnClickListener { view ->
                    val b = view as Button
                    flashMode = if (flashMode == ImageCapture.FLASH_MODE_OFF) {
                        camera?.cameraControl?.enableTorch(true)
                        b.text = "⚡ ON"
                        ImageCapture.FLASH_MODE_ON
                    } else {
                        camera?.cameraControl?.enableTorch(false)
                        b.text = "⚡ OFF"
                        ImageCapture.FLASH_MODE_OFF
                    }
                }

                findViewById<Button>(R.id.btnFlip).setOnClickListener {
                    lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                        CameraSelector.LENS_FACING_FRONT
                    } else {
                        CameraSelector.LENS_FACING_BACK
                    }
                    startCamera()
                }

                findViewById<Button>(R.id.btnShutter).setOnClickListener {
                    captureSuperResPhoto()
                }
            }

            private fun applyAspectRatioLayout() {
                val set = ConstraintSet()
                set.clone(rootContainer)
                if (currentRatio.ratioString != null) {
                    set.setDimensionRatio(R.id.viewportContainer, currentRatio.ratioString)
                } else {
                    set.setDimensionRatio(R.id.viewportContainer, null)
                }
                set.applyTo(rootContainer)
                rootContainer.post { updateViewportZoom() }
            }

            private fun setupTouchHandlers() {
                val scaleGesture = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    override fun onScale(detector: ScaleGestureDetector): Boolean {
                        setZoomLevel(totalZoom * detector.scaleFactor, updateSeek = true)
                        return true
                    }
                })

                val gesture = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        if (isTargetLocked) {
                            clearTargetLock()
                            return true
                        }
                        val factory = previewView.meteringPointFactory
                        val pt = factory.createPoint(e.x, e.y)
                        camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(pt).build())
                        return true
                    }

                    override fun onLongPress(e: MotionEvent) {
                        val normX = (e.x / previewView.width.toFloat().coerceAtLeast(1f)).coerceIn(0.1f, 0.9f)
                        val normY = (e.y / previewView.height.toFloat().coerceAtLeast(1f)).coerceIn(0.1f, 0.9f)

                        normLockX = normX
                        normLockY = normY
                        gyroCompX = 0f
                        gyroCompY = 0f
                        isTargetLocked = true

                        if (isNativeReady) {
                            latestAnalysisBitmap?.let { bmp ->
                                try { nativeLockTarget(bmp, normX, normY) } catch (_: Throwable) {}
                            }
                        }

                        btnDismissLock.visibility = View.VISIBLE
                        tvStatusHud.text = "OBJECT LOCKED @ ${String.format("%.1fx", totalZoom)} | Tap anywhere to unlock"
                        updateViewportZoom()
                        Toast.makeText(this@MainActivity, "Target Locked! Optical + Gyro Tracking Active", Toast.LENGTH_SHORT).show()
                    }
                })

                overlayView.setOnTouchListener { _, event ->
                    scaleGesture.onTouchEvent(event)
                    gesture.onTouchEvent(event)
                    true
                }
            }

            private fun clearTargetLock() {
                isTargetLocked = false
                normLockX = 0.5f
                normLockY = 0.5f
                gyroCompX = 0f
                gyroCompY = 0f
                if (isNativeReady) {
                    try { nativeUnlockTarget() } catch (_: Throwable) {}
                }
                btnDismissLock.visibility = View.GONE
                tvStatusHud.text = "LIVE GPU SHARPENING ACTIVE | Long-press to Lock"
                updateViewportZoom()
            }

            private fun setZoomLevel(zoom: Float, updateSeek: Boolean) {
                totalZoom = zoom.coerceIn(1.0f, 200.0f)
                val hwZoom = min(totalZoom, maxHardwareZoom)
                camera?.cameraControl?.setZoomRatio(hwZoom)
                softwareZoom = (totalZoom / hwZoom).coerceAtLeast(1.0f)

                tvZoomValue.text = String.format("%.1fx", totalZoom)
                if (updateSeek) seekZoom.progress = ((totalZoom - 1.0f) * 10f).toInt()

                pipContainer.visibility = if (totalZoom >= 15.0f) View.VISIBLE else View.GONE
                applyMoonExposureAndShader()
                updateViewportZoom()
            }

            private fun applyMoonExposureAndShader() {
                val state = camera?.cameraInfo?.exposureState
                if (state != null && state.isExposureCompensationSupported) {
                    if (isMoonMode) {
                        val minExp = state.exposureCompensationRange.lower
                        camera?.cameraControl?.setExposureCompensationIndex((minExp * 0.85f).toInt())
                        seekExposure.progress = 10
                    }
                }

                // Apply Real-Time GPU Contrast Adaptive Sharpening (CAS) shader on Android 13+ (API 33+)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    try {
                        if (totalZoom > 4.0f || isMoonMode) {
                            val sharpStrength = ((totalZoom - 1f) / 199f).coerceIn(0.25f, 1.0f)
                            val moonFlag = if (isMoonMode) 1.0f else 0.0f
                            val agsl = """
                                uniform shader inputShader;
                                uniform float2 resolution;
                                uniform float sharpness;
                                uniform float moonMode;
                                half4 main(float2 coord) {
                                    float2 px = float2(1.0 / max(resolution.x, 1.0), 1.0 / max(resolution.y, 1.0));
                                    half4 c = inputShader.eval(coord);
                                    half4 n = inputShader.eval(coord + float2(0.0, -px.y));
                                    half4 s = inputShader.eval(coord + float2(0.0, px.y));
                                    half4 e = inputShader.eval(coord + float2(px.x, 0.0));
                                    half4 w = inputShader.eval(coord + float2(-px.x, 0.0));
                                    half4 avg = (n + s + e + w) * 0.25;
                                    half4 res = c + (c - avg) * (1.2 + sharpness * 1.8);
                                    if (moonMode > 0.5) {
                                        half lum = dot(res.rgb, half3(0.299, 0.587, 0.114));
                                        half crater = clamp((lum - 0.12) * 1.45, 0.0, 1.0);
                                        res.rgb = half3(crater, crater * 0.98, crater * 0.94);
                                    }
                                    return clamp(res, 0.0, 1.0);
                                }
                            """.trimIndent()
                            val shader = RuntimeShader(agsl)
                            shader.setFloatUniform("resolution", previewView.width.toFloat().coerceAtLeast(1080f), previewView.height.toFloat().coerceAtLeast(1440f))
                            shader.setFloatUniform("sharpness", sharpStrength)
                            shader.setFloatUniform("moonMode", moonFlag)
                            previewView.setRenderEffect(RenderEffect.createRuntimeShaderEffect(shader, "inputShader"))
                        } else {
                            previewView.setRenderEffect(null)
                        }
                    } catch (_: Throwable) {}
                }
            }

            private fun updateViewportZoom() {
                val viewW = previewView.width.toFloat()
                val viewH = previewView.height.toFloat()
                if (viewW <= 0 || viewH <= 0) return

                val activeX = (normLockX + gyroCompX).coerceIn(0.06f, 0.94f)
                val activeY = (normLockY + gyroCompY).coerceIn(0.06f, 0.94f)

                // Uniform X & Y scale + translation centered inside clipped viewportContainer (Zero stretch!)
                previewView.pivotX = viewW / 2f
                previewView.pivotY = viewH / 2f
                previewView.scaleX = softwareZoom
                previewView.scaleY = softwareZoom

                val maxPanX = (viewW * (softwareZoom - 1f)) / 2f
                val maxPanY = (viewH * (softwareZoom - 1f)) / 2f
                previewView.translationX = ((0.5f - activeX) * viewW * softwareZoom).coerceIn(-maxPanX, maxPanX)
                previewView.translationY = ((0.5f - activeY) * viewH * softwareZoom).coerceIn(-maxPanY, maxPanY)

                overlayView.updateOverlay(isTargetLocked, activeX, activeY, isMoonMode, totalZoom >= 15f)

                if (totalZoom >= 15f) {
                    val pipW = pipContainer.width.toFloat().coerceAtLeast(100f)
                    val pipH = pipContainer.height.toFloat().coerceAtLeast(133f)
                    val boxFrac = (1.0f / softwareZoom).coerceIn(0.10f, 0.85f)
                    val boxW = (pipW * boxFrac).toInt().coerceAtLeast(16)
                    val boxH = (pipH * boxFrac).toInt().coerceAtLeast(16)

                    val lp = vPipReticle.layoutParams as FrameLayout.LayoutParams
                    lp.width = boxW
                    lp.height = boxH
                    vPipReticle.layoutParams = lp
                    vPipReticle.translationX = (activeX * (pipW - boxW))
                    vPipReticle.translationY = (activeY * (pipH - boxH))
                }
            }

            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    try {
                        val provider = cameraProviderFuture.get()
                        provider.unbindAll()

                        val preview = Preview.Builder()
                            .setTargetAspectRatio(currentRatio.cameraRatio)
                            .build()
                            .also { it.setSurfaceProvider(previewView.surfaceProvider) }

                        imageCapture = ImageCapture.Builder()
                            .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                            .setTargetAspectRatio(currentRatio.cameraRatio)
                            .build()

                        val analysis = ImageAnalysis.Builder()
                            .setTargetResolution(Size(640, 480))
                            .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                            .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                            .build()

                        analysis.setAnalyzer(analysisExecutor) { proxy ->
                            processBackgroundStream(proxy)
                        }

                        val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()

                        // Safely bind Preview + ImageCapture + Analysis, with automatic 2-stream fallback
                        camera = try {
                            provider.bindToLifecycle(this, selector, preview, imageCapture, analysis)
                        } catch (_: Exception) {
                            provider.bindToLifecycle(this, selector, preview, imageCapture)
                        }

                        maxHardwareZoom = (camera?.cameraInfo?.zoomState?.value?.maxZoomRatio ?: 8.0f).coerceAtLeast(1.0f)
                        setZoomLevel(totalZoom, updateSeek = true)
                    } catch (e: Exception) {
                        Log.e("ZoomCamera", "Camera start error", e)
                    }
                }, ContextCompat.getMainExecutor(this))
            }

            private fun processBackgroundStream(proxy: ImageProxy) {
                try {
                    val bmp = proxy.toBitmap()
                    val rot = proxy.imageInfo.rotationDegrees
                    val rotated = if (rot != 0) {
                        val m = Matrix().apply { postRotate(rot.toFloat()) }
                        Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, false)
                    } else {
                        bmp
                    }
                    latestAnalysisBitmap = rotated

                    if (isNativeReady) {
                        if (isTargetLocked) {
                            val tracked = nativeUpdateTarget(rotated)
                            if (tracked != null && tracked.size == 2) {
                                normLockX = tracked[0]
                                normLockY = tracked[1]
                                runOnUiThread { updateViewportZoom() }
                            }
                        }
                        if (totalZoom >= 2.0f) {
                            nativePushBurstFrame(rotated)
                        }
                    }

                    if (totalZoom >= 15.0f && (++pipFrameTick % 3 == 0)) {
                        runOnUiThread { ivPipBackground.setImageBitmap(rotated) }
                    }
                } catch (_: Throwable) {
                } finally {
                    proxy.close()
                }
            }

            override fun onSensorChanged(event: SensorEvent?) {
                if (event?.sensor?.type != Sensor.TYPE_GYROSCOPE) return
                if (lastGyroTime != 0L && totalZoom >= 4.0f && !isTargetLocked) {
                    val dt = (event.timestamp - lastGyroTime) * 1e-9f
                    val damp = 0.035f / softwareZoom.coerceAtLeast(1f)
                    gyroCompX = (gyroCompX - event.values[1] * dt * damp).coerceIn(-0.14f, 0.14f)
                    gyroCompY = (gyroCompY + event.values[0] * dt * damp).coerceIn(-0.14f, 0.14f)
                    gyroCompX *= 0.95f
                    gyroCompY *= 0.95f
                    runOnUiThread { updateViewportZoom() }
                }
                lastGyroTime = event.timestamp
            }

            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

            private fun captureSuperResPhoto() {
                val cap = imageCapture ?: return
                tvOcrBanner.visibility = View.GONE
                Toast.makeText(
                    this,
                    if (isMoonMode) "Capturing Lunar Wavelet Super-Resolution..." else "Capturing Full-Sensor Multi-Frame AI Shot...",
                    Toast.LENGTH_SHORT
                ).show()

                cap.takePicture(cameraExecutor, object : ImageCapture.OnImageCapturedCallback() {
                    override fun onCaptureSuccess(imageProxy: ImageProxy) {
                        val sensorBmp = decodeImageProxy(imageProxy)
                        imageProxy.close()
                        if (sensorBmp == null) return

                        val activeX = (normLockX + gyroCompX).coerceIn(0.06f, 0.94f)
                        val activeY = (normLockY + gyroCompY).coerceIn(0.06f, 0.94f)

                        val baseCropW = (sensorBmp.width / softwareZoom).toInt().coerceAtLeast(48)
                        val baseCropH = when (currentRatio) {
                            AspectRatioOption.RATIO_1_1 -> baseCropW
                            AspectRatioOption.RATIO_16_9 -> (baseCropW * 16) / 9
                            AspectRatioOption.RATIO_4_3 -> (baseCropW * 4) / 3
                            AspectRatioOption.RATIO_FULL -> (baseCropW * viewportContainer.height) / viewportContainer.width.coerceAtLeast(1)
                        }.coerceIn(48, sensorBmp.height)

                        val cropW = baseCropW.coerceAtMost(sensorBmp.width)
                        val cropH = baseCropH.coerceAtMost(sensorBmp.height)
                        val left = ((activeX * sensorBmp.width) - cropW / 2).toInt().coerceIn(0, sensorBmp.width - cropW)
                        val top = ((activeY * sensorBmp.height) - cropH / 2).toInt().coerceIn(0, sensorBmp.height - cropH)

                        val outW = 1440
                        val outH = ((1440L * cropH) / cropW).toInt().coerceIn(640, 2560)
                        val outBitmap = Bitmap.createBitmap(outW, outH, Bitmap.Config.ARGB_8888)

                        lifecycleScope.launch(Dispatchers.Default) {
                            var fusedCount = 1
                            if (isNativeReady) {
                                try {
                                    fusedCount = nativeRemasterShot(
                                        sensorBmp, left, top, cropW, cropH, outBitmap, isMoonMode, currentAiMode
                                    )
                                } catch (e: Throwable) {
                                    Log.e("ZoomCamera", "Native remaster fallback", e)
                                    fallbackCropToBitmap(sensorBmp, left, top, cropW, cropH, outBitmap)
                                }
                            } else {
                                fallbackCropToBitmap(sensorBmp, left, top, cropW, cropH, outBitmap)
                            }

                            var ocrText = ""
                            if (!isMoonMode) {
                                try {
                                    val visionImg = InputImage.fromBitmap(outBitmap, 0)
                                    val res = textRecognizer.process(visionImg).await()
                                    if (res.text.isNotBlank()) {
                                        ocrText = res.text.trim()
                                        val boxes = res.textBlocks.mapNotNull { it.boundingBox }
                                        val flat = IntArray(boxes.size * 4)
                                        boxes.forEachIndexed { idx, r ->
                                            flat[idx * 4] = r.left
                                            flat[idx * 4 + 1] = r.top
                                            flat[idx * 4 + 2] = r.width()
                                            flat[idx * 4 + 3] = r.height()
                                        }
                                        if (flat.isNotEmpty() && isNativeReady) {
                                            nativeSharpenTextStrokes(outBitmap, flat)
                                        }
                                    }
                                } catch (_: Throwable) {}
                            }

                            saveBitmapToGallery(outBitmap)

                            withContext(Dispatchers.Main) {
                                ivGallery.setImageBitmap(outBitmap)
                                tvStatusHud.text = "SAVED ${outW}x${outH} ($fusedCount frames fused)"
                                if (ocrText.isNotEmpty()) {
                                    tvOcrBanner.text = "AI READABLE TEXT:\n$ocrText"
                                    tvOcrBanner.visibility = View.VISIBLE
                                }
                                Toast.makeText(this@MainActivity, "Saved AI Remastered Photo!", Toast.LENGTH_SHORT).show()
                            }
                        }
                    }

                    override fun onError(exception: ImageCaptureException) {
                        runOnUiThread {
                            Toast.makeText(this@MainActivity, "Capture error: ${exception.message}", Toast.LENGTH_SHORT).show()
                        }
                    }
                })
            }

            private fun fallbackCropToBitmap(src: Bitmap, x: Int, y: Int, w: Int, h: Int, dst: Bitmap) {
                val cropped = Bitmap.createBitmap(src, x, y, w, h)
                val scaled = Bitmap.createScaledBitmap(cropped, dst.width, dst.height, true)
                Canvas(dst).drawBitmap(scaled, 0f, 0f, null)
            }

            private fun decodeImageProxy(image: ImageProxy): Bitmap? {
                return try {
                    val buffer: ByteBuffer = image.planes[0].buffer
                    val bytes = ByteArray(buffer.remaining())
                    buffer.get(bytes)
                    val raw = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return null
                    val rot = image.imageInfo.rotationDegrees
                    if (rot != 0) {
                        val m = Matrix().apply { postRotate(rot.toFloat()) }
                        Bitmap.createBitmap(raw, 0, 0, raw.width, raw.height, m, true)
                    } else {
                        raw
                    }
                } catch (_: Throwable) {
                    null
                }
            }

            private fun saveBitmapToGallery(bitmap: Bitmap) {
                val filename = "UltraZoom200x_${System.currentTimeMillis()}.jpg"
                val values = ContentValues().apply {
                    put(MediaStore.Images.Media.DISPLAY_NAME, filename)
                    put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/UltraZoom200x")
                    }
                }
                val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values) ?: return
                contentResolver.openOutputStream(uri)?.use { out: OutputStream ->
                    bitmap.compress(Bitmap.CompressFormat.JPEG, 99, out)
                }
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                }
            }

            external fun nativeInitEngine(modelDirPath: String): Boolean
            external fun nativeLockTarget(frame: Bitmap, normX: Float, normY: Float)
            external fun nativeUpdateTarget(frame: Bitmap): FloatArray?
            external fun nativeUnlockTarget()
            external fun nativePushBurstFrame(frame: Bitmap)
            external fun nativeRemasterShot(
                sensorBmp: Bitmap, x: Int, y: Int, w: Int, h: Int, outBmp: Bitmap, moonMode: Boolean, aiMode: Int
            ): Int
            external fun nativeSharpenTextStrokes(bmp: Bitmap, flatBoxes: IntArray)
        }
        EOF

