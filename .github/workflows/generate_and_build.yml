          package com.edge.bezelmorph.engine
          import android.app.*
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.*
          import android.widget.ImageView
          import com.edge.bezelmorph.data.ConfigStore
          import com.edge.bezelmorph.ui.MainActivity
          import dagger.hilt.android.AndroidEntryPoint
          import kotlinx.coroutines.*
          import javax.inject.Inject

          @AndroidEntryPoint
          class FloatingBubbleService : Service() {
              @Inject lateinit var store: ConfigStore
              private var wm: WindowManager? = null
              private var bubble: ImageView? = null
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              override fun onCreate() {
                  super.onCreate()
                  val ch = NotificationChannel("bubble", "Bubble", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  startForeground(2, Notification.Builder(this, "bubble")
                      .setContentTitle("Bezel Morph Bubble").setSmallIcon(android.R.drawable.ic_menu_compass).build())
              }

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  scope.launch {
                      val c = store.load()
                      if (!c.bubbleEnabled) { stopSelf(); return@launch }
                      if (bubble == null) {
                          wm = getSystemService(WINDOW_SERVICE) as WindowManager
                          val p = WindowManager.LayoutParams(80, 80,
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                              PixelFormat.TRANSLUCENT).apply { x = c.bubbleX; y = c.bubbleY; gravity = Gravity.TOP or Gravity.START }
                          bubble = ImageView(this@FloatingBubbleService).apply {
                              setImageResource(android.R.drawable.ic_menu_compass)
                              setBackgroundColor(0x8838BDF8.toInt())
                              setOnClickListener { sendBroadcast(Intent("com.edge.bezelmorph.TRIGGER")) }
                          }
                          wm?.addView(bubble, p)
                      }
                  }
                  return START_STICKY
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { super.onDestroy(); scope.cancel(); try { bubble?.let { wm?.removeView(it) } } catch (_: Exception) {} }
          }
          EOF

