        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/CameraOverlayView.kt
        package com.example.zoomcamera

        import android.content.Context
        import android.graphics.*
        import android.util.AttributeSet
        import android.view.View

        class CameraOverlayView @JvmOverloads constructor(
            context: Context,
            attrs: AttributeSet? = null,
            defStyleAttr: Int = 0
        ) : View(context, attrs, defStyleAttr) {

            var isLocked = false
            var screenNormX = 0.5f
            var screenNormY = 0.5f
            var isMoonMode = false
            var highZoom = false

            private val targetPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 4f
                color = Color.parseColor("#00E676")
            }

            private val moonPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 3f
                color = Color.parseColor("#FFD600")
            }

            private val reticlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = 2f
                color = Color.parseColor("#66FFFFFF")
            }

            fun updateOverlay(locked: Boolean, x: Float, y: Float, moon: Boolean, zoomHigh: Boolean) {
                isLocked = locked
                screenNormX = x
                screenNormY = y
                isMoonMode = moon
                highZoom = zoomHigh
                postInvalidateOnAnimation()
            }

            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val cx = width / 2f
                val cy = height / 2f

                if (isLocked) {
                    val s = 68f
                    canvas.drawRect(cx - s, cy - s, cx + s, cy + s, targetPaint)
                    canvas.drawLine(cx - s - 16f, cy, cx - s + 10f, cy, targetPaint)
                    canvas.drawLine(cx + s - 10f, cy, cx + s + 16f, cy, targetPaint)
                    canvas.drawLine(cx, cy - s - 16f, cx, cy - s + 10f, targetPaint)
                    canvas.drawLine(cx, cy + s - 10f, cy, cy + s + 16f, targetPaint)
                } else if (isMoonMode) {
                    canvas.drawCircle(cx, cy, 95f, moonPaint)
                    canvas.drawCircle(cx, cy, 8f, moonPaint)
                } else if (highZoom) {
                    canvas.drawCircle(cx, cy, 24f, reticlePaint)
                }
            }
        }
        EOF

