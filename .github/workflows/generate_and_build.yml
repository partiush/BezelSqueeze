          # 12. Hilt Module
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/di/AppModule.kt
          package com.edge.bezelmorph.di
          import android.content.Context
          import androidx.room.Room
          import com.edge.bezelmorph.data.AppDatabase
          import com.edge.bezelmorph.data.ConfigStore
          import com.edge.bezelmorph.engine.HapticEngine
          import dagger.Module
          import dagger.Provides
          import dagger.hilt.InstallIn
          import dagger.hilt.android.qualifiers.ApplicationContext
          import dagger.hilt.components.SingletonComponent
          import javax.inject.Singleton

          @Module
          @InstallIn(SingletonComponent::class)
          object AppModule {
              @Provides @Singleton
              fun provideDatabase(@ApplicationContext ctx: Context): AppDatabase =
                  Room.databaseBuilder(ctx, AppDatabase::class.java, "bezel_morph.db")
                      .fallbackToDestructiveMigration().build()

              @Provides @Singleton
              fun provideConfigStore(@ApplicationContext ctx: Context) = ConfigStore(ctx)
              @Provides @Singleton
              fun provideHapticEngine(@ApplicationContext ctx: Context) = HapticEngine(ctx)
          }
          EOF

          # 13. Room entities
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/data/AppDatabase.kt
          package com.edge.bezelmorph.data
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Entity(tableName = "profiles")
          data class ProfileEntity(
              @PrimaryKey val name: String,
              val configJson: String
          )

          @Dao
          interface ProfileDao {
              @Query("SELECT * FROM profiles ORDER BY name") fun getAll(): Flow<List<ProfileEntity>>
              @Query("SELECT * FROM profiles WHERE name = :name") suspend fun get(name: String): ProfileEntity?
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insert(p: ProfileEntity)
              @Delete suspend fun delete(p: ProfileEntity)
          }

          @Database(entities = [ProfileEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun profileDao(): ProfileDao
          }
          EOF

          # 14. ConfigStore (DataStore + Gson)
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/data/ConfigStore.kt
          package com.edge.bezelmorph.data
          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import com.edge.bezelmorph.core.MorphConfig
          import com.edge.bezelmorph.core.fromJson
          import com.edge.bezelmorph.core.toJson
          import com.google.gson.Gson
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map

          private val Context.dataStore by preferencesDataStore(name = "bezel_morph_pref")
          private val CONFIG_KEY = stringPreferencesKey("config_json")
          private val gson = Gson()

          class ConfigStore(private val context: Context) {
              suspend fun load(): MorphConfig =
                  context.dataStore.data.map { prefs ->
                      prefs[CONFIG_KEY]?.let { json ->
                          try { fromJson(gson.fromJson(json, Map::class.java) as Map<String, Any>) }
                          catch (_: Exception) { MorphConfig() }
                      } ?: MorphConfig()
                  }.first()

              suspend fun save(config: MorphConfig) {
                  context.dataStore.edit { prefs ->
                      prefs[CONFIG_KEY] = gson.toJson(config)
                  }
              }
          }
          EOF

          # 15. MorphConfig (full schema)
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/core/MorphConfig.kt
          package com.edge.bezelmorph.core
          import android.graphics.Color
          import org.json.JSONObject

          data class MorphConfig(
              var edge: Edge = Edge.RIGHT,
              var centerYRatio: Float = 0.228f,
              var y0Dp: Float = 28f,
              var wDp: Float = 38f,
              var depthDp: Float = 16f,
              var shapeProfile: ShapeProfile = ShapeProfile.QUINTIC_SMOOTHERSTEP,
              var omegaN: Float = 68f,
              var zeta: Float = 0.88f,
              var inwardVelocity: Float = 2400f,
              var pressDurationMs: Int = 0,
              var overshootPct: Float = 0f,
              var fillMode: FillMode = FillMode.SOLID,
              var fillColor: Int = Color.BLACK,
              var fillColor2: Int = Color.BLACK,
              var glassEnabled: Boolean = false,
              var innerShadow: Boolean = true,
              var rimLight: Boolean = true,
              var outerGlow: Boolean = false,
              var shaderPreset: ShaderPreset = ShaderPreset.NONE,
              var hapticEnabled: Boolean = true,
              var hapticIntensity: Float = 1f,
              var pressEffect: Int = 0,
              var releaseEffect: Int = 1,
              var customWaveformTimings: LongArray = longArrayOf(),
              var customWaveformAmps: IntArray = intArrayOf(),
              var clickSoundEnabled: Boolean = false,
              var suppressVolumeUi: Boolean = false,
              var rateLimitPerMinute: Int = 60,
              var onlyWhenScreenOn: Boolean = true,
              var onlyWhenUnlocked: Boolean = false,
