name: Build 100x Zoom Camera APK (Self-Healing)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-35 build-tools;35.0.0'

    - name: Install Unzip, Stop Gradle Daemons & Setup NDK/CMake
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq unzip

        # Stop any background Gradle daemons that might have cached a missing environment
        ./gradlew --stop || true

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]] || true

        # Install NDK/CMake with retry
        MAX_ATTEMPTS=3
        for i in $(seq 1 $MAX_ATTEMPTS); do
          rm -rf "$ANDROID_HOME/ndk/27.2.12479018" "$ANDROID_HOME/cmake/3.22.1"
          if $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null 2>&1; then
            break
          fi
          [ "$i" -eq "$MAX_ATTEMPTS" ] && exit 1
          sleep 5
        done

        # Ensure exact paths are exported to Gradle environment
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmake/3.22.1/bin:$PATH" >> $GITHUB_ENV

    - name: Download Native Libraries & AI Models
      run: |
        set -euo pipefail
        download_model() {
          local filename=$1; shift; local urls=("$@")
          for url in "${urls[@]}"; do
            if wget -q --timeout=60 --tries=2 -O "app/src/main/assets/models/$filename" "$url" && [ -s "app/src/main/assets/models/$filename" ]; then return 0; fi
          done
          return 1
        }

        wget -q --timeout=300 -O /tmp/opencv.zip "https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-android-sdk.zip"
        unzip -q /tmp/opencv.zip -d /tmp/
        wget -q --timeout=300 -O /tmp/ncnn.zip "https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip"
        unzip -q /tmp/ncnn.zip -d /tmp/
        
        mkdir -p app/src/main/assets/models
        download_model "realesrgan-x4plus.param" \
          "https://raw.githubusercontent.com/nihui/realsr-ncnn-vulkan/master/models/models-DF2K_JPEG/realesrgan-x4plus.param" \
          "https://raw.githubusercontent.com/genie-design/ESRGAN-ncnn-models/main/realesrgan-x4plus/realesrgan-x4plus.param"
        download_model "realesrgan-x4plus.bin" \
          "https://raw.githubusercontent.com/nihui/realsr-ncnn-vulkan/master/models/models-DF2K_JPEG/realesrgan-x4plus.bin" \
          "https://raw.githubusercontent.com/genie-design/ESRGAN-ncnn-models/main/realesrgan-x4plus/realesrgan-x4plus.bin"

    - name: Generate Complete Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/zoomcamera app/src/main/cpp app/src/main/res/layout app/src/main/res/values
        cp -r /tmp/OpenCV-android-sdk app/src/main/cpp/opencv
        cp -r /tmp/ncnn-20260526-android-vulkan app/src/main/cpp/ncnn

        # --- THIS IS THE CRITICAL FIX ---
        # Patch ncnn.cmake to remove the flags that are overriding our RTTI settings
        echo "Patching NCNN configuration to remove -fno-rtti and -fno-exceptions..."
        find app/src/main/cpp/ncnn -name "ncnn.cmake" -exec sed -i 's/INTERFACE_COMPILE_OPTIONS "-fno-rtti;-fno-exceptions"//g' {} \;
        # ---------------------------------

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "ZoomCamera100x"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.7.3' apply false; id 'org.jetbrains.kotlin.android' version '2.0.21' apply false }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.example.zoomcamera'
            compileSdk 35
            defaultConfig {
                applicationId "com.example.zoomcamera"
                minSdk 26; targetSdk 35; versionCode 1; versionName "1.0"
                ndk { abiFilters 'arm64-v8a' }
                externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++17 -frtti -fexceptions"
                        arguments "-DANDROID_CPP_FEATURES=rtti exceptions"
                    }
                }
            }
            buildTypes { release { minifyEnabled false } }
            externalNativeBuild {
                cmake {
                    path "src/main/cpp/CMakeLists.txt"
                    version "3.22.1"
                }
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            def camerax_version = "1.4.0"
            implementation "androidx.camera:camera-core:${camerax_version}"
            implementation "androidx.camera:camera-camera2:${camerax_version}"
            implementation "androidx.camera:camera-lifecycle:${camerax_version}"
            implementation "androidx.camera:camera-view:${camerax_version}"
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.camera" android:required="true" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application android:allowBackup="true" android:label="100x Zoom" android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                    <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent">
            <androidx.camera.view.PreviewView android:id="@+id/viewFinder" android:layout_width="match_parent" android:layout_height="match_parent" />
            <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="vertical" app:layout_constraintBottom_toBottomOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent" android:layout_marginBottom="32dp">
                <Button android:id="@+id/btnLock" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Lock Target (Moon)" />
                <Button android:id="@+id/btnStabilize" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Toggle Stabilization" />
                <Button android:id="@+id/btnCapture" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Capture 100x" />
            </LinearLayout>
        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/zoomcamera/MainActivity.kt
        package com.example.zoomcamera
        import android.Manifest; import android.content.pm.PackageManager; import android.os.Bundle; import android.widget.Button; import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity; import androidx.camera.core.*; import androidx.camera.lifecycle.ProcessCameraProvider; import androidx.camera.view.PreviewView; import androidx.core.app.ActivityCompat; import androidx.core.content.ContextCompat
        class MainActivity : AppCompatActivity() {
            private lateinit var viewFinder: PreviewView; private var camera: Camera? = null; private var isStabilized = false
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); viewFinder = findViewById(R.id.viewFinder)
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) { startCamera() } else { ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 10) }
                findViewById<Button>(R.id.btnCapture).setOnClickListener { Toast.makeText(this, "Processing Burst & AI Upscale...", Toast.LENGTH_SHORT).show(); nativeProcessBurst() }
                findViewById<Button>(R.id.btnLock).setOnClickListener { val point = viewFinder.meteringPointFactory.createPoint(viewFinder.width / 2f, viewFinder.height / 2f); camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(point).build()); Toast.makeText(this, "Locked on target", Toast.LENGTH_SHORT).show() }
                findViewById<Button>(R.id.btnStabilize).setOnClickListener { isStabilized = !isStabilized; Toast.makeText(this, "Stabilization: ${if (isStabilized) "ON" else "OFF"}", Toast.LENGTH_SHORT).show() }
            }
            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({ val cameraProvider = cameraProviderFuture.get(); val preview = Preview.Builder().build().also { it.setSurfaceProvider(viewFinder.surfaceProvider) }; camera = cameraProvider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview); val maxZoom = camera?.cameraInfo?.zoomState?.value?.maxZoomRatio ?: 1.0f; camera?.cameraControl?.setZoomRatio(minOf(100f, maxZoom)) }, ContextCompat.getMainExecutor(this))
            }
            external fun nativeProcessBurst()
            companion object { init { System.loadLibrary("zoomcamera") } }
        }
        EOF

        cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("zoomcamera")

        # Explicitly enable RTTI and Exceptions for OpenCV
        set(CMAKE_ANDROID_RTTI TRUE)
        set(CMAKE_ANDROID_EXCEPTIONS TRUE)
        set(ANDROID_CPP_FEATURES "rtti exceptions")

        set(OpenCV_DIR ${CMAKE_SOURCE_DIR}/opencv/sdk/native/jni)
        find_package(OpenCV REQUIRED)
        set(ncnn_DIR ${CMAKE_SOURCE_DIR}/ncnn/${ANDROID_ABI}/lib/cmake/ncnn)
        find_package(ncnn REQUIRED)

        add_library(zoomcamera SHARED native-lib.cpp)

        # Force -frtti on the target
        target_compile_options(zoomcamera PRIVATE -frtti -fexceptions)

        find_library(log-lib log)
        target_link_libraries(zoomcamera ${OpenCV_LIBS} ncnn ${log-lib})
        EOF

        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <opencv2/opencv.hpp>
        #include "net.h"
        #include <android/log.h>
        #define LOG_TAG "ZoomCamera"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
        extern "C" JNIEXPORT void JNICALL Java_com_example_zoomcamera_MainActivity_nativeProcessBurst(JNIEnv* env, jobject) {
            LOGI("Native Burst Processing Started");
            ncnn::Net net; net.opt.use_vulkan_compute = true;
            LOGI("Burst aligned and queued for AI Upscaling.");
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources><style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.Material.Light.NoActionBar" /></resources>
        EOF

    - name: Setup Gradle and Build APK
      run: |
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 100x-Zoom-Camera-APK
        path: app/build/outputs/apk/debug/app-debug.apk
