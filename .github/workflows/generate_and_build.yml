                              MainScreen()
                          }
                      }
                  }
              }

              @Composable
              fun MainScreen() {
                  val config = remember { mutableStateOf(MorphConfig()) }
                  val hasAccess by remember { mutableStateOf(hasAccessibility()) }
                  LaunchedEffect(Unit) { config.value = store.load() }

                  if (!hasAccess) {
                      PermissionGate(onGrant = { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  } else {
                      Dashboard(config.value, onConfigChange = { newConfig ->
                          config.value = newConfig
