          # 19. BezelOverlayView (core renderer)
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/BezelOverlayView.kt
          package com.edge.bezelmorph.engine
          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.util.AttributeSet
          import android.view.Choreographer
          import android.view.View
          import com.edge.bezelmorph.core.*
          import kotlin.math.abs

          class BezelOverlayView @JvmOverloads constructor(ctx:Context,attrs:AttributeSet?=null)
              :View(ctx,attrs),Choreographer.FrameCallback{
              var config=MorphConfig(); var isLeftEdge=false; var centerY=0f
              private val choreo=Choreographer.getInstance()
              private val spring=SpringPhysics(config)
              private val path=Path(); private val bounds=RectF()
              private val fill=Paint(Paint.ANTI_ALIAS_FLAG)
              private val rim=Paint(Paint.ANTI_ALIAS_FLAG).apply{style=Paint.Style.STROKE}
              private val density=resources.displayMetrics.density
              private var animating=false; private var lastNs=0L
              private var downMs=0L; private var releasePending=false
              private val minHold=48L

              init{ setLayerType(LAYER_TYPE_HARDWARE,null); SpringPhysics.densityScale=density; spring.configure(config) }

              fun updateConfig(c:MorphConfig){ config=c; spring.configure(c); invalidate() }
              fun onPress(){ downMs=SystemClock.uptimeMillis(); releasePending=false; spring.press(config.inwardVelocity); start() }
              fun onRelease(){
                  val e=SystemClock.uptimeMillis()-downMs
                  if(e<minHold){ releasePending=true; start() } else { spring.release(); start() }
              }
              fun setStaticPreview(r:Float){ stop(); spring.reset(); spring.press(config.inwardVelocity*r); spring.step(0.05f); invalidate() }
              private fun start(){ if(!animating){ animating=true; lastNs=0; choreo.postFrameCallback(this) } }
              private fun stop(){ animating=false; choreo.removeFrameCallback(this) }

              override fun doFrame(ns:Long){
                  if(!animating) return
                  if(releasePending && SystemClock.uptimeMillis()-downMs>=minHold){ releasePending=false; spring.release() }
                  val dt=if(lastNs>0)((ns-lastNs)/1e9f).coerceIn(0.002f,0.02f) else 0.008f
                  lastNs=ns; spring.step(dt); invalidate()
                  if(spring.settled){ animating=false; return }
                  choreo.postFrameCallback(this)
              }

              override fun onDraw(c:Canvas){
                  super.onDraw(c); val d=spring.value; if(abs(d)<=0.1f) return
                  val y0=config.y0Dp*density; val w=config.wDp*density; val total=y0+w
                  val cy=if(centerY>0)centerY else height*config.centerYRatio
                  bounds.set(if(isLeftEdge)0f else width-d,cy-total,if(isLeftEdge)d else width.toFloat(),cy+total)
                  ShapeProvider.build(path,width,cy,y0,w,d,isLeftEdge,config.shapeProfile)
                  c.drawPath(path,FillProvider.paintFor(config,bounds))
                  if(config.rimLight){ rim.strokeWidth=1.2f*density; rim.color=0x66FFFFFF; c.drawPath(path,rim) }
                  if(config.outerGlow){
                      val g=Paint(Paint.ANTI_ALIAS_FLAG).apply{style=Paint.Style.STROKE;strokeWidth=8f*density;
                          color=config.fillColor;maskFilter=BlurMaskFilter(12f*density,BlurMaskFilter.Blur.OUTER);alpha=90}
                      c.drawPath(path,g)
                  }
                  if(config.debugOverlay){
                      val dbg=Paint().apply{color=0xFFFF0000.toInt();style=Paint.Style.STROKE;strokeWidth=2f}
                      c.drawRect(bounds,dbg)
                  }
              }
          }
          EOF

          # 20. HardwareKeyMonitorService (expanded with per-app + foreground service)
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/HardwareKeyMonitorService.kt
          package com.edge.bezelmorph.engine
          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import com.edge.bezelmorph.core.*
          import com.edge.bezelmorph.ui.MainActivity

          class HardwareKeyMonitorService:AccessibilityService(){
              private var wm:WindowManager?=null; private var overlay:BezelOverlayView?=null
              private lateinit var store:ConfigStore; private lateinit var haptics:HapticEngine
              private var config=MorphConfig(); private var activeKey=0
              private var lastTrigger=0L; private var power:PowerManager?=null
              private var currentPkg:String?=null

              override fun onServiceConnected(){
                  super.onServiceConnected()
                  store=ConfigStore(this); haptics=HapticEngine(this)
                  power=getSystemService(POWER_SERVICE) as? PowerManager
                  config=store.load(); attachOverlay(); startForegroundNotification()
              }

              private fun attachOverlay(){
                  if(overlay!=null) return
                  try{
                      wm=getSystemService(WINDOW_SERVICE) as WindowManager
                      val flags=WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                      val p=WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,flags,
                          PixelFormat.TRANSLUCENT)
                      if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.P)
                          p.layoutInDisplayCutoutMode=WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      overlay=BezelOverlayView(this).apply{ updateConfig(config) }
                      wm?.addView(overlay,p)
                  }catch(_:Exception){}
              }

              private fun startForegroundNotification(){
                  if(!config.showStatusNotification) return
                  val ch=NotificationChannel("bezel_morph","Bezel Morph",NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  val pi=PendingIntent.getActivity(this,0,Intent(this,MainActivity::class.java),PendingIntent.FLAG_IMMUTABLE)
                  val n=Notification.Builder(this,"bezel_morph")
                      .setContentTitle("Bezel Morph").setContentText("Engine active")
                      .setSmallIcon(android.R.drawable.ic_menu_compass).setContentIntent(pi)
                      .build()
                  startForeground(1,n)
              }

              override fun onKeyEvent(event:KeyEvent):Boolean{
                  config=store.load()
                  // Per-app profile override
                  val profileName=currentPkg?.let{config.perAppProfiles[it]}
                  val activeConfig=profileName?.let{store.loadProfile(it)}?:config

                  val code=event.keyCode
                  if(event.action==KeyEvent.ACTION_DOWN && event.repeatCount==0){
                      if(!canTrigger()) return false
                      activeKey=code
                      haptics.press(activeConfig)
                      overlay?.let{ v-> v.updateConfig(activeConfig); v.centerY=v.height*activeConfig.centerYRatio; v.onPress() }
                  }else if(event.action==KeyEvent.ACTION_UP && activeKey==code){
                      activeKey=0; haptics.release(activeConfig); overlay?.onRelease()
                  }
                  return activeConfig.suppressVolumeUi
              }

              private fun canTrigger():Boolean{
                  if(config.onlyWhenScreenOn && power?.isInteractive==false) return false
                  val now=System.currentTimeMillis()
                  if(now-lastTrigger<60_000L/config.rateLimitPerMinute.coerceAtLeast(1)) return false
                  lastTrigger=now; return true
              }

              override fun onAccessibilityEvent(e:AccessibilityEvent?){
                  // Track foreground package for per-app profiles
                  e?.packageName?.let{ currentPkg=it.toString() }
              }
              override fun onInterrupt(){}
              override fun onDestroy(){ super.onDestroy(); try{overlay?.let{wm?.removeView(it)}}catch(_:Exception){} }
          }
          EOF

