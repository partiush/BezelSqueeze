name: Generate Project & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Project Files
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/edge/bezelmorph

          # 1. gradle.properties (Fixes checkDebugAarMetadata AndroidX failure)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.0.0")
          }
          EOF

          # 5. Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 6. Service Configuration & Resources
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes=""
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph</string>
              <string name="service_description">Real-time edge deflection sync for physical keys.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#0F0F0F</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          # 7. Persistent Configuration Store
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MorphConfigStore.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.content.SharedPreferences

          class MorphConfigStore(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("morph_settings", Context.MODE_PRIVATE)

              var volumeUpRatio: Float
                  get() = prefs.getFloat("v_up_pos", 0.23f)
                  set(v) = prefs.edit().putFloat("v_up_pos", v).apply()

              var volumeDownRatio: Float
                  get() = prefs.getFloat("v_down_pos", 0.33f)
                  set(v) = prefs.edit().putFloat("v_down_pos", v).apply()

              var lengthPx: Float
                  get() = prefs.getFloat("btn_len", 160f)
                  set(v) = prefs.edit().putFloat("btn_len", v).apply()

              var depthPx: Float
                  get() = prefs.getFloat("btn_depth", 28f)
                  set(v) = prefs.edit().putFloat("btn_depth", v).apply()

              var isLeftEdge: Boolean
                  get() = prefs.getBoolean("is_left", true)
                  set(v) = prefs.edit().putBoolean("is_left", v).apply()
          }
          EOF

          # 8. High-Fidelity Spline & Specular Rim Engine
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/BezelSurfaceView.kt
          package com.edge.bezelmorph

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import androidx.dynamicanimation.animation.FloatPropertyCompat
          import androidx.dynamicanimation.animation.SpringAnimation
          import androidx.dynamicanimation.animation.SpringForce

          class BezelSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              var isLeftEdge: Boolean = true
              var centerY: Float = 400f
              var bulgeLength: Float = 160f
              var maxDepth: Float = 28f

              private var progress: Float = 0f
              private val bodyPath = Path()
              private val rimPath = Path()

              private val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  style = Paint.Style.FILL
              }

              private val rimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2.5f
                  strokeCap = Paint.Cap.ROUND
              }

              private val springProp = object : FloatPropertyCompat<BezelSurfaceView>("morphProgress") {
                  override fun getValue(v: BezelSurfaceView): Float = v.progress
                  override fun setValue(v: BezelSurfaceView, value: Float) {
                      v.progress = value
                      v.invalidate()
                  }
              }

              private val springAnim = SpringAnimation(this, springProp).apply {
                  spring = SpringForce().apply {
                      dampingRatio = 0.58f
                      stiffness = 950f
                  }
              }

              fun onKeyDownInstant() {
                  springAnim.cancel()
                  progress = 1.0f
                  invalidate()
              }

              fun onKeyUpRelease() {
                  springAnim.cancel()
                  springAnim.setStartValue(progress)
                  springAnim.animateToFinalPosition(0f)
              }

              fun setPreview(p: Float) {
                  springAnim.cancel()
                  progress = p
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (progress <= 0.0001f) return

                  val w = width.toFloat()
                  val h = height.toFloat()
                  val activeDepth = maxDepth * progress
                  val halfLen = bulgeLength / 2f
                  val topY = (centerY - halfLen).coerceAtLeast(0f)
                  val botY = (centerY + halfLen).coerceAtMost(h)

                  bodyPath.reset()
                  rimPath.reset()

                  val cp1 = centerY - (halfLen * 0.42f)
                  val cp2 = centerY + (halfLen * 0.42f)

                  if (isLeftEdge) {
                      bodyPath.moveTo(0f, topY)
                      bodyPath.cubicTo(activeDepth, cp1, activeDepth, cp2, 0f, botY)
                      bodyPath.lineTo(0f, topY)
                      canvas.drawPath(bodyPath, bodyPaint)

                      rimPaint.shader = LinearGradient(
                          0f, topY, activeDepth, centerY,
                          intArrayOf(0x00FFFFFF, 0x4DFFFFFF, 0x00FFFFFF),
                          floatArrayOf(0.0f, 0.5f, 1.0f),
                          Shader.TileMode.CLAMP
                      )
                      rimPath.moveTo(0f, topY)
                      rimPath.cubicTo(activeDepth, cp1, activeDepth, cp2, 0f, botY)
                      canvas.drawPath(rimPath, rimPaint)
                  } else {
                      bodyPath.moveTo(w, topY)
                      bodyPath.cubicTo(w - activeDepth, cp1, w - activeDepth, cp2, w, botY)
                      bodyPath.lineTo(w, topY)
                      canvas.drawPath(bodyPath, bodyPaint)

                      rimPaint.shader = LinearGradient(
                          w, topY, w - activeDepth, centerY,
                          intArrayOf(0x00FFFFFF, 0x4DFFFFFF, 0x00FFFFFF),
                          floatArrayOf(0.0f, 0.5f, 1.0f),
                          Shader.TileMode.CLAMP
                      )
                      rimPath.moveTo(w, topY)
                      rimPath.cubicTo(w - activeDepth, cp1, w - activeDepth, cp2, w, botY)
                      canvas.drawPath(rimPath, rimPaint)
                  }
              }
          }
          EOF

          # 9. Hardware-Linked Interceptor
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/HardwareKeyMonitorService.kt
          package com.edge.bezelmorph

          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.view.*
          import android.view.accessibility.AccessibilityEvent

          class HardwareKeyMonitorService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var overlay: BezelSurfaceView? = null
              private lateinit var store: MorphConfigStore
              private var pressedKey: Int = 0

              override fun onCreate() {
                  super.onCreate()
                  store = MorphConfigStore(this)
                  setupOverlay()
              }

              private fun setupOverlay() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  overlay = BezelSurfaceView(this).apply {
                      isLeftEdge = store.isLeftEdge
                      bulgeLength = store.lengthPx
                      maxDepth = store.depthPx
                  }
                  wm?.addView(overlay, params)
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode
                  if (code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      val ratio = if (code == KeyEvent.KEYCODE_VOLUME_UP) store.volumeUpRatio else store.volumeDownRatio

                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (event.repeatCount == 0) {
                              pressedKey = code
                              overlay?.let {
                                  it.isLeftEdge = store.isLeftEdge
                                  it.bulgeLength = store.lengthPx
                                  it.maxDepth = store.depthPx
                                  it.centerY = it.height * ratio
                                  it.onKeyDownInstant()
                              }
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          if (pressedKey == code) {
                              pressedKey = 0
                              overlay?.onKeyUpRelease()
                          }
                      }
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  overlay?.let { wm?.removeView(it) }
              }
          }
          EOF

          # 10. Live Calibration Activity
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/MainActivity.kt
          package com.edge.bezelmorph

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var store: MorphConfigStore
              private lateinit var preview: BezelSurfaceView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = MorphConfigStore(this)

                  val root = FrameLayout(this).apply { setBackgroundColor(0xFF0A0A0A.toInt()) }
                  preview = BezelSurfaceView(this).apply {
                      isLeftEdge = store.isLeftEdge
                      bulgeLength = store.lengthPx
                      maxDepth = store.depthPx
                  }
                  root.addView(preview, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(0xDD1E1E1E.toInt())
                      setPadding(32, 24, 32, 24)
                  }
                  val panel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val heading = TextView(this).apply {
                      text = "Edge Alignment Controls"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 18f
                      setPadding(0, 0, 0, 16)
                  }
                  panel.addView(heading)

                  val toggle = Switch(this).apply {
                      text = "Position: Left Edge"
                      setTextColor(0xFFEEEEEE.toInt())
                      isChecked = store.isLeftEdge
                      setOnCheckedChangeListener { _, checked ->
                          store.isLeftEdge = checked
                          text = if (checked) "Position: Left Edge" else "Position: Right Edge"
                          refresh(store.volumeUpRatio)
                      }
                  }
                  panel.addView(toggle)

                  panel.addView(addSlider("Key 1 Position", (store.volumeUpRatio * 1000).toInt(), 50, 950) {
                      store.volumeUpRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeUpRatio
                      preview.setPreview(1.0f)
                  })

                  panel.addView(addSlider("Key 2 Position", (store.volumeDownRatio * 1000).toInt(), 50, 950) {
                      store.volumeDownRatio = it / 1000f
                      preview.centerY = preview.height * store.volumeDownRatio
                      preview.setPreview(1.0f)
                  })

                  panel.addView(addSlider("Profile Length", store.lengthPx.toInt(), 70, 360) {
                      store.lengthPx = it.toFloat()
                      refresh(store.volumeUpRatio)
                  })

                  panel.addView(addSlider("Deflection Depth", store.depthPx.toInt(), 10, 60) {
                      store.depthPx = it.toFloat()
                      refresh(store.volumeUpRatio)
                  })

                  val btn = Button(this).apply {
                      text = "Enable Hardware Monitoring"
                      setBackgroundColor(0xFF2B5BE6.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  panel.addView(btn)

                  scroll.addView(panel)
                  val cardParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM
                      setMargins(24, 0, 24, 48)
                  }
                  root.addView(scroll, cardParams)

                  setContentView(root)
                  refresh(store.volumeUpRatio)
              }

              private fun addSlider(title: String, initial: Int, minVal: Int, maxVal: Int, onChange: (Int) -> Unit): LinearLayout {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 8, 0, 8)
                  }
                  val txt = TextView(this).apply {
                      text = "$title: $initial"
                      setTextColor(0xFFCCCCCC.toInt())
                  }
                  val seek = SeekBar(this).apply {
                      max = maxVal - minVal
                      progress = initial - minVal
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              val v = p + minVal
                              txt.text = "$title: $v"
                              onChange(v)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) { preview.setPreview(0f) }
                      })
                  }
                  layout.addView(txt)
                  layout.addView(seek)
                  return layout
              }

              private fun refresh(ratio: Float) {
                  preview.isLeftEdge = store.isLeftEdge
                  preview.bulgeLength = store.lengthPx
                  preview.maxDepth = store.depthPx
                  preview.post {
                      preview.centerY = preview.height * ratio
                      preview.setPreview(1.0f)
                  }
              }
          }
          EOF

      - name: Build With Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compile Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeMorph-APK
          path: app/build/outputs/apk/debug/app-debug.apk
