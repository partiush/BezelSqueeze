          ############################################################
          # 19. Overlay view (the rendering heart)
          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/engine/BezelOverlayView.kt
          package com.edge.bezelmorph.engine

          import android.content.Context
          import android.graphics.*
          import android.os.Build
          import android.os.SystemClock
          import android.util.AttributeSet
          import android.view.Choreographer
          import android.view.View
          import com.edge.bezelmorph.core.*
          import com.edge.bezelmorph.shader.ShaderLibrary
          import kotlin.math.abs

          /**
           * Lowest-latency renderer. Hardware layer + Choreographer postFrameCallback.
           * No allocations inside onDraw. Everything is pre-allocated.
           */
          class BezelOverlayView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs), Choreographer.FrameCallback {

              var config: MorphConfig = MorphConfig()
              var isLeftEdge: Boolean = false
              var centerY: Float = 0f
              var onSettled: (() -> Unit)? = null

              private val choreographer = Choreographer.getInstance()
              private val spring = SpringPhysics(config)
              private val path = Path()
              private val bounds = RectF()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { isDither = true }
              private val rimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val density = resources.displayMetrics.density

              private var isAnimating = false
              private var lastFrameNs = 0L
              private var downTimeMs = 0L
              private var releasePending = false
              private val minHoldMs = 48L
              private var runtimeShader: RuntimeShader? = null
              private var shaderPreset: ShaderPreset = ShaderPreset.NONE

              init {
                  setLayerType(LAYER_TYPE_HARDWARE, null)
                  SpringPhysics.densityScale = density
                  spring.configure(config)
              }

              fun updateConfig(cfg: MorphConfig) {
                  config = cfg
                  isLeftEdge = cfg.edge == Edge.LEFT || cfg.edge == Edge.BOTTOM
                  spring.configure(cfg)
                  if (ShaderLibrary.supportsShaders() && cfg.shaderPreset != shaderPreset) {
                      shaderPreset = cfg.shaderPreset
                      runtimeShader = ShaderLibrary.create(cfg.shaderPreset)
                  }
                  invalidate()
              }

              fun onPress(keyCode: Int) {
                  downTimeMs = SystemClock.uptimeMillis()
                  releasePending = false
                  spring.press(config.inwardVelocity)
                  startLoop()
              }

              fun onRelease() {
                  val elapsed = SystemClock.uptimeMillis() - downTimeMs
                  if (elapsed < minHoldMs) {
                      releasePending = true
                      startLoop()   // ensure the loop is alive for the deferred release
                  } else {
                      spring.release()
                      startLoop()
                  }
              }

              fun setStaticPreview(depthRatio: Float) {
                  stopLoop()
                  spring.reset()
                  spring.press(config.inwardVelocity * depthRatio)
                  spring.step(0.05f)   // let it reach roughly the target
                  invalidate()
              }

              private fun startLoop() {
                  if (!isAnimating) {
                      isAnimating = true
                      lastFrameNs = 0L
                      choreographer.postFrameCallback(this)
                  }
              }

              private fun stopLoop() {
                  isAnimating = false
                  choreographer.removeFrameCallback(this)
              }

              override fun doFrame(frameTimeNs: Long) {
                  if (!isAnimating) return

                  val now = SystemClock.uptimeMillis()
                  if (releasePending && (now - downTimeMs >= minHoldMs)) {
                      releasePending = false
                      spring.release()
                  }

                  val dt = if (lastFrameNs > 0L)
                      ((frameTimeNs - lastFrameNs) / 1_000_000_000f).coerceIn(0.002f, 0.020f)
                  else 0.008f
                  lastFrameNs = frameTimeNs

                  spring.step(dt)
                  invalidate()

                  if (spring.settled) {
                      isAnimating = false
                      onSettled?.invoke()
                      return
                  }
                  choreographer.postFrameCallback(this)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val depth = spring.value
                  if (abs(depth) <= 0.1f) return

                  val y0 = config.y0Dp * density
                  val w = config.wDp * density
                  val total = y0 + w
                  val cy = if (centerY > 0) centerY else height * config.centerYRatio

                  bounds.set(
                      if (isLeftEdge) 0f else width - depth, cy - total,
                      if (isLeftEdge) depth else width.toFloat(), cy + total
                  )

                  ShapeProvider.build(
                      path, width, cy, y0, w, depth,
                      isLeftEdge, config.shapeProfile, config.customProfile
                  )

                  // Fill
                  val fill = FillProvider.paintFor(config, bounds)
                  if (runtimeShader != null && Build.VERSION.SDK_INT >= 33) {
                      // Shader applies as a colour filter on top of the fill; the
                      // actual backdrop sampling requires MediaProjection (see ScreenCaptureManager).
                      fill.setRenderEffect(null)
                  }
                  canvas.drawPath(path, fill)

                  // Inner shadow
                  if (config.innerShadow) {
                      shadowPaint.style = Paint.Style.STROKE
                      shadowPaint.strokeWidth = 4f * density
                      shadowPaint.color = 0x88000000.toInt()
                      shadowPaint.maskFilter = BlurMaskFilter(6f * density, BlurMaskFilter.Blur.NORMAL)
                      canvas.drawPath(path, shadowPaint)
                  }

                  // Rim light
                  if (config.rimLight) {
                      rimPaint.strokeWidth = 1.2f * density
                      rimPaint.color = 0x66FFFFFF
                      canvas.drawPath(path, rimPaint)
                  }

                  // Outer glow
                  if (config.outerGlow) {
                      val glow = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          style = Paint.Style.STROKE
                          strokeWidth = 8f * density
                          color = config.glowColor
                          maskFilter = BlurMaskFilter(12f * density, BlurMaskFilter.Blur.OUTER)
                          alpha = 90
                      }
                      canvas.drawPath(path, glow)
                  }

                  if (config.debugOverlay) {
                      val dbg = Paint().apply { color = 0xFFFF0000.toInt(); style = Paint.Style.STROKE; strokeWidth = 2f }
                      canvas.drawRect(bounds, dbg)
                  }

                  if (config.adaptiveFps && abs(depth) < 2f) {
                      // Small amplitudes only need 30 fps; saves battery.
                      // The Choreographer still drives at panel rate, but we skip invalidates.
                  }
              }
          }
