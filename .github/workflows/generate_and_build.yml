        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <android/bitmap.h>
        #include <android/asset_manager.h>
        #include <android/asset_manager_jni.h>
        #include <android/log.h>
        #include <opencv2/opencv.hpp>
        #include "net.h"
        #include <deque>
        #include <mutex>
        #include <vector>

        #define LOG_TAG "ProMoonEngine"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        static std::mutex gRingMutex;
        static std::deque<cv::Mat> gRingQueue;
        static const size_t MAX_RING = 8;

        static std::mutex gLockMutex;
        static cv::Mat gLockTpl;
        static cv::Point2f gLockNorm(0.5f, 0.5f);
        static bool gLockActive = false;

        static ncnn::Net gNcnnNet;
        static bool gModelLoaded = false;

        static cv::Mat bitmapToMat(JNIEnv* env, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return cv::Mat();
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return cv::Mat();
            cv::Mat rgba(info.height, info.width, CV_8UC4, pixels);
            cv::Mat bgr;
            cv::cvtColor(rgba, bgr, cv::COLOR_RGBA2BGR);
            AndroidBitmap_unlockPixels(env, bitmap);
            return bgr;
        }

        static void matToBitmap(JNIEnv* env, const cv::Mat& bgr, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return;
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return;
            cv::Mat resized;
            if (bgr.cols != (int)info.width || bgr.rows != (int)info.height) {
                cv::resize(bgr, resized, cv::Size(info.width, info.height), 0, 0, cv::INTER_LANCZOS4);
            } else {
                resized = bgr;
            }
            cv::Mat dstRgba(info.height, info.width, CV_8UC4, pixels);
            cv::cvtColor(resized, dstRgba, cv::COLOR_BGR2RGBA);
            AndroidBitmap_unlockPixels(env, bitmap);
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeInitModels(JNIEnv* env, jobject, jobject mgrObj) {
            AAssetManager* mgr = AAssetManager_fromJava(env, mgrObj);
            if (!mgr) return;
            gNcnnNet.opt.use_vulkan_compute = false;
            gNcnnNet.opt.num_threads = 4;
            int p = gNcnnNet.load_param(mgr, "models/realesrgan-x4plus.param");
            int m = gNcnnNet.load_model(mgr, "models/realesrgan-x4plus.bin");
            gModelLoaded = (p == 0 && m == 0);
            LOGI("Real-ESRGAN Model Loaded Status: %d", gModelLoaded);
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeSetLockTemplate(JNIEnv* env, jobject, jobject bmp, jfloat nx, jfloat ny) {
            cv::Mat bgr = bitmapToMat(env, bmp);
            if (bgr.empty()) return;
            cv::Mat gray;
            cv::cvtColor(bgr, gray, cv::COLOR_BGR2GRAY);

            int patch = std::max(32, std::min(gray.cols, gray.rows) / 10);
            int cx = (int)(nx * gray.cols);
            int cy = (int)(ny * gray.rows);
            int x0 = std::clamp(cx - patch / 2, 0, gray.cols - patch);
            int y0 = std::clamp(cy - patch / 2, 0, gray.rows - patch);

            std::lock_guard<std::mutex> lock(gLockMutex);
            gLockTpl = gray(cv::Rect(x0, y0, patch, patch)).clone();
            gLockNorm = cv::Point2f(nx, ny);
            gLockActive = true;
        }

        extern "C" JNIEXPORT jfloatArray JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeTrackTemplate(JNIEnv* env, jobject, jobject bmp) {
            std::lock_guard<std::mutex> lock(gLockMutex);
            if (!gLockActive || gLockTpl.empty()) return nullptr;

            cv::Mat bgr = bitmapToMat(env, bmp);
            if (bgr.empty()) return nullptr;
            cv::Mat gray;
            cv::cvtColor(bgr, gray, cv::COLOR_BGR2GRAY);

            int searchRad = gLockTpl.cols * 2;
            int cx = (int)(gLockNorm.x * gray.cols);
            int cy = (int)(gLockNorm.y * gray.rows);
            int x0 = std::clamp(cx - searchRad, 0, gray.cols - gLockTpl.cols - 1);
            int y0 = std::clamp(cy - searchRad, 0, gray.rows - gLockTpl.rows - 1);
            int w = std::min(searchRad * 2, gray.cols - x0);
            int h = std::min(searchRad * 2, gray.rows - y0);

            if (w <= gLockTpl.cols || h <= gLockTpl.rows) return nullptr;

            cv::Mat window = gray(cv::Rect(x0, y0, w, h));
            cv::Mat res;
            cv::matchTemplate(window, gLockTpl, res, cv::TM_CCOEFF_NORMED);

            double minVal, maxVal;
            cv::Point minLoc, maxLoc;
            cv::minMaxLoc(res, &minVal, &maxVal, &minLoc, &maxLoc);

            if (maxVal > 0.40) {
                float targetX = (float)(x0 + maxLoc.x + gLockTpl.cols / 2) / (float)gray.cols;
                float targetY = (float)(y0 + maxLoc.y + gLockTpl.rows / 2) / (float)gray.rows;
                gLockNorm.x = gLockNorm.x * 0.4f + targetX * 0.6f;
                gLockNorm.y = gLockNorm.y * 0.4f + targetY * 0.6f;
            }

            jfloatArray out = env->NewFloatArray(2);
            float arr[2] = { gLockNorm.x, gLockNorm.y };
            env->SetFloatArrayRegion(out, 0, 2, arr);
            return out;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeClearLock(JNIEnv*, jobject) {
            std::lock_guard<std::mutex> lock(gLockMutex);
            gLockActive = false;
            gLockTpl.release();
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativePushFrameToRing(JNIEnv* env, jobject, jobject bmp) {
            cv::Mat bgr = bitmapToMat(env, bmp);
            if (bgr.empty()) return;

            std::lock_guard<std::mutex> lock(gRingMutex);
            if (gRingQueue.size() >= MAX_RING) gRingQueue.pop_front();
            gRingQueue.push_back(bgr);
        }

        extern "C" JNIEXPORT jint JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeProcessRemaster(
            JNIEnv* env, jobject, jobject anchorBmp, jint cropX, jint cropY, jint cropW, jint cropH, jobject outBmp, jboolean moonMode
        ) {
            cv::Mat fullAnchor = bitmapToMat(env, anchorBmp);
            if (fullAnchor.empty()) return 0;

            cv::Rect roi(cropX, cropY, cropW, cropH);
            roi &= cv::Rect(0, 0, fullAnchor.cols, fullAnchor.rows);
            cv::Mat anchorRoi = fullAnchor(roi).clone();

            std::vector<cv::Mat> burst;
            {
                std::lock_guard<std::mutex> lock(gRingMutex);
                for (const auto& f : gRingQueue) {
                    cv::Rect r(cropX, cropY, cropW, cropH);
                    r &= cv::Rect(0, 0, f.cols, f.rows);
                    if (r.width == cropW && r.height == cropH) {
                        burst.push_back(f(r).clone());
                    }
                }
                gRingQueue.clear();
            }

            AndroidBitmapInfo info;
            AndroidBitmap_getInfo(env, outBmp, &info);
            int targetW = info.width;
            int targetH = info.height;

            cv::Mat hiAnchor;
            cv::resize(anchorRoi, hiAnchor, cv::Size(targetW, targetH), 0, 0, cv::INTER_LANCZOS4);

            cv::Mat anchorGray;
            cv::cvtColor(hiAnchor, anchorGray, cv::COLOR_BGR2GRAY);

            cv::Mat accum;
            hiAnchor.convertTo(accum, CV_32FC3, 2.5);
            cv::Mat weights = cv::Mat::ones(targetH, targetW, CV_32FC1) * 2.5f;
            int fusedCount = 1;

            for (const auto& b : burst) {
                cv::Mat cand;
                cv::resize(b, cand, cv::Size(targetW, targetH), 0, 0, cv::INTER_CUBIC);
                cv::Mat candGray;
                cv::cvtColor(cand, candGray, cv::COLOR_BGR2GRAY);

                cv::Mat a32, c32;
                anchorGray.convertTo(a32, CV_32F);
                candGray.convertTo(c32, CV_32F);

                double resp = 0.0;
                cv::Point2d shift = cv::phaseCorrelate(c32, a32, cv::noArray(), &resp);

                if (std::abs(shift.x) < targetW * 0.15 && std::abs(shift.y) < targetH * 0.15 && resp > 0.10) {
                    cv::Mat warp = (cv::Mat_<double>(2, 3) << 1.0, 0.0, shift.x, 0.0, 1.0, shift.y);
                    cv::Mat aligned;
                    cv::warpAffine(cand, aligned, warp, cv::Size(targetW, targetH), cv::INTER_LANCZOS4, cv::BORDER_REPLICATE);

                    cv::Mat diff, diffGray, mask;
                    cv::absdiff(hiAnchor, aligned, diff);
                    cv::cvtColor(diff, diffGray, cv::COLOR_BGR2GRAY);
                    cv::threshold(diffGray, mask, 30.0, 1.0, cv::THRESH_BINARY_INV);
                    mask.convertTo(mask, CV_32FC1);

                    cv::Mat alignedF;
                    aligned.convertTo(alignedF, CV_32FC3);

                    std::vector<cv::Mat> ch(3), accCh(3);
                    cv::split(alignedF, ch);
                    cv::split(accum, accCh);
                    for (int c = 0; c < 3; ++c) accCh[c] += ch[c].mul(mask);
                    cv::merge(accCh, accum);
                    weights += mask;
                    fusedCount++;
                }
            }

            std::vector<cv::Mat> planes(3);
            cv::split(accum, planes);
            for (int c = 0; c < 3; ++c) cv::divide(planes[c], weights, planes[c]);
            cv::Mat finalF, merged8U;
            cv::merge(planes, finalF);
            finalF.convertTo(merged8U, CV_8UC3);

            cv::Mat resultImg;
            if (moonMode) {
                // Samsung-Style Moon Crater Detail Restoration
                cv::Mat lab;
                cv::cvtColor(merged8U, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> labCh;
                cv::split(lab, labCh);

                // High-contrast crater enhancement on L-channel
                cv::Ptr<cv::CLAHE> clahe = cv::createCLAHE(3.5, cv::Size(8, 8));
                clahe->apply(labCh[0], labCh[0]);

                // Crater rim & Maria deconvolution
                cv::Mat blurM, sharpM;
                cv::GaussianBlur(labCh[0], blurM, cv::Size(0, 0), 1.6);
                cv::addWeighted(labCh[0], 2.2, blurM, -1.2, 0, sharpM);
                sharpM.copyTo(labCh[0]);

                cv::merge(labCh, lab);
                cv::cvtColor(lab, resultImg, cv::COLOR_Lab2BGR);
            } else {
                cv::Mat lab;
                cv::cvtColor(merged8U, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> labCh;
                cv::split(lab, labCh);

                cv::Ptr<cv::CLAHE> clahe = cv::createCLAHE(2.0, cv::Size(8, 8));
                clahe->apply(labCh[0], labCh[0]);

                cv::Mat blurL, sharpL;
                cv::GaussianBlur(labCh[0], blurL, cv::Size(0, 0), 1.2);
                cv::addWeighted(labCh[0], 1.7, blurL, -0.7, 0, labCh[0]);

                cv::merge(labCh, lab);
                cv::cvtColor(lab, resultImg, cv::COLOR_Lab2BGR);
            }

            matToBitmap(env, resultImg, outBmp);
            return fusedCount;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeEnhanceTextEdges(JNIEnv* env, jobject, jobject bmp, jintArray boxes) {
            cv::Mat img = bitmapToMat(env, bmp);
            if (img.empty()) return;

            jsize len = env->GetArrayLength(boxes);
            jint* ptr = env->GetIntArrayElements(boxes, nullptr);

            for (int i = 0; i + 3 < len; i += 4) {
                int x = std::max(0, ptr[i] - 6);
                int y = std::max(0, ptr[i + 1] - 6);
                int w = std::min(img.cols - x, ptr[i + 2] + 12);
                int h = std::min(img.rows - y, ptr[i + 3] + 12);
                if (w <= 8 || h <= 8) continue;

                cv::Rect r(x, y, w, h);
                cv::Mat roi = img(r);

                cv::Mat gray, morph;
                cv::cvtColor(roi, gray, cv::COLOR_BGR2GRAY);
                cv::Mat kernel = cv::getStructuringElement(cv::MORPH_RECT, cv::Size(2, 2));
                cv::morphologyEx(gray, morph, cv::MORPH_GRADIENT, kernel);

                cv::Mat mask;
                cv::threshold(morph, mask, 35, 255, cv::THRESH_BINARY);

                cv::Mat lab;
                cv::cvtColor(roi, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> p;
                cv::split(lab, p);

                cv::Mat sharp;
                cv::addWeighted(p[0], 1.9, gray, -0.9, 0, sharp);
                sharp.copyTo(p[0], mask);

                cv::merge(p, lab);
                cv::cvtColor(lab, roi, cv::COLOR_Lab2BGR);
            }

            env->ReleaseIntArrayElements(boxes, ptr, JNI_ABORT);
            matToBitmap(env, img, bmp);
        }
        EOF

