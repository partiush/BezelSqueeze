name: Build BezelMorph (Production + Debug)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # ── SECRET GATING (the fix for the parser error) ─────────────────────
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Scaffold BezelMorph — Complete Source
        run: |
          set -e
          mkdir -p gradle/wrapper app/src/main/res/{values,values-night,drawable,mipmap-anydpi-v26,xml,layout} app/src/main/assets
          mkdir -p app/src/main/java/com/edge/bezelmorph/{core,engine,ui,integration,shader}

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8
          android.enableR8.fullMode=true
          android.enableJetifier=false
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          # 3. Root build.gradle.kts (AGP 9 → built-in Kotlin)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "9.0.1" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins { id("com.android.application") }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 200
                  versionName = "200.0.0"
                  resourceConfigurations += listOf("en","fr","de","hi","ja","zh","es")
              }

              signingConfigs {
                  create("release") {
                      if (System.getenv("KEYSTORE_BASE64") != null) {
                          storeFile = file("release.keystore")
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  debug { isMinifyEnabled = false; applicationIdSuffix = ".debug" }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }
              kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_21) } }
              buildFeatures { buildConfig = true }
              packaging { resources.excludes += setOf("META-INF/AL2.0","META-INF/LGPL2.1") }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.1.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepclassmembers class com.edge.bezelmorph.core.MorphConfig { *; }
          -keep class com.edge.bezelmorph.shader.ShaderLibrary { *; }
          EOF

          # 5. AndroidManifest.xml — expanded
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge">

                  <activity
                      android:name=".ui.MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Accessibility engine -->
                  <service
                      android:name=".engine.HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="@string/service_label">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>

                  <!-- Floating bubble (gesture trigger) -->
                  <service
                      android:name=".engine.FloatingBubbleService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating control bubble for bezel morphology engine" />
                  </service>

                  <!-- Quick Settings tile -->
                  <service
                      android:name=".integration.QuickSettingsTile"
                      android:exported="true"
                      android:icon="@drawable/ic_qs_tile"
                      android:label="@string/qs_tile_label"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <!-- Home‑screen widget -->
                  <receiver
                      android:name=".integration.BezelWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/bezel_widget_info" />
                  </receiver>

                  <!-- Tasker / automation broadcast receiver -->
                  <receiver
                      android:name=".integration.AutomationReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.edge.bezelmorph.TRIGGER" />
                          <action android:name="com.edge.bezelmorph.SET_PROFILE" />
                      </intent-filter>
                  </receiver>

                  <receiver android:name=".integration.BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="android.app.shortcuts"
                      android:resource="@xml/shortcuts" />
              </application>
          </manifest>
          EOF

          # 6. Accessibility service config
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_description"
              android:notificationTimeout="50" />
          EOF

          # 7. Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph</string>
              <string name="service_label">Bezel Morph Engine</string>
              <string name="service_description">Renders physical button displacement with haptics.</string>
              <string name="qs_tile_label">Bezel Morph</string>
              <string name="widget_label">Bezel Morph</string>
              <string name="permission_title">System Authorization</string>
              <string name="permission_subtitle">Grant accessibility so the engine can observe hardware key events.</string>
              <string name="accessibility_title">Accessibility Interceptor</string>
              <string name="accessibility_desc">Monitors hardware key transitions from the system input pipeline.</string>
              <string name="overlay_title">Display Perimeter Layer</string>
              <string name="overlay_desc">Draws the deformation directly against display cutouts.</string>
              <string name="capture_title">Screen Refraction (Optional)</string>
              <string name="capture_desc">Capture the screen so the bulge can refract live content.</string>
              <string name="dashboard_title">Physical Edge Calibrator</string>
              <string name="dashboard_subtitle">Every change is live. Tap the preview to switch keys.</string>
              <string name="teach_key">Teach a New Key</string>
              <string name="save_profile">Save Profile</string>
              <string name="load_profile">Load Profile</string>
              <string name="export_config">Export JSON</string>
              <string name="import_config">Import JSON</string>
              <string name="test_haptic">Test Haptic</string>
              <string name="reset_defaults">Reset Defaults</string>
              <string name="reduce_motion">Reduce Motion</string>
              <string name="suppress_volume_ui">Suppress system volume UI</string>
              <string name="bubble_label">Bezel Morph</string>
          </resources>
          EOF

          # 8. Styles / Colors
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/morph_bg</item>
                  <item name="android:statusBarColor">@color/morph_bg</item>
                  <item name="android:navigationBarColor">@color/morph_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="morph_bg">#0F172A</color>
              <color name="morph_surface">#1E293B</color>
              <color name="morph_accent">#38BDF8</color>
              <color name="morph_text">#F8FAFC</color>
              <color name="morph_muted">#94A3B8</color>
              <color name="morph_success">#10B981</color>
          </resources>
          EOF

          # 9. Adaptive icon (vector)
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0F172A" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E293B"
                  android:pathData="M34,22 h40 a8,8 0 0 1 8,8 v48 a8,8 0 0 1 -8,8 h-40 a8,8 0 0 1 -8,-8 v-48 a8,8 0 0 1 8,-8 z" />
              <path android:fillColor="#38BDF8"
                  android:pathData="M26,38 C18,44 18,64 26,70 C30,73 32,70 32,54 C32,38 30,35 26,38 Z" />
              <path android:strokeColor="#F8FAFC" android:strokeWidth="2.2" android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M44,54 l4,-6 l4,10 l4,-10 l4,10 l4,-10 l4,6" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_monochrome.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M26,38 C18,44 18,64 26,70 C30,73 32,70 32,54 C32,38 30,35 26,38 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2.2" android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M34,22 h40 a8,8 0 0 1 8,8 v48 a8,8 0 0 1 -8,8 h-40 a8,8 0 0 1 -8,-8 v-48 a8,8 0 0 1 8,-8 z" />
          </vector>
          EOF

          # 10. Device database (25+ entries)
          cat << 'EOF' > app/src/main/assets/devices.json
          {
            "version": 1,
            "devices": [
              {"brand":"Google","model":"Pixel 9 Pro XL","width":1344,"height":2992,"dpi":480,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Google","model":"Pixel 9 Pro","width":1280,"height":2856,"dpi":480,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Google","model":"Pixel 9","width":1080,"height":2424,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Google","model":"Pixel 8 Pro","width":1344,"height":2992,"dpi":480,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Google","model":"Pixel 8","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Google","model":"Pixel 7 Pro","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Google","model":"Pixel 7","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Samsung","model":"Galaxy S24 Ultra","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Samsung","model":"Galaxy S24+","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Samsung","model":"Galaxy S24","width":1080,"height":2340,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Samsung","model":"Galaxy S23 Ultra","width":1440,"height":3088,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"OnePlus","model":"OnePlus 12","width":1440,"height":3168,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"OnePlus","model":"OnePlus 11","width":1440,"height":3216,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Xiaomi","model":"Xiaomi 14 Ultra","width":1440,"height":3200,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Xiaomi","model":"Xiaomi 14","width":1200,"height":2670,"dpi":460,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Nothing","model":"Phone (2)","width":1080,"height":2412,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Nothing","model":"Phone (1)","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Motorola","model":"Edge 50 Pro","width":1220,"height":2712,"dpi":440,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Sony","model":"Xperia 1 VI","width":1080,"height":2340,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"},
              {"brand":"Asus","model":"ROG Phone 8","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"RIGHT"}
