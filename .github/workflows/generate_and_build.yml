          package com.edge.bezelmorph.engine

          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.PowerManager
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import com.edge.bezelmorph.core.ConfigStore
          import com.edge.bezelmorph.core.MorphConfig
          import java.util.concurrent.ConcurrentHashMap

          class HardwareKeyMonitorService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var overlay: BezelOverlayView? = null
              private lateinit var store: ConfigStore
              private lateinit var haptics: HapticEngine
              private var config: MorphConfig = MorphConfig()
              private val lastTriggerMs = ConcurrentHashMap<Int, Long>()
              private val activeKeys = ConcurrentHashMap<Int, Boolean>()
              private var powerManager: PowerManager? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  store = ConfigStore(this)
                  haptics = HapticEngine(this)
                  powerManager = getSystemService(POWER_SERVICE) as? PowerManager
                  config = store.load()
                  attachOverlay()
              }

              private fun attachOverlay() {
                  if (overlay != null) return
                  try {
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          flags,
                          PixelFormat.TRANSLUCENT
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          params.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      }

                      overlay = BezelOverlayView(this).apply {
                          updateConfig(config)
                      }
                      wm?.addView(overlay, params)
                  } catch (_: Exception) {}
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  config = store.load()

                  // Any key can be a trigger: no hardcoded key list.
                  val code = event.keyCode
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      if (event.repeatCount == 0) {
                          if (!canTrigger(code)) return false
                          activeKeys[code] = true
                          haptics.press(config)
                          overlay?.let { v ->
                              v.updateConfig(config)
                              v.centerY = v.height * config.centerYRatio
                              v.onPress(code)
                          }
                      }
                  } else if (event.action == KeyEvent.ACTION_UP) {
                      if (activeKeys.remove(code) == true) {
                          haptics.release(config)
                          overlay?.onRelease()
                      }
                  }
                  return config.suppressVolumeUi
              }

              private fun canTrigger(code: Int): Boolean {
                  if (config.onlyWhenScreenOn && powerManager?.isInteractive == false) return false
                  if (config.onlyWhenUnlocked && !isUnlocked()) return false

                  val now = System.currentTimeMillis()
                  val last = lastTriggerMs[code] ?: 0L
                  if (now - last < 60_000L / config.rateLimitPerMinute.coerceAtLeast(1)) return false
                  lastTriggerMs[code] = now
                  return true
              }

              private fun isUnlocked(): Boolean {
                  val km = getSystemService(KEYGUARD_SERVICE) as? KeyguardManager ?: return true
                  return !km.isKeyguardLocked
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Used for foreground-package detection if per-app profiles are enabled.
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  try { overlay?.let { wm?.removeView(it) } } catch (_: Exception) {}
              }
          }
          EOF

