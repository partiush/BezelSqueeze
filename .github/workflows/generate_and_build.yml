        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <android/bitmap.h>
        #include <android/asset_manager.h>
        #include <android/asset_manager_jni.h>
        #include <android/log.h>
        #include <opencv2/opencv.hpp>
        #include "net.h"
        #include <deque>
        #include <mutex>
        #include <vector>

        #define LOG_TAG "ZoomCamera200x"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        static std::mutex gBurstMutex;
        static std::deque<cv::Mat> gBurstRingBuffer;
        static const size_t MAX_RING_BUFFER = 8;

        static std::mutex gTrackMutex;
        static cv::Mat gTargetTemplate;
        static cv::Point2f gTargetCenter(0.5f, 0.5f);
        static bool gHasTarget = false;

        static ncnn::Net gSrNet;
        static bool gNcnnReady = false;

        static cv::Mat bitmapToMat(JNIEnv* env, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return cv::Mat();
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return cv::Mat();
            cv::Mat rgba(info.height, info.width, CV_8UC4, pixels);
            cv::Mat bgr;
            cv::cvtColor(rgba, bgr, cv::COLOR_RGBA2BGR);
            AndroidBitmap_unlockPixels(env, bitmap);
            return bgr.clone();
        }

        static void matToBitmap(JNIEnv* env, const cv::Mat& bgr, jobject bitmap) {
            AndroidBitmapInfo info;
            void* pixels = nullptr;
            if (AndroidBitmap_getInfo(env, bitmap, &info) < 0) return;
            if (AndroidBitmap_lockPixels(env, bitmap, &pixels) < 0) return;
            cv::Mat resized;
            if (bgr.cols != (int)info.width || bgr.rows != (int)info.height) {
                cv::resize(bgr, resized, cv::Size(info.width, info.height), 0, 0, cv::INTER_LANCZOS4);
            } else {
                resized = bgr;
            }
            cv::Mat dstRgba(info.height, info.width, CV_8UC4, pixels);
            cv::cvtColor(resized, dstRgba, cv::COLOR_BGR2RGBA);
            AndroidBitmap_unlockPixels(env, bitmap);
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeInitAiEngine(JNIEnv* env, jobject, jobject assetManagerObj) {
            AAssetManager* mgr = AAssetManager_fromJava(env, assetManagerObj);
            if (!mgr) return;
            gSrNet.opt.use_vulkan_compute = false; // Safe universal CPU/ARM64 NEON mode across all devices
            gSrNet.opt.num_threads = 4;
            int retParam = gSrNet.load_param(mgr, "models/realesrgan-x4plus.param");
            int retBin = gSrNet.load_model(mgr, "models/realesrgan-x4plus.bin");
            gNcnnReady = (retParam == 0 && retBin == 0);
            LOGI("AI Engine initialized. NCNN Real-ESRGAN ready=%d", gNcnnReady);
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeLockTarget(JNIEnv* env, jobject, jobject frameBmp, jfloat normX, jfloat normY) {
            cv::Mat bgr = bitmapToMat(env, frameBmp);
            if (bgr.empty()) return;
            cv::Mat gray;
            cv::cvtColor(bgr, gray, cv::COLOR_BGR2GRAY);

            int patchSize = std::max(32, std::min(gray.cols, gray.rows) / 10);
            int cx = (int)(normX * gray.cols);
            int cy = (int)(normY * gray.rows);
            int x0 = std::clamp(cx - patchSize / 2, 0, gray.cols - patchSize);
            int y0 = std::clamp(cy - patchSize / 2, 0, gray.rows - patchSize);

            std::lock_guard<std::mutex> lock(gTrackMutex);
            gTargetTemplate = gray(cv::Rect(x0, y0, patchSize, patchSize)).clone();
            gTargetCenter = cv::Point2f(normX, normY);
            gHasTarget = true;
        }

        extern "C" JNIEXPORT jfloatArray JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeUpdateTargetLock(JNIEnv* env, jobject, jobject frameBmp) {
            std::lock_guard<std::mutex> lock(gTrackMutex);
            if (!gHasTarget || gTargetTemplate.empty()) return nullptr;

            cv::Mat bgr = bitmapToMat(env, frameBmp);
            if (bgr.empty()) return nullptr;
            cv::Mat gray;
            cv::cvtColor(bgr, gray, cv::COLOR_BGR2GRAY);

            int searchRadius = gTargetTemplate.cols * 2;
            int cx = (int)(gTargetCenter.x * gray.cols);
            int cy = (int)(gTargetCenter.y * gray.rows);

            int x0 = std::clamp(cx - searchRadius, 0, gray.cols - gTargetTemplate.cols - 1);
            int y0 = std::clamp(cy - searchRadius, 0, gray.rows - gTargetTemplate.rows - 1);
            int w = std::min(searchRadius * 2, gray.cols - x0);
            int h = std::min(searchRadius * 2, gray.rows - y0);

            if (w <= gTargetTemplate.cols || h <= gTargetTemplate.rows) return nullptr;

            cv::Mat searchWindow = gray(cv::Rect(x0, y0, w, h));
            cv::Mat result;
            cv::matchTemplate(searchWindow, gTargetTemplate, result, cv::TM_CCOEFF_NORMED);

            double minVal, maxVal;
            cv::Point minLoc, maxLoc;
            cv::minMaxLoc(result, &minVal, &maxVal, &minLoc, &maxLoc);

            if (maxVal > 0.45) {
                float matchedCx = (float)(x0 + maxLoc.x + gTargetTemplate.cols / 2) / (float)gray.cols;
                float matchedCy = (float)(y0 + maxLoc.y + gTargetTemplate.rows / 2) / (float)gray.rows;
                // Exponential smoothing so locked target never jitters
                gTargetCenter.x = gTargetCenter.x * 0.35f + matchedCx * 0.65f;
                gTargetCenter.y = gTargetCenter.y * 0.35f + matchedCy * 0.65f;
            }

            jfloatArray out = env->NewFloatArray(2);
            float coords[2] = { gTargetCenter.x, gTargetCenter.y };
            env->SetFloatArrayRegion(out, 0, 2, coords);
            return out;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeClearTargetLock(JNIEnv*, jobject) {
            std::lock_guard<std::mutex> lock(gTrackMutex);
            gHasTarget = false;
            gTargetTemplate.release();
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativePushBurstFrame(JNIEnv* env, jobject, jobject roiBmp) {
            cv::Mat bgr = bitmapToMat(env, roiBmp);
            if (bgr.empty()) return;

            cv::Mat stdMat;
            cv::resize(bgr, stdMat, cv::Size(480, 640), 0, 0, cv::INTER_LINEAR);

            std::lock_guard<std::mutex> lock(gBurstMutex);
            if (gBurstRingBuffer.size() >= MAX_RING_BUFFER) {
                gBurstRingBuffer.pop_front();
            }
            gBurstRingBuffer.push_back(stdMat);
        }

        extern "C" JNIEXPORT jint JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeProcessSuperResBurst(
            JNIEnv* env, jobject, jobject anchorRoiBmp, jobject outBitmap, jboolean crispTextMode
        ) {
            cv::Mat anchorRaw = bitmapToMat(env, anchorRoiBmp);
            if (anchorRaw.empty()) return 0;

            std::vector<cv::Mat> burst;
            {
                std::lock_guard<std::mutex> lock(gBurstMutex);
                for (const auto& f : gBurstRingBuffer) {
                    burst.push_back(f.clone());
                }
                gBurstRingBuffer.clear();
            }

            // Upscale the exact user capture frame (Reference Anchor) to Super-Res Drizzle grid
            const int srW = 960;
            const int srH = 1280;
            cv::Mat anchorHiRes;
            cv::resize(anchorRaw, anchorHiRes, cv::Size(srW, srH), 0, 0, cv::INTER_LANCZOS4);

            cv::Mat anchorGray;
            cv::cvtColor(anchorHiRes, anchorGray, cv::COLOR_BGR2GRAY);

            cv::Mat accumFloat;
            anchorHiRes.convertTo(accumFloat, CV_32FC3, 2.5); // High weight on user's exact reference shot
            cv::Mat weightSum = cv::Mat::ones(srH, srW, CV_32FC1) * 2.5f;

            int alignedCount = 1;

            // Align each background ring-buffer frame onto the exact user capture frame
            for (const auto& frame : burst) {
                cv::Mat candidateHi;
                cv::resize(frame, candidateHi, cv::Size(srW, srH), 0, 0, cv::INTER_CUBIC);
                cv::Mat candGray;
                cv::cvtColor(candidateHi, candGray, cv::COLOR_BGR2GRAY);

                // Estimate sub-pixel translation/rigid shift via phase correlation & ECC
                cv::Mat anchor32, cand32;
                anchorGray.convertTo(anchor32, CV_32F);
                candGray.convertTo(cand32, CV_32F);
                double response = 0.0;
                cv::Point2d shift = cv::phaseCorrelate(cand32, anchor32, cv::noArray(), &response);

                if (std::abs(shift.x) < srW * 0.20 && std::abs(shift.y) < srH * 0.20 && response > 0.12) {
                    cv::Mat warpMat = (cv::Mat_<double>(2, 3) << 1.0, 0.0, shift.x, 0.0, 1.0, shift.y);
                    cv::Mat aligned;
                    cv::warpAffine(candidateHi, aligned, warpMat, cv::Size(srW, srH), cv::INTER_LANCZOS4, cv::BORDER_REPLICATE);

                    // Per-pixel robustness mask: reject ghosting or moving objects that differ from anchorHiRes
                    cv::Mat diff, diffGray;
                    cv::absdiff(anchorHiRes, aligned, diff);
                    cv::cvtColor(diff, diffGray, cv::COLOR_BGR2GRAY);

                    cv::Mat validMask;
                    cv::threshold(diffGray, validMask, 28.0, 1.0, cv::THRESH_BINARY_INV);
                    validMask.convertTo(validMask, CV_32FC1);

                    cv::Mat alignedFloat;
                    aligned.convertTo(alignedFloat, CV_32FC3);

                    std::vector<cv::Mat> ch(3), accCh(3);
                    cv::split(alignedFloat, ch);
                    cv::split(accumFloat, accCh);
                    for (int c = 0; c < 3; ++c) {
                        accCh[c] += ch[c].mul(validMask);
                    }
                    cv::merge(accCh, accumFloat);
                    weightSum += validMask;
                    alignedCount++;
                }
            }

            std::vector<cv::Mat> finalCh(3);
            cv::split(accumFloat, finalCh);
            for (int c = 0; c < 3; ++c) {
                cv::divide(finalCh[c], weightSum, finalCh[c]);
            }
            cv::Mat fusedFloat, fused8U;
            cv::merge(finalCh, fusedFloat);
            fusedFloat.convertTo(fused8U, CV_8UC3);

            // Edge-preserving bilateral filter + LAB CLAHE local contrast recovery
            cv::Mat denoised;
            cv::bilateralFilter(fused8U, denoised, 5, 35, 35);

            cv::Mat lab;
            cv::cvtColor(denoised, lab, cv::COLOR_BGR2Lab);
            std::vector<cv::Mat> labPlanes;
            cv::split(lab, labPlanes);
            cv::Ptr<cv::CLAHE> clahe = cv::createCLAHE(crispTextMode ? 2.8 : 1.8, cv::Size(8, 8));
            clahe->apply(labPlanes[0], labPlanes[0]);
            cv::merge(labPlanes, lab);
            cv::Mat contrastRecovered;
            cv::cvtColor(lab, contrastRecovered, cv::COLOR_Lab2BGR);

            // Anti-Gibberish Deconvolution / Unsharp Masking for crisp edges & text strokes
            cv::Mat blurred, detailEnhanced;
            cv::GaussianBlur(contrastRecovered, blurred, cv::Size(0, 0), crispTextMode ? 1.8 : 1.4);
            double amount = crispTextMode ? 1.85 : 1.35;
            cv::addWeighted(contrastRecovered, 1.0 + amount, blurred, -amount, 0, detailEnhanced);

            matToBitmap(env, detailEnhanced, outBitmap);
            return alignedCount;
        }

        extern "C" JNIEXPORT void JNICALL
        Java_com_example_zoomcamera_MainActivity_nativeSharpenTextRegions(
            JNIEnv* env, jobject, jobject remasteredBmp, jintArray flatBoxes
        ) {
            cv::Mat img = bitmapToMat(env, remasteredBmp);
            if (img.empty()) return;

            jsize len = env->GetArrayLength(flatBoxes);
            jint* ptr = env->GetIntArrayElements(flatBoxes, nullptr);

            for (int i = 0; i + 3 < len; i += 4) {
                int x = std::max(0, ptr[i] - 8);
                int y = std::max(0, ptr[i + 1] - 8);
                int w = std::min(img.cols - x, ptr[i + 2] + 16);
                int h = std::min(img.rows - y, ptr[i + 3] + 16);
                if (w <= 8 || h <= 8) continue;

                cv::Rect box(x, y, w, h);
                cv::Mat roi = img(box);

                // Boost stroke definition inside detected text boxes without hallucinating fake characters
                cv::Mat lab;
                cv::cvtColor(roi, lab, cv::COLOR_BGR2Lab);
                std::vector<cv::Mat> ch;
                cv::split(lab, ch);
                cv::normalize(ch[0], ch[0], 0, 255, cv::NORM_MINMAX);
                cv::Mat sharpL, blurL;
                cv::GaussianBlur(ch[0], blurL, cv::Size(0, 0), 1.1);
                cv::addWeighted(ch[0], 2.2, blurL, -1.2, 0, ch[0]);
                cv::merge(ch, lab);
                cv::cvtColor(lab, roi, cv::COLOR_Lab2BGR);
            }

            env->ReleaseIntArrayElements(flatBoxes, ptr, JNI_ABORT);
            matToBitmap(env, img, remasteredBmp);
        }
        EOF

    - name: Setup Gradle Wrapper and Build APK
      run: |
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload 200x AI Camera APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 200x-Ultra-Zoom-AI-Camera-APK
        path: app/build/outputs/apk/debug/app-debug.apk
