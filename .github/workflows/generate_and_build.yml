          package com.edge.bezelmorph.engine

          import android.graphics.*
          import android.graphics.LinearGradient
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import com.edge.bezelmorph.core.FillMode
          import com.edge.bezelmorph.core.MorphConfig
          import kotlin.math.cos
          import kotlin.math.sin

          object FillProvider {
              fun paintFor(config: MorphConfig, bounds: RectF): Paint {
                  val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.FILL
                      isDither = true
                  }
                  when (config.fillMode) {
                      FillMode.SOLID -> p.color = config.fillColor
                      FillMode.LINEAR_GRADIENT -> {
                          val rad = Math.toRadians(config.gradientAngleDeg.toDouble())
                          val dx = cos(rad).toFloat() * bounds.width() / 2f
                          val dy = sin(rad).toFloat() * bounds.height() / 2f
                          p.shader = LinearGradient(
                              bounds.centerX() - dx, bounds.centerY() - dy,
                              bounds.centerX() + dx, bounds.centerY() + dy,
                              intArrayOf(config.fillColor, config.fillColor2),
                              null, Shader.TileMode.CLAMP
                          )
                      }
                      FillMode.RADIAL_GRADIENT -> {
                          p.shader = RadialGradient(
                              bounds.centerX(), bounds.centerY(),
                              maxOf(bounds.width(), bounds.height()) / 2f,
                              intArrayOf(config.fillColor, config.fillColor2),
                              floatArrayOf(0f, 1f), Shader.TileMode.CLAMP
                          )
                      }
                      FillMode.GLASS -> {
                          val g = LinearGradient(
                              bounds.left, bounds.top, bounds.right, bounds.bottom,
                              intArrayOf(
                                  0x66FFFFFF, 0x22FFFFFF, 0x11000000, 0x88000000
                              ), null, Shader.TileMode.CLAMP
                          )
                          p.shader = g
                          p.alpha = 210
                      }
                      FillMode.METAL -> {
                          val g = LinearGradient(
                              bounds.left, bounds.top, bounds.right, bounds.bottom,
                              intArrayOf(
                                  0xFF6B7280.toInt(), 0xFF9CA3AF.toInt(),
                                  0xFF4B5563.toInt(), 0xFF9CA3AF.toInt()
                              ),
                              floatArrayOf(0f, 0.3f, 0.7f, 1f), Shader.TileMode.CLAMP
                          )
                          p.shader = g
                      }
                      FillMode.MATTE -> {
                          p.color = config.fillColor
                          p.alpha = 245
                      }
                  }
                  return p
              }
          }
