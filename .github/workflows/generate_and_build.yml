        import android.view.MotionEvent
        import android.view.ScaleGestureDetector
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.camera2.interop.Camera2Interop
        import androidx.camera.core.*
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.camera.view.PreviewView
        import androidx.cardview.widget.CardView
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import androidx.lifecycle.lifecycleScope
        import com.google.mlkit.vision.common.InputImage
        import com.google.mlkit.vision.text.TextRecognition
        import com.google.mlkit.vision.text.latin.TextRecognizerOptions
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.tasks.await
        import kotlinx.coroutines.withContext
        import java.io.OutputStream
        import java.util.concurrent.Executors
        import kotlin.math.min

        class MainActivity : AppCompatActivity(), SensorEventListener {

            private lateinit var rawPreviewView: PreviewView
            private lateinit var zoomViewfinder: StabilizedZoomView
            private lateinit var pipContainer: CardView
            private lateinit var pipGuideView: SamsungPipGuideView
            private lateinit var tvHudStatus: TextView
            private lateinit var tvZoomReadout: TextView
            private lateinit var tvOcrResult: TextView
            private lateinit var seekZoom: SeekBar
            private lateinit var seekExposure: SeekBar
            private lateinit var ivLastPhoto: ImageView

            private var camera: Camera? = null
            private var lensFacing = CameraSelector.LENS_FACING_BACK
            private var flashMode = ImageCapture.FLASH_MODE_OFF
            private var aiTextMode = true

            private var totalZoom = 1.0f
            private var maxHardwareZoom = 8.0f
            private var currentSoftwareZoom = 1.0f

            // Stabilization & Target Lock state
            private lateinit var sensorManager: SensorManager
            private var gyroSensor: Sensor? = null
            private var gyroOffsetX = 0f
            private var gyroOffsetY = 0f
            private var lastGyroTimestamp = 0L

            @Volatile private var isTargetLocked = false
            @Volatile private var normTargetX = 0.5f
            @Volatile private var normTargetY = 0.5f

            @Volatile private var latestFullFrameBitmap: Bitmap? = null
            private val analysisExecutor = Executors.newSingleThreadExecutor()
            private val textRecognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                rawPreviewView = findViewById(R.id.rawPreviewView)
                zoomViewfinder = findViewById(R.id.zoomViewfinder)
                pipContainer = findViewById(R.id.pipContainer)
                pipGuideView = findViewById(R.id.pipGuideView)
                tvHudStatus = findViewById(R.id.tvHudStatus)
                tvZoomReadout = findViewById(R.id.tvZoomReadout)
                tvOcrResult = findViewById(R.id.tvOcrResult)
                seekZoom = findViewById(R.id.seekZoom)
                seekExposure = findViewById(R.id.seekExposure)
                ivLastPhoto = findViewById(R.id.ivLastPhoto)

                sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE)

                nativeInitAiEngine(assets)
                setupUIListeners()
                setupTouchAndTargetLock()

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                } else {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                }
            }

            override fun onResume() {
                super.onResume()
                gyroSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
            }

            override fun onPause() {
                super.onPause()
                sensorManager.unregisterListener(this)
            }

            private fun setupUIListeners() {
                val presetMap = mapOf(
                    R.id.btnZ1 to 1.0f,
                    R.id.btnZ5 to 5.0f,
                    R.id.btnZ15 to 15.0f,
                    R.id.btnZ50 to 50.0f,
                    R.id.btnZ100 to 100.0f,
                    R.id.btnZ200 to 200.0f
                )
                presetMap.forEach { (id, zoomVal) ->
                    findViewById<Button>(id).setOnClickListener { applyZoom(zoomVal, updateSlider = true) }
                }

                seekZoom.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                        if (fromUser) {
                            val z = 1.0f + (progress / 10.0f)
                            applyZoom(z, updateSlider = false)
                        }
                    }
                    override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                    override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                })

                seekExposure.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                        val state = camera?.cameraInfo?.exposureState ?: return
                        if (!state.isExposureCompensationSupported) return
                        val range = state.exposureCompensationRange
                        val index = (range.lower + ((progress / 100f) * (range.upper - range.lower))).toInt()
                        camera?.cameraControl?.setExposureCompensationIndex(index)
                    }
                    override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                    override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                })

                findViewById<Button>(R.id.btnFlash).setOnClickListener { view ->
                    val btn = view as Button
                    flashMode = when (flashMode) {
                        ImageCapture.FLASH_MODE_OFF -> {
                            camera?.cameraControl?.enableTorch(true)
                            btn.text = "FLASH: TORCH"
                            ImageCapture.FLASH_MODE_ON
                        }
                        else -> {
                            camera?.cameraControl?.enableTorch(false)
                            btn.text = "FLASH: OFF"
                            ImageCapture.FLASH_MODE_OFF
                        }
                    }
                }

                findViewById<Button>(R.id.btnMode).setOnClickListener { view ->
                    val btn = view as Button
                    aiTextMode = !aiTextMode
                    btn.text = if (aiTextMode) "MODE: AI TEXT + ULTRA SR" else "MODE: NATURAL MULTI-FRAME"
                }

                findViewById<Button>(R.id.btnFlip).setOnClickListener {
                    lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                        CameraSelector.LENS_FACING_FRONT
                    } else {
                        CameraSelector.LENS_FACING_BACK
                    }
                    startCamera()
                }

                findViewById<Button>(R.id.btnUnlockTarget).setOnClickListener {
                    isTargetLocked = false
                    normTargetX = 0.5f
                    normTargetY = 0.5f
                    gyroOffsetX = 0f
                    gyroOffsetY = 0f
                    nativeClearTargetLock()
                    tvHudStatus.text = "OIS+EIS ACTIVE | Hold screen to Lock Target"
                }

                findViewById<Button>(R.id.btnCapture).setOnClickListener {
                    captureAndRemasterExactFrame()
                }
            }

            private fun setupTouchAndTargetLock() {
                val scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    override fun onScale(detector: ScaleGestureDetector): Boolean {
                        val updated = (totalZoom * detector.scaleFactor).coerceIn(1.0f, 200.0f)
                        applyZoom(updated, updateSlider = true)
                        return true
                    }
                })

                val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        val factory = SurfaceOrientedMeteringPointFactory(
                            zoomViewfinder.width.toFloat(),
                            zoomViewfinder.height.toFloat()
                        )
                        val point = factory.createPoint(e.x, e.y)
                        camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(point).build())
                        return true
                    }

                    override fun onLongPress(e: MotionEvent) {
                        val frame = latestFullFrameBitmap ?: return
                        val crop = zoomViewfinder.getCurrentCropRect(frame.width, frame.height)
                        val relX = (e.x / zoomViewfinder.width.toFloat()).coerceIn(0f, 1f)
                        val relY = (e.y / zoomViewfinder.height.toFloat()).coerceIn(0f, 1f)

                        val lockedPxX = crop.left + relX * crop.width()
                        val lockedPxY = crop.top + relY * crop.height()

                        normTargetX = (lockedPxX / frame.width).coerceIn(0.1f, 0.9f)
                        normTargetY = (lockedPxY / frame.height).coerceIn(0.1f, 0.9f)
                        gyroOffsetX = 0f
                        gyroOffsetY = 0f

                        nativeLockTarget(frame, normTargetX, normTargetY)
                        isTargetLocked = true
                        tvHudStatus.text = "TARGET LOCKED (${String.format("%.1fx", totalZoom)}) - Tracking Active"
                        Toast.makeText(this@MainActivity, "Target Locked! Stabilizing on object...", Toast.LENGTH_SHORT).show()
                    }
                })

                zoomViewfinder.setOnTouchListener { _, event ->
                    scaleDetector.onTouchEvent(event)
                    gestureDetector.onTouchEvent(event)
                    true
                }
            }

            private fun applyZoom(desiredZoom: Float, updateSlider: Boolean) {
                totalZoom = desiredZoom.coerceIn(1.0f, 200.0f)
                val hwZoom = min(totalZoom, maxHardwareZoom)
                camera?.cameraControl?.setZoomRatio(hwZoom)
                currentSoftwareZoom = (totalZoom / hwZoom).coerceAtLeast(1.0f)

                tvZoomReadout.text = String.format("%.1fx", totalZoom)
                if (updateSlider) {
                    seekZoom.progress = ((totalZoom - 1.0f) * 10f).toInt()
                }

                // Show Samsung-style Picture-in-Picture Zoom Map whenever zoom exceeds 15x
                pipContainer.visibility = if (totalZoom > 15.0f) View.VISIBLE else View.GONE
            }

            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    val provider = cameraProviderFuture.get()
                    provider.unbindAll()

                    val previewBuilder = Preview.Builder()
                    Camera2Interop.Extender(previewBuilder)
                        .setCaptureRequestOption(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE, CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON)
                        .setCaptureRequestOption(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON)
                    val preview = previewBuilder.build().also {
                        it.setSurfaceProvider(rawPreviewView.surfaceProvider)
                    }

                    val analysisBuilder = ImageAnalysis.Builder()
                        .setTargetResolution(Size(1920, 1440))
                        .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                        .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)

                    Camera2Interop.Extender(analysisBuilder)
                        .setCaptureRequestOption(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE, CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON)
                        .setCaptureRequestOption(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON)

                    val imageAnalysis = analysisBuilder.build()
                    imageAnalysis.setAnalyzer(analysisExecutor) { imageProxy ->
                        processLiveFrame(imageProxy)
                    }

                    val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()
                    camera = provider.bindToLifecycle(this, selector, preview, imageAnalysis)

                    maxHardwareZoom = (camera?.cameraInfo?.zoomState?.value?.maxZoomRatio ?: 8.0f).coerceAtLeast(1.0f)
                    applyZoom(totalZoom, updateSlider = true)
                }, ContextCompat.getMainExecutor(this))
            }

            private fun processLiveFrame(imageProxy: ImageProxy) {
                try {
                    val rawBmp = imageProxy.toBitmap()
                    val rotation = imageProxy.imageInfo.rotationDegrees
                    val rotatedBmp = if (rotation != 0) {
                        val matrix = Matrix().apply { postRotate(rotation.toFloat()) }
                        Bitmap.createBitmap(rawBmp, 0, 0, rawBmp.width, rawBmp.height, matrix, true)
                    } else {
                        rawBmp
                    }

                    latestFullFrameBitmap = rotatedBmp

                    // 1. Update optical target lock or gyro stabilization center
                    var activeX = (normTargetX + gyroOffsetX).coerceIn(0.08f, 0.92f)
                    var activeY = (normTargetY + gyroOffsetY).coerceIn(0.08f, 0.92f)

                    if (isTargetLocked) {
                        val tracked = nativeUpdateTargetLock(rotatedBmp)
                        if (tracked != null && tracked.size == 2) {
                            normTargetX = tracked[0].coerceIn(0.08f, 0.92f)
                            normTargetY = tracked[1].coerceIn(0.08f, 0.92f)
                            activeX = normTargetX
                            activeY = normTargetY
                        }
                    }

                    // 2. Push stabilized ROI into zero-lag C++ circular ring buffer when zoomed
                    val cropRect = zoomViewfinder.getCurrentCropRect(rotatedBmp.width, rotatedBmp.height)
                    if (totalZoom >= 2.0f) {
                        val roiBmp = Bitmap.createBitmap(
                            rotatedBmp,
                            cropRect.left,
                            cropRect.top,
                            cropRect.width(),
                            cropRect.height()
                        )
                        nativePushBurstFrame(roiBmp)
                    }

                    // 3. Render live 200x stabilized viewfinder + 15x+ PiP guide window
                    zoomViewfinder.updateFrame(rotatedBmp, currentSoftwareZoom, activeX, activeY, isTargetLocked)
                    if (totalZoom > 15.0f) {
                        pipGuideView.updateGuide(rotatedBmp, currentSoftwareZoom, activeX, activeY, isTargetLocked)
                    }
                } catch (_: Exception) {
                } finally {
                    imageProxy.close()
                }
            }

            private fun captureAndRemasterExactFrame() {
                val anchorFullFrame = latestFullFrameBitmap ?: run {
                    Toast.makeText(this, "Camera warming up...", Toast.LENGTH_SHORT).show()
                    return
                }

                // Anchor strictly to the exact crop & position on screen at the moment of shutter click
                val exactCrop: Rect = zoomViewfinder.getCurrentCropRect(anchorFullFrame.width, anchorFullFrame.height)
                val exactAnchorRoi = Bitmap.createBitmap(
                    anchorFullFrame,
                    exactCrop.left,
                    exactCrop.top,
                    exactCrop.width(),
                    exactCrop.height()
                )

                tvHudStatus.text = "ALIGNING BURST + AI REMASTERING (ANCHORED TO SHOT)..."
                tvOcrResult.visibility = View.GONE

                lifecycleScope.launch(Dispatchers.Default) {
                    // Stage 1-3: Sub-pixel Multi-Frame Drizzle + Deconvolution + NCNN Real-ESRGAN (anchored to exactAnchorRoi)
                    val remasteredBmp = Bitmap.createBitmap(960, 1280, Bitmap.Config.ARGB_8888)
                    val mergedCount = nativeProcessSuperResBurst(exactAnchorRoi, remasteredBmp, aiTextMode)

                    // Stage 4: On-Device AI Text Recognition (ML Kit) + Anti-Gibberish Stroke Sharpening
                    var detectedText = ""
                    if (aiTextMode) {
                        try {
                            val visionImg = InputImage.fromBitmap(remasteredBmp, 0)
                            val result = textRecognizer.process(visionImg).await()
                            if (result.text.isNotBlank()) {
                                detectedText = result.text.trim()
                                val boxes = result.textBlocks.mapNotNull { it.boundingBox }
                                val flatBoxes = IntArray(boxes.size * 4)
                                boxes.forEachIndexed { idx, r ->
                                    flatBoxes[idx * 4] = r.left
                                    flatBoxes[idx * 4 + 1] = r.top
                                    flatBoxes[idx * 4 + 2] = r.width()
                                    flatBoxes[idx * 4 + 3] = r.height()
                                }
                                if (flatBoxes.isNotEmpty()) {
                                    nativeSharpenTextRegions(remasteredBmp, flatBoxes)
                                }
                            }
                        } catch (_: Exception) {}
                    }

                    saveBitmapToGallery(remasteredBmp)

                    withContext(Dispatchers.Main) {
                        ivLastPhoto.setImageBitmap(remasteredBmp)
                        tvHudStatus.text = "SAVED! Merged $mergedCount burst frames @ ${String.format("%.1fx", totalZoom)}"
                        if (detectedText.isNotEmpty()) {
                            tvOcrResult.text = "AI READABLE TEXT DETECTED:\n$detectedText"
                            tvOcrResult.visibility = View.VISIBLE
                        }
                        Toast.makeText(
                            this@MainActivity,
                            "Saved 200x AI Remastered Photo ($mergedCount frames fused)!",
                            Toast.LENGTH_SHORT
                        ).show()
                    }
                }
            }

            private fun saveBitmapToGallery(bitmap: Bitmap) {
                val filename = "UltraZoom200x_${System.currentTimeMillis()}.jpg"
                val values = ContentValues().apply {
                    put(MediaStore.Images.Media.DISPLAY_NAME, filename)
                    put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/UltraZoom200x")
                    }
                }
                val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values) ?: return
                contentResolver.openOutputStream(uri)?.use { out: OutputStream ->
                    bitmap.compress(Bitmap.CompressFormat.JPEG, 98, out)
                }
            }

            override fun onSensorChanged(event: SensorEvent?) {
                if (event?.sensor?.type != Sensor.TYPE_GYROSCOPE) return
                if (lastGyroTimestamp != 0L && !isTargetLocked && totalZoom > 3.0f) {
                    val dt = (event.timestamp - lastGyroTimestamp) * 1e-9f
                    // Counteract subtle hand pitch/yaw micro-tremors inversely proportional to zoom
                    val damping = (0.04f / currentSoftwareZoom.coerceAtLeast(1.0f))
                    gyroOffsetX = (gyroOffsetX - event.values[1] * dt * damping).coerceIn(-0.15f, 0.15f)
                    gyroOffsetY = (gyroOffsetY + event.values[0] * dt * damping).coerceIn(-0.15f, 0.15f)
                    // Gently recenter drift
                    gyroOffsetX *= 0.96f
                    gyroOffsetY *= 0.96f
                }
                lastGyroTimestamp = event.timestamp
            }

            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                }
            }

            external fun nativeInitAiEngine(assetManager: AssetManager)
            external fun nativeLockTarget(frame: Bitmap, normX: Float, normY: Float)
            external fun nativeUpdateTargetLock(frame: Bitmap): FloatArray?
            external fun nativeClearTargetLock()
            external fun nativePushBurstFrame(roiFrame: Bitmap)
            external fun nativeProcessSuperResBurst(anchorRoi: Bitmap, outBitmap: Bitmap, crispTextMode: Boolean): Int
            external fun nativeSharpenTextRegions(remasteredBitmap: Bitmap, flatBoxes: IntArray)

            companion object {
                init {
                    System.loadLibrary("zoomcamera")
                }
            }
        }
