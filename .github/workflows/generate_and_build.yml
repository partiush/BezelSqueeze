name: Build BezelMorph Production APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Scaffold BezelMorph Complete Project
        run: |
          set -e
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/edge/bezelmorph/core
          mkdir -p app/src/main/java/com/edge/bezelmorph/engine
          mkdir -p app/src/main/java/com/edge/bezelmorph/ui
          mkdir -p app/src/main/java/com/edge/bezelmorph/integration
          mkdir -p app/src/main/java/com/edge/bezelmorph/shader

          ############################################################
          # 1. gradle.properties
          ############################################################
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8
          android.enableR8.fullMode=true
          android.enableJetifier=false
          EOF

          ############################################################
          # 2. settings.gradle.kts
          ############################################################
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BezelMorph"
          include(":app")
          EOF

          ############################################################
          # 3. Root build.gradle.kts (AGP 9 has built-in Kotlin)
          ############################################################
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "9.0.1" apply false
          }
          EOF

          ############################################################
          # 4. app/build.gradle.kts
          ############################################################
          cat << 'EOF' > app/build.gradle.kts
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.edge.bezelmorph"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.edge.bezelmorph"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 100
                  versionName = "100.0.0"
                  resourceConfigurations += listOf("en", "fr", "de", "hi", "ja", "zh", "es")
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                      applicationIdSuffix = ".debug"
                  }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      // Release signing from GitHub Secrets
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              signingConfigs {
                  create("release") {
                      val ks = System.getenv("KEYSTORE_BASE64")
                      if (ks != null) {
                          storeFile = file("release.keystore")
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }

              kotlin {
                  compilerOptions {
                      jvmTarget.set(JvmTarget.JVM_21)
                      freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
                  }
              }

              buildFeatures {
                  viewBinding = true
                  buildConfig = true
              }

              packaging {
                  resources.excludes += setOf(
                      "META-INF/AL2.0", "META-INF/LGPL2.1",
                      "META-INF/DEPENDENCIES", "META-INF/LICENSE*"
                  )
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.1.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
              implementation("androidx.preference:preference-ktx:1.2.1")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # Keep schema reflection (if any)
          -keepclassmembers class com.edge.bezelmorph.core.ConfigSchema* { *; }
          -keepclassmembers class com.edge.bezelmorph.core.MorphConfig { *; }
          # Shader strings are accessed by name
          -keep class com.edge.bezelmorph.shader.ShaderLibrary { *; }
          EOF

          ############################################################
          # 5. AndroidManifest.xml
          ############################################################
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MorphEdge"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".ui.MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".engine.HardwareKeyMonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="@string/service_label">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/button_event_service_config" />
                  </service>

                  <service
                      android:name=".integration.QuickSettingsTile"
                      android:exported="true"
                      android:icon="@drawable/ic_qs_tile"
                      android:label="@string/qs_tile_label"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".integration.BezelWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/bezel_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".integration.BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="android.app.shortcuts"
                      android:resource="@xml/shortcuts" />
              </application>
          </manifest>
          EOF

          ############################################################
          # 6. Accessibility service XML
          ############################################################
          cat << 'EOF' > app/src/main/res/xml/button_event_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_description"
              android:notificationTimeout="50" />
          EOF

          ############################################################
          # 7. Backup rules
          ############################################################
          cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="sharedpref" path="bezel_morph_pref.xml" />
          </full-backup-content>
          EOF

          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="sharedpref" path="bezel_morph_pref.xml" />
              </cloud-backup>
              <device-transfer>
                  <include domain="sharedpref" path="bezel_morph_pref.xml" />
              </device-transfer>
          </data-extraction-rules>
          EOF

          ############################################################
          # 8. Strings / Styles / Colors
          ############################################################
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bezel Morph</string>
              <string name="service_label">Bezel Morph Engine</string>
              <string name="service_description">Renders the physical button displacement on the display edge with haptic feedback.</string>
              <string name="qs_tile_label">Bezel Morph</string>
              <string name="widget_label">Bezel Morph</string>
              <string name="permission_title">System Authorization</string>
              <string name="permission_subtitle">Grant accessibility and overlay access to align the physics with your device\'s physical switches.</string>
              <string name="accessibility_title">Accessibility Interceptor</string>
              <string name="accessibility_desc">Monitors hardware key events directly from the system input pipeline.</string>
              <string name="overlay_title">Display Perimeter Layer</string>
              <string name="overlay_desc">Draws the deformation directly against the display cutouts.</string>
              <string name="capture_title">Screen Refraction (Optional)</string>
              <string name="capture_desc">Captures the screen so the bulge can refract the actual content behind it.</string>
              <string name="grant">Grant</string>
              <string name="granted">Granted</string>
              <string name="dashboard_title">Physical Edge Calibrator</string>
              <string name="dashboard_subtitle">Every parameter below is live. The preview updates as you drag.</string>
              <string name="teach_key">Teach a New Key</string>
              <string name="teach_key_prompt">Press any hardware key now…</string>
              <string name="teach_key_success">Key captured: %1$s</string>
              <string name="calibrate_tap">Tap to Place Button Center</string>
              <string name="calibrate_drag_size">Drag to Size Plateau</string>
              <string name="calibrate_drag_depth">Drag to Set Depth</string>
              <string name="save_profile">Save Profile</string>
              <string name="load_profile">Load Profile</string>
              <string name="export_config">Export JSON</string>
              <string name="import_config">Import JSON</string>
              <string name="test_haptic">Test Haptic</string>
              <string name="reset_defaults">Reset Defaults</string>
              <string name="advanced">Advanced</string>
              <string name="reduce_motion">Reduce Motion</string>
              <string name="suppress_volume_ui">Suppress system volume UI</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/morph_bg</item>
                  <item name="android:statusBarColor">@color/morph_bg</item>
                  <item name="android:navigationBarColor">@color/morph_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:enforceStatusBarContrast">false</item>
                  <item name="android:enforceNavigationBarContrast">false</item>
              </style>
              <style name="Widget.MorphEdge.Slider" parent="Widget.Material3.Slider" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="morph_bg">#0F172A</color>
              <color name="morph_surface">#1E293B</color>
              <color name="morph_accent">#38BDF8</color>
              <color name="morph_text">#F8FAFC</color>
              <color name="morph_muted">#94A3B8</color>
              <color name="morph_success">#10B981</color>
              <color name="morph_danger">#EF4444</color>
              <color name="morph_icon_bg">#1E293B</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/styles.xml
          <resources>
              <style name="Theme.MorphEdge" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/morph_bg</item>
                  <item name="android:statusBarColor">@color/morph_bg</item>
                  <item name="android:navigationBarColor">@color/morph_bg</item>
              </style>
          </resources>
          EOF

          ############################################################
          # 9. App Icon (adaptive, vector, monochrome)
          ############################################################
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#0F172A" />
          </shape>
          EOF

          # The mark: a phone silhouette with a bulging left edge and a spring
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- Phone body -->
              <path
                  android:fillColor="#1E293B"
                  android:pathData="M34,22 h40 a8,8 0 0 1 8,8 v48 a8,8 0 0 1 -8,8 h-40 a8,8 0 0 1 -8,-8 v-48 a8,8 0 0 1 8,-8 z" />

              <!-- Bulging edge -->
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M26,38 C18,44 18,64 26,70 C30,73 32,70 32,54 C32,38 30,35 26,38 Z" />

              <!-- Spring coil -->
              <path
                  android:strokeColor="#F8FAFC"
                  android:strokeWidth="2.2"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M44,54 l4,-6 l4,10 l4,-10 l4,10 l4,-10 l4,6" />

              <!-- Screen line -->
              <path
                  android:strokeColor="#334155"
                  android:strokeWidth="1.4"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M42,80 h24" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_monochrome.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M26,38 C18,44 18,64 26,70 C30,73 32,70 32,54 C32,38 30,35 26,38 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2.2"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M34,22 h40 a8,8 0 0 1 8,8 v48 a8,8 0 0 1 -8,8 h-40 a8,8 0 0 1 -8,-8 v-48 a8,8 0 0 1 8,-8 z" />
          </vector>
          EOF

          ############################################################
          # 10. Device database asset (curated; fetches extended list on first run)
          ############################################################
          cat << 'EOF' > app/src/main/assets/devices.json
          {
            "version": 1,
            "generated": "2026-11-01",
            "devices": [
              {"brand":"Google","model":"Pixel 9 Pro XL","width":1344,"height":2992,"dpi":480,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 9 Pro","width":1280,"height":2856,"dpi":480,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 9","width":1080,"height":2424,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 8 Pro","width":1344,"height":2992,"dpi":480,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 8","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 7 Pro","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 7","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 6 Pro","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Google","model":"Pixel 6","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Samsung","model":"Galaxy S24 Ultra","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Samsung","model":"Galaxy S24+","width":1440,"height":3120,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Samsung","model":"Galaxy S24","width":1080,"height":2340,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Samsung","model":"Galaxy S23 Ultra","width":1440,"height":3088,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Samsung","model":"Galaxy S23","width":1080,"height":2340,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"OnePlus","model":"OnePlus 12","width":1440,"height":3168,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"OnePlus","model":"OnePlus 11","width":1440,"height":3216,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Xiaomi","model":"Xiaomi 14 Ultra","width":1440,"height":3200,"dpi":560,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Xiaomi","model":"Xiaomi 14","width":1200,"height":2670,"dpi":460,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Xiaomi","model":"Redmi Note 13 Pro","width":1220,"height":2712,"dpi":440,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Motorola","model":"Edge 50 Pro","width":1220,"height":2712,"dpi":440,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Nothing","model":"Phone (2)","width":1080,"height":2412,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Nothing","model":"Phone (1)","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Sony","model":"Xperia 1 VI","width":1080,"height":2340,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"},
              {"brand":"Asus","model":"ROG Phone 8","width":1080,"height":2400,"dpi":420,"volUpY":0.228,"volDownY":0.315,"edge":"right"}
            ]
          }
          EOF

          ############################################################
          # 11. Kotlin — Core schema & config
          ############################################################
          cat << 'EOF' > app/src/main/java/com/edge/bezelmorph/core/MorphConfig.kt
          package com.edge.bezelmorph.core

          import android.graphics.Color
          import org.json.JSONObject

          /**
           * Every user-tunable value lives here. The ConfigSchema generates the UI from this
           * data class via reflection-free field descriptors, so adding a field to the schema
           * automatically adds a control to the dashboard.
           */
          data class MorphConfig(
              // ---- Geometry ----
              var edge: Edge = Edge.RIGHT,
              var centerYRatio: Float = 0.228f,
              var y0Dp: Float = 28f,          // plateau half-length
              var wDp: Float = 38f,           // shoulder transition
              var depthDp: Float = 16f,       // peak amplitude
              var rotationDeg: Float = 0f,

              // ---- Shape ----
              var shapeProfile: ShapeProfile = ShapeProfile.QUINTIC_SMOOTHERSTEP,
              var customProfile: FloatArray = floatArrayOf(),

              // ---- Physics ----
              var omegaN: Float = 68f,
              var zeta: Float = 0.88f,
              var inwardVelocity: Float = 2400f,
              var pressDurationMs: Int = 0,    // 0 = instant impulse
              var releaseDelayMs: Int = 0,
              var overshootPct: Float = 0f,
              var bounceCount: Int = 0,
              var settleEpsilon: Float = 0.2f,

              // ---- Fill ----
              var fillMode: FillMode = FillMode.SOLID,
              var fillColor: Int = Color.BLACK,
              var fillColor2: Int = Color.BLACK,
              var gradientAngleDeg: Float = 90f,
              var glassEnabled: Boolean = false,
              var innerShadow: Boolean = true,
              var outerGlow: Boolean = false,
              var glowColor: Int = 0xFF38BDF8.toInt(),
              var rimLight: Boolean = true,
              var shaderPreset: ShaderPreset = ShaderPreset.NONE,

              // ---- Haptics ----
              var hapticEnabled: Boolean = true,
              var hapticIntensity: Float = 1f,
              var pressEffect: Int = 0,        // VibrationEffect preset index
              var releaseEffect: Int = 1,
              var holdTickMs: Int = 250,
              var hapticUsage: Int = 0,        // 0 = hardware feedback

              // ---- Behavior ----
              var suppressVolumeUi: Boolean = false,
              var holdBehavior: HoldBehavior = HoldBehavior.STAY,
              var rateLimitPerMinute: Int = 60,
              var onlyWhenScreenOn: Boolean = true,
              var onlyWhenUnlocked: Boolean = false,
              var reduceMotion: Boolean = false,
              var adaptiveFps: Boolean = true,

              // ---- Visuals ----
              var dimScreenBehind: Boolean = false,
              var rippleEnabled: Boolean = false,
              var shimmerEnabled: Boolean = false,

              // ---- Advanced ----
              var substepping: Boolean = true,
              var maxFps: Int = 120,
              var debugOverlay: Boolean = false
          )

          enum class Edge { LEFT, RIGHT, TOP, BOTTOM }
          enum class ShapeProfile { QUINTIC_SMOOTHERSTEP, GAUSSIAN, SINE, TRIANGLE, TRAPEZOID, CUSTOM }
          enum class FillMode { SOLID, LINEAR_GRADIENT, RADIAL_GRADIENT, GLASS, METAL, MATTE }
          enum class ShaderPreset { NONE, LIQUID_GLASS, CHROME, JELLY, WATER, CAUSTICS }
          enum class HoldBehavior { STAY, DECAY, PULSE }

          fun MorphConfig.toJson(): JSONObject = JSONObject().apply {
              put("edge", edge.name); put("centerYRatio", centerYRatio)
              put("y0Dp", y0Dp); put("wDp", wDp); put("depthDp", depthDp)
              put("rotationDeg", rotationDeg); put("shapeProfile", shapeProfile.name)
              put("omegaN", omegaN); put("zeta", zeta); put("inwardVelocity", inwardVelocity)
              put("pressDurationMs", pressDurationMs); put("releaseDelayMs", releaseDelayMs)
              put("overshootPct", overshootPct); put("bounceCount", bounceCount)
              put("fillMode", fillMode.name); put("fillColor", fillColor); put("fillColor2", fillColor2)
              put("gradientAngleDeg", gradientAngleDeg); put("glassEnabled", glassEnabled)
              put("innerShadow", innerShadow); put("outerGlow", outerGlow); put("glowColor", glowColor)
              put("rimLight", rimLight); put("shaderPreset", shaderPreset.name)
