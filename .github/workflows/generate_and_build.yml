            private var camera: Camera? = null
            private var lensFacing = CameraSelector.LENS_FACING_BACK
            private var flashMode = ImageCapture.FLASH_MODE_OFF
            private var currentRatio = AspectRatioMode.RATIO_4_3
            private var isMoonMode = false

            private var totalZoom = 1.0f
            private var maxHardwareZoom = 8.0f
            private var softwareZoom = 1.0f

            // Target Tracking & Stabilization
            @Volatile private var isTargetLocked = false
            @Volatile private var normLockX = 0.5f
            @Volatile private var normLockY = 0.5f
            private var gyroCompX = 0f
            private var gyroCompY = 0f
            private var lastGyroTime = 0L

            private lateinit var sensorManager: SensorManager
            private var gyroSensor: Sensor? = null

            private val backgroundExecutor = Executors.newFixedThreadPool(2)
            private val textRecognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }

            @Volatile private var latestFullFrame: Bitmap? = null
            private var pipThrottle = 0

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                liveTextureView = findViewById(R.id.liveTextureView)
                overlayView = findViewById(R.id.overlayView)
                cameraViewportFrame = findViewById(R.id.cameraViewportFrame)
                pipContainer = findViewById(R.id.pipContainer)
                ivPipBackground = findViewById(R.id.ivPipBackground)
                vPipReticle = findViewById(R.id.vPipReticle)
                btnDismissLock = findViewById(R.id.btnDismissLock)
                btnAspectRatio = findViewById(R.id.btnAspectRatio)
                btnMoonMode = findViewById(R.id.btnMoonMode)
                tvZoomValue = findViewById(R.id.tvZoomValue)
                tvOcrBanner = findViewById(R.id.tvOcrBanner)
                seekZoom = findViewById(R.id.seekZoom)
                ivGallery = findViewById(R.id.ivGallery)

                sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE)

                safeInitNativeAI()
                setupUIControls()
                adjustViewportDimensions()

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    setupTextureListenerAndStart()
                } else {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                }
            }

            private fun safeInitNativeAI() {
                try {
                    nativeInitModels(assets)
                } catch (e: Throwable) {
                    Toast.makeText(this, "AI Models initializing...", Toast.LENGTH_SHORT).show()
                }
            }

            override fun onResume() {
                super.onResume()
                gyroSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST) }
            }

            override fun onPause() {
                super.onPause()
                sensorManager.unregisterListener(this)
            }

            private fun setupTextureListenerAndStart() {
                if (liveTextureView.isAvailable) {
                    startCamera()
                } else {
                    liveTextureView.surfaceTextureListener = object : TextureView.SurfaceTextureListener {
                        override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) {
                            startCamera()
                        }
                        override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) {
                            updateGpuSamplingTransform()
                        }
                        override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean = true
                        override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
                    }
                }
            }

            private fun setupUIControls() {
                btnAspectRatio.setOnClickListener {
                    currentRatio = when (currentRatio) {
                        AspectRatioMode.RATIO_4_3 -> AspectRatioMode.RATIO_16_9
                        AspectRatioMode.RATIO_16_9 -> AspectRatioMode.RATIO_1_1
                        AspectRatioMode.RATIO_1_1 -> AspectRatioMode.RATIO_FULL
                        AspectRatioMode.RATIO_FULL -> AspectRatioMode.RATIO_4_3
                    }
                    btnAspectRatio.text = currentRatio.label
                    adjustViewportDimensions()
                }

                btnMoonMode.setOnClickListener {
                    isMoonMode = !isMoonMode
                    btnMoonMode.text = if (isMoonMode) "🌕 MOON: ON" else "🌕 MOON: OFF"
                    applyMoonExposureSettings()
                    overlayView.updateOverlay(isTargetLocked, normLockX, normLockY, isMoonMode, totalZoom >= 15f)
                    Toast.makeText(this, if (isMoonMode) "Moon Mode Active: Auto-Underexposure & Crater Enhancer" else "Normal Mode", Toast.LENGTH_SHORT).show()
                }

                btnDismissLock.setOnClickListener { clearTargetLock() }

                val presets = mapOf(
                    R.id.btnZ1 to 1.0f, R.id.btnZ5 to 5.0f, R.id.btnZ15 to 15.0f,
                    R.id.btnZ50 to 50.0f, R.id.btnZ100 to 100.0f, R.id.btnZ200 to 200.0f
                )
                presets.forEach { (id, z) ->
                    findViewById<Button>(id).setOnClickListener { setZoomLevel(z, updateSeek = true) }
                }

                seekZoom.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                        if (fromUser) setZoomLevel(1.0f + (progress / 10.0f), updateSeek = false)
                    }
                    override fun onStartTrackingTouch(sb: SeekBar?) {}
                    override fun onStopTrackingTouch(sb: SeekBar?) {}
                })

                findViewById<Button>(R.id.btnFlash).setOnClickListener { view ->
                    val b = view as Button
                    flashMode = if (flashMode == ImageCapture.FLASH_MODE_OFF) {
                        camera?.cameraControl?.enableTorch(true)
                        b.text = "⚡ ON"
                        ImageCapture.FLASH_MODE_ON
                    } else {
                        camera?.cameraControl?.enableTorch(false)
                        b.text = "⚡ OFF"
                        ImageCapture.FLASH_MODE_OFF
                    }
                }

                findViewById<Button>(R.id.btnFlip).setOnClickListener {
                    lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) CameraSelector.LENS_FACING_FRONT else CameraSelector.LENS_FACING_BACK
                    startCamera()
                }

                findViewById<Button>(R.id.btnShutter).setOnClickListener {
                    captureUltraRemaster()
                }

                setupTouchHandlers()
            }

            private fun setupTouchHandlers() {
                val scaleGesture = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    override fun onScale(detector: ScaleGestureDetector): Boolean {
                        setZoomLevel(totalZoom * detector.scaleFactor, updateSeek = true)
                        return true
                    }
                })

                val gesture = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        if (isTargetLocked) {
                            clearTargetLock()
                            return true
                        }
                        val factory = SurfaceOrientedMeteringPointFactory(liveTextureView.width.toFloat(), liveTextureView.height.toFloat())
                        val pt = factory.createPoint(e.x, e.y)
                        camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(pt).build())
                        return true
                    }

                    override fun onLongPress(e: MotionEvent) {
                        val normX = (e.x / liveTextureView.width.toFloat()).coerceIn(0.1f, 0.9f)
                        val normY = (e.y / liveTextureView.height.toFloat()).coerceIn(0.1f, 0.9f)

                        normLockX = normX
                        normLockY = normY
                        gyroCompX = 0f
                        gyroCompY = 0f
                        isTargetLocked = true

                        latestFullFrame?.let { bmp ->
                            try { nativeSetLockTemplate(bmp, normX, normY) } catch (_: Throwable) {}
                        }

                        btnDismissLock.visibility = View.VISIBLE
                        updateGpuSamplingTransform()
                        Toast.makeText(this@MainActivity, "Locked! Tracking active.", Toast.LENGTH_SHORT).show()
                    }
                })

                overlayView.setOnTouchListener { _, event ->
                    scaleGesture.onTouchEvent(event)
                    gesture.onTouchEvent(event)
                    true
                }
            }

            private fun clearTargetLock() {
                isTargetLocked = false
                normLockX = 0.5f
                normLockY = 0.5f
                gyroCompX = 0f
                gyroCompY = 0f
                try { nativeClearLock() } catch (_: Throwable) {}
                btnDismissLock.visibility = View.GONE
                updateGpuSamplingTransform()
            }

            private fun adjustViewportDimensions() {
                val root = findViewById<ConstraintLayout>(R.id.rootContainer)
                root.post {
                    val rootW = root.width
                    val rootH = root.height
                    val params = cameraViewportFrame.layoutParams as ConstraintLayout.LayoutParams

                    if (currentRatio == AspectRatioMode.RATIO_FULL) {
                        params.width = ViewGroup.LayoutParams.MATCH_PARENT
                        params.height = ViewGroup.LayoutParams.MATCH_PARENT
                    } else {
                        val targetW = rootW
                        val targetH = (rootW * currentRatio.ratioH) / currentRatio.ratioW
                        if (targetH <= rootH) {
                            params.width = targetW
                            params.height = targetH
                        } else {
                            params.height = rootH
                            params.width = (rootH * currentRatio.ratioW) / currentRatio.ratioH
                        }
                    }
                    cameraViewportFrame.layoutParams = params
                    updateGpuSamplingTransform()
                }
            }

            private fun setZoomLevel(zoom: Float, updateSeek: Boolean) {
                totalZoom = zoom.coerceIn(1.0f, 200.0f)
                val hwZoom = min(totalZoom, maxHardwareZoom)
                camera?.cameraControl?.setZoomRatio(hwZoom)
                softwareZoom = (totalZoom / hwZoom).coerceAtLeast(1.0f)

                tvZoomValue.text = String.format("%.1fx", totalZoom)
                if (updateSeek) seekZoom.progress = ((totalZoom - 1.0f) * 10f).toInt()

                pipContainer.visibility = if (totalZoom >= 15.0f) View.VISIBLE else View.GONE
                if (isMoonMode) applyMoonExposureSettings()
                updateGpuSamplingTransform()
            }

            private fun applyMoonExposureSettings() {
                val state = camera?.cameraInfo?.exposureState ?: return
                if (!state.isExposureCompensationSupported) return
                if (isMoonMode) {
                    // Under-expose by -4.0 EV so the bright Moon disc reveals crater texture
                    val minExp = state.exposureCompensationRange.lower
                    val targetExp = (minExp * 0.85f).toInt()
                    camera?.cameraControl?.setExposureCompensationIndex(targetExp)
                } else {
                    camera?.cameraControl?.setExposureCompensationIndex(0)
                }
            }

            // GPU Sampling Matrix: Never alters View bounds, runs at 60 FPS without GPU buffer crashes
            private fun updateGpuSamplingTransform() {
                val viewW = liveTextureView.width.toFloat()
                val viewH = liveTextureView.height.toFloat()
                if (viewW <= 0 || viewH <= 0) return

                val activeX = (normLockX + gyroCompX).coerceIn(0.08f, 0.92f)
                val activeY = (normLockY + gyroCompY).coerceIn(0.08f, 0.92f)

                val matrix = Matrix()
                matrix.postScale(softwareZoom, softwareZoom, activeX * viewW, activeY * viewH)
                liveTextureView.setTransform(matrix)

                overlayView.updateOverlay(isTargetLocked, activeX, activeY, isMoonMode, totalZoom >= 15f)
                updatePipIndicator(activeX, activeY)
            }

            private fun updatePipIndicator(normX: Float, normY: Float) {
                if (pipContainer.visibility != View.VISIBLE) return
                val pipW = pipContainer.width.toFloat().coerceAtLeast(1f)
                val pipH = pipContainer.height.toFloat().coerceAtLeast(1f)

                val boxFraction = (1.0f / softwareZoom).coerceIn(0.08f, 0.9f)
                val boxPxW = pipW * boxFraction
                val boxPxH = pipH * boxFraction

                vPipReticle.layoutParams.width = boxPxW.toInt().coerceAtLeast(16)
                vPipReticle.layoutParams.height = boxPxH.toInt().coerceAtLeast(16)
                vPipReticle.translationX = (normX * pipW) - (boxPxW / 2f)
                vPipReticle.translationY = (normY * pipH) - (boxPxH / 2f)
            }

            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    val provider = cameraProviderFuture.get()
                    provider.unbindAll()

                    val targetRatio = if (currentRatio == AspectRatioMode.RATIO_16_9) AspectRatio.RATIO_16_9 else AspectRatio.RATIO_4_3

                    val previewBuilder = Preview.Builder().setTargetAspectRatio(targetRatio)
                    Camera2Interop.Extender(previewBuilder)
                        .setCaptureRequestOption(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE, CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON)
                        .setCaptureRequestOption(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON)

                    val preview = previewBuilder.build()
                    preview.setSurfaceProvider { request ->
                        val surfaceTexture = liveTextureView.surfaceTexture
                        if (surfaceTexture != null) {
                            surfaceTexture.setDefaultBufferSize(request.resolution.width, request.resolution.height)
                            val surface = Surface(surfaceTexture)
                            request.provideSurface(surface, ContextCompat.getMainExecutor(this)) { surface.release() }
                        }
                    }

                    val analysis = ImageAnalysis.Builder()
                        .setTargetResolution(Size(1280, 720))
                        .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                        .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                        .build()

                    analysis.setAnalyzer(backgroundExecutor) { proxy ->
                        processAnalysisBuffer(proxy)
                    }

                    val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()
                    camera = provider.bindToLifecycle(this, selector, preview, analysis)

                    maxHardwareZoom = (camera?.cameraInfo?.zoomState?.value?.maxZoomRatio ?: 8.0f).coerceAtLeast(1.0f)
                    setZoomLevel(totalZoom, updateSeek = true)
                }, ContextCompat.getMainExecutor(this))
            }

            private fun processAnalysisBuffer(proxy: ImageProxy) {
                try {
                    val bmp = proxy.toBitmap()
                    val rot = proxy.imageInfo.rotationDegrees
                    val corrected = if (rot != 0) {
                        val m = Matrix().apply { postRotate(rot.toFloat()) }
                        Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                    } else {
                        bmp
                    }

                    latestFullFrame = corrected

                    if (isTargetLocked) {
                        try {
                            val coords = nativeTrackTemplate(corrected)
                            if (coords != null && coords.size == 2) {
                                normLockX = coords[0]
                                normLockY = coords[1]
                                runOnUiThread { updateGpuSamplingTransform() }
                            }
                        } catch (_: Throwable) {}
                    }

                    try { nativePushFrameToRing(corrected) } catch (_: Throwable) {}

                    if (++pipThrottle % 4 == 0 && totalZoom >= 15.0f) {
                        val thumb = Bitmap.createScaledBitmap(corrected, 160, 213, false)
                        runOnUiThread { ivPipBackground.setImageBitmap(thumb) }
                    }
                } catch (_: Exception) {
                } finally {
                    proxy.close()
                }
            }

            override fun onSensorChanged(event: SensorEvent?) {
                if (event?.sensor?.type != Sensor.TYPE_GYROSCOPE) return
                if (lastGyroTime != 0L && totalZoom >= 5.0f && !isTargetLocked) {
                    val dt = (event.timestamp - lastGyroTime) * 1e-9f
                    val damp = 0.035f / softwareZoom
                    gyroCompX = (gyroCompX - event.values[1] * dt * damp).coerceIn(-0.12f, 0.12f)
                    gyroCompY = (gyroCompY + event.values[0] * dt * damp).coerceIn(-0.12f, 0.12f)
                    gyroCompX *= 0.95f
                    gyroCompY *= 0.95f
                    runOnUiThread { updateGpuSamplingTransform() }
                }
                lastGyroTime = event.timestamp
            }

            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

            private fun captureUltraRemaster() {
                val anchor = latestFullFrame ?: run {
                    Toast.makeText(this, "Sensor warming up...", Toast.LENGTH_SHORT).show()
                    return
                }

                Toast.makeText(this, if (isMoonMode) "AI Moon Super-Resolution Processing..." else "Processing 200x Multi-Frame Shot...", Toast.LENGTH_SHORT).show()

                val activeX = (normLockX + gyroCompX).coerceIn(0.08f, 0.92f)
                val activeY = (normLockY + gyroCompY).coerceIn(0.08f, 0.92f)

                val cropW = (anchor.width / softwareZoom).toInt().coerceAtLeast(32)
                val cropH = when (currentRatio) {
                    AspectRatioMode.RATIO_1_1 -> cropW
                    AspectRatioMode.RATIO_16_9 -> (cropW * 16) / 9
                    AspectRatioMode.RATIO_4_3 -> (cropW * 4) / 3
                    AspectRatioMode.RATIO_FULL -> (cropW * liveTextureView.height) / liveTextureView.width.coerceAtLeast(1)
                }.coerceIn(32, anchor.height)

                val left = ((activeX * anchor.width) - cropW / 2).toInt().coerceIn(0, anchor.width - cropW)
                val top = ((activeY * anchor.height) - cropH / 2).toInt().coerceIn(0, anchor.height - cropH)

                val outW = 1080
                val outH = (1080 * cropH) / cropW
                val outBitmap = Bitmap.createBitmap(outW, outH, Bitmap.Config.ARGB_8888)

                lifecycleScope.launch(Dispatchers.Default) {
                    var framesFused = 1
                    try {
                        framesFused = nativeProcessRemaster(anchor, left, top, cropW, cropH, outBitmap, isMoonMode)
                    } catch (e: Throwable) {
                        e.printStackTrace()
                    }

                    var detectedText = ""
                    if (!isMoonMode) {
                        try {
                            val visionImg = InputImage.fromBitmap(outBitmap, 0)
                            val res = textRecognizer.process(visionImg).await()
                            if (res.text.isNotBlank()) {
                                detectedText = res.text.trim()
                                val boxes = res.textBlocks.mapNotNull { it.boundingBox }
                                val flat = IntArray(boxes.size * 4)
                                boxes.forEachIndexed { i, r ->
                                    flat[i * 4] = r.left
                                    flat[i * 4 + 1] = r.top
                                    flat[i * 4 + 2] = r.width()
                                    flat[i * 4 + 3] = r.height()
                                }
                                if (flat.isNotEmpty()) {
                                    nativeEnhanceTextEdges(outBitmap, flat)
                                }
                            }
                        } catch (_: Exception) {}
                    }

                    savePhotoToGallery(outBitmap)

                    withContext(Dispatchers.Main) {
                        ivGallery.setImageBitmap(outBitmap)
                        if (detectedText.isNotEmpty()) {
                            tvOcrBanner.text = "READABLE TEXT:\n$detectedText"
                            tvOcrBanner.visibility = View.VISIBLE
                        }
                        Toast.makeText(this@MainActivity, "Photo Saved ($framesFused frames fused)!", Toast.LENGTH_SHORT).show()
                    }
                }
            }

            private fun savePhotoToGallery(bitmap: Bitmap) {
                val filename = "Zoom200x_${System.currentTimeMillis()}.jpg"
                val values = ContentValues().apply {
                    put(MediaStore.Images.Media.DISPLAY_NAME, filename)
                    put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/200xUltraCamera")
                    }
                }
                val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values) ?: return
                contentResolver.openOutputStream(uri)?.use { out: OutputStream ->
                    bitmap.compress(Bitmap.CompressFormat.JPEG, 98, out)
                }
            }

            external fun nativeInitModels(mgr: AssetManager)
            external fun nativeSetLockTemplate(bmp: Bitmap, nx: Float, ny: Float)
            external fun nativeTrackTemplate(bmp: Bitmap): FloatArray?
            external fun nativeClearLock()
            external fun nativePushFrameToRing(bmp: Bitmap)
            external fun nativeProcessRemaster(anchor: Bitmap, x: Int, y: Int, w: Int, h: Int, outBmp: Bitmap, moonMode: Boolean): Int
            external fun nativeEnhanceTextEdges(bmp: Bitmap, boxes: IntArray)

            companion object {
                init {
                    try { System.loadLibrary("opencv_java4") } catch (_: Throwable) {}
                    try { System.loadLibrary("zoomcamera") } catch (_: Throwable) {}
                }
            }
        }
