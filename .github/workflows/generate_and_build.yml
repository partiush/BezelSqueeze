                    <Button android:id="@+id/btnZ5" style="@style/Widget.Material3.Button.TextButton" android:layout_width="48dp" android:layout_height="36dp" android:padding="0dp" android:text="5x" android:textColor="#FFFFFF" />
                    <Button android:id="@+id/btnZ15" style="@style/Widget.Material3.Button.TextButton" android:layout_width="52dp" android:layout_height="36dp" android:padding="0dp" android:text="15x" android:textColor="#FFFFFF" />
                    <Button android:id="@+id/btnZ50" style="@style/Widget.Material3.Button.TextButton" android:layout_width="52dp" android:layout_height="36dp" android:padding="0dp" android:text="50x" android:textColor="#FFFFFF" />
                    <Button android:id="@+id/btnZ100" style="@style/Widget.Material3.Button.TextButton" android:layout_width="58dp" android:layout_height="36dp" android:padding="0dp" android:text="100x" android:textColor="#FFD600" />
                    <Button android:id="@+id/btnZ200" style="@style/Widget.Material3.Button.TextButton" android:layout_width="58dp" android:layout_height="36dp" android:padding="0dp" android:text="200x" android:textColor="#FF5252" />
